nd Verschlämmung und füttert die Würmer.","zutaten":["Rasenschnitt (angewelkt), Laub, Stroh, Häcksel aus Gemüseresten"],"schritte":["2–5 cm dick zwischen die Pflanzen legen.","Dünn und oft statt dick und selten.","Bei Schneckenproblemen eher Stroh als frisches Grün."]},{"id":"gruenduengung","titel":"Gründüngung","kat":"fuettern","beleg":"W","teil":"Zwischenfrucht","kurz":"Pflanzen, die nur für den Boden wachsen: Wurzeln lockern, Leguminosen sammeln Stickstoff, das Grün wird zu Humus.","zutaten":["Phacelia, Senf, Ölrettich, Buchweizen, Klee, Lupine, Winterroggen"],"schritte":["Nach der Ernte säen, Boden nie offen lassen.","Vor der Samenreife abmähen und als Mulch liegen lassen.","Kreuzblütler (Senf, Ölrettich) nicht vor Kohl – gleiche Krankheiten."]},{"id":"nicht-umgraben","titel":"Lockern statt umgraben","kat":"schuetzen","beleg":"W","teil":"Bodenbearbeitung","kurz":"Umgraben zerstört die Schichtung und das Pilzgeflecht; Oberbodenlebewesen landen in der Tiefe.","zutaten":["Grabegabel oder Sauzahn"],"schritte":["Mit der Grabegabel einstechen und nur leicht hebeln.","Nur bei schwerem, verdichtetem Boden einmalig tiefer lockern.","Nie bei nassem Boden arbeiten oder ihn betreten – feste Wege anlegen."]},{"id":"kompost-nutzen","titel":"Kompost und Mist","kat":"fuettern","beleg":"W","teil":"Organische Düngung","kurz":"Reifer Kompost und gut verrotteter Mist bauen Humus auf.","zutaten":["reifer Kompost (max. ca. 3 l/m²)","verrotteter Pferde-, Rinder- oder Schafmist"],"schritte":["Im Frühjahr flach einarbeiten.","Frischen Mist nur im Herbst oder auf den Kompost.","Wurmhumus aus der Wurmkiste ist besonders fein und nährstoffreich."]},{"id":"pflanzenkohle","titel":"Pflanzenkohle und Terra Preta","kat":"verbessern","beleg":"W","teil":"Bodenverbesserer","kurz":"Poröse Holzkohle speichert Wasser und Nährstoffe und bietet Mikroben Lebensraum. Vorbild ist die Schwarzerde (Terra Preta) im Amazonasgebiet.","zutaten":["Pflanzenkohle (zertifiziert, z. B. EBC)","Kompost oder Jauche zum Aufladen"],"schritte":["Kohle zuerst mit Nährstoffen aufladen: einige Wochen in Kompost oder Jauche mischen.","Nur aufgeladen ausbringen – frische Kohle bindet Nährstoffe zunächst selbst.","Wenige Liter pro m² genügen; Grillkohle und Grillasche sind nicht geeignet."]},{"id":"kalk","titel":"Kalken nach Maß","kat":"verbessern","beleg":"W","teil":"pH","kurz":"Nur kalken, wenn der pH-Wert zu niedrig ist.","zutaten":["pH-Test oder Bodenlabor","kohlensaurer Kalk oder Algenkalk"],"schritte":["Bodenprobe messen.","Bei pH unter ca. 6 im Herbst nach Herstellerangabe kalken.","Nicht gleichzeitig mit Mist oder Kompost ausbringen (Stickstoffverlust als Ammoniak)."]},{"id":"bodentiere","titel":"Regenwürmer fördern","kat":"schuetzen","beleg":"W","teil":"Bodenleben","kurz":"Regenwürmer brauchen Futter an der Oberfläche und Ruhe.","zutaten":["Mulch, Laub","eine Wurmkiste für Küchenabfälle"],"schritte":["Laub im Herbst auf den Beeten lassen.","Keine Fräse auf Dauer; sie zerkleinert Würmer.","Im Winter offene Beete mit Mulch oder Gründüngung bedecken."]}]}]},{"id":"vermeiden","titel":"Was schadet","bloecke":[{"typ":"text","text":"Manche gut gemeinte Maßnahme schadet dem Boden auf Dauer. Diese Liste zeigt, was man meiden oder nur sehr gezielt einsetzen sollte."},{"typ":"tabelle","kopf":["Nicht verwenden bzw. meiden","Warum","Besser"],"zeilen":[["Torf und torfhaltige Erde","Moore sind große CO₂-Speicher; Torf ist nährstoffarm, sauer und für den Garten unnötig","torffreie Erde, eigener Kompost, Rindenhumus"],["Blaukorn und andere phosphatreiche Volldünger","Gartenböden sind meist schon mit Phosphor und Kalium überversorgt","reine Stickstoffdünger wie Hornspäne, Jauchen; vorher Bodenprobe"],["Chloridhaltige Kalidünger","Chlorid schadet empfindlichen Pflanzen und dem Bodenleben","Kaliumsulfat, Kalimagnesia – nur bei nachgewiesenem Mangel"],["Unkrautvernichter, chemische Pilzmittel","schädigen Bodenleben, Bienen, Grundwasser","Mulchen, Hacken, robuste Sorten, Mischkultur"],["Kupfer in größeren Mengen","reichert sich im Boden an, schadet Regenwürmern","nur sparsam und gezielt, Vorbeugung"],["Streusalz","versalzt den Boden, schädigt Wurzeln","Sand, Splitt"],["Asche von Kohle, Briketts, behandeltem oder lackiertem Holz","Schwermetalle und Schadstoffe","höchstens wenig Asche von unbehandeltem Holz, nicht auf Gemüse in Mengen"],["Hunde- und Katzenkot","Parasiten und Krankheitskeime","Restmüll"],["Fleisch, Fisch, Milchprodukte, gekochte Essensreste im offenen Kompost","locken Ratten an, faulen","Bokashi-Eimer oder Biotonne"],["Kranke Pflanzen, samentragendes Unkraut, Wurzelunkräuter","verbreiten Krankheiten und Unkraut im ganzen Garten","Biotonne oder heiße Kompostierung"],["Frischer Rindenmulch auf Gemüsebeeten","bindet Stickstoff, Gerbstoffe hemmen Keimung","unter Gehölzen verwenden"],["Zu viel Kompost oder Mist","Überdüngung mit Phosphor und Kalium, Nitratauswaschung","maßvoll nach Bodenprobe"],["Zu viel Kalk","bindet Spurenelemente, beschleunigt Humusabbau","nur nach Messung"],["Betreten oder Befahren nasser Böden","Verdichtung: Poren gehen verloren, Wurzeln und Würmer leiden","feste Wege, Bretter, warten"],["Offener, nackter Boden","Erosion, Verschlämmung, Austrocknung, Humusverlust","Mulch, Gründüngung"],["Plastik, Hochglanzpapier, kompostierbare Tüten","zerfallen nicht oder zu langsam; Mikroplastik","Restmüll oder Papiertüten"],["Erde und Kompost unbekannter Herkunft","mögliche Schadstoffe oder Unkräuter","geprüfte Erde, Gütesiegel (RAL)"]]}]},{"id":"test","titel":"Boden testen","bloecke":[{"typ":"text","text":"Bevor man düngt oder kalkt, sollte man seinen Boden kennen. Vieles lässt sich mit einfachen Tests selbst herausfinden; für Nährstoffe lohnt sich ein Labor."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"fingerprobe","titel":"Fingerprobe","kat":"alle","beleg":"W","teil":"Bodenart","kurz":"Eine Handvoll feuchte Erde zwischen den Fingern rollen.","zutaten":["feuchte Erde aus 10–20 cm Tiefe"],"schritte":["Rieselt durch, nicht formbar, körnig: Sand.","Mehlig, samtig, kaum klebrig: Schluff.","Formbar, glänzt beim Reiben, klebt: Ton.","Formbar, etwas körnig und etwas klebrig: Lehm."]},{"id":"spatenprobe","titel":"Spatenprobe","kat":"alle","beleg":"W","teil":"Struktur","kurz":"Einen Spatenstich Erde herausheben und ansehen.","zutaten":["Spaten"],"schritte":["Spatenblatt-tief ausstechen und vorsichtig auf ein Brett legen.","Krümelig, dunkel, viele Wurzeln und Wurmgänge = gut.","Scharfkantige Brocken, Schichten, Fäulnisgeruch = verdichtet oder staunass.","Zählen: mehr als 5 Regenwürmer pro Spatenstich ist ein gutes Zeichen."]},{"id":"schlaemm","titel":"Schlämmprobe","kat":"alle","beleg":"W","teil":"Bodenart","kurz":"Zeigt die Anteile von Sand, Schluff und Ton.","zutaten":["großes Schraubglas","Erde, Wasser, Prise Spülmittel"],"schritte":["Glas zu einem Drittel mit Erde füllen, mit Wasser auffüllen, Spülmittel dazu.","Kräftig schütteln und 1–2 Tage stehen lassen.","Schichten messen (siehe Zeichnung)."]},{"id":"ph-test","titel":"pH-Wert messen","kat":"alle","beleg":"W","teil":"pH","kurz":"Teststreifen oder Messset aus dem Gartenhandel.","zutaten":["Bodenprobe","destilliertes Wasser","pH-Test"],"schritte":["Erde mit destilliertem Wasser verrühren, absetzen lassen.","Messen und mit dem Zielbereich (6–7) vergleichen."]},{"id":"labor","titel":"Bodenlabor","kat":"alle","beleg":"W","teil":"Nährstoffe","kurz":"Alle 4–5 Jahre: pH, Phosphor, Kalium, Magnesium, Bodenart; Humus alle 6–10 Jahre.","zutaten":["Mischprobe aus 10–15 Einstichen, 0–30 cm"],"schritte":["Einstiche über das Beet verteilen, in einem Eimer mischen.","Ca. 500 g an ein Bodenlabor schicken (Adressen bei Gartenakademien und Landwirtschaftsämtern).","Düngeempfehlung des Labors befolgen."]}]},{"typ":"illu","id":"schlaemmprobe","titel":"Schlämmprobe im Glas"},{"typ":"tabelle","kopf":["Zeigerpflanze","zeigt an"],"zeilen":[["{{p:p01|Brennnessel}}, {{p:p02|Giersch}}, Vogelmiere","stickstoffreichen, humosen Boden"],["Ackerschachtelhalm, Binsen, Hahnenfuß","Staunässe, verdichteten Untergrund"],["Sauerampfer, Hundskamille, Heidekraut","sauren Boden"],["Huflattich, Ackerwinde","lehmigen, verdichteten Boden"],["Kamille, Wegerich, Gänsefingerkraut","verdichteten, festgetretenen Boden"],["Klatschmohn, Ackersenf","kalkhaltigen Boden"]]},{"typ":"text","text":"Zeigerpflanzen sind Hinweise, keine Messung: Erst mehrere Arten zusammen ergeben ein verlässliches Bild."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Bayerische Gartenakademie: Düngung leicht gemacht","https://www.lwg.bayern.de/mam/cms06/gartenakademie/dateien/infoschrift_duengung_leicht_gemacht.pdf"],["LfL Bayern: Zehn Tonnen Leben unter einem Hektar","https://www.lfl.bayern.de/mam/cms07/iab/dateien/zehn_tonnen_leben_dlz_2009.pdf"],["Bayerische Gartenakademie: Torffrei gärtnern","https://www.lwg.bayern.de/mam/cms06/gartenakademie/dateien/1202-torffrei_gaertnern.pdf"],["Umweltbundesamt: Verlust der Biodiversität im Boden","https://www.umweltbundesamt.de/themen/boden-flaeche/bodenbelastungen/verlust-der-biodiversitaet-im-boden"]]},{"typ":"text","text":"Zusammensetzung, Bodenarten, Horizonte, Kationenaustausch, pH-Verfügbarkeit und Rottephasen sind Lehrbuchwissen der Bodenkunde; Zahlen als Richtwerte. Diagramme zum Stickstoff im Hügelbeet sind schematisch."}]}]},{"id":"mischkultur","titel":"Mischkultur & Pflanznachbarn","nr":"S-03","illu":"mk_wurzelraum","fotos":[],"text":"Welche Pflanzen sich vertragen und welche nicht, was dabei im Boden chemisch und biologisch passiert, welche Regeln belegt und welche Gärtnertradition sind – mit Nachbar-Check, Fruchtfolge und Beetplänen.","stichworte":["Mischkultur","gute Nachbarn","schlechte Nachbarn","Allelopathie","Juglon","Fruchtfolge","Starkzehrer","Mittelzehrer","Schwachzehrer","Knöllchenbakterien","Stickstofffixierung","Tagetes","Nematoden","Drei Schwestern","Gertrud Franck","Bodenmüdigkeit","Kraut- und Braunfäule","Lockpflanze"],"pflanzen":[],"kurz":"Pflanzen beeinflussen sich über Wurzeln, Duftstoffe, Pilznetze und Krankheiten. Gut kombiniert nutzen sie Licht, Wasser und Boden besser und werden seltener krank – schlecht kombiniert hemmen sie sich oder stecken sich an.","steckbrief":[["Belegt [W]","Tomate weit weg von Kartoffel; nichts Empfindliches unter Walnuss; kein Rosengewächs nach Rosengewächs; Fruchtfolge nach Familien; Tagetes gegen Nematoden"],["Metaanalysen","Mischkultur senkt Nematodenschäden um ca. 40 %, bodenbürtige Krankheiten um ca. 55 %"],["Meist Tradition [T]","die meisten konkreten „Gute/Schlechte Nachbarn“-Paare"],["Fruchtfolge","gleiche Familie frühestens nach 3–4 Jahren, Kreuzblütler 5–7 Jahre"],["Klassiker","Möhre + Zwiebel, Tomate + Basilikum, Mais + Bohne + Kürbis"],["Weiter","{{s:boden|Boden}}, {{s:huegelbeet-bepflanzung|Hügelbeet bepflanzen}}"]],"reiter":[{"id":"grundlagen","titel":"Grundlagen","bloecke":[{"typ":"text","text":"Mischkultur heißt: verschiedene Pflanzen gleichzeitig oder kurz nacheinander auf derselben Fläche. Das Gegenteil ist die Monokultur, in der eine Art Schädlingen und Krankheiten einen gedeckten Tisch bietet."},{"typ":"hinweis","text":"**Die vier harten Regeln** [W]: 1. Tomaten möglichst weit weg von Kartoffeln und mit Regendach. 2. Nichts Empfindliches unter Walnuss oder Schwarznuss. 3. Kein Rosengewächs (Apfel, Erdbeere, Rose) ohne Bodenaustausch nach einem Rosengewächs. 4. Fruchtfolge nach Familien: 3–4 Jahre Pause, Kreuzblütler 5–7 Jahre."},{"typ":"abschnitt","titel":"Was die Forschung sagt","liste":["**Systemebene [W]:** Eine Auswertung von 63 Studien aus 18 Ländern (Rakotomalala et al. 2023) fand in Mischkulturen mehr Nützlinge und weniger Schädlinge. Eine globale Synthese aus 609 Studien (Wan et al. 2026) bestätigt: Mehr Pflanzenarten fördern die Pflanzen und hemmen ihre Gegenspieler.","**Boden [W]:** 40 % weniger Nematodenschaden und 55 % weniger bodenbürtige Krankheiten im Mittel – mit widersprüchlichen Einzelergebnissen.","**Einzelpaare [T]:** Die meisten Nachbarschaftstabellen beruhen auf Gärtnererfahrung; kontrollierte Prüfungen ergaben „gemischte Belege“."]},{"typ":"abschnitt","titel":"Fünf Prinzipien guter Nachbarschaft","nummern":["**Stockwerke:** flache neben tiefen Wurzeln, hohe neben niedrigen Pflanzen.","**Hunger ausgleichen:** Starkzehrer neben Schwachzehrer, Leguminosen als Stickstoffquelle.","**Familien mischen:** Nie viele Pflanzen derselben Familie nebeneinander – sie teilen Schädlinge und Krankheiten.","**Zeit staffeln:** Schnelle Vorkultur (Radieschen, Salat) vor oder zwischen langsamen Kulturen.","**Nützlinge einladen:** Blühpflanzen wie Ringelblume, Dill, Phacelia, Borretsch."]}]},{"id":"nachbarn","titel":"Gute & schlechte Nachbarn","bloecke":[{"typ":"text","text":"Wähle zwei Pflanzen – der Check zeigt, ob sie sich vertragen und warum. Darunter die vollständige Tabelle."},{"typ":"nachbarcheck","kulturen":{"Tomate":{"gut":["Basilikum","Petersilie","Möhre","Salat","Kapuzinerkresse","Tagetes","Knoblauch","Sellerie","Kohl"],"schlecht":["Kartoffel","Fenchel","Erbse","Gurke","Walnuss"],"warum":"Kartoffel überträgt Kraut- und Braunfäule; Walnuss: Juglon. Gurke braucht feuchteres Klima.","beleg":"Kartoffel und Walnuss [W], Rest [T]"},"Kartoffel":{"gut":["Buschbohne","Kapuzinerkresse","Spinat","Kohl","Mais","Tagetes"],"schlecht":["Tomate","Kürbis","Gurke","Sonnenblume","Sellerie","Erbse"],"warum":"Tomate teilt Kraut- und Braunfäule; Kürbis und Gurke konkurrieren um Wasser und Platz.","beleg":"Tomate [W], Rest [T]"},"Paprika":{"gut":["Tomate","Basilikum","Möhre"],"schlecht":["Fenchel","Kartoffel","Walnuss"],"warum":"Juglon-empfindlich wie alle Nachtschattengewächse.","beleg":"Walnuss [W], Rest [T]"},"Gurke":{"gut":["Dill","Buschbohne","Erbse","Salat","Zwiebel","Mais","Sellerie"],"schlecht":["Tomate","Kartoffel","Radieschen","Zucchini"],"warum":"Dill lockt Schwebfliegen gegen Läuse; Zucchini teilt den Mehltau.","beleg":"[T]"},"Kürbis":{"gut":["Mais","Stangenbohne","Kapuzinerkresse"],"schlecht":["Kartoffel","Zierkürbis"],"warum":"Drei Schwestern; Zierkürbis kann über Kreuzung bittere, giftige Früchte (Cucurbitacin) im Nachbau bringen.","beleg":"Kreuzung [W], Rest [T]"},"Zucchini":{"gut":["Mais","Buschbohne","Kapuzinerkresse","Dill"],"schlecht":["Kartoffel","Gurke"],"warum":"Wie Kürbis; mit Gurke Mehltau-Brücke.","beleg":"[W/T]"},"Mais":{"gut":["Stangenbohne","Kürbis","Gurke","Zucchini","Kartoffel"],"schlecht":["Sellerie","Rote Bete"],"warum":"Rankhilfe, Lichtkonkurrenz zu niedrigen Lichtpflanzen.","beleg":"[W/T]"},"Kohl":{"gut":["Sellerie","Tomate","Salat","Spinat","Buschbohne","Dill","Kartoffel"],"schlecht":["Zwiebel","Erdbeere","Radieschen","Senf","Knoblauch"],"warum":"Kreuzblütler teilen Kohlhernie und Kohlfliege; Kohl bildet keine Mykorrhiza.","beleg":"Familie [W], Rest [T]"},"Radieschen":{"gut":["Salat","Möhre","Spinat","Buschbohne","Erbse"],"schlecht":["Kohl","Gurke"],"warum":"Erdflöhe und Kohlhernie wie Kohl.","beleg":"[W/T]"},"Salat":{"gut":["Möhre","Radieschen","Erdbeere","Kohl","Zwiebel","Gurke","Tomate","Dill","Fenchel"],"schlecht":["Petersilie","Sellerie"],"warum":"Flache Wurzeln – idealer Lückenfüller.","beleg":"[T]"},"Möhre":{"gut":["Zwiebel","Lauch","Radieschen","Salat","Erbse","Tomate","Dill"],"schlecht":["Pfefferminze"],"warum":"Zwiebelduft soll die Möhrenfliege verwirren – messbar, aber schwach.","beleg":"[W/T]"},"Fenchel":{"gut":["Salat","Gurke","Erbse"],"schlecht":["Tomate","Buschbohne","Koriander","Dill","Paprika"],"warum":"Keimhemmung durch Fenchel-Extrakte nur im Labor nachgewiesen; mit Dill Kreuzung.","beleg":"[T]"},"Sellerie":{"gut":["Kohl","Lauch","Tomate","Buschbohne","Gurke"],"schlecht":["Kartoffel","Mais","Salat"],"warum":"Geruch soll Kohlweißling fernhalten.","beleg":"[T]"},"Petersilie":{"gut":["Tomate","Zwiebel","Radieschen"],"schlecht":["Salat","Petersilie"],"warum":"Mit sich selbst unverträglich: 3–4 Jahre Pause.","beleg":"[W/T]"},"Dill":{"gut":["Gurke","Möhre","Kohl","Salat","Zucchini"],"schlecht":["Fenchel"],"warum":"Lockt Nützlinge; mit Fenchel Kreuzung.","beleg":"[W/T]"},"Zwiebel":{"gut":["Möhre","Erdbeere","Rote Bete","Gurke","Dill","Salat","Petersilie"],"schlecht":["Buschbohne","Erbse","Kohl"],"warum":"Disulfide gegen Möhrenfliege; Hemmung der Leguminosen nicht belegt, aber verbreitete Gärtnerregel.","beleg":"[T]"},"Lauch":{"gut":["Möhre","Sellerie","Erdbeere","Tomate"],"schlecht":["Buschbohne","Erbse"],"warum":"Wie Zwiebel.","beleg":"[T]"},"Knoblauch":{"gut":["Erdbeere","Tomate","Möhre","Obstbaum","Rose"],"schlecht":["Buschbohne","Erbse","Kohl"],"warum":"Allicin wirkt im Labor gegen Pilze.","beleg":"[W/T]"},"Buschbohne":{"gut":["Bohnenkraut","Kartoffel","Gurke","Kohl","Rote Bete","Sellerie","Salat","Zucchini"],"schlecht":["Zwiebel","Lauch","Knoblauch","Erbse","Fenchel"],"warum":"Bindet Stickstoff; Bohnenkraut gegen Bohnenläuse.","beleg":"Stickstoff [W], Rest [T]"},"Stangenbohne":{"gut":["Mais","Kürbis","Salat"],"schlecht":["Zwiebel","Lauch","Erbse"],"warum":"Rankt am Mais (Drei Schwestern).","beleg":"[W/T]"},"Erbse":{"gut":["Möhre","Radieschen","Salat","Gurke","Fenchel"],"schlecht":["Buschbohne","Stangenbohne","Kartoffel","Zwiebel","Lauch","Knoblauch","Tomate"],"warum":"Fußkrankheiten: 4–5 Jahre Anbaupause.","beleg":"[W/T]"},"Spinat":{"gut":["Kartoffel","Kohl","Erdbeere","Radieschen","Tomate"],"schlecht":["Rote Bete","Mangold"],"warum":"Gleiche Familie (Gänsefußgewächse), keine Mykorrhiza.","beleg":"[W/T]"},"Rote Bete":{"gut":["Zwiebel","Kohl","Buschbohne","Dill","Salat"],"schlecht":["Spinat","Mangold","Mais"],"warum":"Wie Spinat.","beleg":"[W/T]"},"Mangold":{"gut":["Buschbohne","Kohl","Möhre","Radieschen"],"schlecht":["Spinat","Rote Bete"],"warum":"Wie Spinat.","beleg":"[W/T]"},"Erdbeere":{"gut":["Knoblauch","Zwiebel","Borretsch","Salat","Spinat","Lauch","Tagetes"],"schlecht":["Kohl","Rosengewächse als Vorkultur"],"warum":"Rosengewächs nach Rosengewächs: Bodenmüdigkeit.","beleg":"Nachbau [W]"},"Basilikum":{"gut":["Tomate","Gurke","Paprika"],"schlecht":["Thymian"],"warum":"Gleiche Ansprüche wie Tomate; Thymian will es trockener.","beleg":"[T]"},"Ringelblume":{"gut":["Tomate","Möhre","Kohl","Erdbeere","Obstbaum"],"schlecht":[],"warum":"Lockt Nützlinge; Hinweise auf Nematodenwirkung.","beleg":"[W/T]"},"Kapuzinerkresse":{"gut":["Tomate","Obstbaum","Kohl","Gurke","Kürbis","Kartoffel"],"schlecht":[],"warum":"Lockpflanze für Blattläuse und Kohlweißling (Senfölglykoside).","beleg":"[W/T]"},"Tagetes":{"gut":["Tomate","Kartoffel","Erdbeere","Rose"],"schlecht":[],"warum":"α-Terthienyl gegen Nematoden – nur als dichter Bestand. Lockt Schnecken.","beleg":"[W]"},"Obstbaum":{"gut":["Knoblauch","Kapuzinerkresse","Ringelblume","Beinwell"],"schlecht":["Walnuss","Rosengewächse als Vorkultur"],"warum":"Juglon schädigt Apfel; Nachbau-Krankheit bei Rosengewächsen.","beleg":"[W]"},"Walnuss":{"gut":["Mais","Möhre","Gräser"],"schlecht":["Tomate","Paprika","Kartoffel","Obstbaum"],"warum":"Juglon.","beleg":"[W]"},"Rose":{"gut":["Knoblauch","Lavendel","Tagetes"],"schlecht":["Rose"],"warum":"Rose nach Rose: Bodenmüdigkeit durch Nematoden.","beleg":"[W/T]"}}},{"typ":"tabelle","kopf":["Kultur","Zehrer","Gute Nachbarn","Schlechte Nachbarn","Warum","Evidenz"],"zeilen":[["Tomate","S","Basilikum, Petersilie, Möhre, Salat, Kapuzinerkresse, Tagetes, Knoblauch, Sellerie, Kohl","Kartoffel, Fenchel, Erbse, Gurke, Walnuss","Kartoffel überträgt Kraut- und Braunfäule; Walnuss: Juglon. Gurke braucht feuchteres Klima.","Kartoffel und Walnuss [W], Rest [T]"],["Kartoffel","S","Buschbohne, Kapuzinerkresse, Spinat, Kohl, Mais, Tagetes","Tomate, Kürbis, Gurke, Sonnenblume, Sellerie, Erbse","Tomate teilt Kraut- und Braunfäule; Kürbis und Gurke konkurrieren um Wasser und Platz.","Tomate [W], Rest [T]"],["Paprika","S","Tomate, Basilikum, Möhre","Fenchel, Kartoffel, Walnuss","Juglon-empfindlich wie alle Nachtschattengewächse.","Walnuss [W], Rest [T]"],["Gurke","S","Dill, Buschbohne, Erbse, Salat, Zwiebel, Mais, Sellerie","Tomate, Kartoffel, Radieschen, Zucchini","Dill lockt Schwebfliegen gegen Läuse; Zucchini teilt den Mehltau.","[T]"],["Kürbis","S","Mais, Stangenbohne, Kapuzinerkresse","Kartoffel, Zierkürbis","Drei Schwestern; Zierkürbis kann über Kreuzung bittere, giftige Früchte (Cucurbitacin) im Nachbau bringen.","Kreuzung [W], Rest [T]"],["Zucchini","S","Mais, Buschbohne, Kapuzinerkresse, Dill","Kartoffel, Gurke","Wie Kürbis; mit Gurke Mehltau-Brücke.","[W/T]"],["Mais","S","Stangenbohne, Kürbis, Gurke, Zucchini, Kartoffel","Sellerie, Rote Bete","Rankhilfe, Lichtkonkurrenz zu niedrigen Lichtpflanzen.","[W/T]"],["Kohl","S","Sellerie, Tomate, Salat, Spinat, Buschbohne, Dill, Kartoffel","Zwiebel, Erdbeere, Radieschen, Senf, Knoblauch","Kreuzblütler teilen Kohlhernie und Kohlfliege; Kohl bildet keine Mykorrhiza.","Familie [W], Rest [T]"],["Radieschen","Sch","Salat, Möhre, Spinat, Buschbohne, Erbse","Kohl, Gurke","Erdflöhe und Kohlhernie wie Kohl.","[W/T]"],["Salat","M/Sch","Möhre, Radieschen, Erdbeere, Kohl, Zwiebel, Gurke, Tomate, Dill, Fenchel","Petersilie, Sellerie","Flache Wurzeln – idealer Lückenfüller.","[T]"],["Möhre","M","Zwiebel, Lauch, Radieschen, Salat, Erbse, Tomate, Dill","Pfefferminze","Zwiebelduft soll die Möhrenfliege verwirren – messbar, aber schwach.","[W/T]"],["Fenchel","M","Salat, Gurke, Erbse","Tomate, Buschbohne, Koriander, Dill, Paprika","Keimhemmung durch Fenchel-Extrakte nur im Labor nachgewiesen; mit Dill Kreuzung.","[T]"],["Sellerie","S","Kohl, Lauch, Tomate, Buschbohne, Gurke","Kartoffel, Mais, Salat","Geruch soll Kohlweißling fernhalten.","[T]"],["Petersilie","M","Tomate, Zwiebel, Radieschen","Salat, Petersilie","Mit sich selbst unverträglich: 3–4 Jahre Pause.","[W/T]"],["Dill","Sch–M","Gurke, Möhre, Kohl, Salat, Zucchini","Fenchel","Lockt Nützlinge; mit Fenchel Kreuzung.","[W/T]"],["Zwiebel","M","Möhre, Erdbeere, Rote Bete, Gurke, Dill, Salat, Petersilie","Buschbohne, Erbse, Kohl","Disulfide gegen Möhrenfliege; Hemmung der Leguminosen nicht belegt, aber verbreitete Gärtnerregel.","[T]"],["Lauch","S","Möhre, Sellerie, Erdbeere, Tomate","Buschbohne, Erbse","Wie Zwiebel.","[T]"],["Knoblauch","M","Erdbeere, Tomate, Möhre, Obstbaum, Rose","Buschbohne, Erbse, Kohl","Allicin wirkt im Labor gegen Pilze.","[W/T]"],["Buschbohne","Sch","Bohnenkraut, Kartoffel, Gurke, Kohl, Rote Bete, Sellerie, Salat, Zucchini","Zwiebel, Lauch, Knoblauch, Erbse, Fenchel","Bindet Stickstoff; Bohnenkraut gegen Bohnenläuse.","Stickstoff [W], Rest [T]"],["Stangenbohne","Sch","Mais, Kürbis, Salat","Zwiebel, Lauch, Erbse","Rankt am Mais (Drei Schwestern).","[W/T]"],["Erbse","Sch","Möhre, Radieschen, Salat, Gurke, Fenchel","Buschbohne, Stangenbohne, Kartoffel, Zwiebel, Lauch, Knoblauch, Tomate","Fußkrankheiten: 4–5 Jahre Anbaupause.","[W/T]"],["Spinat","M","Kartoffel, Kohl, Erdbeere, Radieschen, Tomate","Rote Bete, Mangold","Gleiche Familie (Gänsefußgewächse), keine Mykorrhiza.","[W/T]"],["Rote Bete","M","Zwiebel, Kohl, Buschbohne, Dill, Salat","Spinat, Mangold, Mais","Wie Spinat.","[W/T]"],["Mangold","M","Buschbohne, Kohl, Möhre, Radieschen","Spinat, Rote Bete","Wie Spinat.","[W/T]"],["Erdbeere","M","Knoblauch, Zwiebel, Borretsch, Salat, Spinat, Lauch, Tagetes","Kohl, Rosengewächse als Vorkultur","Rosengewächs nach Rosengewächs: Bodenmüdigkeit.","Nachbau [W]"],["Basilikum","M","Tomate, Gurke, Paprika","Thymian","Gleiche Ansprüche wie Tomate; Thymian will es trockener.","[T]"],["Ringelblume","M","Tomate, Möhre, Kohl, Erdbeere, Obstbaum","–","Lockt Nützlinge; Hinweise auf Nematodenwirkung.","[W/T]"],["Kapuzinerkresse","M","Tomate, Obstbaum, Kohl, Gurke, Kürbis, Kartoffel","–","Lockpflanze für Blattläuse und Kohlweißling (Senfölglykoside).","[W/T]"],["Tagetes","M","Tomate, Kartoffel, Erdbeere, Rose","–","α-Terthienyl gegen Nematoden – nur als dichter Bestand. Lockt Schnecken.","[W]"],["Obstbaum","–","Knoblauch, Kapuzinerkresse, Ringelblume, Beinwell","Walnuss, Rosengewächse als Vorkultur","Juglon schädigt Apfel; Nachbau-Krankheit bei Rosengewächsen.","[W]"],["Walnuss","–","Mais, Möhre, Gräser","Tomate, Paprika, Kartoffel, Obstbaum","Juglon.","[W]"],["Rose","S","Knoblauch, Lavendel, Tagetes","Rose","Rose nach Rose: Bodenmüdigkeit durch Nematoden.","[W/T]"]]},{"typ":"text","text":"S = Starkzehrer, M = Mittelzehrer, Sch = Schwachzehrer. Nicht aufgeführte Paare gelten meist als neutral."}]},{"id":"chemie","titel":"Was chemisch passiert","bloecke":[{"typ":"abschnitt","titel":"1. Allelopathie – Pflanzen hemmen Nachbarn chemisch","liste":["**Juglon [W]:** Walnuss und besonders {{p:p17|Schwarznuss}} bilden eine ungiftige Vorstufe, die an Luft zu Juglon (5-Hydroxy-1,4-naphthochinon) oxidiert. Juglon hemmt die Protonenpumpe der Wurzelzellen und die Zellatmung und erzeugt reaktive Sauerstoffverbindungen. Schon 10 ppm halbierten das Wachstum von Tomatensämlingen. In durchlüftetem Boden bauen Mikroben es ab, in nassem, verdichtetem Boden reichert es sich an.","**Wermut [W/T]:** Absinthin und thujonhaltiges Öl hemmen im Labor die Keimung – im Beet nicht geprüft ({{p:p16|Wermut}}).","**Fenchel [T]:** Anethol hemmt im Labor die Keimung; ein Nachweis im Beet fehlt."]},{"typ":"illu","id":"mk_juglon","titel":"Juglon unter der Walnuss"},{"typ":"abschnitt","titel":"2. Wurzelausscheidungen und Rhizosphäre [W]","liste":["Pflanzen geben Zucker, organische Säuren, Aminosäuren und Abwehrstoffe in den Boden ab – bis zu einem Fünftel ihrer Photosyntheseprodukte.","Damit füttern sie eine artspezifische Mikrobengemeinschaft direkt an der Wurzel.","Steht dieselbe Art jahrelang am selben Ort, reichern sich spezialisierte Erreger an: Grundlage von Fruchtfolge und Bodenmüdigkeit. Mehr: {{s:boden-wurzelraum|Wurzelraum}}."]},{"typ":"abschnitt","titel":"3. Mykorrhiza [W]","liste":["Pilzfäden verlängern die Wurzeln und holen Phosphor und Wasser.","**Kreuzblütler** (Kohl, Radieschen, Senf) und **Gänsefußgewächse** (Spinat, Rote Bete, Mangold) bilden **keine** Mykorrhiza. Vor Lauch, Mais oder Bohne bauen sie das Pilznetz nicht auf.","Das „Wood Wide Web“, über das sich Pflanzen gezielt Signale schicken, ist fachlich umstritten."]},{"typ":"abschnitt","titel":"4. Stickstoff aus der Luft [W]","liste":["Knöllchenbakterien (Rhizobien) in Bohnen und Erbsen reduzieren mit dem Enzym Nitrogenase Luftstickstoff zu Ammoniak.","Leghämoglobin hält Sauerstoff vom empfindlichen Enzym fern und färbt aktive Knöllchen **rosa** – ein einfacher Test mit dem Daumennagel.","Der meiste Stickstoff wandert in die Samen und damit in die Ernte. Den größten Nutzen hat die **Folgekultur**, wenn die Wurzeln im Boden bleiben.","Bei viel Stickstoffdünger bildet die Bohne kaum Knöllchen."]},{"typ":"illu","id":"mk_knoellchen","titel":"Knöllchen der Bohne"},{"typ":"abschnitt","titel":"5. Duftstoffe [W/T]","liste":["Disulfide aus Zwiebel und Lauch, Thymol, Linalool und Senföle schrecken Insekten im Labor ab, im Freiland wirken sie unbeständig.","**Modell der „falschen Landungen“ (Finch & Collier):** Kohlfliegen finden ihre Wirtspflanze vor allem optisch über grüne Flächen. Jede andere Pflanze dazwischen lässt sie „falsch landen“ – unabhängig vom Duft. Wirksam ab etwa der Hälfte Bodenbedeckung."]},{"typ":"abschnitt","titel":"6. Tagetes gegen Nematoden [W]","liste":["Die Wurzeln bilden α-Terthienyl. Dringen Fadenwürmer ein, aktivieren Peroxidasen den Stoff; er bildet Sauerstoffradikale, die die Nematoden töten.","Wirkt gegen bis zu 14 Gattungen, vor allem Wurzelläsions- und Wurzelgallennematoden.","Nur ein **dichter, monatelang wachsender** Bestand wirkt; einzelne Tagetes zwischen Möhren vertreiben die Möhrenfliege nicht."]},{"typ":"illu","id":"mk_tagetes","titel":"Tagetes wirkt im Boden"},{"typ":"abschnitt","titel":"7. Lock- und Fangpflanzen [W/T]","liste":["Kapuzinerkresse zieht Blattläuse und Kohlweißlinge an, Tagetes und Salat Schnecken.","Bestes Beispiel weltweit: das „Push-Pull“-System im afrikanischen Mais (Desmodium stößt ab, Napiergras lockt).","Fangpflanzen regelmäßig kontrollieren, befallene Teile entfernen."]},{"typ":"abschnitt","titel":"8. Konkurrenz um Licht, Wasser und Nährstoffe [W]","liste":["Gute Partner ergänzen sich räumlich: tiefe Möhre neben flachem Salat.","Schlechte Partner wurzeln in derselben Schicht oder beschatten Lichtpflanzen.","Siehe Tabelle {{s:mischkultur-standort|Licht, Wasser, Nährstoffe}}."]}]},{"id":"fehler","titel":"Fehler & Folgen","bloecke":[{"typ":"tabelle","kopf":["Fehler","Was passiert","Folge","Evidenz"],"zeilen":[["Tomate neben Kartoffel","Sporen des Eipilzes Phytophthora infestans fliegen vom Kartoffelkraut auf die Tomaten","Blatt- und Fruchtfäule; befallene Früchte vorsorglich nicht essen","[W]"],["Gemüse unter Walnuss","Juglon-Aufnahme über die Wurzeln","Welke trotz feuchtem Boden, Absterben","[W]"],["Rosengewächs nach Rosengewächs","Erregerkomplex aus Actinomyceten, Oomyceten, Nematoden und Phlorizin-Resten","Kümmerwuchs, pinselartige Wurzeln, jahrelang","[W]"],["Kreuzblütler auf Kreuzblütler","Dauersporen der Kohlhernie überleben bis 20 Jahre","Wurzelwucherungen, Welke","[W]"],["Zu dicht gepflanzt","feuchtes Kleinklima zwischen den Blättern","Pilzkrankheiten, Mehltau","[W]"],["Kürbis-Saatgut neben Zierkürbis","Kreuzung bringt Bitterstoff Cucurbitacin zurück","bittere Früchte können schwere Magen-Darm-Vergiftungen auslösen – **nie bittere Zucchini oder Kürbisse essen**","[W]"],["Viel Stickstoff zu Bohnen","Pflanze stellt Knöllchenbildung ein","kein Stickstoffgewinn, mehr Läuse","[W]"],["Starkzehrer auf Starkzehrer","Nährstoffe einseitig ausgeschöpft","schwache Ernte, mehr Krankheiten","[W/T]"]]},{"typ":"hinweis","text":"**Gegen Bodenmüdigkeit** [W]: Pflanzloch großzügig mit frischer Erde füllen, Standort wechseln, reifen Kompost oder Champost (Pilzsubstrat) einarbeiten. In einem Praxisversuch stärkte Champost die bodeneigene Abwehr am wirksamsten."}]},{"id":"plan","titel":"Beet planen","bloecke":[{"typ":"illu","id":"mk_beet","titel":"Mischkulturbeet nach Gertrud Franck"},{"typ":"illu","id":"fruchtfolge","titel":"Vierjährige Fruchtfolge"},{"typ":"illu","id":"mk_dreischwestern","titel":"Die Drei Schwestern"},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"moehre","titel":"Möhre + Zwiebel","kat":"alle","beleg":"W","teil":"Klassiker","kurz":"Abwechselnde Reihen; die Zwiebel stört die Möhrenfliege leicht, die Möhre wurzelt tiefer.","zutaten":["Möhrensaat, Steckzwiebeln"],"schritte":["Reihen im Abstand von 20–25 cm abwechselnd säen und stecken.","Dazwischen Radieschen als Markiersaat.","Nach der Zwiebelernte im Juli Feldsalat nachsäen."]},{"id":"tomate","titel":"Tomate + Basilikum + Tagetes","kat":"alle","beleg":"T","teil":"Sommerbeet","kurz":"Unter dem Regendach, Kartoffeln weit weg.","zutaten":["Tomaten, Basilikum, Tagetes, Ringelblume"],"schritte":["Tomaten 60–80 cm Abstand.","Basilikum und Tagetes dazwischen.","Boden mit Rasenschnitt mulchen."]},{"id":"drei","titel":"Drei Schwestern","kat":"alle","beleg":"W","teil":"Mais, Bohne, Kürbis","kurz":"Ende Mai Mais, zwei bis drei Wochen später Bohnen und Kürbis.","zutaten":["Mais, Stangenbohne, Kürbis","Platz: ca. 3 × 3 m"],"schritte":["Mais in Gruppen à 4–5 Pflanzen.","Wenn der Mais 15–20 cm hoch ist, je Gruppe 2–3 Bohnen dazu.","Kürbis zwischen die Gruppen setzen."],"tipp":"Gut fürs Hügelbeet: {{s:huegelbeet-bepflanzung|Hügelbeet bepflanzen}}."},{"id":"kohl","titel":"Kohl + Sellerie + Salat","kat":"alle","beleg":"T","teil":"Herbstbeet","kurz":"Sellerie soll Kohlweißlinge verwirren, Salat füllt Lücken.","zutaten":["Kohl, Sellerie, Salat, Dill"],"schritte":["Kohl 50 cm Abstand, Sellerie dazwischen.","Salat in die Lücken, Dill an den Rand.","Kulturschutznetz bleibt der sicherste Schutz."]},{"id":"erdbeere","titel":"Erdbeere + Knoblauch","kat":"alle","beleg":"T","teil":"Dauerbeet","kurz":"Knoblauch zwischen Erdbeeren gegen Pilzkrankheiten.","zutaten":["Erdbeerpflanzen, Knoblauchzehen"],"schritte":["Im Herbst zwischen die Erdbeerreihen Knoblauch stecken.","Nach 3 Jahren Erdbeeren auf neues Beet – kein Rosengewächs davor."]}]},{"typ":"abschnitt","titel":"So planst du","nummern":["Beete in vier Gruppen einteilen: Starkzehrer, Mittelzehrer, Schwachzehrer, Gründüngung.","Pro Beet 3–4 Kulturen aus **verschiedenen Familien** wählen, mit dem Nachbar-Check prüfen.","Hohe Pflanzen an die Nordseite, damit sie niemanden beschatten.","Lücken mit schnellen Kulturen füllen, Boden immer bedeckt halten.","Jedes Jahr notieren, was wo stand – das ist die Grundlage der Fruchtfolge."]}]},{"id":"standort","titel":"Licht, Wasser, Nährstoffe","bloecke":[{"typ":"tabelle","kopf":["Kultur","Licht","Wasser","Nährstoffe","Abstand (cm)","Wurzeltiefe"],"zeilen":[["Tomate","☀☀☀ volle Sonne, Regenschutz","gleichmäßig viel, nicht über die Blätter","Starkzehrer","60–80","tief"],["Gurke","☀☀☀ warm","viel, lauwarm","Starkzehrer","40–60","flach"],["Kartoffel","☀☀☀","mittel, zur Blüte mehr","Starkzehrer","30 × 60","mittel"],["Kohl","☀☀ Sonne bis Halbschatten","viel","Starkzehrer","50 × 50","mittel"],["Kürbis, Zucchini","☀☀☀","viel","Starkzehrer","100–200","flach, breit"],["Mais","☀☀☀","mäßig","Starkzehrer","30 × 60","tief"],["Lauch, Sellerie","☀☀☀","viel","Starkzehrer","15–40","mittel"],["Möhre","☀☀☀","mäßig, gleichmäßig","Mittelzehrer","3–5 × 25","tief"],["Zwiebel","☀☀☀","wenig, zur Reife trocken","Mittelzehrer","5–10 × 25","flach"],["Rote Bete, Mangold","☀☀","mäßig","Mittelzehrer","10–30","tief"],["Salat","☀☀ Sonne bis Halbschatten","gleichmäßig","Mittel- bis Schwachzehrer","25–30","flach"],["Spinat","☀ Halbschatten, kühl","gleichmäßig","Mittelzehrer","5 × 25","mittel"],["Erdbeere","☀☀☀","gleichmäßig","Mittelzehrer","30 × 60","flach"],["Buschbohne","☀☀☀ warm","mäßig","Schwachzehrer","10 × 40","mittel"],["Erbse","☀☀","mäßig","Schwachzehrer","5 × 40","mittel"],["Radieschen","☀☀","gleichmäßig","Schwachzehrer","3 × 15","flach"],["Mediterrane Kräuter","☀☀☀","wenig","Schwachzehrer","25–40","mittel"]]},{"typ":"text","text":"Richtwerte für Mitteleuropa [T]. Nährstoffe: Starkzehrer ca. 3 l Kompost/m² plus organischer Dünger, Mittelzehrer 2 l, Schwachzehrer keinen. Mehr: {{s:boden-aufbauen|Boden aufbauen}}."}]},{"id":"tradition","titel":"Tradition, Franck & Storl","bloecke":[{"typ":"abschnitt","titel":"Gertrud Franck – das Mischkultur-System [T]","liste":["Die Gärtnerin Gertrud Franck (Oberlimpurg, Schwäbisch Hall) entwickelte ab den 1950er-Jahren ein festes Reihensystem und veröffentlichte es in „Gesunder Garten durch Mischkultur“.","Reihen im Abstand von 50 cm: Hauptkulturen, Begleitkulturen und dazwischen **Spinatreihen**, die abgeerntet und als Mulch liegen gelassen werden.","Der Boden ist so das ganze Jahr bedeckt und wird nie umgegraben."]},{"typ":"text","text":"**Storl** sieht den Garten als lebendigen Organismus, in dem Boden, Pflanzen, Tiere, Jahreslauf und Mensch zusammenwirken ({{a:storl-buecher-mikrokosmos|Der Garten als Mikrokosmos}}, 1988). Daraus folgt für ihn: **Mischkultur statt Monokultur**, Kompost und Mulch statt Kunstdünger, alte samenfeste Sorten und Beikräuter als Teil des Systems ({{a:storl-garten-mikrokosmos|Den Garten als Ganzes sehen}}, {{a:storl-buecher-unkraeuter|Die „Unkräuter“ in meinem Garten}}). Seine Erfahrung stammt auch aus biologisch-dynamischen Höfen im Emmental ({{a:storl-person|Person}}). [T]"},{"typ":"text","text":"**Biologisch-dynamischer Aussaatkalender** (Maria Thun): Aussaat nach Mondstand und Sternbild. Verbreitet in der anthroposophischen Gartenpraxis; eine Wirkung ist wissenschaftlich nicht belegt. [A]"}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Rakotomalala et al. 2023: Intercropping enhances beneficial arthropods (Agric. Ecosyst. Environ.)","https://www.sciencedirect.com/science/article/abs/pii/S0167880923002761"],["Metaanalyse assoziative Resistenz gegen Bodenkrankheiten (PMC9545407)","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9545407/"],["IntechOpen: Companion Planting and Insect Pest Control","https://www.intechopen.com/chapters/42925"],["Landwirtschaftskammer NRW: Kraut- und Braunfäule","https://www.landwirtschaftskammer.de/landwirtschaft/pflanzenschutz/hausgarten/gemuese/krautfaeule.htm"],["University of Illinois Extension: Plants that inhibit other plants","https://extension.illinois.edu/blogs/ilriverhort/2018-08-06-plants-inhibit-other-plants"],["Alpha-Terthienyl und Nematoden (PMC6504006)","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6504006/"],["UF/IFAS: Marigolds and nematodes","https://ask.ifas.ufl.edu/publication/NG045/pdf"],["Ökolandbau.de: Bodengesundheit im Obstanbau (Champost)","https://www.oekolandbau.de/forschung/verbesserte-bodengesundheit-im-obstanbau/"],["Rosen Tantau: Bodenmüdigkeit","https://www.rosen-tantau.com/pflegetipps/wenn-rosen-nicht-richtig-gedeihen-bodenmuedigkeit/nachbaukrankheit/"],["Hochschule Weihenstephan-Triesdorf: Kraut- und Braunfäule der Tomaten","https://www.hswt.de/fileadmin/Redaktion/Hochschule/Organisation/Zentrale_Einrichtungen/Weihenstephaner_Gaerten/Pflanzenschutz/Kraut-_und_Braunfaeule_der_Tomaten.pdf"]]}]}]},{"id":"knospen","titel":"Knospen & junge Triebe","nr":"S-04","illu":"knospe_schnitt","fotos":[],"text":"Was in einer Knospe steckt, welche Knospen und Triebe essbar sind, wie man sie sicher und erlaubt sammelt, Rezepte und die Gemmotherapie mit ehrlicher Einordnung.","stichworte":["Knospen","Gemmotherapie","Glyzerinmazerat","Maiwipferl","Kiefernknospen","Fichtenspitzen","Lindenknospen","Knospensirup","Knospenhonig","falsche Kapern","Eibe","Handstraußregel","Meristem","Abscisinsäure","Pol Henry"],"pflanzen":["p14#heilkunde"],"kurz":"In jeder Knospe liegt der fertige Trieb des nächsten Jahres – konzentriert, geschützt durch Harz und Schuppen. Viele Knospen und junge Triebe sind essbar und heilkundlich genutzt. Wer sammelt, muss Eibe und andere Giftpflanzen sicher ausschließen.","steckbrief":[["Sammelzeit","Februar–Mai, je nach Art; immer bevor die Knospe aufbricht oder der Trieb verholzt"],["Recht","§ 39 BNatSchG: geringe Mengen für den eigenen Bedarf (Handstraußregel)"],["Größte Gefahr","Eibe (Taxin) – Nadeln ohne weiße Streifen"],["Gemmotherapie","Herstellung im Europäischen Arzneibuch, Wirkung nicht belegt [A]"],["Klassiker","Maiwipferl-Sirup aus Kiefer oder Fichte"],["Weiter","{{p:p14|Waldkiefer}}"]],"reiter":[{"id":"grundlagen","titel":"Was in einer Knospe steckt","bloecke":[{"typ":"illu","id":"knospe_schnitt","titel":"Knospe im Längsschnitt"},{"typ":"abschnitt","titel":"Aufbau und Biochemie [W]","liste":["Eine Knospe ist ein gestauchter Spross: Im Inneren liegt das **Apikalmeristem**, ein teilungsaktives Gewebe, dazu die fertig angelegten Blätter oder Blüten.","**Knospenschuppen** schützen vor Frost, Austrocknung, UV und Keimen – mit Harzen, Flavonoiden und Gerbstoffen. Aus Pappelknospen sammeln Bienen das Harz für Propolis.","**Abscisinsäure** hält die Knospe über Winter in Ruhe; **Gibberelline** und **Cytokinine** lösen den Austrieb aus; **Auxin** aus der Endknospe hemmt die Seitenknospen (Apikaldominanz).","Teilungsaktives Gewebe ist reich an Aminosäuren, Eiweiß, Nukleinsäuren, Mineralstoffen und – bei jungen Nadelbaumtrieben – Vitamin C."]},{"typ":"hinweis","text":"Pflanzenhormone wirken beim Menschen in Nahrungsmengen nicht als „Wachstumsfaktoren“. Aussagen über „Stammzellen aus Knospen“ sind Theorien der Gemmotherapie, keine belegten Wirkungen."}]},{"id":"essbar","titel":"Essbare Knospen","bloecke":[{"typ":"tabelle","kopf":["Pflanze","Teil","Zeit","Verwendung","Hinweis"],"zeilen":[["Waldkiefer","Maiwipferl 3–5 cm","April–Mai","Sirup, Tee, Honig","Kommission E [W]; {{p:p14|Kapitel Kiefer}}"],["Fichte","Triebspitzen","April–Mai","Sirup, Pesto, Salz","[T]"],["Linde","Knospen, junge Blätter","März–April","Salat, roh naschen","mild, schleimig [T]"],["Rotbuche","junge Blätter","April","Salat","[T]; Bucheckern roh nur wenig"],["Birke","Knospen, junge Blätter","März–April","Tee, Salat","HMPC: Blätter traditionell zur Durchspülung [W]"],["Schwarze Johannisbeere","Knospen","Februar–März","Likör, Gemmo","sehr aromatisch [T/A]"],["Hundsrose","Blütenknospen","Mai","Salat, Gelee","[T]"],["Weißdorn","Knospen, junge Blätter","März–April","Salat, Tee","HMPC traditionell bei nervösen Herzbeschwerden [W]"],["Feige","Knospen","Frühjahr","Gemmo","Milchsaft macht die Haut lichtempfindlich [W]"],["Gänseblümchen, Löwenzahn, Kapuzinerkresse","Blütenknospen","Frühjahr–Sommer","„Falsche Kapern“","[T]; {{p:p03|Löwenzahn}}"],["Kapernstrauch","Blütenknospen","Sommer","eingelegt","nur im Kübel; rutinreich [W]"]]},{"typ":"hinweis","text":"**Giftig:** Die Knospen der **Sumpfdotterblume** wurden früher als Kapernersatz verwendet – sie enthalten Protoanemonin und sind giftig. Auch Hahnenfuß-Knospen nie verwenden."}]},{"id":"sammeln","titel":"Sicher sammeln","bloecke":[{"typ":"illu","id":"nadel_vergleich","titel":"Nadelbäume unterscheiden"},{"typ":"abschnitt","titel":"Merksatz Nadelbäume","liste":["**Fichte:** spitze, vierkantige Nadeln rundum am Zweig, sticht.","**Tanne:** flache Nadeln mit **zwei weißen Streifen** unten, weich.","**Kiefer:** lange Nadeln **zu zweit**.","**Eibe:** flache, weiche Nadeln **ohne** weiße Streifen, keine Zapfen, rote Beeren – **sehr giftig** (Taxin, Herzgift). Im Zweifel nicht ernten.","Ebenfalls giftig: Thuja (Lebensbaum) und Sadebaum (Stinkwacholder) mit Schuppenblättern."]},{"typ":"abschnitt","titel":"Recht und Rücksicht","liste":["**§ 39 Abs. 3 BNatSchG** [W]: Jeder darf wild lebende Pflanzen, Früchte, Pilze, Tee- und Heilkräuter sowie **Zweige** an Stellen ohne Betretungsverbot in geringen Mengen für den persönlichen Bedarf pfleglich entnehmen.","**Handstraußregel:** etwa so viel, wie eine Hand fasst.","Nicht in Naturschutzgebieten, nicht von geschützten Arten, nicht gewerblich ohne Genehmigung, nicht in jungen Forstkulturen und nicht auf Privatgrund ohne Erlaubnis.","**Baum schonen:** nie den Leittrieb; nur Seitentriebe, verteilt über viele Bäume.","Nicht an Straßen, Hundewegen oder gespritzten Flächen sammeln. Weidenkätzchen als frühe Bienennahrung stehen lassen."]},{"typ":"tabelle","kopf":["Monat","Was"],"zeilen":[["Februar–März","Schwarze Johannisbeere, Birke, Linde"],["März–April","Weißdorn, Buche, Lindenblätter"],["April–Mai","Fichte, Kiefer, Tanne (Maiwipferl)"],["Mai–Juni","Rosenknospen, Gänseblümchen, Löwenzahn"],["Sommer","Kapuzinerkresse, Kapern"]]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["vorrat","Vorrat"],["kueche","Küche"]],"eintraege":[{"id":"sirup","titel":"Kalter Maiwipferl-Sirup","kat":"vorrat","menge":"2 Flaschen","zeit":"3–4 Wochen","kurz":"Schichten, Sonne, fertig – Details beim Kapitel Kiefer.","zutaten":["junge Kiefern- oder Fichtenspitzen","Zucker im Verhältnis 1:1"],"schritte":["Abwechselnd schichten, 3–4 Wochen sonnig stellen.","Abseihen, kühl lagern."],"tipp":"Ausführlich: {{p:p14#rezepte-sirup|Maiwipferl-Sirup}}."},{"id":"honig","titel":"Knospenhonig","kat":"vorrat","menge":"1 Glas","zeit":"2–4 Wochen","kurz":"Fichtenspitzen in Honig.","zutaten":["eine Handvoll gehackte Fichten- oder Kiefernspitzen","500 g flüssiger Honig"],"schritte":["Spitzen ins Glas, mit Honig bedecken.","2–4 Wochen ziehen lassen, abseihen."],"hinweis":"Nicht für Säuglinge unter 12 Monaten (Botulismus)."},{"id":"pesto","titel":"Fichtenspitzen-Pesto","kat":"kueche","menge":"1 Glas","zeit":"15 Min.","kurz":"Harzig-zitronig zu Pasta und Käse.","zutaten":["2 Handvoll Fichtenspitzen","50 g Sonnenblumenkerne, 50 g Parmesan","120 ml Olivenöl, Salz"],"schritte":["Alles im Mixer fein pürieren.","Mit Öl bedeckt kühl lagern, in 2 Wochen verbrauchen."]},{"id":"salat","titel":"Knospensalat","kat":"kueche","menge":"2 Pers.","zeit":"15 Min.","kurz":"Frühlingssalat aus dem Wald.","zutaten":["Lindenknospen und junge Lindenblätter","junge Buchenblätter","Gänseblümchen- und Löwenzahnknospen","Walnussöl, Apfelessig, Salz, Honig"],"schritte":["Alles waschen, trocken schleudern.","Mit der Vinaigrette anmachen, sofort servieren."]},{"id":"kapern","titel":"Falsche Kapern","kat":"vorrat","menge":"1 kleines Glas","zeit":"1 Tag + 2 Wochen","kurz":"Aus Gänseblümchen-, Löwenzahn- oder Kapuzinerkresse-Knospen.","zutaten":["eine Tasse geschlossene Knospen","Salz (10 % des Knospengewichts)","Essig und Wasser 1:1"],"schritte":["Knospen einen Tag mit Salz ziehen lassen, abspülen.","Mit heißem Essig-Wasser-Sud übergießen, verschließen.","2 Wochen reifen lassen."]},{"id":"mazerat","titel":"Glyzerinmazerat (Gemmo-Grundrezept)","kat":"vorrat","menge":"ca. 50 ml","zeit":"3–4 Wochen","kurz":"Die Grundzubereitung der Gemmotherapie [A].","zutaten":["1 Teil frische Knospen (Gewicht)","je 15 Teile Ethanol, Glycerin und Wasser"],"schritte":["Knospen zerkleinern, mit der Mischung übergießen.","3–4 Wochen bei ca. 20 °C dunkel ziehen lassen, täglich schütteln.","Filtrieren; traditionell 1:10 verdünnt angewendet."],"hinweis":"Enthält Alkohol. Wirksamkeit nicht belegt, siehe Reiter Gemmotherapie."}]}]},{"id":"gemmo","titel":"Gemmotherapie","bloecke":[{"typ":"text","text":"Der belgische Arzt **Pol Henry** (1918–1988) beschrieb 1956 die „Phytembryotherapie“: Knospen und junge Triebe enthielten als embryonales Gewebe besondere Kräfte. Der Homöopath Max Tétau prägte den Namen Gemmotherapie. [A]"},{"typ":"tabelle","kopf":["Aspekt","Einordnung"],"zeilen":[["Herstellung (Glycerolmazerat)","[W] seit 1965 im französischen, seit 2011 im Europäischen Arzneibuch geregelt – das normiert die Herstellung, nicht die Wirkung"],["Wirksamkeit","[A] nicht durch kontrollierte Studien belegt; als medizinisches Verfahren nicht anerkannt"],["Typische Pflanzen","[A] Schwarze Johannisbeere, Hundsrose, Weißdorn, Feige, Birke, Linde, Bergkiefer"],["Theorie „Stammzellen“, „Proteinsprache“","[A] Erklärungsmodelle der Methode, nicht geprüft"]]},{"typ":"hinweis","text":"Gemmo-Präparate enthalten meist Alkohol – nicht für Kinder, Schwangere und trockene Alkoholiker ohne Rücksprache."}]},{"id":"storl","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Junge Nadelbaumtriebe waren über Jahrhunderte Winter- und Frühjahrsmedizin der Waldvölker gegen Skorbut; Birken- und Lindenknospen gehörten zur Notnahrung im Frühjahr. [T]"},{"typ":"text","text":"**Storl** beschreibt den Menschen als „Geschöpf des Waldes“ ({{a:storl-buecher-wir-geschoepfe|Wir sind Geschöpfe des Waldes}}) und das Sammeln als Begegnung: mit Respekt und Dank nehmen, nie alles ({{a:storl-denken|Storls Denken}}). Für das Knospensammeln heißt das: wenig, verteilt, und den Baum leben lassen. [T]"}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["naturmed-praxis: Gemmotherapie","https://www.naturmed-praxis.de/nachrichten/gemmotherapie/"],["Paracelsus Magazin: Gemmotherapie – die Kraft der Knospen","https://www.paracelsus.de/magazin/ausgabe/201403/gemmotherapie-die-kraft-der-knospen"],["Thieme natürlich: Gemmotherapie","https://natuerlich.thieme.de/therapieverfahren/phytotherapie/detail/gemmotherapie-was-knospen-koennen-4334"],["mundraub: Was ist die Handstraußregel?","https://mundraub.org/blog/was-ist-die-handstraussregelung"],["Landkreis Haßberge: Schutz wild lebender Pflanzen (§ 39 BNatSchG)","https://www.hassberge.de/dienstleistungen/naturschutz/artenschutz/schutz-wild-lebender-tiere-und-pflanzen.html"],["arzneipflanzenlexikon: Kiefer","https://arzneipflanzenlexikon.info/kiefer.php"]]}]}]},{"id":"tabak","titel":"Tabak – vom Samen zur Zigarette","nr":"S-05","illu":"tabak_zeitplan","fotos":[],"text":"Tabak im eigenen Garten: Anzucht, Pflanzung, Köpfen und Geizen, Ernte, Gelben und Trocknen, Fermentieren, Schneiden und Stopfen – mit Zeitplan, Mengen, Temperaturen, Biochemie und Rechtslage.","stichworte":["Tabak","Tabakanbau","Nikotin","Virginia","Burley","Bauerntabak","köpfen","geizen","Sandblatt","Grumpen","Hauptgut","Obergut","fädeln","trocknen","flue-cured","air-cured","fermentieren","Kilning","Feinschnitt","Zigaretten stopfen","Tabaksteuer","Eigenbedarf"],"pflanzen":["p21"],"kurz":"Vom Samenkorn, das kleiner als ein Staubkorn ist, bis zum fertig fermentierten Feinschnitt vergeht fast ein Jahr. Der Anbau ist einfach – entscheidend für die Qualität sind Erntezeitpunkt, langsames Gelben und Trocknen und die Fermentation. Eigenbedarf ist in Deutschland erlaubt und steuerfrei. Gesund ist Rauchen trotzdem nicht.","steckbrief":[["Zeitbedarf","Aussaat Februar/März bis rauchfertig ca. Oktober–Dezember"],["Samen","ca. 10.000 pro Gramm; Lichtkeimer, 20–28 °C, Keimung 4–10 Tage"],["Pflanzung","nach Mitte Mai, ca. 50 × 70 cm, 8–10 cm große Jungpflanzen"],["Ertrag","Richtwert ca. 50–100 g getrockneter Tabak pro Pflanze – je nach Sorte und Sommer"],["Trocknen","Luft: 4–8 Wochen, 20–30 °C, 65–80 % Luftfeuchte"],["Fermentieren","ca. 45–55 °C, 70–75 % Luftfeuchte, 2–6 Wochen"],["Rauchfertig","12–16 % Feuchte, Feinschnitt 0,5–1 mm; ca. 0,7 g pro Zigarette"],["Recht","Eigenbedarf steuerfrei (§ 30 Abs. 1 Nr. 2 TabStG); Verkauf und Weitergabe nicht"]],"reiter":[{"id":"ueberblick","titel":"Überblick","bloecke":[{"typ":"text","text":"Tabak ist eine dankbare Gartenpflanze: wenig Krankheiten, schnelles Wachstum, riesige Blätter. Die Kunst liegt nach der Ernte. Ein frisch getrocknetes Blatt ist kratzig und scharf; erst langsames Gelben, Trocknen und Fermentieren machen daraus milden, aromatischen Tabak."},{"typ":"abschnitt","titel":"Die acht Schritte","nummern":["**Anzucht** im Haus (Februar–März)","**Auspflanzen** nach den Eisheiligen","**Pflege:** gießen, düngen, köpfen, geizen","**Ernte** blattweise von unten nach oben (Juli–September)","**Gelben:** Blätter 2–5 Tage warm und feucht halten, bis sie gelb sind","**Trocknen:** 4–8 Wochen im Schatten","**Fermentieren:** 2–6 Wochen warm und feucht","**Verarbeiten:** entrippen, schneiden, befeuchten, stopfen oder drehen"]},{"typ":"hinweis","text":"Rauchen ist in Deutschland laut Deutschem Krebsforschungszentrum für rund 127.000 Todesfälle pro Jahr verantwortlich. Selbst angebauter Tabak ist **nicht** gesünder: Die Hauptschäden entstehen beim Verbrennen (Teer, Kohlenmonoxid, krebserregende Stoffe), nicht durch Zusatzstoffe. Hilfe beim Aufhören: Rauchfrei-Telefon 0800 8 31 31 31 (kostenfrei)."},{"typ":"tabelle","kopf":["Was","Menge pro Pflanze (Richtwert)"],"zeilen":[["Blätter","ca. 15–25"],["Frischgewicht","ca. 0,5–1,5 kg"],["Trockengewicht","ca. 50–100 g (Wasser sind ca. 85–90 % des frischen Blatts)"],["Zigaretten","grob 70–140 Stück (bei ca. 0,7 g)"]]},{"typ":"text","text":"Die Mengen sind grobe Richtwerte aus der Hobbypraxis – Sorte, Sommer und Erntedichte machen große Unterschiede."}]},{"id":"anzucht","titel":"Anzucht","bloecke":[{"typ":"illu","id":"tabak_anzucht","titel":"Anzucht in vier Schritten"},{"typ":"abschnitt","titel":"So geht’s","nummern":["**Zeit:** Mitte Februar bis Ende März. Für eine Hobbyernte reichen wenige Pflanzen: 0,1 g Saatgut ergibt schon Hunderte Sämlinge.","**Substrat:** feine, nährstoffarme Anzuchterde, vorher anfeuchten.","**Säen:** Samen mit etwas Sand mischen, dünn aufstreuen, nur andrücken – **Lichtkeimer, nicht abdecken**.","**Keimen:** 20–28 °C, Folie oder Haube, hell ohne direkte Sonne; Keimung nach 4–10 Tagen. Nur besprühen, nicht gießen.","**Pikieren:** ab dem zweiten echten Blattpaar einzeln in Töpfchen, mindestens 3 cm Abstand.","**Weiter ziehen:** hell, 18–22 °C; nach 6–8 Wochen sind die Pflanzen 8–10 cm groß.","**Abhärten:** ab Anfang Mai tagsüber nach draußen, weniger gießen."]},{"typ":"hinweis","text":"Tabak keimt ungleichmäßig. Die Saatschale nicht zu früh wegwerfen – Nachzügler kommen noch nach zwei Wochen."}]},{"id":"anbau","titel":"Pflanzung & Pflege","bloecke":[{"typ":"illu","id":"tabak_pflege","titel":"Pflege: köpfen, geizen, ernten"},{"typ":"abschnitt","titel":"Standort und Boden","liste":["**Licht:** volle Sonne, warm, windgeschützt (große Blätter knicken).","**Boden:** locker, humos, sandig-lehmig, pH 5,6–6,8, keine Staunässe.","**Vorfrucht:** gern Getreide; keine Leguminosen direkt davor (zu viel Stickstoff).","**Fruchtfolge:** nicht nach Tomate oder Kartoffel (gleiche Familie, gleiche Krankheiten), 3–4 Jahre Pause. Siehe {{s:mischkultur|Mischkultur}}."]},{"typ":"abschnitt","titel":"Pflanzen","nummern":["Nach Mitte Mai, wenn der Boden warm ist (nicht unter 10–13 °C).","Abstand ca. 50 cm in der Reihe, 70 cm zwischen den Reihen.","Etwas tiefer setzen als im Topf und später anhäufeln – das gibt Halt.","Kräftig angießen."]},{"typ":"tabelle","kopf":["Pflege","Was","Warum"],"zeilen":[["Gießen","in Trockenzeiten durchdringend, morgens an den Fuß","große Blattmasse verdunstet viel; nasse Blätter fördern Pilze"],["Düngen","Kompost (ca. 3–4 l/m²) beim Pflanzen; kaliumreich, **chloridfrei** (kein Kaliumchlorid, kein Blaukorn)","Kalium verbessert Glimmfähigkeit; Chlorid verschlechtert sie; zu viel Stickstoff macht dunkle, nitratreiche, scharfe Blätter"],["Köpfen","sobald die Blütenknospen erscheinen: Blütenstand 5–10 cm unter dem ersten Ansatz abschneiden","Kraft geht in die Blätter; Blätter werden größer, dicker, nikotinreicher"],["Geizen","Seitentriebe in den Blattachseln ausbrechen, sobald sie erscheinen – alle paar Tage","sonst wachsen nach dem Köpfen überall neue Triebe"],["Saatgut","1–2 Pflanzen nicht köpfen, Kapseln reif werden lassen","eine Pflanze liefert Saat für Jahre"]]},{"typ":"abschnitt","titel":"Probleme","liste":["**Blauschimmel** (Peronospora tabacina): gelbe Flecken oben, grauviolett unten – Abstand, morgens gießen, befallene Blätter entfernen.","**Blattläuse, Weiße Fliege** im Gewächshaus: Nützlinge, abspritzen.","**Tabakmosaikvirus:** marmorierte Blätter; wird mit den Händen übertragen – Raucher sollten vor der Arbeit Hände waschen, befallene Pflanzen entfernen.","**Schnecken** an Jungpflanzen."]}]},{"id":"ernte","titel":"Ernte","bloecke":[{"typ":"illu","id":"tabak_reife","titel":"Vom grünen zum fermentierten Blatt"},{"typ":"abschnitt","titel":"Wann ist ein Blatt reif?","liste":["Farbe wechselt von sattgrün zu **hellgrün mit gelblichen Flecken**, Spitze und Ränder werden gelblich.","Das Blatt fühlt sich dicker, etwas „ledrig“ an und hängt nach unten.","Es bricht beim Herunterdrücken mit einem leisen Knacken sauber vom Stängel.","Untere Blätter reifen zuerst; Ernte über 5–7 Wochen, alle paar Tage 2–4 Blätter pro Pflanze."]},{"typ":"tabelle","kopf":["Blattetage","Lage","Eigenschaften"],"zeilen":[["Sandblatt","unterste 2–3 Blätter","dünn, oft verschmutzt, wenig Nikotin – oft verworfen"],["Grumpen","darüber","leicht, mild, gut brennend"],["Hauptgut","Mitte","beste Qualität, groß, ausgewogen"],["Obergut","oben","dick, kräftig, am meisten Nikotin"]]},{"typ":"abschnitt","titel":"Zwei Methoden","liste":["**Blattweise ernten** (Virginia, beste Qualität): immer nur reife Blätter.","**Stammernte** (Burley, Bauerntabak): ganze Pflanze kurz über dem Boden abschneiden, wenn die mittleren Blätter reif sind; kopfüber aufhängen – schneller, aber gemischte Qualität."]},{"typ":"hinweis","text":"**Nie bei Tau oder nach Regen ernten** und Handschuhe tragen: Nikotin geht aus nassen Blättern durch die Haut (Grüne Tabakkrankheit). Am besten am späten Vormittag, wenn die Blätter trocken sind."}]},{"id":"trocknen","titel":"Gelben & Trocknen","bloecke":[{"typ":"illu","id":"tabak_trocknen","titel":"Trockenschuppen"},{"typ":"abschnitt","titel":"1. Gelben (2–5 Tage)","liste":["Frische Blätter aufeinanderlegen oder in einen Karton/Beutel locker schichten, warm (ca. 30–35 °C) und feucht halten.","Das Blatt lebt noch und „hungert“: Es verbraucht Stärke, baut Chlorophyll ab – das Gelb der Carotinoide wird sichtbar.","Täglich wenden; fertig, wenn das Blatt überwiegend gelb ist. Braune Stellen = zu warm oder zu feucht."]},{"typ":"abschnitt","titel":"2. Trocknen (4–8 Wochen)","liste":["Blätter am Stielende auf Schnur fädeln (Rücken an Rücken) oder an Stäben aufhängen, nicht zu dicht.","Schattig, regengeschützt, luftig: Schuppen, Dachboden, Carport; ideal 20–30 °C und 65–80 % relative Luftfeuchte.","Zu trocken → Blätter bleiben grün und kratzig; zu feucht → Schimmel und Fäule (dunkle, schmierige Flecken).","Fertig, wenn die Mittelrippe beim Biegen bricht."]},{"typ":"illu","id":"tabak_kurve","titel":"Temperaturkurve der Heißlufttrocknung"},{"typ":"tabelle","kopf":["Verfahren","Ablauf","Ergebnis"],"zeilen":[["Lufttrocknung (air-cured)","4–8 Wochen im Schatten","braun, zuckerarm, kräftig – Burley, Zigarren"],["Heißluft/Röhre (flue-cured)","ca. 7 Tage in beheizter Scheune: 35–41 °C gelben, langsam bis 57 °C Blatt, bis 74 °C Rippe trocknen","goldgelb, zuckerreich, mild – Virginia"],["Sonne (sun-cured)","Blätter in der Sonne auf Gestellen","Orient-Tabak"],["Feuer (fire-cured)","über offenem, schwelendem Feuer","rauchig, für Pfeife und Kautabak"]]},{"typ":"text","text":"Zuhause lässt sich die Heißlufttrocknung grob nachahmen: Gelben im Karton, dann einige Tage im Dörrautomaten oder in einem warmen Raum bei 40–55 °C mit viel Luftaustausch. Anschließend wieder etwas Feuchte aufnehmen lassen."}]},{"id":"fermentieren","titel":"Fermentieren","bloecke":[{"typ":"illu","id":"tabak_ferment","titel":"Fermentierkiste"},{"typ":"text","text":"Fermentation macht aus „heuigem“, scharfem Tabak milden, runden Tabak. Dabei arbeiten pflanzeneigene Enzyme und Mikroben: Restzucker, Chlorophyll und Eiweiß werden abgebaut, Ammoniak entweicht, das Aroma entwickelt sich."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"kiste","titel":"Kistenmethode („Kilning“)","kat":"alle","beleg":"T","teil":"getrocknete Blätter","kurz":"Kontrolliert und schnell – die übliche Hobbymethode.","zutaten":["Styroporbox oder isolierte Kiste","Heizmatte mit Thermostat (Thermostat-Steckdose)","Thermometer, Hygrometer","Einmachgläser oder Gefrierbeutel"],"schritte":["Getrocknete Blätter leicht befeuchten (Sprühflasche), bis sie biegsam-ledrig sind, nicht nass; einige Stunden in einer Tüte ausgleichen lassen.","Locker in Gläser oder Beutel füllen, verschließen.","Kiste auf ca. 45–55 °C und 70–75 % Luftfeuchte bringen.","Täglich kurz lüften, Feuchte und Geruch prüfen; nach 1 Woche wenden.","Nach 2–6 Wochen fertig: Geruch mild-süßlich statt stechend nach Ammoniak, Farbe gleichmäßig braun."],"hinweis":"Schimmel (weißer oder grüner Flaum, muffiger Geruch) – den Inhalt wegwerfen."},{"id":"stapel","titel":"Stapelfermentation („Schwitzen“)","kat":"alle","beleg":"T","teil":"größere Mengen","kurz":"Die alte bäuerliche Methode: Wärme entsteht von selbst.","zutaten":["mindestens einige Kilo Tabak","Holzkiste oder Plane, Thermometer"],"schritte":["Leicht feuchte Blätter oder Büschel dicht zu einem Stapel schichten, abdecken.","Der Stapel erwärmt sich durch Mikroben; nicht über ca. 50–55 °C steigen lassen.","Alle paar Tage umsetzen (innen nach außen).","Mehrere Wochen bis Monate, bis keine Erwärmung mehr eintritt."]},{"id":"sommer","titel":"Sommermethode","kat":"alle","beleg":"T","teil":"Gläser","kurz":"Einfach, aber schwer zu steuern.","zutaten":["Einmachgläser"],"schritte":["Leicht befeuchteten Tabak in Gläser füllen.","Mehrere Wochen in einem heißen Raum, Gewächshaus oder Auto stehen lassen, täglich lüften."],"hinweis":"Temperaturen schwanken stark – öfter kontrollieren."}]},{"typ":"abschnitt","titel":"Nach der Fermentation","liste":["Tabak wieder auf Raumfeuchte trocknen lassen.","Einige Wochen bis Monate in dichten Gläsern reifen lassen – der Geschmack wird runder.","Kühl, dunkel, luftdicht lagern."]}]},{"id":"verarbeiten","titel":"Verarbeiten & Stopfen","bloecke":[{"typ":"illu","id":"tabak_verarbeitung","titel":"Vom Blatt zur Zigarette"},{"typ":"abschnitt","titel":"Feinschnitt herstellen","nummern":["**Befeuchten:** Blätter leicht anfeuchten, bis sie geschmeidig sind (sonst zerbröseln sie).","**Entrippen:** Mittelrippe herausziehen; dicke Rippen brennen schlecht. Für Pfeife können sie fein gehackt bleiben.","**Stapeln und rollen:** 10–20 Blatthälften übereinanderlegen, fest zu einer Rolle wickeln.","**Schneiden:** mit scharfem Messer, Wiegemesser, Nudel- oder Tabakschneider; Feinschnitt ca. 0,5–1 mm, Pfeife gröber.","**Auflockern** und auf **12–16 % Feuchte** bringen: biegsam, nicht klamm, nicht staubig.","**Mischen:** Hauptgut als Basis; Obergut gibt Kraft, Grumpen Milde."]},{"typ":"abschnitt","titel":"Zigaretten stopfen","nummern":["Stopfhülse mit Filter und eine Stopfmaschine oder einen einfachen Stopfer bereitlegen.","Kammer der Maschine mit ca. 0,6–0,8 g Tabak füllen – nicht pressen.","Hülse auf die Tülle stecken, Hebel zügig durchschieben.","Zu fest: zieht schwer; zu locker: brennt zu schnell und fällt aus."]},{"typ":"text","text":"**Alternativen:** mit Papier drehen; Zigarren aus ganzen Blättern wickeln (Einlage, Umblatt, Deckblatt); Pfeifentabak gröber schneiden."},{"typ":"tabelle","kopf":["Lagerung","Wie"],"zeilen":[["Kurz","Tabakbeutel oder Dose, mit Befeuchter"],["Lang","Einmachgläser, kühl und dunkel; reift weiter"],["Prüfen","alle paar Wochen auf Schimmel, Feuchte nachregeln"]]}]},{"id":"chemie","titel":"Biochemie","bloecke":[{"typ":"illu","id":"tabak_nikotin","titel":"Wie Nikotin entsteht"},{"typ":"abschnitt","titel":"1. Beim Wachsen","liste":["**Nikotin entsteht nur in der Wurzel** [W]: Aus Putrescin (aus Ornithin/Arginin) bildet das Enzym PMT N-Methylpyrrolinium; aus Asparaginsäure entsteht über Chinolinsäure (Enzym QPT) Nicotinsäure. Die Enzyme A622 und BBL verknüpfen beide Teile zu Nikotin.","Mit dem Wasserstrom (Xylem) wandert es in die Blätter und wird in den Vakuolen gespeichert – obere Blätter enthalten am meisten.","**Köpfen** wirkt wie eine Verletzung: Das Jasmonat-Signal steigert die Nikotinbildung in der Wurzel, und die Kraft der Blüte geht in die Blätter. Deshalb sind geköpfte Pflanzen stärker.","**Stickstoff:** Zu viel Stickstoff macht dunkle, eiweiß- und nitratreiche Blätter – sie schmecken scharf und bilden beim Trocknen mehr Nitrosamine."]},{"typ":"abschnitt","titel":"2. Beim Gelben – das Blatt hungert","liste":["Das abgeschnittene Blatt lebt noch 2–5 Tage weiter und atmet.","**Stärke → Zucker** (Amylasen): Bei Virginia steigt der Zucker auf bis zu 15–25 % der Trockenmasse.","**Chlorophyll wird abgebaut**, die gelben Carotinoide bleiben sichtbar ({{b:chlorophyll|Chlorophyll}}, {{b:carotinoide|Carotinoide}}).","**Eiweiß → Aminosäuren** (Proteasen).","Bei der Lufttrocknung atmet das Blatt länger und verbraucht den Zucker: Burley wird zuckerarm."]},{"typ":"abschnitt","titel":"3. Beim Trocknen – Farbe wird festgelegt","liste":["Stirbt das Blatt, treffen Enzyme (Polyphenoloxidasen) auf Chlorogensäure: Es entstehen braune Farbstoffe – wie bei einem angeschnittenen Apfel.","Schnelles Trocknen nach dem Gelben stoppt das: Das Blatt bleibt goldgelb (Virginia). Langsames Trocknen lässt es braun werden (Burley).","Zucker und Aminosäuren reagieren bei Wärme miteinander (**Maillard-Reaktion**): Röst- und Karamellaromen.","Zu hohe Feuchte und Wärme („Scheunenbrand“) kochen das Blatt statt es zu trocknen: schokobraun, muffig."]},{"typ":"abschnitt","titel":"4. Beim Fermentieren","liste":["Enzyme und Mikroben bauen Restzucker, Chlorophyll und Eiweiß weiter ab; **Ammoniak** entweicht (stechender Geruch).","Der Nikotingehalt sinkt etwas.","Aus Carotinoiden entstehen Duftstoffe wie Ionone und β-Damascenon – das typische Tabakaroma.","Ergebnis: milder, runder, gleichmäßig brauner Tabak."]},{"typ":"abschnitt","titel":"5. Die Schattenseite: Nitrosamine","liste":["Beim Trocknen wandeln Bakterien Nitrat in Nitrit um. Nitrit reagiert mit Nornicotin und anderen Tabakalkaloiden zu **tabakspezifischen Nitrosaminen** (NNN, NNK) – stark krebserregend [W].","Viel davon entsteht bei warmer, feuchter, langsamer Lufttrocknung und bei stickstoffreich gedüngtem Tabak.","Weniger Stickstoffdünger und gute Belüftung beim Trocknen senken die Menge, verhindern sie aber nicht. Mehr: {{b:tsna|Nitrosamine}}."]}]},{"id":"recht","titel":"Recht","bloecke":[{"typ":"tabelle","kopf":["Frage","Antwort"],"zeilen":[["Darf ich Tabak anbauen?","Ja. Der Anbau ist nicht gesondert geregelt; es gelten nur allgemeine Vorschriften."],["Muss ich Tabaksteuer zahlen?","Nein, wenn der Tabak aus selbst angebautem Rohtabak stammt und für den **eigenen Bedarf** verwendet wird (§ 30 Abs. 1 Nr. 2 TabStG)."],["Darf ich ihn verschenken oder verkaufen?","Nein. Weitergabe an andere ist nicht mehr Eigenbedarf; Verkauf erfordert Steuerlager, Steuerzeichen und Kleinverkaufspackungen."],["Gibt es eine Pflanzenhöchstzahl?","Das aktuelle Gesetz nennt laut Wissenschaftlichem Dienst des Bundestags keine. Die oft genannten „99 Pflanzen“ stammen aus älteren Regelungen bzw. Hobbykreisen; früher galt eine Grenze von 200 Pflanzen und 50 m² für Kleinpflanzer."],["Muss ich die Ernte beim Zoll melden?","Nach dem heutigen Tabaksteuergesetz nein (früher Wiegepflicht beim Hauptzollamt)."],["Jugendschutz","Abgabe von Tabak an Minderjährige ist verboten (§ 10 JuSchG)."]]},{"typ":"hinweis","text":"Stand: Gutachten des Wissenschaftlichen Dienstes des Bundestags (Januar 2021). Keine Rechtsberatung – im Zweifel beim Hauptzollamt nachfragen."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Wissenschaftliche Dienste des Bundestags: Tabakanbau für den Eigenbedarf (WD 5 – 143/20)","https://www.bundestag.de/resource/blob/823612/1e9b1ece68b2aa625dc553b038e5083a/WD-5-143-20-pdf.pdf"],["University of Georgia: Harvesting and Curing Flue-Cured Tobacco","https://tobacco.caes.uga.edu/content/dam/caes-subsite/tobacco/docs/retrofit/archive/Harvesting-and-Curing-Flue-Cured%20Tobacco.pdf"],["Plantura: Tabakpflanze anbauen","https://www.plantura.garden/blumen-stauden/tabakpflanze/tabakpflanze-anbauen"],["Kräuter und Duftpflanzen: Tabak aus dem eigenen Garten","https://www.kraeuter-und-duftpflanzen.de/katalogbeitraege/pdf/tabak-aus-dem-eigenen-garten.pdf"],["CDC MMWR: Green Tobacco Sickness","https://www.cdc.gov/mmwR/preview/mmwrhtml/00020119.htm"],["Shitan et al. 2015: Nikotin-Transport (PMC4622871)","https://pmc.ncbi.nlm.nih.gov/articles/PMC4622871"],["Stanfill et al. 2023: Tabakspezifische Nitrosamine","https://ueaeprints.uea.ac.uk/93139/7/Stanfill_etal_2023_CRT.pdf"]]}]}]},{"id":"hanf","titel":"Hanf – Anbau, Geschlecht, Ernte, Fasern","nr":"S-06","illu":"hanf_zeitplan","fotos":[],"text":"Hanf im eigenen Garten: Rechtsrahmen, Anzucht, Pflege, männliche und weibliche Pflanzen sicher erkennen, Bestäubung und Samengewinnung, Ernte, Trocknen und Lagern, Fasergewinnung – mit Zeitplan, Tageslänge und Biochemie.","stichworte":["Hanf","Cannabis","männlich","weiblich","zweihäusig","Vorblüte","Zwitter","feminisiert","Autoflower","Kurztagspflanze","Bestäubung","Hanfsamen","Faser","Röste","Hecheln","Trichome","Cannabinoide","THC","CBD","KCanG","Eigenanbau","Nutzhanf","Licht","PPFD","DLI","Spektrum","Phytochrom","Florigen","Gibberelline","Ethylen","Silberthiosulfat","Staunässe","Überwässerung","Wurzelfäule","VPD","EC","pH","Mangel","Toppen","LST","SCROG"],"pflanzen":["p22"],"kurz":"Hanf wächst in Mitteleuropa im Freiland sehr gut. Das Wichtigste für den Selbstversorger ist das Geschlecht: Männliche Pflanzen liefern Pollen und feine Fasern, weibliche Samen und Blüten. Wer sie früh erkennt, bestimmt, was er erntet.","steckbrief":[["Recht","bis 3 Pflanzen pro Erwachsenem am Wohnsitz (KCanG), nicht einsehbar, gesichert"],["Aussaat","April–Mai, Keimung 3–7 Tage bei 20–25 °C, 1–2 cm tief"],["Auspflanzen","nach den Eisheiligen; Kübel ab ca. 30–50 l oder Beet"],["Geschlecht","Vorblüten an den Knoten nach ca. 4–8 Wochen; Männchen zuerst"],["Blüte","bei uns ab Ende Juli/August, ca. 8–10 Wochen"],["Ernte","Samen und Blüten September–Oktober; Fasern zur männlichen Blüte"],["Trocknen","7–14 Tage, 15–21 °C, 50–60 % Luftfeuchte, dunkel"],["Besitz","zuhause höchstens 50 g getrocknet; Überschuss vernichten"]],"reiter":[{"id":"ueberblick","titel":"Überblick & Recht","bloecke":[{"typ":"text","text":"**Rechtslage (Stand Oktober 2026, vor dem Druck prüfen):** Erwachsene dürfen nach dem Konsumcannabisgesetz (KCanG) am Wohnsitz bis zu **drei Pflanzen** für den Eigenbedarf anbauen, nicht einsehbar und vor Kindern und Dritten geschützt. Weitergabe ist verboten. Die Union will das Gesetz verschärfen; Änderungen sind möglich."},{"typ":"tabelle","kopf":["Regel (KCanG)","Inhalt"],"zeilen":[["Wer","Erwachsene ab 18 mit Wohnsitz bzw. gewöhnlichem Aufenthalt in Deutschland"],["Wie viel","bis zu 3 Pflanzen pro Person gleichzeitig, am Wohnsitz"],["Wie","nicht öffentlich einsehbar; Pflanzen, Ernte und Vorrat vor Kindern, Jugendlichen und Dritten schützen (z. B. abschließbar)"],["Besitz","zuhause bis 50 g getrocknet, unterwegs bis 25 g"],["Weitergabe","verboten – auch verschenken; nur Anbauvereinigungen dürfen an Mitglieder abgeben"],["Samen","Erwerb für den Eigenanbau erlaubt, auch aus anderen EU-Staaten"],["Konsumverbote","in Sichtweite von Schulen, Kitas, Spielplätzen (100 m), in Fußgängerzonen 7–20 Uhr, in Anwesenheit Minderjähriger"],["Nutzhanf","gewerblicher Anbau nur durch landwirtschaftliche Betriebe: zertifiziertes Saatgut aus dem EU-Sortenkatalog, THC höchstens 0,3 %, Anzeige bei der BLE"]]},{"typ":"abschnitt","titel":"Die Schritte","nummern":["**Anzucht** im April–Mai","**Auspflanzen** nach Mitte Mai, sonnig","**Wachstum** bei langen Tagen, düngen, gießen","**Geschlecht erkennen** an den Vorblüten","**Entscheiden:** Männchen behalten (Samen, Faser) oder entfernen (samenfreie Blüten)","**Blüte** ab Ende Juli/August","**Ernte:** Fasern, Samen oder Blüten","**Trocknen, reifen, lagern** bzw. **rösten** für Fasern"]}]},{"id":"anzucht","titel":"Anzucht","bloecke":[{"typ":"abschnitt","titel":"So geht’s","nummern":["**Samen:** zertifizierte Samen; regulär (♂ und ♀), feminisiert (fast nur ♀) oder Autoflower.","**Keimen:** zwischen feuchtem Küchenpapier oder direkt in Anzuchterde, 1–2 cm tief (kein Lichtkeimer), 20–25 °C, Keimung nach 3–7 Tagen.","**Sämling:** sehr hell, sonst vergeilt er; die ersten Blätter sind einfach, dann folgen gefingerte.","**Umtopfen** nach 2–3 Wochen in größere Töpfe.","**Abhärten** ab Anfang Mai tagsüber draußen."]},{"typ":"hinweis","text":"Nicht zu nass halten – Umfallkrankheit (Pilze am Stängelgrund) ist der häufigste Ausfall bei Sämlingen."}]},{"id":"anbau","titel":"Anbau & Pflege","bloecke":[{"typ":"abschnitt","titel":"Standort und Boden","liste":["**Licht:** volle Sonne, mindestens 6–8 Stunden direkte Sonne.","**Boden:** tiefgründig, locker, humos, pH 6–7, keine Staunässe.","**Kübel:** ab ca. 30–50 l, gute Drainage.","**Platz:** Pflanzen werden im Freiland 1,5–3 m hoch und 1 m breit.","**Fruchtfolge:** Hanf ist eine gute Vorfrucht: Er beschattet und unterdrückt Beikraut und lockert mit der Pfahlwurzel den Boden. Siehe {{s:mischkultur|Mischkultur}}."]},{"typ":"tabelle","kopf":["Pflege","Wachstum (lange Tage)","Blüte (kürzere Tage)"],"zeilen":[["Nährstoffe","viel Stickstoff: Kompost, Brennnesseljauche ({{p:p01#selbstversorgung-jauche|Rezept}})","weniger Stickstoff, mehr Kalium und Phosphor: Beinwelljauche ({{p:p20#selbstversorgung-jauche|Rezept}})"],["Gießen","gleichmäßig, Oberfläche zwischendurch abtrocknen lassen","gleichmäßig; Blüten nicht benetzen"],["Formen","Spitze kappen oder Triebe herunterbinden ergibt buschigere Pflanzen","Stützen gegen Windbruch"],["Kontrolle","Läuse, Spinnmilben, Schnecken","Vorblüten, später Grauschimmel in dichten Blüten bei Herbstnässe"]]},{"typ":"abschnitt","titel":"Probleme","liste":["**Grauschimmel (Botrytis)** im September/Oktober: braune, matschige Stellen im Inneren der Blütenstände – großzügig herausschneiden und vernichten.","**Mehltau:** weißer Belag auf Blättern – Abstand, Luft, befallene Blätter entfernen.","**Spinnmilben** bei Hitze und Trockenheit: feine Gespinste – abbrausen, Raubmilben.","**Vögel** fressen reifende Samen – Netz."]},{"typ":"tabelle","kopf":["Klima","Keimling","Wachstum","Blüte früh","Blüte spät"],"zeilen":[["Temperatur Tag","22–26 °C","22–28 °C","20–26 °C","18–24 °C"],["Temperatur Nacht","20–22 °C","18–22 °C","18–20 °C","15–20 °C"],["Luftfeuchte","65–75 %","55–70 %","45–55 %","35–45 %"],["VPD (Dampfdruckdefizit)","0,4–0,8 kPa","0,8–1,2 kPa","1,0–1,4 kPa","1,2–1,6 kPa"]]},{"typ":"text","text":"**VPD** beschreibt, wie stark die Luft Wasser aus dem Blatt „zieht“: zu niedrig (feucht-kühl) → wenig Verdunstung, Schimmel; zu hoch (heiß-trocken) → Spaltöffnungen schließen, Wachstum stoppt."},{"typ":"tabelle","kopf":["Nährstoffe","Wachstum","Blüte"],"zeilen":[["Schwerpunkt","viel Stickstoff (N)","weniger N, mehr Phosphor (P) und Kalium (K)"],["Leitfähigkeit EC (Düngerstärke)","ca. 1,0–1,6 mS/cm","ca. 1,4–2,2 mS/cm"],["pH Erde","6,0–7,0","6,0–7,0"],["pH Kokos / Hydro","5,6–6,2","5,8–6,3"],["Calcium, Magnesium","wichtig, besonders bei LED und Kokos","wichtig"]]},{"typ":"text","text":"Im Freiland mit guter Gartenerde reichen Kompost im Frühjahr und Jauchen: Brennnessel im Wachstum, Beinwell in der Blüte. In lebendiger Erde („Living Soil“) liefern Bodenleben und Mykorrhiza die Nährstoffe nach – ähnlich wie im {{s:boden|Bodenkapitel}} beschrieben."},{"typ":"illu","id":"hanf_mangel","titel":"Mangelbilder am Blatt"},{"typ":"tabelle","kopf":["Training","Was","Wirkung"],"zeilen":[["Toppen","Haupttrieb über dem 4.–6. Knoten abschneiden","zwei oder mehr Haupttriebe, buschiger"],["LST (Niederbinden)","Triebe sanft waagrecht binden","gleichmäßiges Blätterdach, alle Spitzen bekommen Licht"],["SCROG","Netz über den Pflanzen, Triebe durchflechten","flaches, voll ausgeleuchtetes Dach"],["Entlauben","große Schattenblätter gezielt entfernen","mehr Licht und Luft im Inneren"],["Auslichten unten","kleine Triebe unten entfernen","Kraft in die oberen Blütenstände"]]},{"typ":"abschnitt","titel":"Zeitplan drinnen (fotoperiodische Sorten)","nummern":["Keimung: 2–7 Tage","Sämling: 1–2 Wochen, 18/6","Wachstum: 3–8 Wochen, 18/6 – so lange, bis die Pflanze ca. die Hälfte der Endhöhe hat (sie streckt sich in der Blüte um das 1,5- bis 3-Fache)","Blüte: 12/12, je nach Sorte 7–11 Wochen","Trocknen und Reifen: 3–8 Wochen"]},{"typ":"abschnitt","titel":"Freiland in Mitteleuropa","liste":["Früh blühende Sorten wählen (Ernte bis Ende September/Anfang Oktober), sonst holt sie der Herbstregen.","Vorziehen ab Mitte April, auspflanzen nach den Eisheiligen; Pflanzgrube 60 × 60 cm mit Kompost oder großer Kübel (50–100 l).","Sonnigster Platz, windgeschützt, Regenschutz (Dachüberstand, Folie) ab Blütebeginn verringert Grauschimmel stark.","Straßenlaternen und Bewegungsmelder in der Nähe meiden – sie stören die Nachtlänge."]}]},{"id":"licht","titel":"Licht & Spektrum","bloecke":[{"typ":"text","text":"Hanf ist eine ausgesprochene Lichtpflanze: Er stammt aus offenen, sonnigen Lagen, hat große, dünne Blätter mit vielen Spaltöffnungen und eine sehr hohe Photosynthese-Kapazität. Er kann viel mehr Licht verwerten als die meisten Gartenpflanzen – Salat ist bei einem Drittel davon gesättigt."},{"typ":"abschnitt","titel":"Warum so viel Licht?","liste":["**Photosynthese:** Licht spaltet Wasser, die Energie wird in ATP und NADPH gespeichert, damit baut das Enzym Rubisco CO₂ zu Zucker ein. Jedes Gramm Blüte, Faser oder Samen ist umgewandeltes Licht.","**Hohe Sättigung:** Ein einzelnes Hanfblatt arbeitet bis ca. 1.000–1.500 µmol/m²/s immer schneller; in einer Studie lag das Maximum bei 30 °C und 1.500 µmol, bei 2.000 µmol sank es um ca. 20 % [W].","**Der ganze Bestand:** Untere Blätter liegen im Schatten. Mehr Licht oben heißt mehr Licht unten – deshalb stieg der Ertrag im Versuch von Rodriguez-Morrison et al. (2021) bis 1.800 µmol fast linear an, ohne dass sich der Cannabinoid-Gehalt änderte [W].","**Begrenzung:** Ab einem gewissen Punkt bremst nicht mehr das Licht, sondern CO₂, Temperatur, Wasser oder Nährstoffe. Mit CO₂-Anreicherung (800–1.200 ppm) verträgt Hanf mehr Licht."]},{"typ":"illu","id":"hanf_licht","titel":"Licht und Ertrag"},{"typ":"tabelle","kopf":["Phase","PPFD (µmol/m²/s)","Tageslichtsumme DLI (mol/m²/Tag)","Licht/Dunkel"],"zeilen":[["Keimling, Steckling","100–300","6–15","18/6 oder 20/4"],["Wachstum","300–600","20–40","18/6"],["Blüte","600–1.000 (normale Luft)","30–45","12/12"],["Blüte mit CO₂","bis 1.200–1.500","40–65","12/12"],["Sonne im Sommer zum Vergleich","bis ca. 2.000 mittags","ca. 40–60 an klaren Tagen","–"]]},{"typ":"text","text":"Die Zahlen sind Richtwerte aus Praxis und Versuchen [W/T]. **DLI** = Lichtmenge pro Tag: PPFD × Stunden × 0,0036 (z. B. 700 µmol × 12 h ≈ 30 mol)."},{"typ":"illu","id":"hanf_spektrum","titel":"Spektrum und Lichtrezeptoren"},{"typ":"tabelle","kopf":["Licht","Wellenlänge","Rezeptor","Wirkung auf Hanf"],"zeilen":[["UV-B","280–315 nm","UVR8","Schutzreaktion: mehr Flavonoide, kompakter Wuchs; THC-Anstieg in einem älteren Versuch, in neueren Studien nicht bestätigt [W]"],["UV-A","315–400 nm","Cryptochrome","Schutzpigmente; mit Blau mehr CBG in einer Studie"],["Blau","400–500 nm","Cryptochrome, Phototropine","kurze Internodien, kompakte Pflanzen, dickere Blätter, Spaltöffnungen öffnen"],["Grün","500–600 nm","schwach","dringt tief ins Blätterdach, versorgt untere Blätter"],["Rot","600–700 nm","Phytochrom Pr, Chlorophyll","effizienteste Photosynthese, Streckung und Blüte"],["Dunkelrot (Far-Red)","700–750 nm","Phytochrom Pfr","Schattenflucht: Streckung; steigert zusammen mit Rot die Photosynthese (Emerson-Effekt); am Tagesende beschleunigt es den Übergang in die Nacht"]]},{"typ":"abschnitt","titel":"Welche Lampe?","liste":["**Sonne:** volles Spektrum, unerreicht – im Freiland aber nur April bis Oktober.","**LED Vollspektrum (weiß + rot):** heute Standard; effizient (2,5–3 µmol pro Joule), wenig Wärme, Spektrum steuerbar.","**Natriumdampf (HPS):** viel Gelb-Rot, viel Wärme, etwa 1,7 µmol/J; klassisch für die Blüte.","**Leuchtstoffröhren, Energiesparlampen:** nur für Keimlinge und Stecklinge.","**Abstand:** so wählen, dass die Zielwerte erreicht werden (PAR-Messgerät oder Handy-App mit Korrekturfaktor); zu nah: gebleichte, nach oben gerollte Blätter."]},{"typ":"illu","id":"hanf_phytochrom","titel":"Wie Hanf die Nacht misst"},{"typ":"abschnitt","titel":"Photoperiode im Detail","liste":["Hanf ist eine **Kurztagspflanze** – genauer: eine Langnachtpflanze. Er blüht, wenn die ununterbrochene Nacht länger ist als ca. 9–11 Stunden (sortenabhängig).","Tagsüber wird **Phytochrom** durch Rotlicht in die aktive Form Pfr umgewandelt, die die Blüte hemmt. Nachts zerfällt Pfr langsam. Ist die Nacht lang genug, bilden die Blätter das Blühhormon **Florigen** (FT-Protein), das zu den Triebspitzen wandert.","**Lichtunterbrechung:** Schon wenige Minuten Licht mitten in der Nacht wandeln Pr wieder in Pfr – die Nacht „beginnt von vorn“. Folge: verzögerte Blüte, Rückkehr ins Wachstum oder Zwitterblüten.","**Grünes Arbeitslicht** stört kaum, weil Phytochrom Grün wenig absorbiert.","**Autoflower** blühen nach ca. 3–5 Wochen unabhängig von der Nacht; sie vertragen 18/6 oder 20/4 durchgehend."]}]},{"id":"wasser","titel":"Wasser & Staunässe","bloecke":[{"typ":"text","text":"Wurzeln atmen: Sie brauchen Sauerstoff, um Zucker zu verbrennen und mit der gewonnenen Energie Nährstoffe aktiv aufzunehmen. Sauerstoff wandert durch Luft etwa 10.000-mal schneller als durch Wasser. Sind die Poren der Erde voll Wasser, erstickt die Wurzel – meist schon nach Stunden."},{"typ":"illu","id":"hanf_staunaesse","titel":"Gesund gegen staunass"},{"typ":"abschnitt","titel":"Was bei zu viel Wasser passiert – Schritt für Schritt","nummern":["**Sauerstoffmangel (Hypoxie):** Die Wurzel kann nicht mehr normal atmen.","**Gärung:** Sie schaltet auf Notstoffwechsel – Glykolyse mit Milchsäure- und Alkoholgärung (Enzym Alkoholdehydrogenase). Pro Zuckermolekül entstehen nur 2 statt ca. 30 ATP.","**Energiekrise:** Ohne ATP stoppen die Protonenpumpen; Nitrat, Kalium, Phosphat werden nicht mehr aufgenommen. Die Pflanze zeigt Mangel, obwohl genug Dünger da ist.","**Ansäuerung und Zelltod:** Milchsäure senkt den pH im Zellinneren, Wurzelspitzen und Feinwurzeln sterben ab.","**Ethylen-Signal:** Die Wurzel schickt die Vorstufe ACC mit dem Saftstrom nach oben; im Blatt wird daraus Ethylen. Folge: Blattstiele krümmen sich nach unten (**Epinastie**) – die Pflanze sieht durstig aus, ist aber ertrunken.","**Wasser kommt nicht mehr hoch:** Kranke Wurzeln leiten schlecht, Spaltöffnungen schließen, Photosynthese und Wachstum stehen.","**Boden kippt:** Bakterien atmen Nitrat statt Sauerstoff – Stickstoff entweicht als Gas (Denitrifikation). Mangan und Eisen werden in giftige, gelöste Formen reduziert; es kann nach faulen Eiern
