:"text","text":"Weitere Stoffe: {{b:omega3|Omega-3-Fettsäuren}}, {{b:oxalsaeure|Oxalsäure}}, Betalaine (rote Farbstoffe der Stängel), Schleimstoffe."},{"typ":"hinweis","text":"**Nehls-Bezug:** {{a:nehls|Dr. Nehls}} betont Omega-3 für das Gehirn – meint aber vor allem **DHA** ({{a:nehls-praxis-omega3|Omega-3 versorgen}}). Portulak liefert ALA, die der Körper nur zu wenigen Prozent in DHA umwandelt. Portulak ist eine gute Ergänzung, ersetzt aber keine DHA-Quelle wie Algenöl."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Nährstoffreiches Gemüse","roh, gedünstet","[W] Nährwertanalysen"],["Antioxidativ","Nahrung","[W] Labor"],["Kühlend, gegen Durst und Sodbrennen","Salat, Saft","[T] Mittelmeer- und chinesische Volksmedizin"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"brennen","titel":"Kühlende Auflage","kat":"aeusserlich","beleg":"T","teil":"zerdrückte Blätter","kurz":"Bei leichtem Sonnenbrand und Insektenstichen.","zutaten":["eine Handvoll frische Blätter"],"schritte":["Zerdrücken, auflegen, nach 20 Minuten abnehmen."]}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"]],"eintraege":[{"id":"salat","titel":"Griechischer Portulaksalat (Glistrida)","kat":"kueche","menge":"2 Pers.","zeit":"10 Min.","kurz":"Mit Joghurt – das Calcium bindet einen Teil der Oxalsäure.","zutaten":["2 Handvoll junge Portulaktriebe","150 g Joghurt","1 Knoblauchzehe, Olivenöl, Salz"],"schritte":["Triebe waschen, grob zupfen.","Joghurt mit Knoblauch, Öl und Salz verrühren, unterheben."]},{"id":"pfanne","titel":"Portulak aus der Pfanne","kat":"kueche","menge":"2 Pers.","zeit":"10 Min.","kurz":"Kurz geschwenkt wie Spinat.","zutaten":["3 Handvoll Portulak","1 Zwiebel, Olivenöl, Zitrone"],"schritte":["Zwiebel in Öl glasig dünsten.","Portulak 2 Minuten mitschwenken, mit Zitrone abschmecken."],"tipp":"Kurz blanchieren und das Wasser weggießen senkt die Oxalsäure."},{"id":"eingelegt","titel":"Eingelegte Portulakstängel","kat":"vorrat","menge":"2 Gläser","zeit":"20 Min. + 2 Wochen","kurz":"Knackig wie Gurken.","zutaten":["500 g dicke Stängel","300 ml Essig, 300 ml Wasser, 1 EL Salz, 1 TL Zucker","Dill, Senfkörner"],"schritte":["Sud aufkochen.","Stängel mit Gewürzen in Gläser schichten, heiß übergießen, verschließen.","2 Wochen ziehen lassen."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["anbau","Anbau"],["garten","Garten"]],"eintraege":[{"id":"anbau","titel":"Gemüse-Portulak anbauen","kat":"anbau","beleg":"T","teil":"Samen","kurz":"Die Kulturform (var. sativa) hat größere, zartere Blätter.","zutaten":["Saatgut, warmes sonniges Beet"],"schritte":["Ab Mitte Mai breitwürfig säen, nur andrücken (Lichtkeimer).","Feucht halten, nach 4–6 Wochen erste Ernte.","Alle 3–4 Wochen nachsäen; 5 cm über dem Boden schneiden, treibt nach."]},{"id":"winter","titel":"Winterportulak ist etwas anderes","kat":"anbau","beleg":"W","teil":"Claytonia","kurz":"Winterportulak (Claytonia perfoliata) ist eine andere Pflanze – ein winterhartes Blattgemüse.","zutaten":["Saat August–September"],"schritte":["Ins Gewächshaus oder Frühbeet säen.","Den ganzen Winter ernten."]},{"id":"mischkultur","titel":"Als Bodendecker in der Mischkultur","kat":"garten","beleg":"T","teil":"Pflanze","kurz":"Zwischen Tomaten und Paprika hält Portulak den Boden feucht und schattig.","zutaten":["Lücken im Sommerbeet"],"schritte":["Vor Samenreife ernten, sonst wird er lästig.","Siehe {{s:mischkultur|Mischkultur}}."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Portulak wird seit der Antike als Gemüse gegessen und war im Mittelalter in Europa verbreitet; später geriet er in Vergessenheit. In Griechenland, der Türkei und Mexiko (verdolaga) ist er bis heute Alltagsgemüse. [T]"},{"typ":"text","text":"Ganz im Sinne von **Storl**: Was der Gärtner als „Unkraut“ jätet, ist oft das wertvollere Gemüse. In {{a:storl-buecher-unkraeuter|Die „Unkräuter“ in meinem Garten}} plädiert er dafür, Beikräuter als Ernte zu sehen – Portulak ist dafür ein Paradebeispiel. Zur Kulturgeschichte alter Gemüse siehe auch {{a:storl-buecher-gemuese|Bekannte und vergessene Gemüse}}. [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Risiko","Wer","Was tun"],"zeilen":[["Oxalsäure (bis 870 mg/100 g)","Calciumoxalat-Nierensteine, Niereninsuffizienz, Gicht, Kleinkinder","junge Triebe nehmen, blanchieren, mit Milchprodukten kombinieren, maßvoll essen"],["Verwechslung mit Wolfsmilch","alle Sammler","Milchsaft-Test: Portulak hat klaren Saft"],["Nitrat","bei Überdüngung","nicht von gedüngten Rasenflächen sammeln"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Uddin et al. 2014: Purslane Weed – Nutritional and Antioxidant Properties (PMC3934766)","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3934766/"],["Oxalat-Gehalte und Erntezeit (PMC6720689)","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6720689/"],["VOL.AT: Storl – Die „Unkräuter“ in meinem Garten","https://www.vol.at/selbstversorger-die-unkraeuter-in-meinem-garten/5778209"]]}]}]},{"id":"p12","nr":"P-12","illu":"koenigskerze","fotos":[],"name":"Königskerze","botan":"Verbascum densiflorum Bertol., V. phlomoides L., V. thapsus L.","volksnamen":["Wollkraut","Himmelbrand","Wetterkerze","Fackelkraut"],"kurz":"Eine zwei Meter hohe gelbe Fackel auf trockenem Ödland: Die Blüten der Königskerze sind ein altes, amtlich anerkanntes Hustenmittel – schleimig, reizlindernd, mild.","steckbrief":[["Familie","Braunwurzgewächse (Scrophulariaceae)"],["Lebensform","zweijährig: 1. Jahr Rosette, 2. Jahr Blütenstand"],["Größe","bis 2 m"],["Blütezeit","Juli–September"],["Sammelzeit","voll geöffnete Blüten an trockenen Vormittagen"],["Verwendete Teile","Blüten (Verbasci flos)"],["Monographie","HMPC 2018 traditionell, Kommission E positiv"],["Name","Verbascum vermutlich von barbascum = bärtig (wollige Haare)"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":5,"wasser":1,"naehrstoffe":3,"ph":"neutral bis kalkhaltig","boden":"sandig-steinig, trocken, Bahndämme, Schotter","ellenberg":"L8 F4 R7 N7","hinweis":"Braucht offenen Boden zum Keimen; im dichten Rasen verschwindet sie."},{"typ":"abschnitt","titel":"Aussehen","liste":["**1. Jahr:** große, grau-filzige Blattrosette, weich wie Flanell.","**2. Jahr:** bis 2 m hoher Stängel, Blätter laufen am Stängel herab.","**Blüten:** gelb, 2–5 cm, fünf Blütenblätter, Staubfäden teils wollig behaart; öffnen nach und nach von unten.","**Wurzel:** kräftige Pfahlwurzel."]},{"typ":"hinweis","text":"**Verwechslung:** Die Rosette ähnelt jungem **Fingerhut** (giftig). Königskerze ist dicker, wollig-filzig, Fingerhut weicher und netznervig. Geblüht ist sie unverwechselbar."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Schleimstoffe","Polysaccharide (ca. 3 %)","{{b:schleimstoffe|Schleimstoffe}}"],["Saponine","Triterpensaponine","{{b:saponine|Saponine}}"],["Iridoide","Aucubin, Catalpol","{{b:iridoide|Iridoide}}"],["Phenylethanoide","Verbascosid","–"],["Flavonoide","–","{{b:flavonoide|Flavonoide}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Halsschmerzen mit trockenem Husten bei Erkältung","Tee ab 12 Jahren","[W] HMPC 2018 traditionell; klinische Studien fehlen"],["Katarrhe der Atemwege","3–4 g Blüten pro Tag","[W] Kommission E"],["Ohrenschmerzen","Blütenöl","[T] nur nach ärztlicher Abklärung und bei intaktem Trommelfell"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"tee","titel":"Königskerzenblüten-Tee","kat":"innerlich","beleg":"W","teil":"Blüten","kurz":"Mild schleimlösend und reizlindernd.","zutaten":["1,5–2 g Blüten (2–3 TL)","150 ml Wasser","Papierfilter"],"schritte":["Mit kochendem Wasser übergießen, 10–15 Minuten ziehen lassen.","**Durch einen Papierfilter abseihen** – die Härchen reizen sonst den Hals.","3–4 Tassen täglich."],"hinweis":"Laut HMPC ab 12 Jahren. Hält der Husten länger als eine Woche an oder kommen Fieber und Atemnot dazu: Arzt."},{"id":"mischung","titel":"Hustentee-Mischung","kat":"innerlich","beleg":"T","teil":"Blüten","kurz":"Mit Spitzwegerich und Thymian.","zutaten":["Königskerzenblüten, {{p:p06|Spitzwegerich}}, Thymian zu gleichen Teilen"],"schritte":["1 TL Mischung auf 150 ml, 10 Minuten, filtern."]}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"]],"eintraege":[{"id":"sirup","titel":"Königskerzen-Honig","kat":"vorrat","menge":"1 Glas","zeit":"10 Min. + 3 Wochen","kurz":"Für Hustenzeiten.","zutaten":["frische Blüten, locker ein Glas voll","flüssiger Honig"],"schritte":["Blüten ins Glas, mit Honig bedecken.","3 Wochen ziehen lassen, durch ein feines Tuch abseihen."],"hinweis":"Honig nicht an Säuglinge unter 12 Monaten (Botulismus)."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["sammeln","Sammeln"],["anbau","Anbau"]],"eintraege":[{"id":"ernten","titel":"Blüten richtig ernten","kat":"sammeln","beleg":"T","teil":"Blüten","kurz":"Jeden Morgen öffnen sich neue Blüten – über Wochen täglich pflücken.","zutaten":["Korb, trockenes Wetter"],"schritte":["Nur voll geöffnete, trockene Blüten abzupfen.","Rasch und warm (bis 40 °C) trocknen – sie werden sonst braun und unbrauchbar.","Luftdicht und dunkel lagern; sie ziehen Feuchtigkeit."],"tipp":"Gut getrocknete Blüten bleiben goldgelb."},{"id":"garten","titel":"Ansiedeln","kat":"anbau","beleg":"T","teil":"Samen","kurz":"Im Spätsommer auf offenen, mageren Boden streuen.","zutaten":["Samen, Kiesbeet oder Trockenmauer"],"schritte":["Nicht düngen.","Rosette im 1. Jahr stehen lassen; im 2. Jahr Blüte und Selbstaussaat."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Die getrockneten Stängel wurden in Harz oder Talg getaucht und als Fackel angezündet – daher „Himmelbrand“ und „Fackelkraut“. Als Wetterkerze sollte sie Unwetter anzeigen. In Bayern und Österreich gehört sie bis heute in den Kräuterbuschen zu Mariä Himmelfahrt. [T]"},{"typ":"text","text":"**Storl** beschreibt solche Bräuche als Rest einer alten europäischen „Ur-Medizin“, in der Heilpflanzen zugleich Ritualpflanzen waren ({{a:storl-denken|Storls Denken}}, {{a:storl-buecher-ur-medizin|Ur-Medizin}}). [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Thema","Einordnung"],"zeilen":[["Verträglichkeit","gut; Tee immer filtern"],["Kinder","Tee laut HMPC erst ab 12 Jahren"],["Samen","nicht verzehren – saponinreich, wurden früher als Fischgift verwendet"],["Ohröl","nie bei Ohrenausfluss oder verletztem Trommelfell"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["EMA/HMPC: Verbasci flos","https://www.ema.europa.eu/en/medicines/herbal/verbasci-flos"],["Altmeyers: Verbasci flos","https://www.altmeyers.org/en/naturopathy/verbasci-flos-144034"]]}]}]},{"id":"p13","nr":"P-13","illu":"fliegenpilz","fotos":[],"name":"Fliegenpilz","botan":"Amanita muscaria (L.) Lam. – ein Pilz, keine Pflanze","volksnamen":["Glückspilz","Mückenschwamm","Narrenschwamm"],"kurz":"Das bekannteste Glückssymbol ist ein Giftpilz. Dieses Kapitel erklärt Biologie, Gift und Erste Hilfe – und warum der aktuelle Trend zu „Fliegenpilz-Fruchtgummis“ gefährlich ist. Keine Anleitung zum Verzehr.","steckbrief":[["Reich","Pilze, Ordnung Champignonartige"],["Lebensweise","Mykorrhiza mit Birke, Fichte, Kiefer"],["Saison","Juli–November"],["Giftstoffe","Ibotensäure, Muscimol (Muscarin nur in Spuren)"],["Vergiftungsbild","Pantherina-Syndrom: Rausch, Verwirrtheit, bis Koma"],["Gegengift","keines; Behandlung im Krankenhaus"],["Notruf","Giftnotruf, bei Bewusstseinsstörung 112"],["Verwechslung","Kaiserling (essbar, gelbe Lamellen)"]],"reiter":[{"id":"botanik","titel":"Mykologie","bloecke":[{"typ":"illu","id":"fliegenpilz_d","titel":"Verwechslungstafel"},{"typ":"standort","licht":3,"wasser":3,"naehrstoffe":2,"ph":"sauer","boden":"Wälder und Parks mit Birke, Fichte, Kiefer","ellenberg":"–","hinweis":"Der Pilz lebt in Symbiose: Er versorgt die Baumwurzeln mit Wasser und Mineralstoffen und bekommt dafür Zucker."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Hut:** 8–20 cm, leuchtend rot bis orange, mit weißen Flocken (Hüllreste) – Regen kann sie abwaschen!","**Lamellen:** weiß, frei.","**Stiel:** weiß, mit hängendem Ring.","**Basis:** knollig, mit ringförmigen Gürteln.","**Jung:** in einer weißen Gesamthülle wie ein Ei."]},{"typ":"text","text":"Der eigentliche Pilz ist das unterirdische Geflecht (Myzel). Der Fruchtkörper ist nur sein Sporenträger. Ohne Fliegenpilz und andere Mykorrhizapilze wachsen Birken und Kiefern auf armem Boden schlecht. Mehr zur Mykorrhiza: {{s:boden-wurzelraum|Wurzelraum}}."}]},{"id":"inhaltsstoffe","titel":"Giftstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Wirkung","Teil B"],"zeilen":[["Ibotensäure","wird beim Trocknen und Erhitzen zu Muscimol; erregend","{{b:muscimol|Ibotensäure & Muscimol}}"],["Muscimol","aktiviert GABA-A-Rezeptoren: Rausch, Benommenheit, Koma","{{b:muscimol|Ibotensäure & Muscimol}}"],["Muscarin","nur Spuren; laut BfR für die Giftwirkung kaum verantwortlich","–"]]},{"typ":"text","text":"Der Wirkstoffgehalt schwankt stark zwischen einzelnen Fruchtkörpern – eine sichere „Dosis“ gibt es nicht. [W]"}]},{"id":"wirkung","titel":"Vergiftung","bloecke":[{"typ":"abschnitt","titel":"Pantherina-Syndrom (BfR 2025)","liste":["Beginn etwa 30 Minuten bis 2 Stunden nach dem Verzehr.","**Abwechselnd Benommenheit und Unruhe**, Verwirrtheit, Halluzinationen, Übelkeit, Muskelzuckungen.","Bewusstseinsstörung bis zum **Koma**, Herz-Kreislauf-Störungen.","Meist klingen die Symptome binnen 24 Stunden ab; Todesfälle sind äußerst selten, aber beschrieben.","Der braune **Pantherpilz** ist noch giftiger."]},{"typ":"hinweis","text":"**Erste Hilfe:** Giftnotruf (Deutschland, z. B. Berlin 030 19240), bei Bewusstseinsstörung oder Atemnot sofort **112**. Kein Erbrechen auslösen. Pilzreste und Putzabfälle aufbewahren. Betroffene nicht allein lassen. Es gibt kein Gegengift; behandelt wird im Krankenhaus."}]},{"id":"trend","titel":"Microdosing-Trend","bloecke":[{"typ":"text","text":"Seit 2023 werden Muscimol-„Fruchtgummis“, Brownies und Lollis online und sogar in Automaten verkauft (Fall in Hessen, Oktober 2024). Giftinformationszentren melden laut BfR „Bewusstseinseintrübungen bis hin zum Koma, Verwirrtheit und Erregungszustände“. Psychoaktive Effekte treten schon im einstelligen Milligrammbereich auf. Kinder halten die Produkte für Süßigkeiten. [W]"},{"typ":"tabelle","kopf":["Behauptung der Szene","Einordnung"],"zeilen":[["Fliegenpilz hilft bei Schlaf, Angst, Schmerz","[A] unbelegt; keine kontrollierten Studien"],["Microdosing ist harmlos","[W] BfR und Schweizer BLV warnen ausdrücklich"],["Getrocknet ist er entgiftet","[W] falsch: Trocknen wandelt Ibotensäure in das stärker berauschende Muscimol um"]]},{"typ":"text","text":"**Rechtslage:** In der Schweiz steht Muscimol inzwischen auf der Betäubungsmittelliste. In Deutschland fällt der Fliegenpilz nicht unter das Betäubungsmittelgesetz; muscimolhaltige Lebensmittel sind aber nicht verkehrsfähig. Stand der Recherche Oktober 2026 – bitte vor dem Druck aktuell prüfen."}]},{"id":"tradition","titel":"Kultur & Storl","bloecke":[{"typ":"text","text":"Sibirische Völker (z. B. Korjaken, Ewenken) nutzten den Fliegenpilz rituell. In gezuckerter Milch diente er als Fliegenfalle – daher der Name. Als Glückssymbol schmückt er Neujahrskarten. Die These, er sei das indische „Soma“ (Wasson 1968), ist umstritten. [T]"},{"typ":"text","text":"**Storl** hat als Ethnologe schamanische Kulturen erforscht und beschreibt die europäische Volksmedizin als Erbe schamanischer Traditionen ({{a:storl-denken|Ur-Medizin}}). Rauschpflanzen waren dort an Ritual, Erfahrung und Gemeinschaft gebunden – nicht an Fruchtgummis aus dem Internet. Zu Zauber- und Giftpflanzen siehe auch {{a:storl-buecher-hexenmedizin|Hexenmedizin}} und {{a:storl-buecher-bilsenkraut|Götterpflanze Bilsenkraut}}. [T]"},{"typ":"hinweis","text":"**Storl im Video (2018):** In der Sowjetunion habe man den sakralen Gebrauch des Fliegenpilzes zur Wintersonnenwende auslöschen wollen; die Menschen sollten stattdessen Wodka trinken – ein „billiger Ersatz“ ({{a:storl-videos-kenfm2018|Storl im Gespräch 2018}}). [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Regel","Warum"],"zeilen":[["Nie essen, nie „probieren“","Giftgehalt unberechenbar"],["Kinder aufklären, Pilze im Garten entfernen","Kinder verschlucken Stücke"],["Keine Muscimol-Produkte kaufen","BfR: Koma-Fälle"],["Kaiserling nur mit Pilzsachverständigem","Verwechslung ist die häufigste Vergiftungsursache"]]},{"typ":"hinweis","text":"Giftnotruf (Deutschland, z. B. Berlin 030 19240), bei Bewusstseinsstörung oder Atemnot sofort **112**."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["BfR-Mitteilung 021/2025: Fliegenpilzgift – Risiken muscimolhaltiger Fruchtgummis","https://www.bfr.bund.de/assets/01_Ver%C3%B6ffentlichungen/Mitteilungen_deutsch/fliegenpilzgift-gesundheitliche-risiken-muscimolhaltiger-fruchtgummis-kinder-sind-besonders-gefaehrdet.pdf"],["BLV Schweiz: Signal Report Microdosing","https://www.blv.admin.ch/dam/blv/de/dokumente/lebensmittel-und-ernaehrung/publikationen-forschung/signal-report-microdosing.pdf.download.pdf/Signal%20Report%20Microdosing_Version%203.0.pdf"],["Blick: Gift oder Glücksrausch","https://www.blick.ch/gesellschaft/gift-oder-gluecksrausch-die-andere-seite-vom-fliegenpilz-id21200242.html"]]}]}]},{"id":"p14","nr":"P-14","illu":"kiefer","fotos":[],"name":"Waldkiefer & Kiefernknospen","botan":"Pinus sylvestris L.","volksnamen":["Föhre","Forche","Kienbaum","Maiwipferl"],"kurz":"Die jungen Frühjahrstriebe der Kiefer sind eine amtlich anerkannte Arzneidroge gegen Husten und Erkältung – und ergeben einen harzig-frischen Sirup. Beim Sammeln gilt: die Eibe sicher ausschließen.","steckbrief":[["Familie","Kieferngewächse (Pinaceae)"],["Lebensform","Baum, bis 40 m, Lichtbaumart"],["Nadeln","zu zweit, 4–7 cm"],["Sammelzeit","Maiwipferl April–Mai, 3–5 cm lang"],["Verwendete Teile","junge Triebe (Pini turiones), Knospen, Nadeln, Harz"],["Monographie","Kommission E positiv; keine HMPC-Monographie"],["Achtung","ätherische Öle nicht bei Säuglingen und Kleinkindern"],["Mehr","{{s:knospen|Thema Knospen}}"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"nadel_vergleich","titel":"Nadelbäume sicher unterscheiden"},{"typ":"standort","licht":5,"wasser":2,"naehrstoffe":1,"ph":"sauer bis kalkhaltig","boden":"sehr anspruchslos: Sand, Moor, Fels","ellenberg":"L7 F– R– N–","hinweis":"Bildet eine tiefe Pfahlwurzel; wächst auch dort, wo andere Bäume scheitern."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Nadeln:** immer zu zweit an einem Kurztrieb, 4–7 cm, leicht gedreht, blaugrün.","**Rinde:** im oberen Stamm fuchsrot und dünn abblätternd, unten dicke graubraune Borke.","**Blüten:** gelbe männliche Kätzchen im Mai (Pollenwolken), kleine rötliche weibliche Zäpfchen.","**Zapfen:** reifen erst im zweiten Herbst.","**Wurzel:** tiefe Pfahlwurzel, Mykorrhiza u. a. mit dem {{p:p13|Fliegenpilz}}."]},{"typ":"hinweis","text":"**Eibe ausschließen:** flache, weiche Nadeln **ohne weiße Streifen**, keine Zapfen, rote Samenmäntel – fast alle Teile sind tödlich giftig (Taxin). Mehr in {{s:knospen-sammeln|Knospen sicher sammeln}}."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Ätherisches Öl","α- und β-Pinen, Bornylacetat, Limonen","{{b:terpene|Terpene}}"],["Harz","Harzsäuren","–"],["Vitamin C","in jungen Trieben","{{b:vitamine-vergleich|Vitamine}}"],["Flavonoide, Gerbstoffe","–","{{b:flavonoide|Flavonoide}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Katarrhe der oberen und unteren Atemwege","Tee, Sirup, Inhalation","[W] Kommission E (Pini turiones), 2–3 g Droge mehrmals täglich"],["Leichte Muskel- und Nervenschmerzen","Einreibung, Bad","[W] Kommission E äußerlich"],["Gegen Skorbut","Nadeltee","[T] historisch belegt (Vitamin C)"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"tee","titel":"Kiefernsprossen-Tee","kat":"innerlich","beleg":"W","teil":"junge Triebe","kurz":"Bei Erkältungshusten.","zutaten":["2–3 g getrocknete oder 1 EL frische, zerkleinerte Triebe","200 ml Wasser"],"schritte":["Mit kochendem Wasser übergießen, zugedeckt 10 Minuten ziehen lassen.","Mehrmals täglich eine Tasse."],"hinweis":"Nicht bei Asthma und Keuchhusten (Bronchospasmus möglich)."},{"id":"inhalation","titel":"Inhalation","kat":"innerlich","beleg":"T","teil":"Triebe, Nadeln","kurz":"Dampf mit Kiefernduft befreit die Nase.","zutaten":["eine Handvoll Triebe oder Nadeln","Schüssel heißes Wasser, Handtuch"],"schritte":["Übergießen, unter dem Handtuch 5–10 Minuten inhalieren, Augen schließen."],"hinweis":"Nie bei Säuglingen und Kleinkindern – ätherische Öle können einen Stimmritzenkrampf auslösen."},{"id":"bad","titel":"Kiefernbad","kat":"aeusserlich","beleg":"T","teil":"Zweige","kurz":"Wärmend bei Muskelverspannung.","zutaten":["2 Handvoll Zweigspitzen","3 l Wasser"],"schritte":["20 Minuten auskochen, abseihen, ins Badewasser geben."]}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["vorrat","Vorrat"],["kueche","Küche"]],"eintraege":[{"id":"sirup","titel":"Maiwipferl-Sirup (kalt)","kat":"vorrat","menge":"2 Flaschen","zeit":"30 Min. + 3–4 Wochen","kurz":"Der Klassiker – ohne Kochen.","zutaten":["250 g junge Kiefern- oder Fichtentriebe","250 g Zucker","großes Schraubglas"],"schritte":["Triebe und Zucker abwechselnd schichten, oben Zucker.","3–4 Wochen an einen sonnigen Platz stellen, täglich schwenken.","Abseihen, in Flaschen füllen, kühl lagern."],"tipp":"Teelöffelweise bei Husten oder als Limonade mit Sprudel."},{"id":"sirup2","titel":"Maiwipferl-Sirup (gekocht)","kat":"vorrat","menge":"3 Flaschen","zeit":"Über Nacht + 1 Std.","kurz":"Haltbarer, schneller fertig.","zutaten":["200 g Triebspitzen","1 l Wasser","1 kg Zucker","Saft von 1 Zitrone"],"schritte":["Triebe über Nacht im Wasser ziehen lassen, dann aufkochen und abseihen.","Mit Zucker und Zitrone sirupartig einkochen.","Heiß in sterile Flaschen füllen."]},{"id":"salz","titel":"Kiefernnadel-Salz","kat":"kueche","menge":"1 Glas","zeit":"15 Min.","kurz":"Zu Wild, Pilzen und Kartoffeln.","zutaten":["2 EL junge Nadeln","100 g Meersalz"],"schritte":["Im Mörser zusammen fein reiben.","Einen Tag offen trocknen, abfüllen."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["sammeln","Sammeln"],["haus","Haus"]],"eintraege":[{"id":"sammeln","titel":"Schonend sammeln","kat":"sammeln","beleg":"W","teil":"Triebe","kurz":"Nie den Leittrieb, nur Seitentriebe von vielen Bäumen.","zutaten":["Erlaubnis des Waldbesitzers bei größeren Mengen","Schere, Korb"],"schritte":["Nur 3–5 cm lange, noch geschlossene Triebe abknipsen.","Pro Baum nur wenige.","Handstraußregel beachten (§ 39 BNatSchG)."]},{"id":"kien","titel":"Kienspan und Harz","kat":"haus","beleg":"T","teil":"Holz, Harz","kurz":"Harzreiches Kiefernholz brennt wie eine Fackel – das alte Licht der Bauernstuben.","zutaten":["harzreiche Wurzelstöcke"],"schritte":["Dünne Späne spalten.","Als Feueranzünder nutzen."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Die Kiefer war in Mitteleuropa nach der Eiszeit eine der ersten Waldbaumarten. Kienspan war bis ins 19. Jahrhundert die Beleuchtung armer Haushalte. Junge Triebe und Nadeltee halfen Seefahrern und Waldvölkern gegen Skorbut. [T]"},{"typ":"text","text":"**Storl** sieht den Menschen als „Geschöpf des Waldes“ ({{a:storl-buecher-wir-geschoepfe|Wir sind Geschöpfe des Waldes}}). Nadelbäume, Harz und Räucherwerk spielen in seinen Büchern über Baumkalender und Pflanzen der Kelten eine große Rolle ({{a:storl-buecher-kelten|Pflanzen der Kelten}}). [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Risiko","Wer","Was tun"],"zeilen":[["Ätherische Öle: Stimmritzenkrampf","Säuglinge, Kinder unter 2 (besser unter 4) Jahren","nie im Gesicht anwenden"],["Bronchospasmus","Asthma, Keuchhusten","keine Inhalation"],["Hautreizung","große Hautverletzungen, Fieber","kein Vollbad"],["Verwechslung Eibe","alle Sammler","Nadeln paarweise? Sonst nicht ernten"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["arzneipflanzenlexikon: Kiefer (Kommission E)","https://arzneipflanzenlexikon.info/kiefer.php"],["Altmeyers: Pini turiones","https://www.altmeyers.org/en/naturopathy/pini-turiones-143717"],["Wildkräuterwerkstatt: Kiefernsprossen","https://wildkraeuterwerkstatt.de/kiefer-kiefernsprossen-pinus-sylvestris/"]]}]}]},{"id":"p15","nr":"P-15","illu":"nelke","fotos":[],"name":"Gewürznelke","botan":"Syzygium aromaticum (L.) Merr. & L. M. Perry","volksnamen":["Nelke","Nägelein","Kreidenelke"],"kurz":"Getrocknete Blütenknospen eines tropischen Baums: in kleinen Mengen ein Gewürz und altes Hausmittel gegen Zahnschmerz, als konzentriertes Öl für Kinder lebensgefährlich.","steckbrief":[["Familie","Myrtengewächse (Myrtaceae)"],["Herkunft","Molukken (Indonesien), Anbau u. a. Sansibar, Madagaskar"],["Verwendete Teile","getrocknete Blütenknospen, Nelkenöl"],["Hauptwirkstoff","Eugenol (80–90 % des Öls)"],["Monographie","HMPC: Nelkenöl traditionell bei Mund- und Zahnbeschwerden"],["Achtung","Nelkenöl nicht unter 18 Jahren; bei Kleinkindern ab 5–10 ml lebensbedrohlich"],["Anbau","bei uns nicht möglich (tropisch)"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":4,"wasser":4,"naehrstoffe":3,"ph":"leicht sauer","boden":"tropisch, feucht-warm; in Mitteleuropa nicht anbaubar","ellenberg":"–","hinweis":""},{"typ":"abschnitt","titel":"Aussehen","liste":["**Baum:** immergrün, 8–12 m.","**Blätter:** ledrig, glänzend, gegenständig, mit Öldrüsen.","**Knospen:** in Büscheln; geerntet, wenn sie sich rosa färben – vor dem Aufblühen.","**Gewürznelke:** der Stiel ist der Fruchtknoten, das Köpfchen die geschlossenen Blütenblätter."]},{"typ":"text","text":"**Qualitätsprobe:** Gute Nelken sinken im Wasser oder schwimmen senkrecht (viel Öl). Waagrecht schwimmende sind alt oder ausgelaugt."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Ätherisches Öl (15–20 %)","{{b:eugenol|Eugenol}} 80–90 %, Eugenylacetat, β-Caryophyllen","{{b:eugenol|Eugenol}}"],["Gerbstoffe","ca. 10 %","–"],["Flavonoide","–","{{b:flavonoide|Flavonoide}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Örtlich betäubend bei Zahnschmerz","Nelke oder verdünntes Öl","[W] HMPC traditionell – nur als Überbrückung bis zum Zahnarzt"],["Leichte Entzündungen in Mund und Rachen","verdünntes Öl, Mundspülung","[W] HMPC traditionell"],["Antimikrobiell","Labor","[W] Labor; klinisch kaum geprüft"],["Verdauungsfördernd","Gewürz","[T]"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"zahn","titel":"Erste Hilfe bei Zahnschmerz","kat":"aeusserlich","beleg":"T","teil":"ganze Nelke","kurz":"Nur für Erwachsene, nur kurzfristig.","zutaten":["1 ganze Nelke"],"schritte":["Nelke an den schmerzenden Zahn legen und leicht anbeißen, bis die Stelle taub wird.","Spätestens am nächsten Tag zum Zahnarzt."],"hinweis":"Kein unverdünntes Nelkenöl auf Zahnfleisch – es verätzt die Schleimhaut."}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"]],"eintraege":[{"id":"rotkohl","titel":"Rotkohl mit Nelken","kat":"kueche","menge":"4 Pers.","zeit":"1 Std.","kurz":"Klassisch zum Braten.","zutaten":["1 Rotkohl","2 Äpfel, 1 Zwiebel","3 Nelken, 1 Lorbeerblatt","Essig, Zucker, Salz"],"schritte":["Kohl hobeln, Zwiebel und Äpfel andünsten.","Mit Gewürzen und einem Schuss Essig 50 Minuten schmoren.","Nelken und Lorbeer entfernen."]},{"id":"gluehwein","titel":"Kinderpunsch","kat":"kueche","menge":"1 l","zeit":"15 Min.","kurz":"Warmer Wintertrunk.","zutaten":["1 l Apfel- oder Traubensaft","1 Zimtstange, 3 Nelken, 1 Orange in Scheiben"],"schritte":["Alles erhitzen, nicht kochen, 10 Minuten ziehen lassen, abseihen."]}]}]},{"id":"selbstversorgung","titel":"Vorrat","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"lager","titel":"Lagern","kat":"haus","beleg":"T","teil":"Knospen","kurz":"Ganz kaufen, erst bei Bedarf mahlen.","zutaten":["dunkles, dichtes Glas"],"schritte":["Kühl und dunkel lagern; ganze Nelken halten Jahre.","Wasserprobe für die Qualität machen."]},{"id":"motten","titel":"Duftorange gegen Motten","kat":"haus","beleg":"T","teil":"Knospen","kurz":"Mit Nelken gespickte Orange duftet wochenlang.","zutaten":["1 Orange, eine Handvoll Nelken, Band"],"schritte":["Orange rundum mit Nelken spicken.","Trocknen lassen, in den Schrank hängen."]}]}]},{"id":"tradition","titel":"Tradition","bloecke":[{"typ":"text","text":"Nelken gehörten mit Muskat zu den kostbarsten Gewürzen der Welt; um die Molukken wurden Kriege geführt. Hildegard von Bingen empfahl „Nägelein“ bei Kopfschmerz und Ohrensausen. [T]"},{"typ":"hinweis","text":"Die „Parasitenkur“ nach Hulda Clark kombiniert Nelken mit Schwarznuss und Wermut – Einordnung bei {{p:p17#tradition|Schwarznuss}}."}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Risiko","Wer","Grenze / Was tun"],"zeilen":[["Vergiftung durch Nelkenöl: Leberversagen, Krämpfe, Unterzuckerung, Azidose","Kinder unter 2 Jahren","schon 5–10 ml lebensbedrohlich (HMPC) – **kindersicher lagern**; Giftnotruf (Deutschland, z. B. Berlin 030 19240), bei Bewusstseinsstörung oder Atemnot sofort **112**."],["Lebertoxizität","Erwachsene bei 10–30 ml Öl","Gewürzmengen sind unbedenklich (LiverTox, NIH)"],["Kontaktallergie (Eugenol)","Allergiker","meiden"],["Schwangerschaft, Stillzeit, unter 18","–","kein Nelkenöl (HMPC)"],["Blutgerinnung","Gerinnungshemmer","keine Öl-Präparate"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["EMA/HMPC: Caryophylli floris aetheroleum – Monographie","https://www.ema.europa.eu/en/documents/herbal-monograph/final-community-herbal-monograph-syzygium-aromaticum-l-merill-et-l-m-perry-floris-aetheroleum_en.pdf"],["LiverTox (NIH): Clove","https://ncbi.nlm.nih.gov/books/NBK551727/?report=reader"],["Janes et al. 2005: Eugenol-induced hepatic failure","https://www.researchgate.net/publication/7846667_Essential_oil_poisoning_N-acetylcysteine_for_eugenol-induced_hepatic_failure_and_analysis_of_a_national_database"]]}]}]},{"id":"p16","nr":"P-16","illu":"wermut","fotos":[],"name":"Wermut","botan":"Artemisia absinthium L.","volksnamen":["Bitterer Beifuß","Absinth","Wurmkraut","Grabkraut"],"kurz":"Eine der bittersten Pflanzen Europas: In winzigen Mengen weckt Wermut Appetit und Verdauung. Sein Thujon ist ein Nervengift – deshalb gibt es klare Höchstmengen.","steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","Halbstrauch, 60–120 cm"],["Blütezeit","Juli–September"],["Sammelzeit","blühende Triebspitzen Juli–August"],["Bitterwert","mindestens 15.000 (Ph. Eur.)"],["Monographie","HMPC traditionell bei Appetitlosigkeit und Verdauungsbeschwerden"],["Grenzwert","Thujon unter 6,0 mg pro Tag (HMPC Rev. 1), höchstens 2 Wochen"],["Achtung","nicht in Schwangerschaft, nicht für Kinder, kein Öl einnehmen"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":5,"wasser":1,"naehrstoffe":4,"ph":"kalkhaltig","boden":"trocken, durchlässig, steinig; Weinbergränder, Ruinen","ellenberg":"L9 F4 R– N8","hinweis":"Braucht volle Sonne; in nassem Boden fault der Wurzelhals."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** 2–3-fach gefiedert, **beidseitig** silbergrau seidig behaart.","**Blüten:** kleine, kugelige, nickende gelbe Köpfchen in Rispen.","**Geruch und Geschmack:** würzig-herb, extrem bitter.","**Wuchs:** Halbstrauch mit verholzter Basis, Pfahlwurzel."]},{"typ":"hinweis","text":"Unterschied zum {{p:p09|Beifuß}}: Beifuß ist oben grün, nur unten weiß, und viel weniger bitter. Siehe Verwechslungstafel beim Beifuß."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Bitterstoffe","Absinthin, Anabsinthin (Sesquiterpenlactone)","{{b:bitterstoffe|Bitterstoffe}}"],["Ätherisches Öl (0,2–1 %)","α- und β-{{b:thujon|Thujon}}, stark schwankend je Chemotyp und Monat","{{b:thujon|Thujon}}"],["Flavonoide","–","{{b:flavonoide|Flavonoide}}"]]},{"typ":"text","text":"Ein Chemotyp enthielt im August rund 50 % α-Thujon im Öl, im November nur ca. 8 % (HMPC-Bewertungsbericht). Thujonarme Chemotypen sind vorzuziehen."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Appetitlosigkeit","Tee vor dem Essen","[W] HMPC traditionell"],["Leichte Verdauungsbeschwerden, Völlegefühl","Tee","[W] HMPC traditionell"],["Gallenwegs-Dyskinesien","Tee","[W] Kommission E"],["Gegen Würmer","–","[T] Name „Wurmkraut“; nicht belegt – Würmer gehören zum Arzt"]]}]}, ckbrief":[["Familie","Walnussgewächse (Juglandaceae)"],["Herkunft","östliches Nordamerika; bei uns Forst- und Parkbaum"],["Größe","bis 30 m"],["Blätter","15–23 Fiederblättchen (Walnuss 5–9)"],["Nuss","sehr hart, tief gefurcht"],["Wirkstoff","Juglon (Allelopathie)"],["Achtung","Schalen-Präparate: Datenlage zur Sicherheit dünn"],["Garten","nichts Empfindliches unter die Krone pflanzen"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":4,"wasser":3,"naehrstoffe":4,"ph":"neutral","boden":"tiefgründiger, frischer Lehm","ellenberg":"–","hinweis":"Tiefe Pfahlwurzel; braucht Platz – Krone bis 20 m breit."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** gefiedert, 30–60 cm, 15–23 Fiederblättchen, gesägt; Endblättchen oft fehlend.","**Frucht:** kugelig, grün, 4–6 cm; die Schale färbt tiefbraun.","**Nuss:** dick, tief gefurcht, sehr hart, kleiner, aromatischer Kern.","**Rinde:** dunkel, tief gefurcht."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Wo","Teil B"],"zeilen":[["{{b:juglon|Juglon}}","Knospen, Fruchtschalen, Wurzeln, Laub","{{b:juglon|Juglon}}"],["Gerbstoffe","Fruchtschale","–"],["Fett, Eiweiß, Omega-6 und etwas Omega-3","Kern","{{b:omega3|Omega-3}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Behauptung","Einordnung"],"zeilen":[["Kerne als Nahrung","[W] nährstoffreich wie Walnuss"],["Schalentinktur gegen Parasiten, Pilze","[A] nicht belegt; Juglon ist im Labor zytotoxisch"],["„Heilt alle Krankheiten“ (Hulda Clark)","[A] keine wissenschaftliche Grundlage"]]}]},{"id":"heilkunde","titel":"Nutzung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"faerben","titel":"Färben mit Nussschalen","kat":"haus","beleg":"T","teil":"Fruchtschalen","kurz":"Die grünen Schalen färben Wolle, Holz und Haut tiefbraun.","zutaten":["grüne Fruchtschalen, Handschuhe","Topf, Wasser, Wolle"],"schritte":["Schalen 1–2 Stunden au
