ak, Leinöl, Walnuss. Der Körper wandelt ALA nur zu wenigen Prozent in EPA und DHA um, die für Gehirn und Herz wichtig sind. DHA kommt aus Fisch und Algen – ein Kernthema bei {{a:nehls-praxis-omega3|Dr. Nehls}}.","stichworte":["ALA","DHA","EPA","Portulak","Gehirn"],"pflanzen":["p11#inhaltsstoffe"]},{"id":"terpene","titel":"Terpene (ätherische Öle)","text":"Größte Gruppe flüchtiger Pflanzenstoffe: Pinen und Bornylacetat (Kiefer), Cineol, Kampfer und Thujon (Beifuß, Wermut), Zingiberen (Ingwer), Turmerone (Kurkuma). Sie wirken antimikrobiell, schleimlösend oder durchblutungsfördernd; konzentriert können sie Haut und Atemwege reizen – bei Kleinkindern Stimmritzenkrampf.","stichworte":["Pinen","Cineol","ätherisches Öl","Monoterpene"],"pflanzen":["p14#inhaltsstoffe","p18#inhaltsstoffe"]},{"id":"tsna","titel":"Tabakspezifische Nitrosamine (TSNA)","text":"Stark krebserregende Verbindungen (z. B. NNN, NNK), die beim Trocknen und Lagern von Tabak entstehen: Bakterien wandeln Nitrat in Nitrit um, das mit Tabakalkaloiden reagiert. Viel Stickstoffdünger und feucht-warme, langsame Trocknung erhöhen die Menge.","stichworte":["NNN","NNK","Nitrosamine","Krebs","Nitrit"],"pflanzen":["p21#inhaltsstoffe"]},{"id":"nikotin","titel":"Nikotin","text":"Pyridin-Alkaloid des Tabaks, gebildet nur in den Wurzeln und über das Xylem in die Blätter transportiert. Bindet an nikotinische Acetylcholin-Rezeptoren: in kleinen Mengen anregend, in großen Mengen lähmend. Macht stark abhängig. Für Kinder können schon verschluckte Zigaretten oder Kippen gefährlich sein.","stichworte":["Alkaloid","Acetylcholin","Abhängigkeit","Nornicotin","Anabasin","Jasmonat"],"pflanzen":["p21#inhaltsstoffe"]},{"id":"cannabinoide","titel":"Cannabinoide","text":"Terpenophenole des Hanfs, gebildet in den Drüsenhaaren der weiblichen Blüten. Aus CBGA entstehen THCA, CBDA und CBCA; erst Hitze macht daraus THC, CBD und CBC. THC wirkt über CB1-Rezeptoren im Gehirn (berauschend), CBD nicht berauschend. Der Körper hat ein eigenes Endocannabinoid-System mit Anandamid und 2-AG.","stichworte":["THC","CBD","CBG","CBN","THCA","Decarboxylierung","CB1","Endocannabinoid","Anandamid"],"pflanzen":["p22#inhaltsstoffe"]},{"id":"vitamine","titel":"Vitamine, Mineralstoffe & Verträglichkeit","nr":"B-V","illu":"vit_balken","fotos":[],"text":"Vitamin- und Mineralstoffgehalt von Wildkräutern im Vergleich zu Kulturgemüse, was die Stoffe im Körper tun, wie Zubereitung sie verändert – und wer bei welchen Pflanzen aufpassen muss, mit allen Grenzwerten auf einen Blick.","stichworte":["Vitamin C","Vitamin A","Beta-Carotin","Vitamin K","Vitamin E","Folat","Eisen","Calcium","Magnesium","Kalium","Nährwerte","Wildkräuter","Verträglichkeit","Oxalsäure","Nitrat","Allergie","Grenzwerte","Leber","Schwangerschaft"],"pflanzen":["p01#inhaltsstoffe","p02#inhaltsstoffe","p03#inhaltsstoffe","p11#inhaltsstoffe"],"kurz":"Wildkräuter schlagen Kopfsalat bei fast allen Vitaminen und Mineralstoffen um ein Vielfaches – die Brennnessel ist der Spitzenreiter. Gleichzeitig hat jede wirksame Pflanze ihre Grenzen: Hier stehen sie gesammelt.","steckbrief":[["Spitzenreiter","Brennnessel: Vitamin C, Calcium, Carotinoide"],["Omega-3","Portulak (ALA, 300–400 mg/100 g)"],["Vitamin K","Löwenzahn, Brennnessel"],["Achtung Zahlen","je nach Quelle, Standort und Zustand Faktor 2–4 Unterschied"],["Nicht in Pflanzen","Vitamin B12, Vitamin D (nur Spuren), DHA"],["Grenzwerte","Reiter „Grenzwerte“"]],"reiter":[{"id":"vergleich","titel":"Vergleich","bloecke":[{"typ":"illu","id":"vit_balken","titel":"Vitamin C und Calcium im Vergleich"},{"typ":"tabelle","kopf":["Pflanze (roh, 100 g)","Vitamin C (mg)","Vitamin A / Beta-Carotin","Vitamin K (µg)","Eisen (mg)","Calcium (mg)","Magnesium (mg)","Kalium (mg)","Quelle"],"zeilen":[["{{p:p01|Brennnessel}}","333","ca. 2.400 µg Beta-Carotin","ca. 500 (blanchiert)","ca. 4,1","713 (blanchiert 481)","ca. 80","400–475","Souci-Fachmann-Kraut via Sekundärquellen; USDA blanchiert"],["{{p:p02|Giersch}}","46,5 (Review 2025) bis 100–200 (populär)","k. A.","k. A.","2,5–3","ca. 130","k. A.","ca. 580","PMC11990176; höhere Werte unsicher"],["{{p:p03|Löwenzahn}}","35 (USDA) bis 68–70","ca. 7.900 µg Beta-Carotin","ca. 778","3,1","187","36","397","USDA; deutsche Tabellen"],["{{p:p11|Portulak}}","21–27","66 µg RAE","k. A.","ca. 2","65","68","494","Uddin et al. 2014"],["{{p:p10|Breitwegerich}}","k. A.","k. A.","k. A.","k. A.","k. A.","k. A.","k. A.","Datenlücke"],["Spinat","ca. 28","469 µg RAE","ca. 483","ca. 2,7","99","79","558","USDA"],["Kopfsalat","ca. 9","ca. 370 µg RAE","ca. 126","ca. 0,9","36","13","194","USDA"]]},{"typ":"hinweis","text":"Die Werte sind **Richtwerte**. Wildkräuter schwanken stark nach Standort, Erntezeit, Blattalter und Messmethode. USDA-Werte konnten bei der Recherche nicht live geprüft werden; vor dem Druck mit USDA FoodData Central abgleichen."},{"typ":"text","text":"Laut einer Studie der Universität Göttingen (2022) enthält die Brennnessel mehr von allen gemessenen Mineralstoffen als Giersch – außer Kalium. [W]"}]},{"id":"vitamine","titel":"Was die Vitamine tun","bloecke":[{"typ":"tabelle","kopf":["Vitamin","Aufgabe","Gute Pflanzenquellen","Hinweis"],"zeilen":[["Vitamin C","Abwehr, Bindegewebe, Eisenaufnahme, Antioxidans","Brennnessel, Hagebutte, junge Nadelbaumtriebe, Giersch, Löwenzahn","hitze- und lichtempfindlich; frisch und roh am meisten"],["Beta-Carotin (Provitamin A)","Augen, Haut, Schleimhäute","Brennnessel, Löwenzahn, Möhre, Spinat","nur mit Fett gut aufgenommen ({{b:carotinoide|Carotinoide}})"],["Vitamin K1","Blutgerinnung, Knochen","Löwenzahn, Brennnessel, Spinat, Kohl","Vorsicht bei Gerinnungshemmern (Marcumar) – gleichmäßig essen ({{b:vitamin-k|Vitamin K}})"],["Vitamin E","Zellschutz, Fettsäuren","Portulak, Nüsse, Pflanzenöle","fettlöslich"],["Folat","Zellteilung, Blutbildung, Schwangerschaft","grünes Blattgemüse, Wildkräuter","hitzeempfindlich"],["Vitamin B12","Nerven, Blut","**nicht in Pflanzen**","bei veganer Ernährung ergänzen"],["Vitamin D","Knochen, Immunsystem, Gehirn","**kaum in Pflanzen** – entsteht in der Haut durch Sonne","im Winter meist Mangel"]]},{"typ":"hinweis","text":"**Nehls-Bezug:** {{a:nehls|Dr. Nehls}} legt großen Wert auf Vitamin D ({{a:nehls-praxis-vitamind|Vitamin D und Tageslicht}}), Omega-3-DHA ({{a:nehls-praxis-omega3|Omega-3 versorgen}}) und – bei veganer Ernährung – B12. Gerade diese drei liefern Pflanzen nicht oder kaum: Wildkräuter ersetzen sie nicht, ergänzen aber Vitamin C, K1, Folat und Mineralstoffe. Seine Einordnung und die Kritik daran: {{a:nehls-einordnung|Einordnung}}. Zu Lithium in Pflanzen: {{b:lithium|Lithium}}."}]},{"id":"mineralstoffe","titel":"Mineralstoffe","bloecke":[{"typ":"tabelle","kopf":["Mineralstoff","Aufgabe","Wildkräuter","Aufnahme"],"zeilen":[["Calcium","Knochen, Muskeln, Nerven","Brennnessel (Spitze), Löwenzahn, Giersch","Oxalsäure bindet es (Spinat, Portulak)"],["Eisen","Blutbildung, Sauerstofftransport","Brennnessel, Löwenzahn, Giersch","Pflanzeneisen wird schlecht aufgenommen; Vitamin C verbessert, Gerbstoffe (Tee, Kaffee) und Phytinsäure verschlechtern"],["Magnesium","Muskeln, Nerven, Energiestoffwechsel","Portulak, Brennnessel, Spinat","im Chlorophyll gebunden ({{b:chlorophyll|Chlorophyll}})"],["Kalium","Blutdruck, Herz, Wasserhaushalt","Giersch, Portulak, Brennnessel","bei Nierenerkrankung Vorsicht"],["Kieselsäure","Bindegewebe (traditionell)","Brennnessel, Schachtelhalm","{{b:kieselsaeure|Kieselsäure}}"]]},{"typ":"text","text":"**Trick für mehr Eisen:** Wildkräuter mit Vitamin-C-reichen Zutaten kombinieren (Zitrone, Paprika) und Tee oder Kaffee erst eine Stunde später trinken. Mehr zu Hemmstoffen: {{b:phytinsaeure|Phytinsäure}}, {{b:oxalsaeure|Oxalsäure}}."}]},{"id":"zubereitung","titel":"Zubereitung & Verluste","bloecke":[{"typ":"tabelle","kopf":["Was","Wirkung auf Nährstoffe"],"zeilen":[["Kochen","Vitamin C und Folat sinken stark; wasserlösliche Mineralstoffe gehen ins Kochwasser – Kochwasser mitverwenden"],["Kurz dünsten, blanchieren","mäßige Verluste; Oxalsäure und Nitrat sinken, wenn das Wasser weggegossen wird"],["Mit Fett","Carotinoide, Vitamin E und K werden besser aufgenommen"],["Kochen von Wildkräutern","kann laut Göttinger Studie die antioxidative Wirkung **erhöhen**, weil gebundene Polyphenole frei werden [W]"],["Trocknen","Vitamin C sinkt deutlich; Mineralstoffe bleiben"],["Lagern","welke Blätter verlieren Vitamin C in Stunden – frisch ernten, schnell essen"],["Einfrieren","nach kurzem Blanchieren gute Erhaltung ({{s:einfrieren|Blanchieren und Einfrieren}})"]]}]},{"id":"vertraeglichkeit","titel":"Verträglichkeit","bloecke":[{"typ":"tabelle","kopf":["Risiko","Pflanzen","Mechanismus","Wer aufpassen muss","Was tun"],"zeilen":[["Oxalsäure","Portulak, Spinat, Mangold, Rhabarber, Sauerampfer","bindet Calcium, Nierensteine","Nierensteinpatienten, Kleinkinder","blanchieren, mit Milchprodukten, Mengen begrenzen"],["Nitrat","Spinat, Rucola, Salat, Rote Bete, Wildkräuter von überdüngten Stellen","wird zu Nitrit; bei Säuglingen Blausucht","Säuglinge unter 6 Monaten","nicht am Misthaufen sammeln, Gemüse nicht lange warmhalten ({{b:nitrat|Nitrat}})"],["Korbblütler-Allergie","{{p:p09|Beifuß}}, {{p:p16|Wermut}}, {{p:p03|Löwenzahn}}, {{p:p07|Schafgarbe}}, {{p:p05|Ringelblume}}, Kamille","Art v 1, Sesquiterpenlactone","Pollenallergiker","meiden, Allergietest"],["Lichtempfindlichkeit","{{p:p08|Johanniskraut}}, Feige, Bärenklau, Pastinake, Weinraute","Hypericin, Furocumarine","Hellhäutige, Gärtner","Handschuhe, Sonne meiden"],["Leber","{{p:p20|Beinwell}}, Borretsch (PA), {{p:p19|Kurkuma}}-Extrakte, {{p:p15|Nelkenöl}}, {{p:p17|Schwarznuss}} (unklar)","Pyrrolizidinalkaloide, direkte oder unvorhersehbare Giftwirkung","Lebererkrankte, Kinder, Langzeitanwender","Grenzwerte beachten; bei Gelbsucht oder dunklem Urin absetzen, Arzt"],["Nervensystem","{{p:p16|Wermut}}, {{p:p09|Beifuß}} (je Chemotyp), {{p:p13|Fliegenpilz}}","Thujon blockiert, Muscimol aktiviert GABA-A-Rezeptoren","Epileptiker, Kinder, Schwangere","Thujon unter 6 mg/Tag; Fliegenpilz nie essen"],["Schwangerschaft","Wermut, Beifuß, Beinwell, Nelkenöl, Kurkuma-Präparate; Ingwer nur in Küchenmengen","uteruswirksam, PA, fehlende Daten","Schwangere, Stillende","keine Präparate ohne Rücksprache"],["Kinder","Nelkenöl, ätherische Öle im Gesicht ({{p:p14|Kiefer}}), Königskerzentee erst ab 12, Honig erst ab 1 Jahr","Stimmritzenkrampf, Leber, Botulismus","Eltern","kindersicher lagern, Giftnotruf kennen"],["Wechselwirkungen","Johanniskraut, Kurkuma und Ingwer hochdosiert, Weißdorn, Vitamin-K-reiche Kräuter","Enzyminduktion, Gerinnung","Dauermedikation","Apotheke oder Arzt fragen"]]}]},{"id":"grenzwerte","titel":"Grenzwerte","bloecke":[{"typ":"tabelle","kopf":["Pflanze / Stoff","Grenze","Quelle"],"zeilen":[["{{p:p16|Wermut}}: Thujon","unter 6,0 mg pro Tag, höchstens 2 Wochen","[W] HMPC Revision 1"],["{{p:p20|Beinwell}}: Pyrrolizidinalkaloide","höchstens 100 µg pro Tag äußerlich (1 µg innerlich), max. 4–6 Wochen im Jahr","[W] Stufenplan 1992, BfArM, EMA 2021"],["{{p:p19|Kurkuma}}: Curcumin","3 mg pro kg Körpergewicht und Tag aus allen Quellen","[W] EFSA 2010, BfR 040/2021"],["Piperin in Nahrungsergänzung","höchstens 2 mg pro Tag","[W] BfR 040/2021"],["{{p:p15|Nelkenöl}}","nicht unter 18 Jahren; bei Kleinkindern ab 5–10 ml lebensbedrohlich","[W] HMPC"],["{{p:p13|Fliegenpilz}}","kein Verzehr, keine Muscimol-Produkte","[W] BfR 2025"],["{{p:p12|Königskerze}}","Tee ab 12 Jahren","[W] HMPC"],["{{p:p18|Ingwer}} (Arzneimittel)","Reiseübelkeit ab 18 Jahren 1–2 g; Kinder 6–12 J. 250–500 mg","[W] HMPC 2025"],["{{p:p08|Johanniskraut}}","Wechselwirkungen mit vielen Medikamenten, auch der Pille","[W] HMPC"]]},{"typ":"hinweis","text":"Im Zweifel: Apotheke fragen. Giftnotruf (z. B. Berlin 030 19240), Notfall 112."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Engelhardt, Pöhnl & Neugart 2022: Brennnessel und Giersch (PMC9610176)","https://pmc.ncbi.nlm.nih.gov/articles/PMC9610176/"],["Giersch-Review 2025 (PMC11990176)","https://pmc.ncbi.nlm.nih.gov/articles/PMC11990176/"],["Uddin et al. 2014: Portulak (PMC3934766)","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3934766/"],["USDA SR Legacy: Brennnessel blanchiert (Spiegelseite)","https://www.nutritionvalue.org/Stinging_Nettles%2C_blanched_%28Northern_Plains_Indians%29_nutritional_value.html"],["kraeuter-buch.de: Mineralstoffe und Vitamine von Kräutern","https://www.kraeuter-buch.de/magazin/mineralstoffe-und-vitamine-von-kraeutern-eine-analyse-123.html"],["kraeuterleben: Wildkräuter vs. Kulturgemüse","https://www.kraeuterleben.de/wissen-forschung/wildkraeuter-vs-kulturgemuese-naehrstoffvergleich"],["BfR-Stellungnahme 040/2021 (Kurkuma)","https://doi.org/10.17590/20211214-121912"]]}]}]}]}</script>

function bodenProfil(){ const X0=-1.2,X1=1.2,D=1.3; const HZ=[[0,-0.05,0x3a2a18,0x5a4228,'O · Streu'],[-0.05,-0.4,0x22170e,0x3a2818,'A · Humus, Mutterboden'],[-0.4,-0.9,0x7a5230,0x9a6a3a,'B · Unterboden'],[-0.9,-1.4,0x8a8270,0xa8a088,'C · Ausgangsgestein']];

  const seiten=[[u=>new V(X0+(X1-X0)*u,0,0)],[u=>new V(X0,0,-D*u)],[u=>new V(X1,0,-D*u)]];
  HZ.forEach(([yo,yu,c0,c1],k)=>{ seiten.forEach(([f])=>{ scene.add(band(60,u=>{ const p=f(u); p.y=k?yo+welle(p.x+p.z,k):0.02+rauschen(p.x,p.z); return p; },u=>{ const p=f(u); p.y=yu+(k<3?welle(p.x+p.z,k+1):0); return p; },c0,c1)); }); });
  scene.add(oberflaeche(X0,X1,0,-D,(x,z)=>0.02+rauschen(x,z),[0x2a3a18,0x3a5222,0x5a4a2a,null].filter(Boolean)));
  const inst=new T.InstancedMesh(new T.ConeGeometry(0.004,1,3),MR(0x4a7a2a,{roughness:0.8}),2600), o=new T.Object3D();
  for(let i=0;i<2600;i++){ const x=X0+rnd()*(X1-X0), z=-rnd()*D; o.position.set(x,0.03+rauschen(x,z),z); const h=0.05+rnd()*0.08; o.scale.set(1,h,1); o.position.y+=h/2; o.rotation.set((rnd()-.5)*0.5,0,(rnd()-.5)*0.5); o.updateMatrix(); inst.setMatrixAt(i,o.matrix); } scene.add(inst);
  for(let i=0;i<4;i++){ const g=rosette(K.p03); g.scale.setScalar(0.7); g.position.set(-0.8+i*0.5,0.03,-0.3-rnd()*0.8); scene.add(g); }
  const wm=MR(0xd8c8a8,{roughness:0.9}); for(let i=0;i<40;i++){ const x=X0+0.05+rnd()*(X1-X0-0.1), pts=[new V(x,0.01,0.004)]; let q=pts[0]; for(let k=0;k<5;k++){ q=q.clone().add(new V((rnd()-.5)*0.05,-0.04-rnd()*0.06*(i%5?1:2.5),0)); pts.push(q); } scene.add(rohr(pts,0.0018,wm,10)); }
  const ro=MR(0x120c08,{roughness:1}); for(let i=0;i<5;i++){ const x=-1+i*0.5+rnd()*0.2, pts=[]; for(let k=0;k<6;k++) pts.push(new V(x+0.03*Math.sin(k*1.3),-0.02-k*0.16,0.003)); scene.add(rohr(pts,0.011,ro,16)); if(i%2) wurm(x,-0.25-rnd()*0.3,0.012); }
  const lp=[]; for(let i=0;i<260;i++){ const x=X0+rnd()*(X1-X0), y=-0.05-rnd()*0.32, a=rnd()*6.28, l=0.02+rnd()*0.05; lp.push(x,y,0.006,x+Math.cos(a)*l,y+Math.sin(a)*l*0.5,0.006); } const lg=new T.BufferGeometry(); lg.setAttribute('position',new T.Float32BufferAttribute(lp,3)); scene.add(new T.LineSegments(lg,new T.LineBasicMaterial({color:0xf0ead8,transparent:true,opacity:0.7})));
  for(let i=0;i<70;i++){ const x=X0+0.05+rnd()*(X1-X0-0.1), y=-0.95-rnd()*0.42, r=0.02+rnd()*0.07; const s=new T.Mesh(new T.DodecahedronGeometry(r,0),MR(new T.Color().setHSL(0.1,0.06,0.45+rnd()*0.2),{roughness:0.9,flatShading:true})); s.position.set(x,y,0.005); s.scale.z=0.35; scene.add(s); }
  for(let i=0;i<30;i++){ const x=X0+0.05+rnd()*(X1-X0-0.1), y=-0.45-rnd()*0.4; const s=new T.Mesh(new T.DodecahedronGeometry(0.01+rnd()*0.02,0),MR(0x6a5a48,{flatShading:true})); s.position.set(x,y,0.004); s.scale.z=0.3; scene.add(s); }
  kruemel(120,X0+0.05,X1-0.05,()=>-0.05,()=>-0.4,0); for(let i=0;i<60;i++){ const x=X0+rnd()*(X1-X0), z=-rnd()*D; const b=new T.Mesh(new T.CircleGeometry(0.02+rnd()*0.02,6),MR(new T.Color().setHSL(0.07+rnd()*0.05,0.5,0.25+rnd()*0.15),{side:T.DoubleSide})); b.rotation.x=-Math.PI/2+(rnd()-.5)*0.4; b.position.set(x,0.03+rauschen(x,z),z); scene.add(b); }
  rasen(3.4).position.y=-1.41;
  legende=HZ.map(([,,c0,c1,t])=>[c1,t]).concat([[0x120c08,'Regenwurmröhren'],[0xf0ead8,'Pilzfäden (Hyphen)'],[0xd8c8a8,'Graswurzeln']]);
  return {ziel:new V(0,-0.5,-0.4),abst:4.2}; }

/* ---------- Komposthaufen ---------- */
function kompost(){ const B=0.65, D=1.2, H=1.0; const L=[[1.0,0.9,0xb89a58,0xd0b468,'Abdeckung: Stroh, Laub'],[0.9,0.65,0x4a5a22,0x7a6a32,'Frisches Material'],[0.65,0.38,0x4a3420,0x6a4a2a,'Rotte (warm, 40–60 °C)'],[0.38,0.14,0x1e150c,0x2e2014,'Reifer Kompost'],[0.14,0,0x5a4430,0x6a5038,'Reisig, Äste']];
  const wv=(x,k)=>0.015*Math.sin(x*8+k*3);
  const seiten=[u=>new V(-B+2*B*u,0,0),u=>new V(-B,0,-D*u),u=>new V(B,0,-D*u)];
  L.forEach(([o,u,c0,c1],k)=>seiten.forEach(f=>scene.add(band(40,v=>{ const p=f(v); p.y=H*o+(k?wv(p.x+p.z,k):0.03*Math.sin(p.x*5)+0.02); return p; },v=>{ const p=f(v); p.y=H*u+(k<4?wv(p.x+p.z,k+1):0); return p; },c0,c1))));
  scene.add(oberflaeche(-B,B,0,-D,(x,z)=>H+0.02+0.03*Math.sin(x*5)+rauschen(x,z)*2,[0xa88a48,0xc8a860,0xd8bc78]));
  const latte=MR(0x8a6a44,{roughness:0.95}), latte2=MR(0x7a5a38,{roughness:0.95});
  for(let i=0;i<6;i++){ const y=0.08+i*0.17; [[-B-0.025,-D/2,0.03,0.1,D+0.1],[B+0.025,-D/2,0.03,0.1,D+0.1],[0,-D-0.025,2*B+0.1,0.1,0.03]].forEach(([x,z,w,h,d],j)=>{ const m=new T.Mesh(new T.BoxGeometry(w,h,d),j===2?latte2:latte); m.position.set(x,y,z); m.castShadow=true; scene.add(m); }); }
  [[-B-0.05,0],[B+0.05,0],[-B-0.05,-D-0.05],[B+0.05,-D-0.05]].forEach(([x,z])=>{ const p=new T.Mesh(new T.BoxGeometry(0.06,H+0.15,0.06),latte2); p.position.set(x,(H+0.15)/2-0.03,z); scene.add(p); });
  const ast=MR(0x6a4a2a,{roughness:1}), sch=MR(0xb08858);
  for(let i=0;i<22;i++){ const x=-B+0.04+rnd()*(2*B-0.08), y=0.02+rnd()*0.11, r=0.012+rnd()*0.02; const c2=new T.Mesh(new T.CylinderGeometry(r,r,0.3,8),ast); c2.rotation.x=Math.PI/2; c2.position.set(x,y,-0.15); scene.add(c2); const d=new T.Mesh(new T.CircleGeometry(r*0.9,10),sch); d.position.set(x,y,0.002); scene.add(d); }
  for(let i=0;i<40;i++){ const x=-B+0.05+rnd()*(2*B-0.1), y=H*(0.66+rnd()*0.22); const b=new T.Mesh(new T.CircleGeometry(0.012+rnd()*0.02,5),MR([0x6a8a2a,0x9a7a30,0xd8c8a8,0xb85a20][i%4],{side:T.DoubleSide})); b.position.set(x,y,0.003); b.rotation.z=rnd()*3; scene.add(b); }
  kruemel(80,-B+0.03,B-0.03,()=>H*0.37,()=>H*0.15,0); kruemel(60,-B+0.03,B-0.03,()=>H*0.64,()=>H*0.4,0);
  for(let i=0;i<7;i++) wurm(-0.5+rnd()*0.9,H*(0.25+rnd()*0.35),0.01,0xb0453a);
  const hm=MR(0xd0b468,{roughness:1}); for(let i=0;i<220;i++){ const x=(rnd()-.5)*2*B*0.95, z=-rnd()*D*0.97, y=H+0.03+0.03*Math.sin(x*5); const h=new T.Mesh(new T.CylinderGeometry(0.003,0.003,0.06+rnd()*0.1,3),hm); h.position.set(x,y,z); h.rotation.set(Math.PI/2,0,rnd()*Math.PI); scene.add(h); }
  rasen(3);
  legende=L.map(([,,c0,c1,t])=>[c1,t]).concat([[0xb0453a,'Kompostwürmer']]);
  return {ziel:new V(0,0.45,-0.4),abst:3.4}; }

/* ---------- Aufbau ---------- */
let pflanze=null, wurzelG=null, sicht={ziel:new V(0,1,-0.2),abst:4};
function setzePflanze(){ if(pflanze){ scene.remove(pflanze); } seed=13; let g;
  const w=c.wuchs; g=w==='staude'?staude(c):w==='rosette'?rosette(c):w==='kriech'?kriech(c):w==='strauch'?strauch(c):w==='baum'?baum(c):w==='pilz'?pilz():w==='schilf'?schilf(c):w==='gras'?gras(c):w==='mais'?mais(c):w==='hanf'?hanf(hanfW):new T.Group();
  g.position.set(0,profil(0),-0.03); g=verschmelze(g); scene.add(g); pflanze=g; return g; }
let hanfW=true;
if(c.szene==='huegel'){ huegel(true); [[-0.55,0.1],[0,-0.6],[0.55,-0.2],[-0.2,-1.1]].forEach(([x,z],i)=>{ const s=i%2?{wuchs:'rosette',H:0.1,blaetter:14,blatt:{form:'rund',l:0.11,br:0.5,farbe:[0x5a9a30,0xa8d070],wolb:-0.2},neig:0.55,stiele:0}:{wuchs:'rosette',H:0.1,blaetter:9,blatt:{form:'oval',l:0.17,br:0.45,stiel:0.4,farbe:[0x4a6a5a,0x8aa8a0]},neig:0.45,stiele:0};
    const g=rosette(s); g.position.set(x,profil(x)+rauschen(x,z),z); g.traverse(o=>{ if(o.isMesh) o.castShadow=true; }); scene.add(g); }); sicht={ziel:new V(0,0.1,-0.5),abst:4.6}; }
else if(c.szene==='boden') sicht=bodenProfil();
else if(c.szene==='kompost') sicht=kompost();
else { huegel(false); const g=setzePflanze(); const s=(c.wuchs==='baum'?2.5:c.wuchs==='strauch'?2:c.wuchs==='pilz'?2.5:1);
  wurzelG=plattDruecken(wurzeln(c.wurzel,s),0.012); wurzelG.position.set(0,profil(0),0); scene.add(wurzelG);
  if(c.wuchs==='hanf') wurzelG.add(plattDruecken(wurzeln({typ:'pfahl',l:1.1,r:0.03,farbe:0xe2d2aa,seiten:22}),0.012));
  const box=new T.Box3(); g.updateMatrixWorld(true); g.traverse(o=>{ if(o.isMesh&&!o.isInstancedMesh){ o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } }); const gr=box.getSize(new V()), m=box.getCenter(new V()); const h=Math.max(gr.y,gr.x*0.8,0.35);
  sicht={ziel:new V(0,Math.max(m.y,0.3),-0.15),abst:Math.max(1.05,h*1.45+0.55)}; }
const dir=new V(0.5,0.38,1).normalize(); cam.position.copy(sicht.ziel).addScaledVector(dir,sicht.abst); ctl.target.copy(sicht.ziel); ctl.minDistance=0.4; ctl.maxDistance=sicht.abst*2.2;

if(legende){ const d=document.createElement('div'); d.className='d3-leg'; d.innerHTML=legende.map(([f,t])=>`<span><i style="background:#${new T.Color(f).getHexString()}"></i>${t}</span>`).join(''); ov.appendChild(d); }
/* Knoepfe */
const kn=(t,an,f)=>{ const b=document.createElement('button'); b.textContent=t; b.setAttribute('aria-pressed',an); b.onclick=()=>f(b); leiste.appendChild(b); return b; };
if(c.wuchs==='hanf'){ let bw,bm; bw=kn('♀ weiblich',true,()=>{ hanfW=true; setzePflanze(); bw.setAttribute('aria-pressed',true); bm.setAttribute('aria-pressed',false); }); bm=kn('♂ männlich',false,()=>{ hanfW=false; setzePflanze(); bm.setAttribute('aria-pressed',true); bw.setAttribute('aria-pressed',false); }); }
if(wurzelG) kn('Wurzeln',true,b=>{ const an=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',an); wurzelG.visible=an; if(bodenGruppe) bodenGruppe.visible=an; });
kn('Drehen',true,b=>{ ctl.autoRotate=!ctl.autoRotate; b.setAttribute('aria-pressed',ctl.autoRotate); });

function groesse(){ const w=el.clientWidth, h=el.clientHeight; renderer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',groesse); groesse();
let raf=0, laeuft=true; (function los(){ if(!laeuft) return; raf=requestAnimationFrame(los); ctl.update(); renderer.render(scene,cam); })();
return ()=>{ laeuft=false; cancelAnimationFrame(raf); removeEventListener('resize',groesse); ctl.dispose(); scene.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); mats.forEach(m=>m.dispose()); renderer.dispose(); };
}
return {oeffne,knoepfe,hat:id=>!!key(id),K};
})();

</script>

<script>
(function(){
const D = JSON.parse(document.getElementById('daten').textContent);
const main = document.getElementById('inhalt');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Eigene botanische Zeichnungen (SVG, ohne fremde Bildrechte) ---------- */
const IL = (()=>{
  const C={leaf:'#5a8a3a',leafD:'#3f6a27',vein:'#2f4f1d',stem:'#6a8f45',wood:'#7d6249',root:'#c9a66b',white:'#f6f3e7',whiteS:'#a9a38b',yellow:'#f4c430',yellowD:'#b98208',orange:'#f08a24',orangeD:'#b85d0f',brown:'#7a5634',berry:'#2a1f33',berryS:'#9a3b5a',green2:'#a4b85a'};
  const R=n=>Math.round(n*10)/10;
  /* --- Zeichenstil: Verläufe, Konturen, Buntstift-Struktur --- */
  let DEFS=[], GM={}, FIG='x', GN=0;
  const hex2=h=>{ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); };
  const shade=(h,p)=>{ const c=hex2(h).map(v=>Math.round(p<0?v*(1+p):v+(255-v)*p)); return '#'+c.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); };
  function lg(c0,c1,a){ const k=c0+c1+Math.round(a/15); if(GM[k]) return GM[k]; const id=FIG+'g'+(GN++), r=a*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    DEFS.push(`<linearGradient id="${id}" x1="${R(50-50*c)}%" y1="${R(50-50*s)}%" x2="${R(50+50*c)}%" y2="${R(50+50*s)}%"><stop offset="0" stop-color="${c0}"/><stop offset=".55" stop-color="${shade(c1,-0.12)}"/><stop offset="1" stop-color="${c1}"/></linearGradient>`); return GM[k]=`url(#${id})`; }
  function vg(c){ const k='v'+c; if(GM[k]) return GM[k]; const id=FIG+'g'+(GN++);
    DEFS.push(`<linearGradient id="${id}" x1="30%" y1="0%" x2="70%" y2="100%"><stop offset="0" stop-color="${shade(c,0.22)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-0.28)}"/></linearGradient>`); return GM[k]=`url(#${id})`; }
  function stil(svg){ return svg.replace(/<(path|ellipse|circle|polygon)\b([^>]*?)fill="(#[0-9a-fA-F]{3,6})"([^>]*)>/g,(m,tag,a1,col,a2)=>{ const rest=a1+a2; const st=/stroke=/.test(rest)?'':` stroke="${shade(col,-0.45)}" stroke-width=".55" stroke-opacity=".8"`; return `<${tag}${a1}fill="${vg(col)}"${a2.replace(/\/$/,'')}${st}${a2.endsWith('/')?'/':''}>`; }); }
  const STIFT=id=>`<filter id="${id}" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="d"/><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="9" result="k"/><feColorMatrix in="k" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 -1.1 0.62" result="kk"/><feComposite in="kk" in2="d" operator="in" result="korn"/><feMerge><feMergeNode in="d"/><feMergeNode in="korn"/></feMerge></filter>`;
  const rot=(pts,x,y,a)=>{a*=Math.PI/180;const c=Math.cos(a),s=Math.sin(a);return pts.map(([u,v])=>[R(x+u*c-v*s),R(y+u*s+v*c)]);};
  const P=pts=>'M'+pts.map(p=>p.join(',')).join('L')+'Z';
  const L=pts=>'M'+pts.map(p=>p.join(',')).join('L');
  const stiel=(d,w,col)=>(w>=1.4&&/^#/.test(col)?`<path d="${d}" stroke="${shade(col,-0.5)}" stroke-width="${R(w+0.9)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:'')+`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`+(w>=2.5&&/^#/.test(col)?`<path d="${d}" stroke="${shade(col,0.35)}" stroke-width="${R(w*0.25)}" fill="none" stroke-linecap="round" opacity=".6" transform="translate(-${R(w*0.2)},0)"/>`:'');
  const mk=(x,y,n)=>`<g class="mk"><circle cx="${x}" cy="${y}" r="9"/><text x="${x}" y="${y+3.6}">${n}</text></g>`;
  const boden=y=>`<path d="M8,${y} H292" class="boden"/>`;
  const lbl=(x,y,t)=>`<text class="lbl" x="${x}" y="${y}">${t}</text>`;
  function form(len,wid,o){
    const n=o.teeth?o.teeth*2:22, up=[], dn=[];
    for(let i=0;i<=n;i++){ const t=i/n; let w;
      if(o.heart) w=wid*Math.pow(Math.sin(Math.PI*(0.2+0.8*t)),0.8);
      else if(o.spatel) w=wid*Math.pow(Math.sin(Math.PI*Math.pow(t,1.6)),0.7);
      else w=wid*Math.pow(Math.sin(Math.PI*Math.pow(t,o.shape||0.75)),0.85);
      if(o.teeth&&i%2===1&&t<0.96) w*=(o.deep||1.16);
      up.push([R(t*len),R(-w)]); dn.push([R(t*len),R(w)]); }
    const pts=up.concat(dn.reverse()); if(o.heart) pts.unshift([R(len*0.08),0]); return pts;
  }
  function blatt(x,y,len,wid,a,o={}){
    const f0=o.fill||C.leaf, ader=shade(f0,0.45);
    let g=`<path d="${P(rot(form(len,wid,o),x,y,a))}" fill="${lg(shade(f0,-0.38),shade(f0,0.2),a)}" stroke="${shade(o.stroke||f0,-0.55)}" stroke-width=".8" stroke-linejoin="round"/>`;
    g+=`<path d="${P(rot(form(len,wid*0.42,o).map(([u,v])=>[u*0.9+len*0.04,v-wid*0.3]),x,y,a))}" fill="${shade(f0,0.35)}" opacity=".18"/>`;
    g+=`<path d="${L(rot([[0,0],[len*0.92,0]],x,y,a))}" stroke="${ader}" stroke-width="${R(Math.max(.6,wid*0.05))}" fill="none" opacity=".75"/>`;
    if(o.nerven){ for(const v of [-0.4,0.4]) g+=`<path d="${L(rot([[len*0.04,0],[len*0.5,v*wid],[len*0.92,0]],x,y,a))}" stroke="${ader}" stroke-width=".6" fill="none" opacity=".6"/>`; }
    else if(o.adern!==false){ for(let k=1;k<=4;k++){ const t=k/5*0.88; for(const s of [-1,1]) g+=`<path d="${L(rot([[len*t,0],[len*(t+0.13),s*wid*0.68]],x,y,a))}" stroke="${ader}" stroke-width=".5" fill="none" opacity=".55"/>`; } }
    return g;
  }

    hanf_hormone(){ let g=`<defs><marker id="hh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="var(--muted)"/></marker></defs>`;

    hanf_spektrum(){ let g=`<defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#5a2a8a"/><stop offset=".12" stop-color="#3a2aca"/><stop offset=".28" stop-color="#1a8ae0"/><stop offset=".40" stop-color="#2ac04a"/><stop offset=".52" stop-color="#e8e02a"/><stop offset=".62" stop-color="#f08a1a"/><stop offset=".76" stop-color="#e02a1a"/><stop offset=".9" stop-color="#7a0a0a"/><stop offset="1" stop-color="#3a0505"/></linearGradient></defs>`;

/* ---------- Fotos: im Kompendium hinterlegt oder lokal auf diesem Gerät ---------- */
const FOTO = (()=>{
  let dbp=null;
  const db=()=>dbp||(dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('quellwissen',1); r.onupgradeneeded=()=>{ const s=r.result.createObjectStore('fotos',{keyPath:'id'}); s.createIndex('seite','seite'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }));
  const tx=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{ const t=d.transaction('fotos',mode); const out=fn(t.objectStore('fotos')); t.oncomplete=()=>res(out&&out.result); t.onerror=()=>rej(t.error); }));
  return {
    liste:seite=>tx('readonly',s=>s.index('seite').getAll(seite)).catch(()=>[]),
    add:(seite,blob,text)=>tx('readwrite',s=>s.put({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),seite,blob,text,datum:new Date().toISOString()})),
    del:id=>tx('readwrite',s=>s.delete(id)),
    klein:file=>new Promise(res=>{ const u=URL.createObjectURL(file), img=new Image(); img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>res(b||file),'image/jpeg',0.85); }; img.onerror=()=>{ URL.revokeObjectURL(u); res(file); }; img.src=u; })
  };
})();
function fotoBereich(seite, fotos){

  return `<section class="fotos" data-seite="${esc(seite)}"><div class="fotos-kopf"><h3>Fotos</h3><label class="knopf">+ Foto hinzufügen<input type="file" accept="image/*" multiple hidden></label></div>

    <p class="klein leer"${fest?' hidden':''}>Noch keine Fotos. Füge eigene hinzu – sie bleiben auf diesem Gerät. Damit ein Foto für alle im Kompendium erscheint, schick es an Claude.</p></section>`;
}
async function initFotos(){
  const sec=main.querySelector('.fotos'); if(!sec) return;

  const zeigen=async()=>{ gal.querySelectorAll('.lokal').forEach(n=>{ const i=n.querySelector('img'); if(i) URL.revokeObjectURL(i.src); n.remove(); });
    const lst=await FOTO.liste(seite);
    for(const f of lst){ const u=URL.createObjectURL(f.blob); const fig=document.createElement('figure'); fig.className='foto lokal';
      fig.innerHTML=`<button class="foto-btn" data-src="${u}" data-text="${esc(f.text||'')}"><img src="${u}" alt="${esc(f.text||'Eigenes Foto')}"></button><figcaption>${esc(f.text||'Eigenes Foto')}<span>nur auf diesem Gerät</span></figcaption><button class="foto-weg" data-id="${f.id}">Entfernen</button>`;
      gal.appendChild(fig); }
    leer.hidden = gal.children.length>0; };
  sec.querySelector('input[type=file]').addEventListener('change', async ev=>{ const files=[...ev.target.files]; ev.target.value='';
    for(const file of files){ try{ await FOTO.add(seite, await FOTO.klein(file), file.name.replace(/\.[^.]+$/,'')); }catch(e){ leer.hidden=false; leer.textContent='Speichern ist in diesem Browser nicht möglich (z. B. privates Fenster). Schick das Foto an Claude.'; } }
    zeigen(); });
  gal.addEventListener('click', async ev=>{ const w=ev.target.closest('.foto-weg');
    if(w){ if(w.dataset.ok){ try{ await FOTO.del(w.dataset.id); }catch(e){} zeigen(); } else { w.dataset.ok='1'; w.textContent='Wirklich entfernen?'; } return; }
    const b=ev.target.closest('.foto-btn'); if(b) lightbox(b.dataset.src,b.dataset.text); });
  zeigen();
}

function kopfBereich(p){

function inline(t){
  let s = esc(t);
  s = s.replace(/\[([^\]]{2,}?)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\[(W|T|A)\]/g,(m,k)=>badge(k));
  s = s.replace(/\{\{(b|s|p|a|g):([^|}]+)\|([^}]+)\}\}/g,(m,teil,id,txt)=>{
    const h = teil==='p' ? id.replace('#','-') : teil+'-'+id;
    return `<a href="#${h}">${txt}</a>`;
  });
  return s;
}
function zielLink(ref){ // "p01#rezepte-salz"

    }
  }
  return `<a href="#${pid}${rest?'-'+rest:''}">${esc(label)}</a>`;
}

/* ---------- Suchindex ---------- */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
const kurz = s => norm(s).replace(/(.)\1+/g,'$1'); // Brennessel = Brennnessel
const index = [];
function add(label, art, wo, hash, extra){
  const text = [label, extra||''].join(' ');
  index.push({label, art, wo, hash, n:norm(text), k:kurz(text), nl:norm(label)});
}
D.pflanzen.forEach(p=>{

    add(p.name+' · '+r.titel,'Reiter',p.nr,p.id+'-'+r.id,'');
    r.bloecke.forEach(b=>{
      if(b.typ==='karten') b.eintraege.forEach(e=>add(e.titel, b.art==='rezept'?'Rezept':'Anwendung', p.name+' · '+r.titel, p.id+'-'+r.id+'-'+e.id, [e.kurz||'',...(e.zutaten||[])].join(' ')));
      if(b.typ==='abschnitt') add(b.titel,'Abschnitt',p.name+' · '+r.titel,p.id+'-'+r.id,(b.liste||b.nummern||[]).join(' '));
    });

});
function addKapitel(e, pre, art, teilName){
  add(e.titel, art, teilName, pre+e.id, [(e.stichworte||[]).join(' '), e.text||''].join(' '));
  (e.reiter||[]).forEach(r=>{
    add(e.titel+' · '+r.titel,'Reiter',teilName,pre+e.id+'-'+r.id,'');
    r.bloecke.forEach(b=>{
      if(b.typ==='karten') b.eintraege.forEach(x=>add(x.titel,'Eintrag',e.titel+' · '+r.titel,pre+e.id+'-'+r.id+'-'+x.id,[x.kurz||'',...(x.zutaten||[])].join(' ')));
      if(b.typ==='abschnitt') add(b.titel.replace(/^\d+\.\s*/,''),'Abschnitt',e.titel+' · '+r.titel,pre+e.id+'-'+r.id,(b.liste||b.nummern||[]).join(' '));
    });
  });
}

function suchen(q){
  const n = norm(q.trim()), k = kurz(q.trim());
  if(n.length<2) return [];
  return index.map(e=>{
    let score = 0;
    if(e.nl.startsWith(n)) score = 4; else if(e.nl.includes(n)) score = 3;
    else if(e.k.includes(k) && kurz(e.label).includes(k)) score = 2.5;
    else if(e.n.includes(n) || e.k.includes(k)) score = 1;
    return {e,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || a.e.label.length-b.e.label.length).slice(0,12).map(x=>x.e);
}

  if(ev.key==='Enter' && aktiv>=0){ ev.preventDefault(); waehle(aktuelle[aktiv].hash); }
  if(ev.key==='Escape'){ liste.hidden = true; }
});

function block(b, pid, rid){
  if(b.typ==='text') return `<p>${inline(b.text)}</p>`;
  if(b.typ==='hinweis') return `<p class="hinweis">${inline(b.text)}</p>`;
  if(b.typ==='abschnitt'){
    const items = b.liste ? `<ul>${b.liste.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>` : `<ol>${b.nummern.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>`;
    return `<section class="abschnitt"><h3>${esc(b.titel)}</h3>${items}</section>`;
  }
  if(b.typ==='tabelle') return `<div class="tab-wrap"><table><thead><tr>${b.kopf.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.zeilen.map(z=>`<tr>${z.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.typ==='illu') return IL.figur(b.id, b.titel);
  if(b.typ==='standort') return standortBlock(b);
  if(b.typ==='baum') return baumBlock(b);
  if(b.typ==='nachbarcheck') return nachbarBlock(b);
  if(b.typ==='schichten'){
    const n = b.eintraege.length;
    return `<figure class="schnitt" aria-label="${esc(b.titel)}"><figcaption class="unter">${esc(b.titel)}</figcaption>
      ${b.eintraege.map(([name,dicke,info],i)=>`<div class="lage lage-${i}" style="--w:${Math.round(42+58*i/(n-1))}%"><span class="lage-name">${esc(name)}</span><span class="lage-dicke">${esc(dicke)}</span><span class="lage-info">${esc(info)}</span></div>`).join('')}
      <div class="grund">gewachsener Boden</div></figure>`;
  }
  if(b.typ==='quellen') return `<ul class="stack" style="padding-left:1.2em;margin:0">${b.eintraege.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul>`;
  if(b.typ==='karten'){
    const f = `<div class="filter" role="group" aria-label="Filter">${b.filter.map(([k,l],i)=>`<button data-f="${k}" aria-pressed="${i===0}">${esc(l)}</button>`).join('')}</div>`;
    const k = b.eintraege.map(e=>{
      const meta = b.art==='rezept' ? `<span>${esc(e.menge)}</span><span>${esc(e.zeit)}</span>`
        : b.art==='buch' ? `<span><strong>${esc(e.jahr)}</strong></span><span>${esc(e.verlag)}</span>`
        : `${badge(e.beleg)}<span>${esc(e.teil)}</span>`;
      const l1 = {rezept:'Zutaten',buch:'Angaben'}[b.art]||'Du brauchst', l2 = {rezept:'Zubereitung',buch:'Kernaussagen'}[b.art]||'So geht’s';
      return `<article class="karte" id="${pid}-${rid}-${e.id}" data-kat="${e.kat}">

        <div class="koerper" hidden>

          <div class="unter">${l2}</div>${b.art==='buch'?'<ul>':'<ol>'}${e.schritte.map(z=>`<li>${inline(z)}</li>`).join('')}${b.art==='buch'?'</ul>':'</ol>'}

function autoBaum(p,pre){
  const kn=p.reiter.map(r=>{ const k=[]; r.bloecke.forEach(b=>{

      else if(b.typ==='karten') b.eintraege.forEach(e=>k.push({t:e.titel,h:'#'+pre+'-'+r.id+'-'+e.id}));
      else if(b.typ==='illu' && b.titel) k.push({t:'🖉 '+b.titel});
      else if(b.typ==='baum') k.push({t:'Themenbaum'});
      else if(b.typ==='nachbarcheck') k.push({t:'Nachbar-Check'});
      else if(b.typ==='standort') k.push({t:'Standort: Licht, Wasser, Nährstoffe'}); });
    const max=7, rest=k.length-max; return {t:r.titel,h:'#'+pre+'-'+r.id,k:rest>1?k.slice(0,max).concat([{t:`+ ${rest} weitere`,h:'#'+pre+'-'+r.id}]):k}; });

function initNachbar(){
  main.querySelectorAll('.nachbar').forEach(n=>{
    const K=JSON.parse(n.dataset.k), A=n.querySelector('.nb-a'), Bs=n.querySelector('.nb-b'), out=n.querySelector('.nb-ergebnis'), li=n.querySelector('.nb-listen');
    const chip=(t,c)=>`<button type="button" class="nb-chip ${c}" data-n="${esc(t)}">${esc(t)}</button>`;
    const go=()=>{ const a=A.value, b=Bs.value, ka=K[a], kb=K[b]; let urteil='neutral', row=null;
      if(a===b && !(ka.schlecht.includes(a))){ urteil='neutral'; }
      if(ka.gut.includes(b)){ urteil='gut'; row=ka; } else if(ka.schlecht.includes(b)){ urteil='schlecht'; row=ka; }
      else if(kb&&kb.gut.includes(a)){ urteil='gut'; row=kb; } else if(kb&&kb.schlecht.includes(a)){ urteil='schlecht'; row=kb; }
      const titel={gut:'Gute Nachbarn',schlecht:'Schlechte Nachbarn',neutral:'Keine bekannte Wechselwirkung'}[urteil];
      out.className='nb-ergebnis nb-'+urteil;
      out.innerHTML=`<div class="nb-icon">${{gut:'✓',schlecht:'✕',neutral:'–'}[urteil]}</div><div><strong>${esc(a)} + ${esc(b)}: ${titel}</strong><p>${row?inline(row.warum)+' <span class="klein">'+inline(row.beleg)+'</span>':'Meist unproblematisch. Achte trotzdem auf Licht, Platz, Wurzeltiefe und Fruchtfolge.'}</p></div>`;
      li.innerHTML=`<div><span class="eyebrow">Gut zu ${esc(a)}</span>${ka.gut.map(t=>chip(t,'gut')).join('')||' –'}</div><div><span class="eyebrow">Nicht zu ${esc(a)}</span>${ka.schlecht.map(t=>chip(t,'schlecht')).join('')||' –'}</div>`; };
    A.addEventListener('change',go); Bs.addEventListener('change',go);
    li.addEventListener('click',e=>{ const c=e.target.closest('.nb-chip'); if(c){ Bs.value=c.dataset.n; go(); } });
    go();
  });
}
function oeffne(karte, an){

const TEILFARBE={P:'var(--c-p)',S:'var(--c-s)',G:'var(--c-g)',B:'var(--c-b)',A:'var(--c-a)'};
function uebersicht(){

   {k:'B',t:'Biochemie',h:'#teil-B',g:[['Themen',D.biochemie.filter(e=>e.reiter).map(e=>[e.titel,'#b-'+e.id,e.illu])],['Wirkstoffe',[[`Alle Stoffe von A bis Z`,'#teil-B']],D.biochemie.filter(e=>!e.reiter).length]]},
   {k:'A',t:'Autoren',h:'#teil-A',g:[['Porträts',D.autoren.map(a=>[a.name.replace('Dr. ',''),'#a-'+a.id])]]}];
  const zweig=([t,href,illu])=>`<li><a href="${href}">${illu&&IL.has(illu)?`<span class="bm-mini">${IL.mini(illu,t)}</span>`:'<span class="bm-punkt"></span>'}<span>${esc(t)}</span></a></li>`;

function startSeite(){
  main.innerHTML = `
  <div class="stack"><div class="eyebrow">Quellwissen</div><h1>Kompendium für Natur, Selbstversorgung und Gesundheit</h1>

  ${legende()}`;
  if(innerWidth<760) main.querySelectorAll('.bm details').forEach(d=>d.open=false);

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let teil = null;
  if(!h || h==='start') startSeite();
  else if(h.startsWith('teil-')){ teil = h.slice(5); teilSeite(teil); }
  else if(h.startsWith('b-')){
    teil='B'; const rest = h.slice(2);
    const k = D.biochemie.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 'b-'+k.id, 'B'); }
    else teilSeite('B', rest);
  }
  else if(h.startsWith('g-')){
    teil='G'; const rest = h.slice(2);
    const k = D.getreide.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 'g-'+k.id, 'G'); }
    else teilSeite('G', rest);
  }
  else if(h.startsWith('s-')){
    teil='S'; const rest = h.slice(2);
    const k = D.selbstversorgung.find(e=>e.reiter && (rest===e.id || rest.startsWith(e.id+'-')));
    if(k){ const [rid,...e] = rest.slice(k.id.length+1).split('-'); pflanzenSeite(k, rid, e.join('-'), 's-'+k.id, 'S'); }
    else teilSeite('S', rest);
  }
  else if(h.startsWith('a-')){
    teil='A'; const rest = h.slice(2);
    const a = D.autoren.find(e=>rest===e.id || rest.startsWith(e.id+'-'));
    if(a){ const [rid,...e] = rest.slice(a.id.length+1).split('-'); pflanzenSeite(a, rid, e.join('-'), 'a-'+a.id, 'A'); }
    else teilSeite('A');
  }
  else {
    const [pid, rid, ...rest] = h.split('-');
    const p = D.pflanzen.find(x=>x.id===pid);
    if(p){ teil='P'; pflanzenSeite(p, rid, rest.join('-')); } else startSeite();
  }
  document.querySelectorAll('.teile button').forEach(b=>b.setAttribute('aria-current', b.dataset.ziel==='teil-'+teil));
}
addEventListener('hashchange', route);
route();
})();
</script>
