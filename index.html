ilpflanze des Jahres","2024 (Naturheilverein Theophrastus)"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"holunder_d","titel":"Detailtafel"},{"typ":"standort","licht":3,"wasser":3,"naehrstoffe":5,"ph":"indifferent","boden":"humos, Waldränder, Hecken, Hofnähe","ellenberg":"L7 F5 R– N9","hinweis":"Stickstoffzeiger; wächst gern am Kompost."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Wuchs:** mehrstämmiger Strauch mit überhängenden Zweigen.","**Rinde:** graubraun, mit hellen Korkwarzen; junge Zweige mit weißem, weichem Mark.","**Blätter:** gegenständig, unpaarig gefiedert mit 5–7 gesägten Fiederblättern, riechen beim Zerreiben unangenehm.","**Blüten:** viele kleine, cremeweiße Sternblüten in flachen Schirmrispen bis 20 cm, süßer Duft.","**Früchte:** schwarzviolette Steinbeeren an rot werdenden, hängenden Dolden."]},{"typ":"hinweis","text":"**Verwechslung mit Zwergholunder (Attich, Sambucus ebulus):** Attich ist giftig und krautig, nur 1–2 m hoch, stirbt im Winter ab. Seine Fruchtstände stehen aufrecht, die Blüten haben rötliche Staubbeutel. Der Schwarze Holunder ist verholzt und seine reifen Dolden hängen. Auch Roter Holunder (Traubenholunder) mit roten Beeren in Trauben ist roh giftig."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**April:** Blattaustrieb.","**Mai–Juni:** Blüte; Ernte für Sirup und Tee an trockenen, sonnigen Vormittagen.","**August–September:** Beerenreife, wenn alle Beeren der Dolde schwarz sind.","**Herbst–Winter:** Laubfall; Stecklinge schneiden."]},{"typ":"abschnitt","titel":"Standort","liste":["Waldränder, Hecken, Bachufer, Schuttplätze, alte Höfe.","Stickstoffzeiger; wächst gern dort, wo Menschen leben.","Früher stand an fast jedem Bauernhaus ein Holunder als Hausbaum. Im Volksglauben wohnte darin Frau Holle, die Schützerin von Haus und Hof [A]."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Blüten und Beeren unterscheiden sich stark: Die Blüten liefern Flavonoide und Duftstoffe, die Beeren Farbstoffe und Vitamine. Samen und grüne Teile enthalten Sambunigrin."},{"typ":"tabelle","kopf":["Pflanzenteil","Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Blüten","Flavonoide","Rutin, Quercetin, Isoquercitrin","{{b:flavonoide|Flavonoide}}"],["Blüten","Phenolsäuren, ätherisches Öl","Chlorogensäure; Duftstoffe","–"],["Beeren","Farbstoffe","Anthocyane (Sambucyanin u. a.)","{{b:anthocyane|Anthocyane}}"],["Beeren","Vitamine, Mineralstoffe","Vitamin C, B-Vitamine, Kalium","–"],["Beeren","Gerbstoffe, Fruchtsäuren","–","–"],["Samen, unreife Beeren, Blätter, Rinde","cyanogene Glykoside","Sambunigrin","{{b:sambunigrin|Sambunigrin}}"]]},{"typ":"text","text":"Quelle: [PTAheute](https://www.ptaheute.de/serien/heimische-heilpflanzen/holunder-trendaroma-und-erkaeltungsdroge)."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Holunderblütentee ist als traditionelles Arzneimittel bei den ersten Anzeichen einer Erkältung anerkannt. Er wirkt schweißtreibend."},{"typ":"tabelle","kopf":["Wirkung","Teil","Einordnung"],"zeilen":[["Schweißtreibend bei beginnender Erkältung","Blüten","[W] HMPC traditionell"],["Schleimlösend","Blüten (in Kombipräparaten)","[W] als Bestandteil von Fertigarzneimitteln"],["Stärkt die Abwehrkräfte","Beerensaft","[T] Volksheilkunde; Laborstudien zu Anthocyanen"],["Antioxidativ","Beeren (Anthocyane)","[W] im Labor"],["Blutreinigend, krampflösend","Blüten, Beeren","[T] Volksheilkunde"],["Bei Hautunreinheiten, Rheuma, Verstopfung","Beeren, Blüten","[T] Volksheilkunde"],["Mildes Abführmittel","Beerenmus","[T] Volksheilkunde"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Der klassische Weg bei Frösteln und Kratzen im Hals: heißen Holunderblütentee trinken und ins Bett, damit man schwitzt."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"schwitztee","titel":"Holunderblüten-Schwitztee","kat":"innerlich","beleg":"W","teil":"getrocknete Blüten","kurz":"Bei ersten Erkältungszeichen, heiß getrunken.","zutaten":["2–5 g getrocknete Blüten (1–2 TL)","150 ml kochendes Wasser"],"schritte":["Übergießen, 5–10 Minuten zugedeckt ziehen lassen.","Mehrmals am Tag eine Tasse so heiß wie möglich trinken, Tagesmenge 10–15 g Blüten.","Danach warm zudecken und schwitzen."],"hinweis":"Bei Fieber über 39 °C oder Beschwerden länger als eine Woche zum Arzt."},{"id":"lindenmischung","titel":"Erkältungsmischung mit Linde","kat":"innerlich","beleg":"T","teil":"Blüten","kurz":"Klassische Hausmischung zum Schwitzen.","zutaten":["gleiche Teile Holunderblüten und Lindenblüten","nach Wunsch etwas Thymian"],"schritte":["1–2 TL der Mischung pro Tasse heiß aufgießen.","10 Minuten ziehen lassen, mit Honig heiß trinken."]},{"id":"beerensaft","titel":"Holunderbeersaft zur Abwehr","kat":"innerlich","beleg":"T","teil":"Beeren, erhitzt","kurz":"Im Herbst und Winter täglich ein kleines Glas.","zutaten":["selbst gemachter oder gekaufter Muttersaft (siehe Rezepte)"],"schritte":["Täglich 50–100 ml, pur oder mit Wasser verdünnt.","Heiß mit Honig und Zimt als Punsch bei Erkältung."],"hinweis":"Nur erhitzten Saft verwenden."},{"id":"gurgeln","titel":"Gurgellösung","kat":"innerlich","beleg":"T","teil":"Blüten","kurz":"Bei Halskratzen.","zutaten":["starker Holunderblütentee (2 TL pro Tasse)"],"schritte":["Lauwarm mehrmals täglich gurgeln."]},{"id":"augenkompresse","titel":"Kompresse für müde Augen","kat":"aeusserlich","beleg":"T","teil":"Blüten","kurz":"Kühlender Umschlag nach altem Hausbrauch.","zutaten":["abgekühlter Blütentee","2 Wattepads"],"schritte":["Pads tränken und 10 Minuten auf die geschlossenen Augen legen."],"hinweis":"Tee frisch zubereiten und abseihen; bei Augenentzündung zum Arzt."}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** **Storl** verbindet den Holunder mit **Frau Holle**, der alten Göttin aus dem Märchen: Der Holunderbusch am Hof galt als Wohnsitz guter Hausgeister, vor dem man den Hut zog (u. a. {{a:storl-buecher-alte-goettin|Die alte Göttin und ihre Pflanzen}}). [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Blüten: an einem sonnigen Vormittag ernten, nicht waschen, nur ausschütteln – der Pollen trägt das Aroma. Beeren: nur ganz schwarze Dolden, Stiele entfernen und immer auf über 80 °C erhitzen."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["blueten","Aus Blüten"],["beeren","Aus Beeren"],["getraenke","Getränke"]],"eintraege":[{"id":"sirup","titel":"Holunderblütensirup","kat":"blueten","menge":"ca. 2,5 l","zeit":"20 Min. + 2 Tage","zutaten":["20–25 Blütendolden","2 l Wasser","2 kg Zucker","2 Bio-Zitronen","40 g Zitronensäure (Apotheke)"],"schritte":["Zucker im Wasser aufkochen, abkühlen lassen.","Zitronen in Scheiben schneiden.","Dolden, Zitronen und Zitronensäure in einen großen Topf, mit dem Zuckersirup übergießen.","Zugedeckt 2 Tage kühl ziehen lassen, täglich umrühren.","Durch ein Tuch abseihen, aufkochen, heiß in saubere Flaschen füllen."],"tipp":"Kühl und dunkel etwa ein Jahr haltbar. Mit Wasser, Sekt oder als Hugo."},{"id":"kuechle","titel":"Holunderküchle (ausgebackene Blüten)","kat":"blueten","menge":"4 Portionen","zeit":"20 Min.","zutaten":["12 Blütendolden mit Stiel","200 g Mehl","2 Eier","250 ml Milch oder Bier","1 EL Zucker, Prise Salz","Öl zum Ausbacken, Puderzucker, Zimt"],"schritte":["Teig aus Mehl, Eiern, Milch, Zucker und Salz rühren, 15 Minuten quellen lassen.","Dolden am Stiel in den Teig tauchen, abtropfen lassen.","In heißem Öl kopfüber goldgelb backen.","Dicke Stiele abschneiden, mit Puderzucker und Zimt bestreuen."],"tipp":"Dazu passt Apfel- oder Holunderbeerenmus."},{"id":"limo","titel":"Holunderblüten-Limonade","kat":"getraenke","menge":"2 l","zeit":"10 Min. + 1 Tag","zutaten":["6 Blütendolden","2 l Wasser","1 Bio-Zitrone","4 EL Zucker oder Honig","Minze nach Wunsch"],"schritte":["Alles in einen Krug geben.","24 Stunden kühl ziehen lassen, abseihen.","Eiskalt servieren."]},{"id":"holundersekt","titel":"Holunderblüten-Spritz (gegoren)","kat":"getraenke","menge":"ca. 5 l","zeit":"20 Min. + 1–2 Wochen","zutaten":["10 Blütendolden","5 l Wasser","600 g Zucker","2 Bio-Zitronen","2 EL Weißweinessig"],"schritte":["Zucker in warmem Wasser lösen, abkühlen lassen.","Dolden, Zitronenscheiben und Essig zugeben, abgedeckt 3–5 Tage stehen lassen, bis es zu sprudeln beginnt.","Abseihen, in Bügelflaschen füllen.","Kühl lagern und innerhalb von 2 Wochen trinken; Flaschen täglich kurz entlüften."],"tipp":"Natürliche Hefen sorgen für Kohlensäure; enthält wenig Alkohol. Flaschen können bei Wärme platzen."},{"id":"blueten-gelee","titel":"Holunderblütengelee","kat":"blueten","menge":"5 Gläser","zeit":"30 Min. + 1 Nacht","zutaten":["10 Blütendolden","750 ml Apfelsaft","500 g Gelierzucker 2:1","Saft einer Zitrone"],"schritte":["Dolden im Apfelsaft über Nacht ziehen lassen, abseihen.","Mit Gelierzucker und Zitrone 4 Minuten sprudelnd kochen, heiß abfüllen."]},{"id":"saft","titel":"Holunderbeersaft","kat":"beeren","menge":"je nach Menge","zeit":"1–2 Std.","zutaten":["vollreife Beerendolden","Dampfentsafter oder großer Topf und Tuch","nach Wunsch Zucker oder Äpfel"],"schritte":["Beeren mit einer Gabel von den Stielen streifen.","Im Dampfentsafter etwa 1 Stunde entsaften.","Oder Beeren mit wenig Wasser 10 Minuten kochen und durch ein Tuch pressen.","Heiß (über 80 °C) in saubere Flaschen füllen."],"tipp":"Grüne Stiele und unreife Beeren gründlich aussortieren."},{"id":"beeren-gelee","titel":"Holunderbeergelee","kat":"beeren","menge":"5 Gläser","zeit":"20 Min.","zutaten":["750 ml Holunderbeersaft","500 g Gelierzucker 2:1","Saft einer Zitrone","nach Wunsch 1 Zimtstange"],"schritte":["Saft mit Gelierzucker, Zitrone und Zimt aufkochen.","4 Minuten sprudelnd kochen, Zimt entfernen, heiß abfüllen."]},{"id":"fliederbeersuppe","titel":"Fliederbeersuppe","kat":"beeren","menge":"4 Portionen","zeit":"30 Min.","zutaten":["500 ml Holunderbeersaft","250 ml Wasser","2 Äpfel","1 Zimtstange, 2 Nelken","2 EL Speisestärke","Zucker nach Geschmack"],"schritte":["Saft, Wasser und Gewürze aufkochen.","Äpfel würfeln, 5 Minuten darin garen.","Stärke kalt anrühren, einrühren, aufkochen.","Mit Zucker abschmecken; klassisch mit Grießklößchen."],"tipp":"Norddeutsches Wintergericht."},{"id":"punsch","titel":"Heißer Holunderpunsch","kat":"getraenke","menge":"4 Becher","zeit":"10 Min.","zutaten":["500 ml Holunderbeersaft","250 ml Apfelsaft","1 Zimtstange, 3 Nelken","Orangenscheiben","Honig nach Geschmack"],"schritte":["Alles erhitzen, nicht kochen, 10 Minuten ziehen lassen.","Heiß trinken."]},{"id":"chutney","titel":"Holunder-Zwetschgen-Chutney","kat":"beeren","menge":"3 Gläser","zeit":"1 Std.","zutaten":["300 g Holunderbeeren (ohne Stiele)","500 g Zwetschgen","1 Zwiebel","150 g brauner Zucker","100 ml Rotweinessig","1 TL Ingwer, Salz, Chili"],"schritte":["Alle Zutaten aufkochen.","Unter Rühren 45 Minuten dicklich einkochen.","Heiß abfüllen."],"tipp":"Zu Käse und Wild."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Ein einzelner Strauch liefert Blüten für Sirup und Tee und mehrere Liter Saft. Dazu bietet er Vögeln Nahrung und Nistplätze."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["ernte","Ernte & Vorrat"]],"eintraege":[{"id":"pflanzen","titel":"Holunder pflanzen","kat":"garten","beleg":"T","teil":"Strauch","kurz":"Anspruchslos, wächst schnell, trägt nach 2–3 Jahren.","zutaten":["Jungpflanze oder Steckling","sonniger bis halbschattiger Platz, 3–4 m Raum"],"schritte":["Im Herbst oder Frühjahr pflanzen, Kompost ins Pflanzloch.","In den ersten Jahren bei Trockenheit gießen.","Ertragssorten (z. B. Haschberg) tragen besonders reich."]},{"id":"steckling","titel":"Vermehrung durch Stecklinge","kat":"garten","beleg":"T","teil":"Zweige","kurz":"Wurzelt sehr leicht – kostenlos neue Sträucher.","zutaten":["bleistiftdicke, einjährige Triebe, ca. 20 cm"],"schritte":["Im Winter schneiden, mit mindestens 2 Knospenpaaren.","Zu zwei Dritteln in lockere Erde stecken.","Feucht halten; im Frühjahr treiben sie aus."]},{"id":"schnitt","titel":"Schnitt","kat":"garten","beleg":"T","teil":"Strauch","kurz":"Holunder trägt an jungem Holz.","zutaten":["Astschere, Säge"],"schritte":["Im Winter alte, abgetragene Triebe bodennah entfernen.","8–10 kräftige Triebe stehen lassen."]},{"id":"blueten-trocknen","titel":"Blüten für Tee trocknen","kat":"ernte","beleg":"T","teil":"Blüten","kurz":"Für den Erkältungstee im Winter.","zutaten":["frisch aufgeblühte Dolden"],"schritte":["Dolden kopfüber oder auf Gitter im Schatten trocknen.","Getrocknete Blüten abrebeln, Stiele entfernen.","Luftdicht und dunkel lagern ({{s:trocknen|Kräuter trocknen}})."]},{"id":"vogelschutz","titel":"Vogelgehölz","kat":"garten","beleg":"W","teil":"ganze Pflanze","kurz":"Die Beeren sind Futter für über 60 Vogelarten (häufig genannte Zahl).","zutaten":["Holunder in der Hecke"],"schritte":["Einen Teil der Dolden für die Vögel hängen lassen.","Mit Schlehe, Weißdorn und Hasel zur Wildhecke kombinieren."]},{"id":"jauche","titel":"Holunderblätter-Jauche","kat":"garten","beleg":"T","teil":"Blätter","kurz":"Traditionell gegen Wühlmäuse in die Gänge gegossen.","zutaten":["1 kg frische Blätter","10 l Wasser"],"schritte":["Wie {{s:jauche|Pflanzenjauche}} ansetzen und vergären.","Unverdünnt in die Gänge gießen."],"hinweis":"Wirkung nicht belegt; die Blätter sind giftig, nicht auf Gemüse gießen."}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"hinweis","text":"**Nie roh:** Rohe, unreife Beeren, Samen, Blätter, Rinde und grüne Stiele enthalten Sambunigrin, aus dem im Körper Blausäure entstehen kann. Roh gegessen drohen Übelkeit, Erbrechen und Durchfall. Beeren immer auf über 80 °C erhitzen; Blüten ohne grobe Stiele verwenden."},{"typ":"abschnitt","titel":"Weitere Hinweise","liste":["Nur Schwarzen Holunder sammeln; Attich (Zwergholunder) ist giftig ({{p:p04#botanik|Botanik}}).","Roter Holunder: Fruchtfleisch nur erhitzt, Kerne stets entfernen; im Zweifel meiden.","Schwitztee belastet den Kreislauf; bei Herzschwäche vorsichtig sein.","Kinder sind empfindlicher: keine rohen Beeren, Sirup und Saft nur aus erhitzter Zubereitung.","Wechselwirkungen: keine bekannt."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["PTAheute: Holunder – Trendaroma und Erkältungsdroge","https://www.ptaheute.de/serien/heimische-heilpflanzen/holunder-trendaroma-und-erkaeltungsdroge"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte. Noch offen: weitere Primärquellen (HMPC-Monographie Sambuci flos), Fotos zum Vergleich mit Attich."}]}]},{"id":"p05","nr":"P-05","illu":"ringelblume","fotos":[],"name":"Ringelblume","botan":"Calendula officinalis L.","volksnamen":["Calendula","Studentenblume (regional)","Totenblume","Goldblume"],"kurz":"Die Wundblume des Bauerngartens: Ringelblumensalbe ist eines der bekanntesten Hausmittel überhaupt. Die Blüten färben und würzen Speisen, und im Beet hält sie den Boden gesund.","steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","einjährig, sät sich selbst aus"],["Größe","30–60 cm"],["Blütezeit","Juni bis zum ersten Frost"],["Sammelzeit","laufend, voll geöffnete Blüten an trockenen Vormittagen"],["Verwendete Teile","Blüten (ganze Körbe oder Zungenblüten)"],["Arzneidroge","Ringelblumenblüten (Calendulae flos), HMPC, ESCOP, Kommission E"],["Name","Calendula von lateinisch calendae (Monatsanfang): Sie blüht fast jeden Monat"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"ringelblume_d","titel":"Detailtafel"},{"typ":"standort","licht":5,"wasser":3,"naehrstoffe":3,"ph":"pH 6–7,5","boden":"durchlässiger Gartenboden","ellenberg":"Kulturpflanze","hinweis":"Sät sich selbst aus; zu viel Stickstoff macht sie mastig und anfällig für Mehltau."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** verzweigt, kantig, drüsig behaart und etwas klebrig.","**Blätter:** länglich-spatelförmig, weich, wechselständig.","**Blüten:** leuchtend orange bis gelbe Körbe, 4–7 cm, schließen sich bei Regen und abends.","**Samen:** gekrümmt wie kleine Ringe oder Würmer – daher der Name Ringelblume.","**Duft:** würzig-harzig beim Zerreiben."]},{"typ":"hinweis","text":"**Verwechslung:** Studentenblumen (Tagetes) heißen regional ebenfalls Studentenblume, sind aber eine andere Gattung mit stark riechenden, gefiederten Blättern und nicht für Salben gedacht. Die Ringelblume erkennt man an den ganzrandigen Blättern und den ringförmigen Samen."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März–Mai:** Aussaat direkt ins Beet; Keimung nach 1–2 Wochen.","**Juni:** erste Blüten.","**Bis zum Frost:** Wer laufend erntet, bekommt ständig neue Blüten.","**Herbst:** Samen reifen und fallen aus; im nächsten Jahr kommen Sämlinge von allein."]},{"typ":"abschnitt","titel":"Standort","liste":["Sonnig, jeder normale Gartenboden.","Ursprünglich aus dem Mittelmeerraum, in Mitteleuropa seit dem Mittelalter Gartenpflanze.","Schon Hildegard von Bingen beschrieb sie [T]."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Die Wirkung auf die Haut wird vor allem den Triterpenen zugeschrieben, die Farbe den Carotinoiden."},{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Triterpenalkohole und -saponine","Faradiol-Ester, Calenduloside","{{b:saponine|Saponine}}"],["Farbstoffe","Beta-Carotin, Lycopin, Lutein","{{b:carotinoide|Carotinoide}}"],["Flavonoide","Isorhamnetin- und Quercetin-Glykoside","{{b:flavonoide|Flavonoide}}"],["Bitterstoffe","Calendulin","{{b:bitterstoffe|Bitterstoffe}}"],["Ätherisches Öl, Polysaccharide","–","–"]]},{"typ":"text","text":"Quelle: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/calendulae-flos-22130). Fettlösliche Stoffe wie Carotinoide und Faradiol gehen besser in Öl und Salbe über als in Tee."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Die Ringelblume ist bei leichten Hautentzündungen, kleinen Wunden und Entzündungen im Mund- und Rachenraum anerkannt."},{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Leichte Hautentzündungen, kleine Wunden","Salbe, Umschlag","[W] HMPC, ESCOP"],["Entzündungen in Mund und Rachen","Spülung, Gurgeln","[W] HMPC, ESCOP, Kommission E, WHO"],["Schlecht heilende Wunden","Salbe, Umschlag","[W] Kommission E"],["Abschwellend, entzündungshemmend, fördert Granulation","äußerlich","[W] Labor- und Tierstudien"],["Bei Unterschenkelgeschwüren","äußerlich","[W] Belege fehlen laut Altmeyers"],["Wunder Babypo, Sonnenbrand, Ekzeme, Hautpflege nach Bestrahlung","äußerlich","[T] Erfahrungsheilkunde"],["Krampflösend, menstruationsfördernd, für Leber und Galle","innerlich","[T] Volksheilkunde"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Am bekanntesten ist die Salbe. Für Wunden eignet sich auch ein Umschlag mit kräftigem Tee."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["salben","Salben & Öle"],["umschlag","Umschläge & Spülungen"]],"eintraege":[{"id":"salbe-fett","titel":"Ringelblumensalbe nach Großmutterart","kat":"salben","beleg":"T","teil":"frische Blüten","kurz":"Der Klassiker mit Schmalz – einfach, wirksam, gut haltbar im Kühlschrank.","zutaten":["250 g Schweineschmalz","2 Handvoll frische Blüten (ganze Körbe)"],"schritte":["Schmalz schmelzen, Blüten zugeben, kurz aufschäumen lassen, nicht braten.","Vom Herd nehmen, zugedeckt über Nacht stehen lassen.","Am nächsten Tag leicht erwärmen und durch ein Leinentuch abseihen.","In saubere Tiegel füllen, kühl lagern; ca. 1 Jahr haltbar."],"hinweis":"Auf trockene, kleine Wunden, Schrunden, raue Haut. Nicht auf tiefe oder eitrige Wunden."},{"id":"salbe-vegan","titel":"Ringelblumensalbe mit Öl und Bienenwachs","kat":"salben","beleg":"T","teil":"Ringelblumenöl","kurz":"Feinere Salbe aus dem Ölauszug.","zutaten":["100 ml Ringelblumenöl (siehe unten)","10–12 g Bienenwachs (vegan: Candelillawachs, ca. 7 g)","nach Wunsch 10 g Sheabutter"],"schritte":["Öl und Wachs im Wasserbad schmelzen.","Konsistenz prüfen: ein Tropfen auf kaltem Teller – mehr Wachs macht fester.","In Tiegel füllen, offen abkühlen lassen, dann verschließen."]},{"id":"oel","titel":"Ringelblumenöl (Ölauszug)","kat":"salben","beleg":"T","teil":"getrocknete Blüten","kurz":"Grundlage für Salben, Massage- und Babyöl.","zutaten":["getrocknete Blüten","Oliven- oder Mandelöl","Schraubglas"],"schritte":["Glas zu zwei Dritteln mit Blüten füllen, mit Öl vollständig bedecken.","4–6 Wochen hell und warm stehen lassen, täglich schwenken.","Abseihen, dunkel lagern."],"hinweis":"Getrocknete Blüten verwenden – frische enthalten Wasser, das Öl schimmelt."},{"id":"umschlag","titel":"Wundumschlag","kat":"umschlag","beleg":"W","teil":"Blüten","kurz":"Bei kleinen, schlecht heilenden Wunden und Hautentzündungen.","zutaten":["1–2 g Blüten (1–2 TL) pro 150 ml Wasser","sterile Kompresse"],"schritte":["Tee aufgießen, 10 Minuten ziehen lassen, gut abseihen, abkühlen lassen.","Kompresse tränken und mehrmals täglich auflegen."]},{"id":"mundspuelung","titel":"Mund- und Gurgelspülung","kat":"umschlag","beleg":"W","teil":"Blüten oder Tinktur","kurz":"Bei Zahnfleisch- und Mundschleimhautentzündung.","zutaten":["Tee wie beim Umschlag","oder 2–4 ml Tinktur auf 250–500 ml Wasser"],"schritte":["Lauwarm mehrmals täglich spülen und gurgeln.","Nicht schlucken."]},{"id":"lippenbalsam","titel":"Lippenbalsam","kat":"salben","beleg":"T","teil":"Ringelblumenöl","kurz":"Für rissige Lippen im Winter.","zutaten":["15 ml Ringelblumenöl","5 g Bienenwachs","5 g Kakaobutter"],"schritte":["Im Wasserbad schmelzen.","In kleine Döschen oder Stifthülsen füllen."]}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** Im Sinne von **Storl** gehört die Ringelblume in jeden Selbstversorgergarten: Heilpflanze, Nützlingsweide und Bodenpfleger in einem ({{a:storl-garten-mikrokosmos|Den Garten als Ganzes sehen}}). [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"In der Küche nutzt man vor allem die Zungenblüten (die Blütenblätter). Sie schmecken mild-würzig, leicht herb und färben goldgelb – deshalb der alte Name „Safran des armen Mannes“."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"],["getraenke","Getränke"]],"eintraege":[{"id":"salat","titel":"Sommersalat mit Ringelblumen","kat":"kueche","menge":"2 Portionen","zeit":"10 Min.","zutaten":["1 Kopf Pflücksalat","1 Gurke","Blütenblätter von 4–5 Blüten","Dressing aus Öl, Zitrone, Honig, Salz"],"schritte":["Salat und Gurke anrichten.","Mit Dressing mischen.","Erst kurz vor dem Servieren die Blütenblätter darüberstreuen."]},{"id":"goldreis","titel":"Goldener Reis","kat":"kueche","menge":"4 Portionen","zeit":"25 Min.","zutaten":["250 g Reis","500 ml Gemüsebrühe","2 EL getrocknete oder 4 EL frische Blütenblätter","1 Zwiebel, 1 EL Butter"],"schritte":["Zwiebel in Butter andünsten, Reis zugeben.","Mit Brühe aufgießen, Blütenblätter einrühren.","Zugedeckt 18 Minuten garen."],"tipp":"Färbt wie Safran, schmeckt aber milder."},{"id":"butter","titel":"Ringelblumen-Kräuterbutter","kat":"kueche","menge":"125 g","zeit":"10 Min.","zutaten":["125 g weiche Butter","Blütenblätter von 5 Blüten","1 EL Schnittlauch","Salz, Zitronenabrieb"],"schritte":["Alles verrühren, zur Rolle formen und kühlen."],"tipp":"Hübsch zu Brot und gegrilltem Gemüse."},{"id":"omelett","titel":"Blüten-Omelett","kat":"kueche","menge":"1 Portion","zeit":"10 Min.","zutaten":["3 Eier","1 EL Blütenblätter","Kräuter, Salz, Pfeffer","Butter"],"schritte":["Eier mit Blüten und Kräutern verquirlen.","In Butter stocken lassen, zusammenklappen."]},{"id":"suppe","titel":"Goldene Kürbissuppe","kat":"kueche","menge":"4 Portionen","zeit":"40 Min.","zutaten":["1 kg Hokkaido","1 Zwiebel","800 ml Brühe","200 ml Kokosmilch","2 EL getrocknete Blütenblätter","Ingwer, Salz"],"schritte":["Zwiebel, Ingwer und Kürbis andünsten, mit Brühe 20 Minuten kochen.","Mit Kokosmilch pürieren.","Mit Blütenblättern bestreuen."]},{"id":"salz","titel":"Ringelblumen-Kräutersalz","kat":"vorrat","menge":"1 Glas","zeit":"10 Min.","zutaten":["100 g grobes Meersalz","2 EL getrocknete Blütenblätter","1 EL getrocknete Kräuter (Thymian, Liebstöckel)"],"schritte":["Alles im Mörser grob zerstoßen.","Dunkel lagern."],"tipp":"Kombiniert mit {{p:p01#rezepte-salz|Brennnesselsalz}} zu einer bunten Würzmischung."},{"id":"essig","titel":"Ringelblumen-Essig","kat":"vorrat","menge":"500 ml","zeit":"5 Min. + 3 Wochen","zutaten":["1 Handvoll Blüten","500 ml Weißwein- oder Apfelessig"],"schritte":["Blüten in eine Flasche geben, mit Essig übergießen.","3 Wochen hell stehen lassen, abseihen."],"tipp":"Goldgelb, für Salate."},{"id":"tee","titel":"Sommerlicher Blütentee","kat":"getraenke","menge":"1 Kanne","zeit":"10 Min.","zutaten":["1 TL Ringelblumen","1 TL Pfefferminze","1 TL Zitronenmelisse"],"schritte":["Mit 500 ml heißem Wasser übergießen, 8 Minuten ziehen lassen.","Warm oder kalt trinken."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Die Ringelblume ist die ideale Einsteigerpflanze: einmal säen, jahrelang ernten. Im Gemüsebeet ist sie ein guter Nachbar."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["ernte","Ernte & Vorrat"]],"eintraege":[{"id":"aussaat","titel":"Aussaat","kat":"garten","beleg":"T","teil":"Samen","kurz":"Direkt ins Beet ab März, bis Juni nachsäen.","zutaten":["Saatgut","sonniges Beet"],"schritte":["1 cm tief säen, Abstand 25 cm.","Feucht halten, Keimung nach 1–2 Wochen.","Für Salben die ungefüllte, orangefarbene Arzneisorte wählen."]},{"id":"mischkultur","titel":"Mischkultur und Bodengesundheit","kat":"garten","beleg":"T","teil":"ganze Pflanze","kurz":"Ringelblumen sollen den Boden gegen Fadenwürmer (Nematoden) schützen und locken Nützlinge an.","zutaten":["Ringelblumen zwischen Gemüse"],"schritte":["Am Rand von Kohl-, Tomaten- und Möhrenbeeten säen.","Auf dem {{s:huegelbeet|Hügelbeet}} an die Flanken setzen.","Nach der Saison als Gründüngung einarbeiten."],"hinweis":"Die Nematoden-Wirkung ist bei Tagetes besser belegt als bei Ringelblumen."},{"id":"dauerernte","titel":"Ernten für ständige Blüte","kat":"ernte","beleg":"T","teil":"Blüten","kurz":"Je mehr man pflückt, desto mehr blüht nach.","zutaten":["Schere"],"schritte":["Voll geöffnete Blüten an trockenen Vormittagen abschneiden.","Verblühtes laufend entfernen."]},{"id":"trocknen","titel":"Blüten trocknen","kat":"ernte","beleg":"T","teil":"Blüten","kurz":"Für Tee, Öl und Würze im Winter.","zutaten":["Gitter oder Backpapier"],"schritte":["Blüten einzeln auslegen oder Blütenblätter abzupfen.","Im Schatten trocknen, bis sie rascheln.","Dunkel und luftdicht lagern ({{s:trocknen|Kräuter trocknen}})."]},{"id":"saatgut","titel":"Eigenes Saatgut","kat":"ernte","beleg":"T","teil":"Samen","kurz":"Die ringförmigen Samen sind leicht zu sammeln.","zutaten":["reife, braune Samenstände"],"schritte":["Im Spätsommer abschneiden und nachtrocknen.","In Papiertüten lagern ({{s:samen|Samen ernten}})."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Äußerlich gilt die Ringelblume als sehr gut verträglich. Das Hauptrisiko sind Allergien bei Menschen, die auf Korbblütler reagieren."},{"typ":"abschnitt","titel":"Gegenanzeigen","liste":["Bekannte Allergie gegen Korbblütler (z. B. Kamille, Arnika, Löwenzahn, Beifuß).","Schwangerschaft und Stillzeit: als Arzneimittel nicht anwenden, da Daten fehlen.","Kinder unter 6 Jahren: als Arzneimittel nicht ohne ärztlichen Rat."]},{"typ":"abschnitt","titel":"Hinweise","liste":["Bei Hautrötung, Juckreiz oder Bläschen nach dem Auftragen absetzen.","Tiefe, stark blutende, verschmutzte oder eitrige Wunden gehören zum Arzt.","Selbst gemachte Salben sauber herstellen und kühl lagern; bei verändertem Geruch entsorgen.","Wechselwirkungen: keine bekannt."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Altmeyers Enzyklopädie: Calendulae flos","https://www.altmeyers.org/de/naturheilkunde/calendulae-flos-22130"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte. Noch offen: HMPC-Monographie im Wortlaut, Fotos."}]}]},{"id":"p06","nr":"P-06","illu":"spitzwegerich","fotos":[],"name":"Spitzwegerich","botan":"Plantago lanceolata L.","volksnamen":["Wegerich","Lungenblattl","Schlangenzunge","Rossrippe"],"kurz":"Das Pflaster vom Wegesrand: Ein zerkautes Blatt auf den Mückenstich, ein Sirup gegen Reizhusten. Spitzwegerich wächst auf fast jeder Wiese und war Arzneipflanze des Jahres 2014.","steckbrief":[["Familie","Wegerichgewächse (Plantaginaceae)"],["Lebensform","ausdauernde Staude mit Blattrosette"],["Größe","10–50 cm"],["Blütezeit","Mai–September"],["Sammelzeit","Blätter April–September, am besten vor und während der Blüte"],["Verwendete Teile","Blätter (Kraut), junge Blütenknospen, Samen"],["Arzneidroge","Spitzwegerichkraut (Plantaginis lanceolatae herba), HMPC, ESCOP, Kommission E"],["Name","Wegerich = König der Wege; wächst gern auf festgetretenem Boden"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"spitzwegerich_d","titel":"Detailtafel"},{"typ":"standort","licht":4,"wasser":3,"naehrstoffe":3,"ph":"indifferent","boden":"Wiesen, Wegränder, Rasen","ellenberg":"L6 F– R– N–","hinweis":"Verträgt Tritt und Mahd."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** schmal-lanzettlich, in einer Rosette, mit 3–7 kräftigen, parallel laufenden Längsnerven.","**Fäden:** Reißt man ein Blatt quer, ziehen sich elastische Fasern aus den Nerven.","**Blütenstand:** kurze, dunkelbraune Ähre auf langem, gefurchtem Stängel; zur Blüte mit einem Kranz weißer Staubbeutel.","**Wurzel:** kurzer Wurzelstock mit vielen Faserwurzeln."]},{"typ":"hinweis","text":"**Verwechslung:** Breitwegerich und Mittlerer Wegerich haben breite, eiförmige Blätter; sie sind ebenfalls essbar und werden ähnlich genutzt. Giftige Doppelgänger gibt es nicht."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**April:** frische Rosetten, zarteste Blätter.","**Mai:** junge Blütenknospen erscheinen.","**Mai–September:** Blüte, Windbestäubung.","**Spätsommer:** Samen reifen; sie quellen bei Nässe und kleben an Schuhen und Pfoten – so verbreitet sich die Pflanze."]},{"typ":"abschnitt","titel":"Standort","liste":["Wiesen, Weiden, Wegränder, Rasen.","Verträgt Tritt und Mahd gut.","Sammeln nur abseits von Straßen und Hundewegen."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Typisch sind Schleimstoffe, die Schleimhäute schützen, und Iridoide wie Aucubin, die antibakteriell wirken sollen."},{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Iridoidglykoside","Aucubin (bis ca. 2,5 %), Catalpol","{{b:iridoide|Iridoide}}"],["Schleimstoffe","Polysaccharide","{{b:schleimstoffe|Schleimstoffe}}"],["Gerbstoffe","ca. 7 %","–"],["Phenylethanoide","Acteosid (Verbascosid)","–"],["Flavonoide","–","{{b:flavonoide|Flavonoide}}"],["Mineralstoffe","Kieselsäure (ca. 1 %), Zink, Kalium","{{b:kieselsaeure|Kieselsäure}}"]]},{"typ":"text","text":"Quelle: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/plantaginis-lanceolatae-herba-21366). Aucubin ist hitzeempfindlich; für die antibakterielle Wirkung werden deshalb Kaltauszüge oder Frischpflanzensirup empfohlen [T]."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Spitzwegerich ist bei Reizhusten und Entzündungen in Mund und Rachen anerkannt. Äußerlich hilft er bei kleinen Hautverletzungen und Insektenstichen."},{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Reizlindernd bei trockenem Reizhusten","Tee, Sirup","[W] HMPC, ESCOP, Kommission E"],["Entzündungen in Mund und Rachen","Tee, Gurgeln","[W] Monographien"],["Zusammenziehend (adstringierend), abschwellend","Tee, Umschlag","[W] Gerbstoffe"],["Mild antibakteriell","frisch, Kaltauszug","[W] Labor; braucht weitere Studien"],["Bei Insektenstichen, kleinen Wunden","frisches Blatt","[T] Volksheilkunde, Kommission E äußerlich"],["Bei gereizter Magenschleimhaut","Tee","[T] Volksheilkunde"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Spitzwegerich ist die Notfallapotheke für unterwegs: Das frische Blatt kühlt und schließt kleine Wunden."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"stich","titel":"Erste Hilfe bei Insektenstichen","kat":"aeusserlich","beleg":"T","teil":"frisches Blatt","kurz":"Blatt zerreiben, auflegen – Juckreiz und Schwellung lassen nach.","zutaten":["1–2 frische Blätter"],"schritte":["Blatt zwischen den Fingern rollen oder zerkauen, bis Saft austritt.","Auf den Stich drücken, einige Minuten halten.","Bei Bedarf wiederholen."],"hinweis":"Bei Stichen im Mund- und Rachenraum oder Atemnot sofort Notruf 112."},{"id":"pflaster","titel":"Wegerich-Pflaster","kat":"aeusserlich","beleg":"T","teil":"frisches Blatt","kurz":"Bei Schürfwunden und Blasen auf der Wanderung.","zutaten":["sauberes, frisches Blatt"],"schritte":["Blatt quetschen und mit der Saftseite auf die gereinigte Wunde legen.","Mit Tuch oder Pflaster fixieren, mehrmals täglich wechseln."]},{"id":"tee","titel":"Hustentee","kat":"innerlich","beleg":"W","teil":"getrocknetes Kraut","kurz":"Bei trockenem Reizhusten und Halsschmerzen.","zutaten":["3 g Kraut (ca. 2 TL)","150 ml heißes Wasser"],"schritte":["Übergießen, 10 Minuten ziehen lassen.","2–3 Tassen am Tag, mit Honig."]},{"id":"kaltauszug","titel":"Kaltauszug","kat":"innerlich","beleg":"T","teil":"Kraut","kurz":"Schont hitzeempfindliches Aucubin und die Schleimstoffe.","zutaten":["2 TL Kraut","250 ml kaltes Wasser"],"schritte":["Über Nacht ziehen lassen.","Abseihen, leicht anwärmen und schluckweise trinken."]},{"id":"sirup-heil","titel":"Hustensirup (siehe Rezepte)","kat":"innerlich","beleg":"T","teil":"frische Blätter","kurz":"Der bekannteste Hausmittel-Sirup.","zutaten":["siehe {{p:p06#rezepte-sirup|Rezept}}"],"schritte":["Erwachsene 3-mal täglich 1 EL, Kinder ab 3 Jahren 1 TL."],"hinweis":"Wegen Honig nicht für Kinder unter 1 Jahr."},{"id":"gurgeln","titel":"Gurgellösung","kat":"innerlich","beleg":"W","teil":"Kraut","kurz":"Bei Entzündungen in Mund und Rachen.","zutaten":["starker Tee (2 TL pro Tasse)"],"schritte":["Lauwarm mehrmals täglich gurgeln."]}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** **Storl** zählt den Wegerich zu den Heilpflanzen, die dort wachsen, wo Menschen leben – an Haustür, Weg und Gartenzaun ({{a:storl-denken|Storls Denken}}). [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Junge Blätter schmecken leicht bitter, die jungen Blütenknospen erinnern an Champignons. Ältere Blätter sind faserig – quer zu den Nerven fein schneiden."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["vorrat","Vorrat"],["kueche","Küche"]],"eintraege":[{"id":"sirup","titel":"Spitzwegerich-Hustensirup (Schichtmethode)","kat":"vorrat","menge":"1 Glas","zeit":"15 Min. + 2–3 Monate","zutaten":["2–3 Handvoll frische Blätter","ca. 300 g Zucker oder Honig","Schraubglas"],"schritte":["Blätter klein schneiden.","Im Glas abwechselnd 1 cm Blätter und Zucker (oder Honig) schichten, oben mit Zucker abschließen, fest andrücken.","Gut verschlossen 2–3 Monate an einem kühlen, dunklen Ort ziehen lassen; Profis graben das Glas in die Erde.","Den entstandenen Sirup abseihen und in eine Flasche füllen."],"tipp":"Die klassische Version aus Großmutters Zeit. Schneller: Blätter 10 Minuten in Wasser köcheln, abseihen und mit gleicher Menge Zucker zu Sirup einkochen."},{"id":"knospen","titel":"Gebratene Knospen mit Pilzgeschmack","kat":"kueche","menge":"2 Portionen als Beilage","zeit":"10 Min.","zutaten":["2 Handvoll junge, noch geschlossene Blütenknospen","1 EL Butter","Salz, Pfeffer, Knoblauch"],"schritte":["Knospen mit 1–2 cm Stiel abschneiden.","In Butter 3–4 Minuten braten.","Würzen, auf Brot oder zu Rührei."]},{"id":"chips","titel":"Spitzwegerich-Chips","kat":"kueche","menge":"1 Schale","zeit":"15 Min.","zutaten":["30 große Blätter","1 EL Öl","Salz, Paprika"],"schritte":["Blätter trocken tupfen, mit Öl und Gewürzen mischen.","Bei 140 °C ca. 10 Minuten backen, bis sie knusprig sind."]},{"id":"salat","titel":"Wildkräuter-Salat","kat":"kueche","menge":"2 Portionen","zeit":"10 Min.","zutaten":["1 Handvoll junge Spitzwegerichblätter, quer in Streifen","Löwenzahn, Giersch, Gänseblümchen","Feldsalat","Zitronendressing"],"schritte":["Alles waschen und zupfen.","Mit Dressing mischen."]},{"id":"quark","titel":"Wegerich-Kräuterquark","kat":"kueche","menge":"4 Portionen","zeit":"10 Min.","zutaten":["1 Handvoll junge Blätter, sehr fein gehackt","250 g Quark","2 EL Joghurt","Schnittlauch, Salz, Pfeffer"],"schritte":["Alles glattrühren und abschmecken."],"tipp":"Zu Pellkartoffeln."},{"id":"suppe","titel":"Grüne Wildkräutersuppe","kat":"kueche","menge":"4 Portionen","zeit":"30 Min.","zutaten":["2 Handvoll gemischte Wildkräuter (Spitzwegerich, Brennnessel, Giersch)","3 Kartoffeln","1 Zwiebel","1 l Brühe","Sahne, Muskat"],"schritte":["Zwiebel und Kartoffeln in Brühe 15 Minuten kochen.","Kräuter fein gehackt zugeben, 3 Minuten mitkochen.","Pürieren, mit Sahne abschmecken."]},{"id":"salz","titel":"Wegerich-Kräutersalz","kat":"vorrat","menge":"1 Glas","zeit":"10 Min.","zutaten":["2 Handvoll getrocknete Blätter","100 g grobes Salz"],"schritte":["Zusammen im Mörser mahlen.","Dunkel lagern."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Spitzwegerich muss man nicht anbauen – man lässt ihn einfach wachsen. Ein ungespritzter Rasen liefert genug für Tee und Sirup."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"wiese","titel":"Kräuterrasen","kat":"alle","beleg":"T","teil":"Wiese","kurz":"Rasen seltener mähen, dann kommen Wegerich, Gänseblümchen und Löwenzahn von selbst.","zutaten":["ungespritzte Rasenfläche"],"schritte":["Höher und seltener mähen.","Nicht düngen und keine Unkrautvernichter verwenden."]},{"id":"trocknen","titel":"Blätter trocknen","kat":"alle","beleg":"T","teil":"Blätter","kurz":"Für den Hustentee im Winter.","zutaten":["saubere, gesunde Blätter"],"schritte":["Einzeln auf Gitter legen, im Schatten trocknen.","Rasch trocknen: Langsam getrocknete Blätter werden schwarz (Aucubin zerfällt).","Dunkel und luftdicht lagern ({{s:trocknen|Kräuter trocknen}})."]},{"id":"tiere","titel":"Futter- und Heilkraut für Tiere","kat":"alle","beleg":"T","teil":"Blätter","kurz":"Pferde, Schafe, Kaninchen und Hühner fressen ihn gern.","zutaten":["frische Blätter"],"schritte":["Als Teil abwechslungsreicher Grünfütterung."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Spitzwegerich gilt als sehr gut verträglich."},{"typ":"abschnitt","titel":"Hinweise","liste":["Innerliche Anwendung als Arzneimittel nicht in Schwangerschaft und Stillzeit (fehlende Daten).","Nicht für Kinder unter 3 Jahren als Arzneimittel; Honig-Sirup nicht unter 1 Jahr.","Allergie gegen Wegerich (auch Pollen) möglich.","Husten mit Fieber, Atemnot, blutigem Auswurf oder länger als eine Woche gehört zum Arzt.","Wechselwirkungen: keine bekannt."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Altmeyers Enzyklopädie: Plantaginis lanceolatae herba","https://www.altmeyers.org/de/naturheilkunde/plantaginis-lanceolatae-herba-21366"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte."}]}]},{"id":"p07","nr":"P-07","illu":"schafgarbe","fotos":[],"name":"Schafgarbe","botan":"Achillea millefolium L. s. l.","volksnamen":["Achilleskraut","Zimmermannskraut","Augenbraue der Venus","Tausendblatt"],"kurz":"Eine Wundpflanze seit der Antike und Arzneipflanze des Jahres 2025: krampflösend bei Bauch- und Regelschmerzen, appetitanregend, und mit ihren fein gefiederten Blättern ein würziges Wildkraut.","steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","ausdauernde Staude mit Ausläufern"],["Größe","bis ca. 80 cm"],["Blütezeit","Juni–Oktober"],["Sammelzeit","Blätter März–Juni, blühendes Kraut Juni–August"],["Verwendete Teile","blühendes Kraut, Blüten, junge Blätter"],["Arzneidroge","Schafgarbenkraut (Millefolii herba), Ph. Eur.; HMPC traditionell"],["Name","Nach Achilles, der laut Sage damit Wunden heilte; millefolium = tausendblättrig"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"schafgarbe_d","titel":"Detailtafel"},{"typ":"standort","licht":4,"wasser":2,"naehrstoffe":2,"ph":"indifferent","boden":"mager; Wiesen, Wegränder, Böschungen","ellenberg":"L8 F4 R– N5","hinweis":"Magerkeitszeiger; auf fettem Boden wird sie schwach."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** zwei- bis dreifach fein gefiedert, wirken wie Federn oder ein Tausendblatt; würziger Duft beim Zerreiben.","**Stängel:** aufrecht, zäh, oft behaart.","**Blüten:** viele kleine Körbchen in flachen Doldentrauben; jedes Körbchen mit meist 5 weißen bis rosa Zungenblüten.","**Wuchs:** bildet über Ausläufer kleine Teppiche."]},{"typ":"hinweis","text":"**Verwechslung:** Die Blütenstände ähneln auf den ersten Blick den Dolden giftiger Doldenblütler wie dem Schierling. Unterschied: Schafgarbe hat fein gefiederte, federartige Blätter, zähe Stängel und Blütenkörbchen statt Dolden mit Strahlen. Im Zweifel nicht sammeln."},{"typ":"text","text":"Die Schafgarbe ist eine Artengruppe aus mehreren schwer unterscheidbaren Kleinarten mit unterschiedlicher Chemie. Nur manche bilden die blauen Azulene."},{"typ":"abschnitt","titel":"Standort","liste":["Wiesen, Weg- und Ackerränder, trockene Böschungen, sonnig.","Kommt mit mageren und trockenen Böden aus.","In Europa, Asien und Nordamerika verbreitet."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Die wichtigsten Wirkstoffe stecken im ätherischen Öl, besonders die Proazulene, aus denen beim Erhitzen das blaue Chamazulen entsteht."},{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Ätherisches Öl (0,1–1,4 %)","Pinen, Cineol, Kampfer, Beta-Caryophyllen","–"],["Proazulene","Achillicin; daraus Chamazulen","{{b:azulene|Azulene}}"],["Flavonoide (0,3–1 %)","–","{{b:flavonoide|Flavonoide}}"],["Bitterstoffe","Sesquiterpenlactone","{{b:bitterstoffe|Bitterstoffe}}"],["Weitere","Cumarine, Kaffeoylchinasäuren, Polyacetylene","{{b:cumarine|Cumarine}} · {{b:polyacetylene|Polyacetylene}}"]]},{"typ":"text","text":"Quelle: [Universität Münster, Arzneipflanze des Jahres 2025](https://www.uni-muenster.de/Chemie.pb/institut/garten/adj2025.html). Das Europäische Arzneibuch verlangt mindestens 0,2 % ätherisches Öl und 0,02 % Proazulene."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Als traditionelles Arzneimittel anerkannt bei Appetitlosigkeit, leichten krampfartigen Magen-Darm-Beschwerden und Regelschmerzen; äußerlich bei kleinen, oberflächlichen Wunden."},{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Appetitanregend","Tee vor dem Essen","[W] HMPC traditionell"],["Krampflösend bei Magen-Darm-Beschwerden","Tee","[W] HMPC traditionell"],["Bei leichten Regelschmerzen","Tee, Sitzbad","[W] HMPC traditionell"],["Kleine oberflächliche Wunden","Umschlag","[W] HMPC traditionell"],["Galletreibend, entzündungshemmend, antibakteriell","–","[W] überwiegend Labordaten"],["Blutstillend bei kleinen Wunden und Nasenbluten","frisches Kraut","[T] Volksheilkunde, daher Soldaten- und Zimmermannskraut"],["Frauenkraut für Zyklus und Wechseljahre","Tee, Sitzbad","[T] Volksheilkunde"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Schafgarbe ist ein klassisches Bauch- und Frauenkraut. Tee am besten vor den Mahlzeiten trinken."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"tee","titel":"Schafgarbentee","kat":"innerlich","beleg":"W","teil":"blühendes Kraut","kurz":"Bei Appetitlosigkeit und krampfartigen Bauchschmerzen.","zutaten":["2–4 g Kraut (ca. 1–2 TL)","150 ml kochendes Wasser"],"schritte":["Übergießen, zugedeckt 10 Minuten ziehen lassen (ätherisches Öl).","3–4-mal täglich eine Tasse zwischen oder vor den Mahlzeiten."]},{"id":"regel","titel":"Bei Regelschmerzen","kat":"innerlich","beleg":"W","teil":"Kraut","kurz":"Ab einigen Tagen vor der Regel täglich Tee trinken.","zutaten":["Schafgarbe, nach Wunsch mit Frauenmantel und Melisse"],"schritte":["Tee wie oben, 3 Tassen täglich.","Dazu eine Wärmflasche auf den Bauch."]},{"id":"sitzbad","titel":"Schafgarben-Sitzbad","kat":"aeusserlich","beleg":"T","teil":"Kraut","kurz":"Entspannend bei Unterleibskrämpfen.","zutaten":["ca. 100 g Kraut","4 l Wasser"],"schritte":["Kraut mit kochendem Wasser übergießen, 20 Minuten ziehen lassen, abseihen.","Dem Sitzbad zugeben, 15–20 Minuten bei ca. 37 °C."]},{"id":"wunde","titel":"Wundauflage und Nasenbluten","kat":"aeusserlich","beleg":"T","teil":"frisches Kraut","kurz":"Altes Soldaten- und Handwerkermittel für kleine Schnitte.","zutaten":["frische, saubere Blätter"],"schritte":["Blätter zerreiben, auf die kleine Wunde drücken.","Bei Nasenbluten ein gerolltes Blatt kurz in das Nasenloch [T]."],"hinweis":"Bei stark blutenden oder verschmutzten Wunden zum Arzt."},{"id":"umschlag","titel":"Umschlag für die Haut","kat":"aeusserlich","beleg":"W","teil":"Tee","kurz":"Bei kleinen, oberflächlichen Hautwunden.","zutaten":["abgekühlter starker Tee","Kompresse"],"schritte":["Kompresse tränken, mehrmals täglich auflegen."],"hinweis":"Nicht bei Korbblütler-Allergie."}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** Die Schafgarbe passt zu **Storls** Gedanken der Ur-Medizin, nach dem unsere Volksmedizin sehr alt ist ({{a:storl-buecher-ur-medizin|Ur-Medizin}}): Schon ihr Name Achillea verweist auf die Wundheilkunst der Antike. [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Die jungen Blätter schmecken würzig-herb, ähnlich wie Rucola mit Kräuternote. Sparsam verwenden, sie sind kräftig."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"],["getraenke","Getränke"]],"eintraege":[{"id":"butter","titel":"Schafgarben-Kräuterbutter","kat":"kueche","menge":"125 g","zeit":"10 Min.","zutaten":["125 g weiche Butter","2 EL junge Blätter, fein gehackt","1 kleine Knoblauchzehe","Salz, Zitronenabrieb"],"schritte":["Alles verrühren, zur Rolle formen, kühlen."]},{"id":"quark","titel":"Kräuterquark mit Schafgarbe","kat":"kueche","menge":"4 Portionen","zeit":"10 Min.","zutaten":["250 g Quark","1 EL fein gehackte Schafgarbe","1 EL Schnittlauch","Salz, Pfeffer"],"schritte":["Glattrühren und 15 Minuten durchziehen lassen."]},{"id":"salat","titel":"Kartoffelsalat mit Schafgarbe","kat":"kueche","menge":"4 Portionen","zeit":"30 Min.","zutaten":["800 g Kartoffeln","1 Zwiebel","200 ml Brühe","3 EL Essig, 3 EL Öl","2 EL junge Schafgarbenblätter, gehackt"],"schritte":["Kartoffeln kochen, pellen, in Scheiben schneiden.","Mit warmer Brühe, Zwiebel, Essig und Öl marinieren.","Schafgarbe unterheben."]},{"id":"pesto","titel":"Wildkräuterpesto","kat":"vorrat","menge":"1 Glas","zeit":"10 Min.","zutaten":["30 g Schafgarbenblätter","50 g {{p:p02|Giersch}} oder Basilikum","40 g Walnüsse","40 g Parmesan","120 ml Olivenöl, Salz"],"schritte":["Alles mixen, ins Glas füllen, mit Öl bedecken."],"tipp":"Die Schafgarbe nur als Würze – zu viel macht es bitter."},{"id":"suppe","titel":"Kräutersuppe mit Schafgarbe","kat":"kueche","menge":"4 Portionen","zeit":"25 Min.","zutaten":["3 Kartoffeln","1 Lauchstange","1 l Brühe","1 Handvoll Wildkräuter mit etwas Schafgarbe","Sahne"],"schritte":["Lauch und Kartoffeln in Brühe weichkochen.","Kräuter zugeben, pürieren, mit Sahne abschmecken."]},{"id":"tee-mischung","titel":"Bauchwohl-Teemischung","kat":"getraenke","menge":"1 Dose","zeit":"5 Min.","zutaten":["2 Teile Schafgarbe","2 Teile Pfefferminze","1 Teil Kamille","1 Teil Fenchelsamen, angestoßen"],"schritte":["Getrocknet mischen.","1–2 TL pro Tasse, 10 Minuten zugedeckt ziehen lassen."]},{"id":"bitter","titel":"Kräuterbitter (Digestif)","kat":"getraenke","menge":"500 ml","zeit":"10 Min. + 3 Wochen","zutaten":["2 EL getrocknete Schafgarbe","1 EL getrocknete Löwenzahnwurzel","Schale einer Bio-Orange","500 ml Korn (38–40 %)","1–2 EL Honig"],"schritte":["Alles ins Glas, 3 Wochen dunkel ziehen lassen.","Abseihen, mit Honig abschmecken.","Ein Schnapsgläschen nach schweren Mahlzeiten."],"tipp":"Enthält Alkohol – nicht für Kinder und Schwangere."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Schafgarbe ist robust, trockenheitsverträglich und ein wertvoller Gartennachbar."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"anbau","titel":"Anbau","kat":"alle","beleg":"T","teil":"Pflanze","kurz":"Sonnig, eher mager; breitet sich über Ausläufer aus.","zutaten":["Jungpflanzen oder Saatgut (Lichtkeimer)"],"schritte":["Im Frühjahr säen, Samen nur andrücken, nicht bedecken.","Abstand 30 cm.","Alle 3–4 Jahre teilen."]},{"id":"kompost","titel":"Kompoststarter","kat":"alle","beleg":"A","teil":"Kraut","kurz":"In der biologisch-dynamischen Landwirtschaft ein Bestandteil der Kompostpräparate.","zutaten":["eine Handvoll fein gehacktes Kraut"],"schritte":["Lagenweise in den Kompost geben."],"hinweis":"Weltanschaulich begründet; wissenschaftlich kaum untersucht."},{"id":"nuetzlinge","titel":"Nützlingsmagnet","kat":"alle","beleg":"W","teil":"Blüten","kurz":"Die flachen Blütenstände ziehen Schwebfliegen, Schlupfwespen und Marienkäfer an – Gegenspieler der Blattläuse.","zutaten":["Schafgarbe am Beetrand"],"schritte":["Zwischen Gemüsebeeten oder am Rand des {{s:huegelbeet|Hügelbeets}} pflanzen."]},{"id":"trocknen","titel":"Kraut ernten und trocknen","kat":"alle","beleg":"T","teil":"Kraut","kurz":"Zu Beginn der Blüte die oberen 20 cm schneiden.","zutaten":["Schere, Bindfaden"],"schritte":["In kleinen Bündeln kopfüber im Schatten trocknen ({{s:trocknen|Kräuter trocknen}})."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Schafgarbe ist gut verträglich, kann aber bei Menschen mit Korbblütler-Allergie Hautreaktionen auslösen."},{"typ":"abschnitt","titel":"Hinweise","liste":["Allergie gegen Korbblütler: nicht anwenden. Nach äußerer Anwendung kann eine juckende, blasige Hautentzündung entstehen (Schafgarben-Dermatitis).","Schwangerschaft und Stillzeit: als Arzneimittel nicht anwenden (fehlende Daten).","Kinder unter 12 Jahren: als Arzneimittel nicht ohne ärztlichen Rat.","Arzneimittel sind meist besser geprüft als Nahrungsergänzungsmittel.","Wechselwirkungen: keine bekannt."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Universität Münster: Arzneipflanze des Jahres 2025 – Schafgarbe","https://www.uni-muenster.de/Chemie.pb/institut/garten/adj2025.html"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte."}]}]},{"id":"p08","nr":"P-08","illu":"johanniskraut","fotos":[],"name":"Johanniskraut","botan":"Hypericum perforatum L.","volksnamen":["Tüpfel-Johanniskraut","Herrgottsblut","Hexenkraut","Sonnwendkraut"],"kurz":"Die Sonnenpflanze um den Johannistag (24. Juni): Als Extrakt ist sie eines der am besten untersuchten pflanzlichen Mittel gegen leichte bis mittelschwere Depressionen, als Rotöl ein Hausmittel für Haut und Muskeln. Wichtig: viele Wechselwirkungen mit Medikamenten.","steckbrief":[["Familie","Johanniskrautgewächse (Hypericaceae)"],["Lebensform","ausdauernde Staude"],["Größe","30–80 cm"],["Blütezeit","Juni–August, Höhepunkt um den 24. Juni"],["Sammelzeit","obere Triebspitzen zur Hauptblüte"],["Verwendete Teile","blühendes Kraut"],["Arzneidroge","Johanniskraut (Hyperici herba); HMPC: Extrakte gut belegt bei leichter bis mittelschwerer Depression"],["Achtung","viele Wechselwirkungen, u. a. mit der Pille; macht lichtempfindlich"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"johanniskraut_d","titel":"Detailtafel"},{"typ":"standort","licht":4,"wasser":2,"naehrstoffe":2,"ph":"schwach sauer bis kalkhaltig","boden":"mager; Lichtungen, Böschungen, Magerrasen","ellenberg":"L7 F4 R6 N4","hinweis":"Braucht Sonne für den Hypericin-Gehalt."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** aufrecht, rund mit zwei feinen Längsleisten (Unterschied zu anderen Arten), oben verzweigt.","**Blätter:** gegenständig, länglich, ohne Stiel. Gegen das Licht gehalten zeigen sie viele durchscheinende Punkte (Öldrüsen) – daher perforatum = durchlöchert.","**Blüten:** goldgelb, fünfzählig, mit vielen Staubblättern; an den Rändern schwarze Drüsenpunkte.","**Rotfärbung:** Zerreibt man eine Blüte zwischen den Fingern, färbt sie sich blutrot (Hypericin)."]},{"typ":"hinweis","text":"**Verwechslung:** Es gibt mehrere Johanniskraut-Arten. Das echte erkennt man an der Kombination: zweikantiger Stängel, durchscheinend punktierte Blätter und Blüten, die beim Zerreiben rot färben. Andere gelb blühende Pflanzen wie Jakobskreuzkraut (giftig!) haben keine punktierten Blätter und fiederteilige Blätter."},{"typ":"abschnitt","titel":"Standort","liste":["Sonnige, trockene Standorte: Wegränder, Böschungen, Waldlichtungen, Magerwiesen.","In ganz Europa verbreitet."]},{"typ":"text","text":"Im Volksglauben war es ein Lichtbringer gegen Dunkelheit und böse Geister; man hängte es zur Sonnwende an Türen und Fenster [A]."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Die stimmungsaufhellende Wirkung wird vor allem Hyperforin und Hypericin zugeschrieben, zusammen mit Flavonoiden. Hyperforin ist auch für die meisten Wechselwirkungen verantwortlich."},{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Naphthodianthrone","Hypericin, Pseudohypericin (roter Farbstoff, macht lichtempfindlich)","{{b:hypericin|Hypericin & Hyperforin}}"],["Phloroglucinderivate","Hyperforin (wichtig für Wirkung und Wechselwirkungen)","{{b:hypericin|Hypericin & Hyperforin}}"],["Flavonoide, Biflavone","Hyperosid, Rutin, Quercitrin, Biapigenin","{{b:flavonoide|Flavonoide}}"],["Gerbstoffe (ca. 10 %)","–","–"],["Ätherisches Öl (0,5–1 %)","–","–"]]},{"typ":"text","text":"Quelle: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/hyperici-herba-24223)."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Johanniskraut-Extrakte sind bei leichten bis mittelschweren depressiven Episoden gut belegt. Tee und Öl werden traditionell genutzt."},{"typ":"tabelle","kopf":["Wirkung","Zubereitung","Einordnung"],"zeilen":[["Leichte bis mittelschwere Depression","standardisierte Extrakte aus der Apotheke","[W] HMPC well-established use"],["Vorübergehende seelische Erschöpfung","Extrakt, Tee","[W] HMPC traditionell, ESCOP"],["Leichte Magen-Darm-Beschwerden","Tee, Öl innerlich","[W] HMPC traditionell"],["Leichte Hautentzündungen, Sonnenbrand, kleine Wunden","Rotöl äußerlich","[W] HMPC traditionell"],["Verbrennungen 1. Grades, Muskelschmerzen, Prellungen","Rotöl","[W] Kommission E"],["Atopisches Ekzem","1,5-%-Creme","[W] eine kleine Studie mit 21 Patienten"],["Narbenpflege, trockene Haut, Bettnässen","Rotöl","[T] Erfahrungsheilkunde"]]},{"typ":"hinweis","text":"**Depression ist eine ernste Erkrankung.** Johanniskraut ersetzt keine ärztliche Diagnose. Bei schwerer Depression oder Gedanken, sich das Leben zu nehmen, sofort Hilfe holen: Hausarzt, ärztlicher Bereitschaftsdienst 116 117 oder Telefonseelsorge 0800 111 0 111."}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Für die Stimmung werden standardisierte Apothekenpräparate verwendet, weil Tee den Gehalt nicht sicher erreicht. Selbst gemacht wird vor allem das Rotöl."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"extrakt","titel":"Extrakt bei gedrückter Stimmung","kat":"innerlich","beleg":"W","teil":"Fertigpräparat","kurz":"Nur nach Rücksprache mit Arzt oder Apotheke – wegen der Wechselwirkungen.","zutaten":["Präparat aus der Apotheke (Tagesdosis meist 300–900 mg Extrakt, je nach Präparat)"],"schritte":["Vorher alle anderen Medikamente mit Arzt oder Apotheke abgleichen.","Regelmäßig über mehrere Wochen einnehmen; die Wirkung baut sich langsam auf.","Nicht eigenmächtig mit anderen Antidepressiva kombinieren."]},{"id":"tee","titel":"Johanniskrauttee","kat":"innerlich","beleg":"T","teil":"Kraut","kurz":"Bei Nervosität und seelischer Erschöpfung.","zutaten":["1,5 TL Kraut","1 Tasse kochendes Wasser"],"schritte":["Übergießen, 10 Minuten ziehen lassen.","Morgens und abends eine Tasse, über mehrere Wochen."],"hinweis":"Auch Tee kann Wechselwirkungen haben."},{"id":"rotoel","titel":"Rotöl auf Haut und Muskeln","kat":"aeusserlich","beleg":"W","teil":"Rotöl","kurz":"Bei Sonnenbrand (danach!), leichten Verbrennungen, Prellungen, Muskelschmerzen, Narben.","zutaten":["Rotöl (siehe Zubereitungen)"],"schritte":["Dünn auftragen und sanft einmassieren.","Behandelte Haut danach nicht der Sonne aussetzen."]},{"id":"narben","titel":"Narbenpflege","kat":"aeusserlich","beleg":"T","teil":"Rotöl","kurz":"Für verheilte Narben.","zutaten":["Rotöl"],"schritte":["Täglich 2-mal einmassieren, über Wochen.","Nur auf geschlossene Haut."]}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** **Storl** beschreibt die Bräuche um die Sommersonnwende, das Johannisfeuer und die Sonnwendkräuter ({{a:storl-buecher-haustuer|Heilkräuter und Zauberpflanzen zwischen Haustür und Gartentor}}). Das Johanniskraut, das um den 24. Juni blüht, ist die bekannteste dieser Pflanzen. [T]"}]},{"id":"rezepte","titel":"Zubereitungen","bloecke":[{"typ":"text","text":"Johanniskraut ist eher Heil- als Küchenpflanze. Hier die wichtigsten Hausrezepte."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["oel","Öle & Salben"],["getraenke","Tee"]],"eintraege":[{"id":"rotoel","titel":"Johanniskraut-Rotöl","kat":"oel","menge":"ca. 500 ml","zeit":"15 Min. + 6 Wochen","zutaten":["frisch aufgeblühte Blüten und Knospen (ca. 2 Handvoll)","500 ml Olivenöl","helles Schraubglas"],"schritte":["Blüten kurz anwelken lassen, leicht zerdrücken.","Ins Glas füllen und vollständig mit Öl bedecken.","6 Wochen an einen sonnigen Platz stellen, täglich schütteln. Das Öl färbt sich tiefrot.","Abseihen, in dunkle Flaschen füllen, kühl lagern; ca. 1 Jahr haltbar."],"tipp":"Traditionell um den Johannistag ansetzen. Hier darf das Glas ausnahmsweise in die Sonne – Licht hilft, das Hypericin zu lösen."},{"id":"salbe","titel":"Johanniskraut-Salbe","kat":"oel","menge":"ca. 100 ml","zeit":"15 Min.","zutaten":["100 ml Rotöl","10–12 g Bienenwachs"],"schritte":["Im Wasserbad schmelzen.","In Tiegel füllen, abkühlen lassen."]},{"id":"massageoel","titel":"Wärmendes Massageöl","kat":"oel","menge":"100 ml","zeit":"5 Min.","zutaten":["80 ml Rotöl","20 ml {{p:p01|Brennnessel}}- oder Arnikaöl","nach Wunsch 5 Tropfen Rosmarinöl"],"schritte":["Mischen, dunkel lagern.","Bei verspannten Muskeln einmassieren."]},{"id":"lippenbalsam","titel":"Lippenbalsam","kat":"oel","menge":"3 kleine Döschen","zeit":"10 Min.","zutaten":["15 ml Rotöl","5 g Bienenwachs","5 g Sheabutter"],"schritte":["Im Wasserbad schmelzen und abfüllen."],"hinweis":"Wegen der Lichtempfindlichkeit eher abends verwenden."},{"id":"tee-mischung","titel":"Sonnenteemischung für dunkle Tage","kat":"getraenke","menge":"1 Dose","zeit":"5 Min.","zutaten":["2 Teile Johanniskraut","1 Teil Melisse","1 Teil Lavendelblüten","1 Teil Ringelblume"],"schritte":["Getrocknet mischen.","1–2 TL pro Tasse, 10 Minuten ziehen lassen."],"hinweis":"Nicht bei Einnahme der Pille oder anderer Medikamente ohne Rücksprache."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Johanniskraut wächst wild auf sonnigen Böschungen und lässt sich leicht im Garten ansiedeln."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"anbau","titel":"Anbau","kat":"alle","beleg":"T","teil":"Pflanze","kurz":"Sonnig, trocken, eher mager.","zutaten":["Saatgut (Lichtkeimer) oder Jungpflanzen"],"schritte":["Im Frühjahr säen, Samen nur andrücken.","Abstand 30–40 cm.","Ab dem 2. Jahr reiche Blüte."]},{"id":"ernte","titel":"Ernte zur Johannizeit","kat":"alle","beleg":"T","teil":"Triebspitzen","kurz":"Die oberen 20–30 cm zur Hauptblüte an sonnigen Tagen schneiden.","zutaten":["Schere"],"schritte":["Für Öl frisch verarbeiten.","Für Tee in Bündeln im Schatten trocknen ({{s:trocknen|Kräuter trocknen}})."]},{"id":"tiere","titel":"Vorsicht bei Weidetieren","kat":"alle","beleg":"W","teil":"ganze Pflanze","kurz":"Hellhäutige Weidetiere, die viel Johanniskraut fressen, können Sonnenbrand-ähnliche Hautschäden bekommen.","zutaten":["–"],"schritte":["Auf Pferde- und Schafweiden große Bestände im Blick behalten."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"hinweis","text":"**Wechselwirkungen:** Johanniskraut regt Leberenzyme (CYP3A4, CYP2C9, CYP2C19) und den Transporter P-Glykoprotein an. Dadurch werden viele Medikamente schneller abgebaut und wirken schwächer. **Die Antibabypille kann unwirksam werden.** Vor jeder innerlichen Anwendung alle Medikamente mit Arzt oder Apotheke abklären."},{"typ":"tabelle","kopf":["Medikamente","Risiko"],"zeilen":[["Antibabypille und andere hormonelle Verhütung","Wirkung kann nachlassen, Schwangerschaft möglich"],["Blutverdünner (z. B. Warfarin, Phenprocoumon)","Wirkung sinkt – Thrombosegefahr"],["Ciclosporin, Tacrolimus (nach Transplantation)","Abstoßungsgefahr – nicht kombinieren"],["HIV-Mittel (Proteasehemmer), einige Krebsmittel (Irinotecan)","nicht kombinieren"],["Digoxin, Simvastatin, Benzodiazepine, Methadon, Amitriptylin","Wirkung kann sinken"],["Andere Antidepressiva (z. B. Sertralin, Paroxetin), Triptane","Gefahr eines Serotonin-Syndroms"],["Narkosemittel","vor geplanten Operationen absetzen bzw. angeben"]]},{"typ":"abschnitt","titel":"Weitere Hinweise","liste":["**Lichtempfindlichkeit:** Innerlich und äußerlich kann die Haut empfindlicher auf Sonne reagieren. Starke Sonne und Solarium meiden.","Nicht bei bekannter Lichtüberempfindlichkeit.","Nicht bei schweren Depressionen.","Nicht in Schwangerschaft und Stillzeit (fehlende Daten).","Nicht bei Kindern unter 12 Jahren (innerlich).","Mögliche Nebenwirkungen: Magen-Darm-Beschwerden, Müdigkeit, Unruhe, allergische Reaktionen."]},{"typ":"text","text":"Quelle: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/hyperici-herba-24223)."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Altmeyers Enzyklopädie: Hyperici herba","https://www.altmeyers.org/de/naturheilkunde/hyperici-herba-24223"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte."}]}]},{"id":"p09","nr":"P-09","illu":"beifuss","fotos":[],"name":"Beifuß","botan":"Artemisia vulgaris L.","volksnamen":["Gänsekraut","Sonnwendgürtel","Jungfernkraut","Mugwurz"],"kurz":"Das Würzkraut für den Gänsebraten und eine der ältesten Ritualpflanzen Europas: Beifuß macht Fettes bekömmlich, wächst an jedem Wegrand – und ist eine der wichtigsten Ursachen für Pollenallergien im Spätsommer.","steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","ausdauernde Staude mit kriechendem Wurzelstock"],["Größe","60–200 cm"],["Blütezeit","Juli–September, windbestäubt"],["Sammelzeit","Rispen kurz vor dem Aufblühen (Juli–August)"],["Verwendete Teile","Blütenrispen, junge Triebspitzen"],["Erkennen","Blattunterseite weißfilzig, oben dunkelgrün"],["Achtung","Pollenallergie, Sellerie-Beifuß-Gewürz-Syndrom; nicht in der Schwangerschaft"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"beifuss_d","titel":"Verwechslungstafel"},{"typ":"standort","licht":4,"wasser":3,"naehrstoffe":4,"ph":"indifferent","boden":"stickstoffreiche Wegränder, Schutt, Ufer","ellenberg":"L7 F6 R– N8","hinweis":"Ruderalpflanze: zeigt nährstoffreichen, gestörten Boden an."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** aufrecht, gefurcht, oft rötlich überlaufen, oben rispig verzweigt.","**Blätter:** fiederschnittig mit spitzen Zipfeln, **oben dunkelgrün, unten weißfilzig**.","**Blüten:** viele kleine, gelblich-braune Köpfchen (2–4 mm) in langen Rispen; ohne Zungenblüten, vom Wind bestäubt.","**Wurzel:** kriechender, im Alter verholzender Wurzelstock – Beifuß bildet dichte Bestände."]},{"typ":"hinweis","text":"**Verwechslung:** **Wermut** ist beidseitig silbrig und extrem bitter ({{p:p16|Wermut}}). Die **Ambrosie** (Ragweed) hat beidseitig grüne Blätter, ist ein Hochallergen und sollte ausgerissen werden – mit Handschuhen."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**April–Mai:** Austrieb aus dem Wurzelstock.","**Juni:** Triebspitzen für die Küche.","**Juli–August:** Rispen kurz vor der Blüte ernten.","**August–September:** Blüte, Pollenflug.","**Winter:** Stängel stehen dürr; Samen für Vögel."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Ätherisches Öl","1,8-Cineol, Kampfer, je nach Chemotyp {{b:thujon|Thujon}}","{{b:thujon|Thujon}}"],["Sesquiterpenlactone","Bitterstoffe","{{b:bitterstoffe|Bitterstoffe}}"],["Flavonoide","Quercetin-Glykoside","{{b:flavonoide|Flavonoide}}"],["Cumarine","Umbelliferon, Scopoletin","{{b:cumarine|Cumarine}}"],["Allergen","Art v 1 (ein Defensin im Pollen)","–"]]},{"typ":"text","text":"Der Gehalt an Thujon hängt stark vom Chemotyp und Standort ab. Für den Küchengebrauch in kleinen Mengen spielt das keine Rolle."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Verdauungsfördernd zu fetten Speisen","Gewürz, Tee","[T] Volksheilkunde; in der Küche bewährt"],["Bitter-aromatisch, appetitanregend","Tee kurzfristig","[T]"],["„Frauenkraut“ bei Menstruationsbeschwerden","Tee","[T] traditionell; nicht belegt"],["Keine Arzneimittel-Monographie","–","[W] keine HMPC-Monographie; Kommission-E-Status unklar"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"tee","titel":"Beifußtee nach schwerem Essen","kat":"innerlich","beleg":"T","teil":"Rispen","kurz":"Kurz und selten – als Bitter-Aromatikum.","zutaten":["1 TL getrocknete Rispen","250 ml Wasser"],"schritte":["Mit heißem Wasser übergießen, 5 Minuten ziehen lassen.","Ungesüßt nach dem Essen trinken, höchstens einige Tage."],"hinweis":"Nicht in Schwangerschaft und Stillzeit, nicht bei Korbblütler- oder Sellerieallergie."},{"id":"raeuchern","titel":"Räuchern","kat":"aeusserlich","beleg":"T","teil":"getrocknetes Kraut","kurz":"Eines der ältesten Räucherkräuter Europas.","zutaten":["getrocknete Blätter und Rispen","Räucherschale mit Sand und Kohle"],"schritte":["Kleine Mengen auf die glühende Kohle legen.","Gut lüften."],"hinweis":"Rauch ist für Allergiker und Asthmatiker ungeeignet."}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"]],"eintraege":[{"id":"gans","titel":"Gänse- oder Entenbraten mit Beifuß","kat":"kueche","menge":"4 Pers.","zeit":"3 Std.","kurz":"Der Klassiker: Beifuß macht das Fett bekömmlicher.","zutaten":["1 Gans oder Ente","3–4 Beifußrispen (frisch oder getrocknet)","Äpfel, Zwiebeln, Salz"],"schritte":["Rispen mit Äpfeln und Zwiebeln in den Bauch füllen.","Außen salzen, wie gewohnt braten.","Rispen vor dem Servieren entfernen."]},{"id":"salz","titel":"Beifußsalz","kat":"vorrat","menge":"1 Glas","zeit":"10 Min.","kurz":"Für Schweinebraten, Bohnen und Pilze.","zutaten":["2 EL getrocknete, zerriebene Rispen","100 g grobes Salz"],"schritte":["Mischen, dunkel und trocken lagern."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["sammeln","Sammeln"],["garten","Garten"]],"eintraege":[{"id":"sammeln","titel":"Richtig sammeln","kat":"sammeln","beleg":"T","teil":"Rispen","kurz":"Kurz vor dem Aufblühen, wenn die Köpfchen noch grünlich-geschlossen sind.","zutaten":["Schere, Korb"],"schritte":["Obere 20–30 cm der Rispen abschneiden.","Gebündelt kopfüber im Schatten trocknen.","Abrebeln, harte Stängel verwerfen."],"tipp":"Offene Blüten schmecken bitterer und stauben Pollen."},{"id":"garten","titel":"Im Garten","kat":"garten","beleg":"T","teil":"Pflanze","kurz":"Beifuß sät sich selbst aus und wuchert über den Wurzelstock – lieber an den Rand oder in einen großen Kübel.","zutaten":["Wegrand, Gartenecke"],"schritte":["Nach der Ernte zurückschneiden, bevor er Samen bildet."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Beifuß gilt als eine der ältesten Heil- und Ritualpflanzen Europas. Im angelsächsischen **Neunkräutersegen** (Lacnunga, um 1000) steht er an erster Stelle als „ältestes der Kräuter“. Der Gattungsname Artemisia verweist auf die Göttin Artemis. [T]"},{"typ":"text","text":"**Storl** behandelt den Beifuß ausführlich in {{a:storl-buecher-haustuer|Heilkräuter und Zauberpflanzen zwischen Haustür und Gartentor}}: Die Artemisia-Arten seien bitter, unscheinbar und Überlebende der eiszeitlichen Steppe. Er beschreibt den **Sonnwendgürtel** – Beifußranken, die man zur Sommersonnwende trug und mit dem Johannisfeuer verbrannte, damit Unglück und Krankheit „hinweggehen“. [T]"},{"typ":"hinweis","text":"Mehr zu Storls Sicht auf die Pflanzen „zwischen Haustür und Gartentor“: {{a:storl-denken|Storls Denken}}."}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Risiko","Wer","Was tun"],"zeilen":[["Pollenallergie (Art v 1), Kreuzallergie Sellerie-Beifuß-Gewürz-Syndrom: Sellerie, Karotte, Anis, Fenchel, Kümmel, Koriander, Petersilie, Senf","Pollenallergiker, Sellerieallergiker","meiden; Sellerie kann bei Beifuß-Sensibilisierten schwere Reaktionen auslösen (Paul-Ehrlich-Institut 2024) [W]"],["Thujon (je nach Chemotyp)","Schwangere, Epileptiker","keine Präparate, keine längere Teekur"],["Schwangerschaft","Schwangere","nicht anwenden (uteruswirksam, traditionell)"],["Korbblütlerallergie","Allergiker","meiden"]]},{"typ":"hinweis","text":"Etwa 16 % der Beifußpollen-Sensibilisierten haben eine assoziierte Nahrungsmittelallergie. Mehr dazu: {{b:vitamine-vertraeglichkeit|Verträglichkeit im Überblick}}."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Paul-Ehrlich-Institut 2024: Neue Erkenntnisse zu Sellerieallergie-Risiken","https://www.pei.de/DE/newsroom/pm/jahr/2024/07-neue-erkenntnisse-sellerieallergie-risiken.html"],["alles-zur-allergologie: Beifuß","https://www.alles-zur-allergologie.de/Allergologie/Artikel/3499/Allergen,Allergie/Beifu%C3%9F/"],["Storl: Heilkräuter und Zauberpflanzen zwischen Haustür und Gartentor (Leseprobe, Narayana)","https://narayana-verlag.imgbolt.de/media/99/83/f0/1787088027/excerpt_24559_de-DE.pdf"]]}]}]},{"id":"p10","nr":"P-10","illu":"breitwegerich","fotos":[],"name":"Breitwegerich","botan":"Plantago major L.","volksnamen":["Großer Wegerich","Wegtritt","Fußstapfen des weißen Mannes"],"kurz":"Der zähe Bruder des Spitzwegerichs wächst dort, wo andere Pflanzen zertreten werden. Sein Blatt ist das klassische Pflaster der Volksheilkunde für Stiche, Blasen und kleine Wunden.","steckbrief":[["Familie","Wegerichgewächse (Plantaginaceae)"],["Lebensform","ausdauernde Rosettenstaude"],["Größe","10–40 cm"],["Blütezeit","Juni–Oktober"],["Sammelzeit","Blätter April–September"],["Verwendete Teile","Blätter, Samen"],["Monographie","keine eigene; nur Spitzwegerich hat eine HMPC-Monographie"],["Name","„Fußstapfen des weißen Mannes“: breitete sich mit europäischen Siedlern in Amerika aus"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":4,"wasser":3,"naehrstoffe":3,"ph":"indifferent","boden":"verdichtete Trittstellen, Wege, Hofeinfahrten","ellenberg":"L8 F5 R– N6","hinweis":"Zeigt verdichteten Boden an: Wo er dicht wächst, braucht der Boden Luft (Grabegabel, Gründüngung)."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** breit-eiförmig in einer flachen Rosette, mit 3–9 zähen Längsnerven, die beim Abreißen als Fäden heraushängen.","**Blütenstand:** lange, schmale, bleistiftartige Ähren mit unscheinbaren Blüten.","**Samen:** klein, verschleimen bei Nässe und kleben an Schuhen und Pfoten – so wandert er.","**Wurzel:** dichter Schopf aus Faserwurzeln."]},{"typ":"hinweis","text":"**Verwechslung:** Junge Rosetten des **Fingerhuts** (tödlich giftig) sind weich behaart und netznervig, nicht parallelnervig. Im Zweifel nicht ernten."},{"typ":"text","text":"Unterschied zum {{p:p06|Spitzwegerich}}: Spitzwegerich hat lange, schmale Blätter und kurze, dunkle Ähren mit weißem Staubbeutelkranz."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Iridoidglykoside","Aucubin, Catalpol","{{b:iridoide|Iridoide}}"],["Phenylethanoide","Acteosid (Verbascosid)","–"],["Schleimstoffe","Polysaccharide","{{b:schleimstoffe|Schleimstoffe}}"],["Gerbstoffe","–","–"],["Nährwerte","belastbare Werte pro 100 g fehlen (Datenlücke)","{{b:vitamine-vergleich|Vitamine}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Entzündungshemmend","frisches Blatt","[W] Aucubin im Labor; klinisch nicht geprüft"],["Wundheilung, Juckreiz bei Stichen","Blattpflaster","[T] Volksheilkunde weltweit"],["Reizhusten","Tee, Sirup","[T] analog Spitzwegerich; für Breitwegerich nicht monographiert"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"pflaster","titel":"Wegerich-Pflaster für unterwegs","kat":"aeusserlich","beleg":"T","teil":"frisches Blatt","kurz":"Das Blatt zerdrücken und auflegen – bei Stichen, Blasen, kleinen Schürfwunden.","zutaten":["1 sauberes Blatt"],"schritte":["Blatt zerknüllen oder zerkauen, bis Saft austritt.","Auflegen, mit einem zweiten Blatt abdecken, mit Socke oder Pflaster fixieren.","Alle paar Stunden wechseln."],"hinweis":"Tiefe, verschmutzte oder entzündete Wunden gehören zum Arzt."},{"id":"salbe","titel":"Wegerichsalbe","kat":"aeusserlich","beleg":"T","teil":"Blätter","kurz":"Für raue Hände und juckende Haut.","zutaten":["2 Handvoll frische Blätter, angewelkt","200 ml Olivenöl","20 g Bienenwachs"],"schritte":["Blätter klein schneiden, im Öl 2 Stunden bei max. 60 °C ziehen lassen.","Abseihen, Wachs im warmen Öl schmelzen, in Tiegel füllen."],"tipp":"Gut angewelkte Blätter verwenden, sonst schimmelt das Öl."}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"]],"eintraege":[{"id":"chips","titel":"Wegerich-Chips","kat":"kueche","menge":"1 Schale","zeit":"20 Min.","kurz":"Junge Blätter knusprig gebacken.","zutaten":["eine Handvoll junge Blätter","1 EL Öl, Salz"],"schritte":["Blätter mit Öl und Salz mischen.","Bei 150 °C 10–15 Minuten backen, bis sie knusprig sind."]},{"id":"suppe","titel":"Wildkräutersuppe","kat":"kueche","menge":"4 Pers.","zeit":"30 Min.","kurz":"Fein geschnitten mit Brennnessel und Giersch.","zutaten":["1 Handvoll Breitwegerich, fein geschnitten","je 1 Handvoll Brennnessel und Giersch","1 Zwiebel, 2 Kartoffeln, 1 l Brühe"],"schritte":["Zwiebel und Kartoffeln in Brühe weich kochen.","Kräuter 3 Minuten mitziehen lassen, pürieren."],"tipp":"Ältere Blätter sind zäh – nur junge, fein geschnitten verwenden."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"zeiger","titel":"Bodenzeiger lesen","kat":"garten","beleg":"W","teil":"Pflanze","kurz":"Viel Breitwegerich = verdichteter Boden.","zutaten":["Grabegabel"],"schritte":["Boden mit der Grabegabel lockern, nicht umgraben.","Tiefwurzelnde Gründüngung säen (Ölrettich, Lupine).","Wege bewusst anlegen, Beete nicht betreten."]},{"id":"samen","titel":"Samen als Vogelfutter","kat":"garten","beleg":"T","teil":"Samen","kurz":"Die reifen Ähren mögen Finken und Wellensittiche.","zutaten":["reife Ähren im Spätsommer"],"schritte":["Ähren schneiden, trocknen, im Winter anbieten."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Wegerich gehört zu den neun Kräutern des angelsächsischen Neunkräutersegens („Mutter der Kräuter“, Waybroed). In Nordamerika nannten ihn indigene Völker „Fußstapfen des weißen Mannes“, weil er den Wegen der Siedler folgte. [T]"},{"typ":"text","text":"**Storl** zählt den Wegerich zu den Pflanzen, die dem Menschen folgen und dort wachsen, wo er lebt – „zwischen Haustür und Gartentor“ ({{a:storl-denken|Storls Denken}}). Die Idee: Die wichtigsten Heilpflanzen wachsen nicht in fernen Ländern, sondern am eigenen Weg. [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Thema","Einordnung"],"zeilen":[["Verträglichkeit","gut verträglich, auch als Nahrung"],["Allergie","selten; Wegerichpollen kann Heuschnupfen auslösen"],["Verwechslung","Fingerhut-Rosette – tödlich giftig"],["Sammelort","nicht an Hundewegen und Straßen"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["PMC9545407 / Recherchedossier Quellwissen 2026","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9545407/"],["Storl: Heilkräuter und Zauberpflanzen zwischen Haustür und Gartentor (Leseprobe, Narayana)","https://narayana-verlag.imgbolt.de/media/99/83/f0/1787088027/excerpt_24559_de-DE.pdf"]]}]}]},{"id":"p11","nr":"P-11","illu":"portulak","fotos":[],"name":"Portulak","botan":"Portulaca oleracea L.","volksnamen":["Gemüse-Portulak","Burzelkraut","Sauburzel","Kreuzkraut"],"kurz":"Das „Unkraut“ zwischen Pflastersteinen ist eines der nährstoffreichsten Blattgemüse überhaupt: so viel pflanzliche Omega-3-Fettsäure wie kein anderes Blattgemüse, dazu Magnesium und Vitamin E – aber auch viel Oxalsäure.","steckbrief":[["Familie","Portulakgewächse (Portulacaceae)"],["Lebensform","einjährig, sukkulent"],["Größe","niederliegend, Triebe bis 40 cm"],["Blütezeit","Juni–September, nur bei Sonne offen"],["Sammelzeit","Juni–September, junge Triebe vor der Blüte"],["Verwendete Teile","Blätter, Triebspitzen, Stängel"],["Besonders","Omega-3 (ALA) 300–400 mg/100 g, Vitamin E ca. 22 mg/100 g"],["Achtung","Oxalat 670–870 mg/100 g"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"portulak_d","titel":"Detail- und Verwechslungstafel"},{"typ":"standort","licht":5,"wasser":2,"naehrstoffe":3,"ph":"neutral","boden":"sandig, offen, warm; Pflasterfugen, Gemüsebeete","ellenberg":"unsicher","hinweis":"Keimt erst bei warmem Boden (ab ca. 20 °C) – ein Sommerkraut."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** rötlich, fleischig, niederliegend, strahlenförmig ausgebreitet.","**Blätter:** dick, spatelförmig, glänzend, wasserspeichernd (C4- und CAM-Stoffwechsel wie Kakteen).","**Blüten:** klein, gelb, 5 Blütenblätter, öffnen sich nur bei Sonne am Vormittag.","**Samen:** winzig, schwarz, in Deckelkapseln; bis zu 200.000 pro Pflanze, jahrzehntelang keimfähig.","**Wurzel:** kurze Pfahlwurzel mit Faserwurzeln."]},{"typ":"hinweis","text":"**Verwechslung:** Kleine **Wolfsmilch**-Arten wachsen am selben Ort. Wolfsmilch hat **weißen Milchsaft** und ist giftig – Portulak hat klaren Saft. Stängel immer brechen und prüfen."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Nährstoff","pro 100 g frisch","Einordnung"],"zeilen":[["Alpha-Linolensäure (Omega-3)","300–400 mg","höchster Wert aller Blattgemüse [W]"],["Vitamin E","22,2 mg","[W] Uddin et al. 2014"],["Vitamin C","21–27 mg","[W]"],["Kalium","494 mg","[W]"],["Magnesium","68 mg","[W]"],["Calcium","65 mg","teils an Oxalat gebunden"],["Oxalat","671–869 mg","hoch – Blätter und späte Ernte mehr [W]"]]},{"typ"
