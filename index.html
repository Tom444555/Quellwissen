 riechen (Schwefelwasserstoff).","**Krankheiten:** Wurzelfäule durch Pythium und Fusarium, Trauermücken in dauerfeuchter Erde."]},{"typ":"tabelle","kopf":["Zeichen","zu viel Wasser","zu wenig Wasser"],"zeilen":[["Blätter","hängen nach unten gekrümmt, aber fest und prall","hängen schlaff, weich, werden dünn"],["Topf","schwer, Erde dunkel und nass","leicht, Erde zieht sich vom Rand zurück"],["Blattfarbe","gelblich, Mangelbilder trotz Dünger","matt, Ränder trocken"],["Wurzeln","braun, schleimig, muffig","weiß, aber trocken"],["Nach dem Gießen","wird schlimmer","erholt sich in 1–2 Stunden"]]},{"typ":"abschnitt","titel":"Richtig gießen","nummern":["**Topf anheben:** Gegossen wird erst, wenn der Topf deutlich leichter ist (ca. die Hälfte des Wassers verbraucht) bzw. die obersten 3–5 cm trocken sind.","**Durchdringend gießen:** so viel, dass 10–20 % unten herauslaufen; dann wieder abtrocknen lassen – feucht-trocken-Wechsel zieht Luft in die Erde.","**Untersetzer leeren** nach 15–30 Minuten.","**Substrat:** lockere Erde mit 20–30 % Perlite oder Blähton, Stoff- oder Lufttöpfe mit Luft an den Wurzeln.","**Topfgröße passend zur Pflanze:** ein kleiner Sämling in 50 l Erde bleibt tagelang nass – erst klein, dann umtopfen.","**Wassertemperatur:** ca. 18–22 °C; warmes Wasser hält weniger Sauerstoff.","**Freiland:** kein Standort mit Staunässe; im Hochbeet oder auf einem Hügel pflanzen."]},{"typ":"abschnitt","titel":"Wenn es passiert ist","liste":["Nicht mehr gießen, bis der Topf leicht ist; Topf schräg stellen, damit Wasser abläuft.","Ränder der Erde mit einem Stab lockern, Luft hineinbringen.","Bei Wurzelfäule umtopfen, braune Wurzeln abschneiden, frisches, luftiges Substrat.","Erst wieder düngen, wenn neue weiße Wurzeln wachsen."]}]},{"id":"geschlecht","titel":"Geschlecht erkennen","bloecke":[{"typ":"illu","id":"hanf_vorbluete","titel":"Vorblüten an den Knoten"},{"typ":"abschnitt","titel":"Wann und wo schauen","liste":["Etwa 4–8 Wochen nach der Keimung erscheinen an den Knoten, wo Blattstiel und Hauptstängel zusammentreffen, die **Vorblüten** – zuerst im oberen Drittel.","**Lupe** (10–30-fach) hilft sehr.","Männchen zeigen sich meist 1–3 Wochen früher.","Bei fotoperiodischen Sorten werden die Zeichen eindeutig, wenn die Tage kürzer werden; bei Autoflower nach 3–5 Wochen."]},{"typ":"tabelle","kopf":["Was du siehst","Bedeutung"],"zeilen":[["Zwei spitze grüne Blättchen links und rechts am Knoten","Nebenblätter (Stipeln) – haben alle Pflanzen, kein Geschlechtsmerkmal"],["Kleines rundes Kügelchen auf einem Stielchen, oft in Trauben","**männlich** – Pollensack"],["Tropfen- oder birnenförmiger Kelch mit zwei weißen Härchen","**weiblich** – Blüte mit Narben"],["Kelch ohne Härchen","abwarten – oft weiblich, Härchen kommen nach"],["Gelbe, bananenförmige Staubbeutel zwischen weiblichen Blüten","**Zwitter** – kann alle Pflanzen bestäuben"]]},{"typ":"abschnitt","titel":"Was tun?","liste":["**Samen gewünscht** (Nahrung, Öl, eigenes Saatgut): mindestens ein kräftiges Männchen behalten.","**Fasern:** Männchen liefern feinere Fasern und werden zur Blüte geerntet.","**Samenfreie Blüten:** Männchen entfernen, **bevor** sich die Pollensäcke öffnen; Zwitter ebenso entfernen oder die männlichen Blüten herauszupfen.","Ein einziges blühendes Männchen in der Nachbarschaft reicht – der Pollen fliegt kilometerweit."]},{"typ":"illu","id":"hanf_bluete","titel":"Blüten, Drüsenhaare und Samen im Detail"},{"typ":"illu","id":"hanf_hormone","titel":"Hormonwaage: männlich oder weiblich"},{"typ":"abschnitt","titel":"Wann wird das Geschlecht festgelegt?","nummern":["**Bei der Befruchtung:** Bekommt der Samen vom Pollen ein X, wird er XX (weiblich), bei einem Y wird er XY (männlich). Das Verhältnis ist etwa 1 : 1 [W].","**Im Keimling:** Das Geschlecht ist genetisch festgelegt, aber noch unsichtbar – Blätter und Wuchs sehen bei beiden gleich aus.","**Bei der Blühbereitschaft:** Erst wenn die Pflanze „erwachsen“ ist (ca. 4–8 Wochen) und das Blühsignal kommt, entscheidet das Hormongleichgewicht an jedem Knoten, ob eine männliche oder weibliche Blütenanlage entsteht.","**Während der Blüte:** XX-Pflanzen können unter Stress noch einzelne männliche Blüten nachschieben (Zwitter). XY-Pflanzen bleiben fast immer männlich."]},{"typ":"abschnitt","titel":"Die Biochemie dahinter [W]","liste":["**Gibberelline (GA)** fördern männliche Blüten. Behandelt man weibliche Pflanzen mit GA, können sie männliche Blüten bilden; bei männlichen Pflanzen bewirkt das nichts.","**Ethylen** fördert weibliche Blüten. Wird Ethylen gebildet, aber seine Wirkung blockiert, kippt eine XX-Pflanze in Richtung männlich.","**Silberionen** (Silberthiosulfat, kolloidales Silber) besetzen den Ethylen-Rezeptor – deshalb bilden besprühte weibliche Pflanzen männliche Blüten mit fruchtbarem Pollen. In einem Versuch (Flajšman et al. 2021) brachte tägliches Sprühen von 30 ppm kolloidalem Silber bis zu 379 männliche Blüten pro Pflanze.","**Cytokinine und Auxin** wirken ebenfalls in Richtung weiblich.","**Gene:** In Genomstudien fanden sich Abschnitte mit Genen für den Auxin- und Gibberellin-Haushalt (u. a. ARF2, ARF5, GAI) – Geschlecht ist also XY plus ein ganzes Netz von Genen.","**Spontan:** Bis zu ca. 10 % weiblicher Pflanzen können ohne erkennbaren Grund einzelne männliche Blüten bilden."]},{"typ":"tabelle","kopf":["Einfluss","Wirkung auf weibliche Pflanzen (XX)","Warum"],"zeilen":[["Lange Tage, Dauerlicht vor der Blüte","eher männliche Blüten","mehr Gibberellin-Signal"],["Licht in der Dunkelphase","Zwitterblüten","Blühsignal gestört, Stresshormone"],["Hitze über ca. 30 °C","mehr männliche Blüten","Ethylenwirkung sinkt, GA steigt"],["Trockenstress, Nährstoffmangel","mehr männliche Blüten","Stress verschiebt das Hormongleichgewicht"],["Verletzungen, grobes Beschneiden spät in der Blüte","Zwitter möglich","Wundsignale"],["Sehr späte Ernte","männliche Blüten („Bananen“) am Ende","Notprogramm zur Selbstbestäubung"],["Kühle Nächte, kurze Tage, genug Stickstoff, hohe Luftfeuchte","mehr weiblich","ältere Versuche an Faserhanf [W/T]"]]},{"typ":"text","text":"**Feminisierte Samen:** Eine XX-Pflanze wird mit Silber zur Bildung männlicher Blüten gebracht. Ihr Pollen trägt nur X-Chromosomen; bestäubt man damit eine andere XX-Pflanze, sind die Nachkommen fast alle weiblich. **Autoflower-Pflanzen** enthalten Gene von Cannabis ruderalis, die das Blühen an das Alter statt an die Nachtlänge koppeln."},{"typ":"hinweis","text":"Ursachen für Zwitter: Hitze über ca. 30 °C, Licht in der Dunkelphase (Straßenlaterne!), Wassermangel, Verletzungen, sehr späte Ernte und die Genetik."}]},{"id":"bestaeubung","titel":"Bestäubung & Samen","bloecke":[{"typ":"illu","id":"hanf_bestaeubung","titel":"Windbestäubung"},{"typ":"abschnitt","titel":"Eigenes Saatgut gewinnen","nummern":["Ein gesundes Männchen und ein oder mehrere Weibchen derselben Sorte nebeneinander blühen lassen.","Wenn sich die Pollensäcke öffnen (gelber Staub), wird bestäubt – nur ein Ast lässt sich gezielt bestäuben, indem man Pollen mit einem Pinsel aufträgt und den Ast in eine Papiertüte steckt.","Männchen danach entfernen.","Samen reifen in 4–6 Wochen: Tragblätter platzen auf, Samen werden dunkel, hart und marmoriert.","Ernten, nachtrocknen, kühl, dunkel und trocken lagern – keimfähig mehrere Jahre."]},{"typ":"tabelle","kopf":["Samentyp","Entsteht durch","Ergebnis"],"zeilen":[["regulär","Männchen × Weibchen","ca. 50 % ♂, 50 % ♀"],["feminisiert","Weibchen zur Pollenbildung gebracht × Weibchen","fast nur ♀, etwas mehr Zwitter-Neigung"],["Autoflower","Kreuzung mit Cannabis ruderalis","blüht nach Alter, nicht nach Tageslänge"]]}]},{"id":"ernte","titel":"Ernte","bloecke":[{"typ":"illu","id":"hanf_tag","titel":"Tageslänge im Saarland"},{"typ":"tabelle","kopf":["Ernteziel","Wann","Wie"],"zeilen":[["Fasern","zur männlichen Blüte (Faser am feinsten), spätestens bei Samenansatz","Stängel bodennah abschneiden, entblättern, zum Rösten auslegen"],["Samen","wenn ca. zwei Drittel der Samen dunkel und hart sind (September)","Blütenstände abschneiden, nachtrocknen, ausdreschen, sieben"],["Blüten","wenn die meisten Narbenfäden braun und eingezogen sind und die Harzköpfchen von klar zu milchig wechseln (September–Oktober)","Pflanze oder Äste abschneiden, große Blätter entfernen"]]},{"typ":"hinweis","text":"Vor der Ernte Wetterbericht prüfen: Nach einer Regenperiode im Herbst steigt das Grauschimmel-Risiko stark. Lieber ein paar Tage früher ernten als alles zu verlieren."}]},{"id":"trocknen","titel":"Trocknen & Lagern","bloecke":[{"typ":"illu","id":"hanf_trocknen","titel":"Trocknen und Reifen"},{"typ":"abschnitt","titel":"Trocknen","liste":["Äste kopfüber an einer Schnur aufhängen, in einem dunklen, luftigen Raum.","Richtwerte: 15–21 °C, 50–60 % Luftfeuchte, 7–14 Tage.","Fertig, wenn dünne Stiele beim Biegen knacken statt sich zu biegen."]},{"typ":"abschnitt","titel":"Reifen (Curing)","liste":["Getrocknetes Material in Schraubgläser füllen (ca. drei Viertel voll).","Die ersten 1–2 Wochen täglich einige Minuten öffnen, damit Restfeuchte entweicht; riecht es nach Heu oder Ammoniak, länger lüften.","Insgesamt 2–8 Wochen: Chlorophyll baut sich weiter ab, Aroma wird runder."]},{"typ":"abschnitt","titel":"Lagern","liste":["Kühl, dunkel, luftdicht: Licht, Wärme und Sauerstoff wandeln THC langsam in CBN um.","Besitzgrenze 50 g getrocknet am Wohnsitz beachten – Überschuss muss vernichtet werden."]}]},{"id":"faser","titel":"Fasern & Samen verarbeiten","bloecke":[{"typ":"illu","id":"hanf_faser","titel":"Vom Stängel zur Faser"},{"typ":"abschnitt","titel":"Fasern gewinnen","nummern":["**Ernten** zur Blüte der Männchen; Blätter abstreifen.","**Rösten:** Stängel 2–6 Wochen flach auf eine Wiese legen und mehrmals wenden (Tauröste); Tau, Pilze und Bakterien zersetzen das Pektin, das die Fasern ans Holz klebt. Alternativ in Wasser (Wasserröste, 1–2 Wochen, stinkt).","**Trocknen:** bis die Stängel spröde sind.","**Brechen:** auf einer Hanfbreche oder über einer Kante knicken – der Holzteil (Schäben) zerbricht.","**Schwingen:** Schäben herausschlagen.","**Hecheln:** durch einen Nagelkamm ziehen: lange Fasern für Garn und Seil, kurze (Werg) zum Stopfen und Dämmen."]},{"typ":"tabelle","kopf":["Produkt","Verwendung"],"zeilen":[["Langfaser","Garn, Seil, Gewebe"],["Werg (Kurzfaser)","Dichtung (Sanitär!), Dämmung, Polster"],["Schäben","Tiereinstreu, Mulch, Hanfkalk-Baustoff"],["Samen","Lebensmittel, Öl, Vogelfutter, Saatgut"],["Presskuchen","Hanfprotein, Tierfutter"]]},{"typ":"text","text":"**Hanföl** pressen geht im Kleinen mit einer Hand-Ölpresse; aus 1 kg Samen erhält man grob 200–300 ml Öl. Kühl und dunkel lagern."},{"typ":"hinweis","text":"Hanf-Werg ist bis heute ein klassisches Dichtmaterial für Gewindeverbindungen in der Sanitärinstallation."}]},{"id":"chemie","titel":"Biochemie","bloecke":[{"typ":"illu","id":"hanf_cannabinoide","titel":"Wie Cannabinoide entstehen"},{"typ":"abschnitt","titel":"Was in der Pflanze passiert","liste":["**Kurztagspflanze:** Ein Lichtrezeptor (Phytochrom) misst die Nachtlänge. Werden die Nächte länger als ca. 9–10 Stunden, wird das Blühsignal gebildet.","**Drüsenhaare** auf den weiblichen Tragblättern sind kleine Chemiefabriken: Im Köpfchen entstehen Cannabinoide und Terpene als Schutz gegen Fraß, UV-Licht und Pilze.","**Cannabinoid-Weg:** Olivetolsäure + Geranylpyrophosphat → CBGA → je nach Enzym THCA, CBDA oder CBCA. Welches Enzym aktiv ist, legt die Genetik fest (Nutzhanf: fast nur CBDA).","**Säureformen:** In der lebenden Pflanze liegen fast nur THCA/CBDA vor. Erst Wärme spaltet CO₂ ab (Decarboxylierung) – das gilt auch für Lebensmittel mit Blütenanteil.","**Alterung:** Licht und Sauerstoff wandeln THC in CBN um.","**Terpene:** Myrcen, Limonen, Pinen, β-Caryophyllen – dieselben Stoffgruppen wie in Hopfen, Kiefer und Zitrusfrüchten ({{b:terpene|Terpene}})."]},{"typ":"abschnitt","titel":"Im menschlichen Körper","liste":["Der Körper besitzt ein **Endocannabinoid-System** mit eigenen Botenstoffen (Anandamid, 2-AG) und Rezeptoren (CB1 vor allem im Gehirn, CB2 im Immunsystem).","THC aktiviert CB1 und wirkt dadurch auf Gedächtnis (Hippocampus), Bewegung (Kleinhirn), Belohnung und Appetit.","CBD bindet kaum an CB1 und berauscht nicht.","Mehr: {{b:cannabinoide|Cannabinoide}}."]},{"typ":"abschnitt","titel":"Samen und Fasern","liste":["Hanfsamenöl enthält ca. 75–80 % mehrfach ungesättigte Fettsäuren, darunter γ-Linolensäure – deshalb oxidiert es schnell.","Das Speichereiweiß **Edestin** ist leicht verdaulich und enthält alle essenziellen Aminosäuren.","Hanffasern bestehen zu rund 70 % aus Cellulose; Pektin verklebt sie mit dem Holz – das Rösten löst diese Verbindung mikrobiell."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Konsumcannabisgesetz (KCanG)","https://www.gesetze-im-internet.de/kcang/"],["CSC Deutschland: Cannabiskontrollgesetz 2026","https://cscsdeutschland.de/cannabiskontrollgesetz-2026"],["Wissenschaftliche Dienste des Bundestags: WD 5 – 165/24 (Nutzhanf)","https://www.bundestag.de/resource/blob/1042780/be749330137a0f32f6ee41b00cc75299/WD-5-165-24-pdf.pdf"],["topagrar: Nutzhanfanbau – die Nische schrumpft","https://www.topagrar.com/perspektiven/news/nutzhanfanbau-die-nische-schrumpft-20018503.html"],["WESSLING: Hanf als Lebensmittel","https://de.wessling-group.com/fileadmin/user_upload/global/services/food/WESSLING_Lebensmittelbrief_Hanf_neues_Superfood.pdf"]]}]}]},{"id":"blueten","titel":"Essbare Blüten","nr":"S-07","illu":"bluetentafel","fotos":[],"text":"Zwölf essbare Blüten aus Garten und Wiese: Geschmack, Erntezeit, Verwendung, Rezepte – und welche giftigen Doppelgänger man sicher ausschließen muss.","stichworte":["essbare Blüten","Blüten","Zucchiniblüte","Kapuzinerkresse","Löwenzahn","Lavendel","Korianderblüten","Stiefmütterchen","Schnittlauchblüten","Basilikumblüten","Ringelblume","Veilchen","Holunderblüten","Gänseblümchen","kandierte Blüten","Blütensirup","Blütensalz"],"pflanzen":["p03#rezepte","p05#rezepte","p04#rezepte"],"kurz":"Blüten bringen Farbe, Duft und Geschmack auf den Teller – von pfeffrig (Kapuzinerkresse) über zwiebelig (Schnittlauch) bis honigsüß (Löwenzahn, Holunder). Viele wachsen ohnehin im Garten oder auf der Wiese.","steckbrief":[["Sammelzeit","an trockenen Vormittagen, wenn der Tau abgetrocknet ist und die Blüten frisch geöffnet sind"],["Verarbeiten","sofort; Blüten welken in Stunden"],["Waschen","nur abschütteln oder kurz in kaltes Wasser tauchen"],["Nicht essen","Blüten aus Blumenladen und Gartencenter (Pflanzenschutzmittel)"],["Grundregel","nur essen, was man sicher bestimmt hat"],["Mehr","{{s:knospen|Knospen & junge Triebe}}"]],"reiter":[{"id":"ueberblick","titel":"Überblick","bloecke":[{"typ":"illu","id":"bluetentafel","titel":"Zwölf essbare Blüten"},{"typ":"tabelle","kopf":["Blüte","Geschmack","Erntezeit","Verwendung","Im Kompendium"],"zeilen":[["**Zucchiniblüte** (Cucurbita pepo)","mild, leicht süßlich-nussig","Juni–September, morgens frisch geöffnet","gefüllt und frittiert, in Risotto, roh in Salat","{{s:mischkultur|Mischkultur: Kürbis}}"],["**Kapuzinerkresse** (Tropaeolum majus)","scharf-pfeffrig wie Kresse (Senföle)","Juni–Oktober","Salat, Kräuterbutter, Essig; Knospen als Kapern","{{s:knospen-rezepte-kapern|Falsche Kapern}}"],["**Löwenzahn** (Taraxacum officinale)","Blütenblätter süßlich-honigartig, Grün bitter","April–Mai","Löwenzahnhonig (Sirup), Salat, Gelee","{{p:p03|Löwenzahn}}"],["**Lavendel** (Lavandula angustifolia)","blumig-herb, leicht seifig, sehr intensiv","Juni–August, kurz vor dem Aufblühen","sparsam in Gebäck, Zucker, Sirup, Eis, Kräuter der Provence","–"],["**Korianderblüten** (Coriandrum sativum)","wie Koriandergrün, milder","Juni–August","über Salate, Currys, Suppen, Fisch","–"],["**Stiefmütterchen** (Viola × wittrockiana, Wildform V. tricolor)","mild, salatartig, leicht süß","März–Oktober","Salat, Deko auf Torten, kandiert, in Eiswürfeln","–"],["**Schnittlauchblüten** (Allium schoenoprasum)","zwiebelig-scharf, frisch","Mai–Juli","Blüten in Einzelblütchen zupfen: Salat, Quark, Kräuteressig (färbt rosa)","{{s:mischkultur|Mischkultur: Zwiebelgewächse}}"],["**Basilikumblüten** (Ocimum basilicum)","wie Basilikum, etwas milder und süßer","Juli–September","Pesto, Salat, Tomatengerichte, Öl","–"],["**Ringelblume** (Calendula officinalis)","mild, leicht herb-würzig","Juni–Oktober","Blütenblätter in Salat, Reis („Safran der Armen“), Butter, Tee","{{p:p05|Ringelblume}}"],["**Veilchen** (Viola odorata)","süß, parfümiert","März–April","kandierte Veilchen, Sirup, Likör, Salat","–"],["**Holunderblüten** (Sambucus nigra)","süß-blumig, muskatellerartig","Mai–Juni, voll aufgeblüht","Sirup, Holunderküchle, Sekt, Tee","{{p:p04|Holunder}}"],["**Gänseblümchen** (Bellis perennis)","nussig, leicht herb; Knospen kräftiger","fast ganzjährig, Hauptzeit März–Juni","Salat, Kräuterquark, Butter, falsche Kapern aus Knospen","{{s:knospen-rezepte-kapern|Falsche Kapern}}"]]}]},{"id":"garten","titel":"Aus dem Garten","bloecke":[{"typ":"text","text":"Diese Blüten wachsen im Gemüse- und Kräutergarten oder im Balkonkasten – sicher bestimmt und ungespritzt."},{"typ":"karten","art":"anwendung","filter":[],"eintraege":[{"id":"zucchinibluete","titel":"Zucchiniblüte","kat":"alle","beleg":"T","teil":"Cucurbita pepo","kurz":"Geschmack: mild, leicht süßlich-nussig.","zutaten":["**Erntezeit:** Juni–September, morgens frisch geöffnet","**Verwendung:** gefüllt und frittiert, in Risotto, roh in Salat"],"schritte":["Männliche Blüten (langer dünner Stiel, ohne Fruchtansatz) ernten, weibliche bringen die Früchte. Bitter schmeckende Blüten oder Früchte nie essen (Cucurbitacin)."]},{"id":"kapuzinerkresse","titel":"Kapuzinerkresse","kat":"alle","beleg":"T","teil":"Tropaeolum majus","kurz":"Geschmack: scharf-pfeffrig wie Kresse (Senföle).","zutaten":["**Erntezeit:** Juni–Oktober","**Verwendung:** Salat, Kräuterbutter, Essig; Knospen als Kapern"],"schritte":["Blätter ebenfalls essbar; viel davon reizt Magen und Nieren (Senföle)."]},{"id":"lavendel","titel":"Lavendel","kat":"alle","beleg":"T","teil":"Lavandula angustifolia","kurz":"Geschmack: blumig-herb, leicht seifig, sehr intensiv.","zutaten":["**Erntezeit:** Juni–August, kurz vor dem Aufblühen","**Verwendung:** sparsam in Gebäck, Zucker, Sirup, Eis, Kräuter der Provence"],"schritte":["Echter Lavendel; Schopflavendel ist kampferreich und für die Küche ungeeignet."]},{"id":"korianderblueten","titel":"Korianderblüten","kat":"alle","beleg":"T","teil":"Coriandrum sativum","kurz":"Geschmack: wie Koriandergrün, milder.","zutaten":["**Erntezeit:** Juni–August","**Verwendung:** über Salate, Currys, Suppen, Fisch"],"schritte":["**Doldenblütler-Verwechslung:** Gefleckter Schierling und Hundspetersilie sind tödlich giftig – nur aus eigener Aussaat ernten."]},{"id":"stiefmuetterchen","titel":"Stiefmütterchen","kat":"alle","beleg":"T","teil":"Viola × wittrockiana, Wildform V. tricolor","kurz":"Geschmack: mild, salatartig, leicht süß.","zutaten":["**Erntezeit:** März–Oktober","**Verwendung:** Salat, Deko auf Torten, kandiert, in Eiswürfeln"],"schritte":["Das Wilde Stiefmütterchen ist zugleich Heilpflanze (traditionell bei Hautleiden)."]},{"id":"schnittlauchblueten","titel":"Schnittlauchblüten","kat":"alle","beleg":"T","teil":"Allium schoenoprasum","kurz":"Geschmack: zwiebelig-scharf, frisch.","zutaten":["**Erntezeit:** Mai–Juli","**Verwendung:** Blüten in Einzelblütchen zupfen: Salat, Quark, Kräuteressig (färbt rosa)"],"schritte":["Ganze Köpfe sind zäh – zerpflücken."]},{"id":"basilikumblueten","titel":"Basilikumblüten","kat":"alle","beleg":"T","teil":"Ocimum basilicum","kurz":"Geschmack: wie Basilikum, etwas milder und süßer.","zutaten":["**Erntezeit:** Juli–September","**Verwendung:** Pesto, Salat, Tomatengerichte, Öl"],"schritte":["Blütenstände abknipsen verlängert auch die Blatternte."]},{"id":"ringelblume","titel":"Ringelblume","kat":"alle","beleg":"T","teil":"Calendula officinalis","kurz":"Geschmack: mild, leicht herb-würzig.","zutaten":["**Erntezeit:** Juni–Oktober","**Verwendung:** Blütenblätter in Salat, Reis („Safran der Armen“), Butter, Tee"],"schritte":["Korbblütler-Allergie beachten."]}]}]},{"id":"wiese","titel":"Von Wiese und Strauch","bloecke":[{"typ":"text","text":"Wildblüten sind oft aromatischer, wachsen aber neben giftigen Doppelgängern. Nur sammeln, was man sicher kennt, und nicht an Straßen, Hundewiesen oder gedüngten Flächen."},{"typ":"karten","art":"anwendung","filter":[],"eintraege":[{"id":"loewenzahn","titel":"Löwenzahn","kat":"alle","beleg":"T","teil":"Taraxacum officinale","kurz":"Geschmack: Blütenblätter süßlich-honigartig, Grün bitter.","zutaten":["**Erntezeit:** April–Mai","**Verwendung:** Löwenzahnhonig (Sirup), Salat, Gelee"],"schritte":["Nur Zungenblüten verwenden, der grüne Kelch ist bitter."]},{"id":"veilchen","titel":"Veilchen","kat":"alle","beleg":"T","teil":"Viola odorata","kurz":"Geschmack: süß, parfümiert.","zutaten":["**Erntezeit:** März–April","**Verwendung:** kandierte Veilchen, Sirup, Likör, Salat"],"schritte":["Nur das duftende März-Veilchen hat das typische Aroma."]},{"id":"holunderblueten","titel":"Holunderblüten","kat":"alle","beleg":"T","teil":"Sambucus nigra","kurz":"Geschmack: süß-blumig, muskatellerartig.","zutaten":["**Erntezeit:** Mai–Juni, voll aufgeblüht","**Verwendung:** Sirup, Holunderküchle, Sekt, Tee"],"schritte":["Stiele, Blätter und rohe Beeren meiden (Sambunigrin). Zwerg-Holunder (Attich) mit aufrechten Dolden und rotvioletten Staubbeuteln ist giftig."]},{"id":"gaensebluemchen","titel":"Gänseblümchen","kat":"alle","beleg":"T","teil":"Bellis perennis","kurz":"Geschmack: nussig, leicht herb; Knospen kräftiger.","zutaten":["**Erntezeit:** fast ganzjährig, Hauptzeit März–Juni","**Verwendung:** Salat, Kräuterquark, Butter, falsche Kapern aus Knospen"],"schritte":["Nicht an Hundewiesen und gedüngten Rasen sammeln."]}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** Für Storl ist das Gänseblümchen mehr als Salatdeko: Germanen, Kelten und Slawen stellten sich die Seele als Gans vor, das „Gänsemädchen“ hütet die Seelen auf der grünen Himmelswiese – mehr dazu in {{a:storl-videos-kenfm2018|Storl bei KenFM (2018)}}."}]},{"id":"ernten","titel":"Ernten & Haltbarmachen","bloecke":[{"typ":"abschnitt","titel":"Richtig ernten","nummern":["Am späten Vormittag ernten, wenn der Tau getrocknet ist – dann ist das Aroma am stärksten.","Nur frisch geöffnete, makellose Blüten nehmen.","In einem luftigen Korb oder auf einem feuchten Tuch transportieren, nicht in der Plastiktüte.","Insekten ausschütteln, nur bei Bedarf kurz in kaltes Wasser tauchen und auf Küchenpapier trocknen.","Stempel und Staubgefäße bei großen Blüten (Zucchini) entfernen; bei Korbblütlern nur die Zungenblüten zupfen."]},{"typ":"tabelle","kopf":["Methode","Geeignet für","So geht’s"],"zeilen":[["Frisch halten","alle","in einer Dose zwischen feuchtem Küchenpapier im Kühlschrank, 1–2 Tage"],["Trocknen","Ringelblume, Lavendel, Kornblume","luftig im Schatten, dann dunkel in Gläsern ({{s:trocknen|Kräuter trocknen}})"],["Kandieren","Veilchen, Stiefmütterchen, Rosen","mit Eiweiß bepinseln, in feinem Zucker wälzen, 1–2 Tage trocknen"],["Einfrieren","Stiefmütterchen, Veilchen, Borretsch","in Eiswürfelformen mit Wasser"],["Blütensalz und -zucker","Lavendel, Ringelblume, Kornblume","Blütenblätter mit Salz oder Zucker mischen, trocknen lassen"],["Sirup","Holunder, Löwenzahn, Veilchen","siehe Rezepte"]]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"]],"eintraege":[{"id":"salat","titel":"Bunter Blütensalat","kat":"kueche","menge":"4 Pers.","zeit":"15 Min.","kurz":"Der Klassiker – Blüten erst kurz vor dem Servieren darüber.","zutaten":["gemischte Blattsalate","je eine Handvoll Kapuzinerkresse, Gänseblümchen, Stiefmütterchen, Ringelblumen-Blütenblätter","Schnittlauchblüten, zerzupft","Essig, Öl, Honig, Senf, Salz"],"schritte":["Salat waschen und trocken schleudern.","Dressing anrühren und unterheben.","Blüten zum Schluss lose darüber verteilen – nicht mehr mischen, sonst fallen sie zusammen."]},{"id":"zucchini","titel":"Gefüllte Zucchiniblüten","kat":"kueche","menge":"4 Pers.","zeit":"30 Min.","kurz":"Ricotta-Füllung, kurz ausgebacken.","zutaten":["8 männliche Zucchiniblüten","250 g Ricotta, 1 Ei, Parmesan, Zitronenschale, Basilikum","für den Teig: 100 g Mehl, 150 ml kaltes Sprudelwasser, Salz","Öl zum Ausbacken"],"schritte":["Blüten öffnen, Stempel herauszupfen.","Füllung mischen, mit einem Löffel einfüllen, Blütenblätter zudrehen.","Durch den Teig ziehen und in heißem Öl 2–3 Minuten goldbraun backen."]},{"id":"holunder","titel":"Holunderblütensirup","kat":"vorrat","menge":"ca. 2 l","zeit":"15 Min. + 2 Tage","kurz":"Der Duft des Frühsommers.","zutaten":["20 voll aufgeblühte Dolden","1,5 l Wasser","1,5 kg Zucker","2 Bio-Zitronen in Scheiben","30 g Zitronensäure (optional, für längere Haltbarkeit)"],"schritte":["Wasser mit Zucker aufkochen, abkühlen lassen.","Dolden ausschütteln (nicht waschen), mit Zitronen in den Sirup legen.","Abgedeckt 2 Tage kühl ziehen lassen, täglich umrühren.","Durch ein Tuch abseihen, kurz aufkochen, heiß in sterile Flaschen füllen."],"tipp":"Dicke Stiele vorher abschneiden."},{"id":"loewenzahn","titel":"Löwenzahnhonig (Blütensirup)","kat":"vorrat","menge":"ca. 3 Gläser","zeit":"1 Std. + Nacht","kurz":"Vegane Honig-Alternative.","zutaten":["4 Handvoll Löwenzahnblüten (nur das Gelbe)","1 l Wasser","1 kg Zucker","1 Zitrone"],"schritte":["Blüten mit Wasser und Zitronenscheiben aufkochen, über Nacht ziehen lassen.","Abseihen, gut ausdrücken.","Mit Zucker 1–2 Stunden sanft einkochen, bis er honigartig fließt (Gelierprobe).","Heiß in Gläser füllen."]},{"id":"veilchen","titel":"Kandierte Veilchen","kat":"vorrat","menge":"1 kleines Glas","zeit":"20 Min. + 1–2 Tage","kurz":"Edle Tortendeko.","zutaten":["Veilchen- oder Stiefmütterchenblüten","1 Eiweiß","feiner Zucker"],"schritte":["Eiweiß leicht verquirlen.","Blüten mit einem feinen Pinsel rundum bestreichen.","In Zucker wälzen, auf Backpapier 1–2 Tage trocknen lassen.","Luftdicht lagern."]},{"id":"butter","titel":"Blütenbutter","kat":"kueche","menge":"1 Rolle","zeit":"10 Min.","kurz":"Bunt, würzig, schnell.","zutaten":["125 g weiche Butter","2 EL Blüten (Schnittlauch, Kapuzinerkresse, Ringelblume, Gänseblümchen)","Salz, etwas Zitronenschale"],"schritte":["Blüten fein schneiden bzw. zupfen.","Mit Butter und Salz verkneten, zu einer Rolle formen, kühlen."]},{"id":"lavendelzucker","titel":"Lavendelzucker","kat":"vorrat","menge":"1 Glas","zeit":"5 Min. + 2 Wochen","kurz":"Für Gebäck und Eis.","zutaten":["2 EL getrocknete Lavendelblüten","250 g Zucker"],"schritte":["Mischen, verschlossen 2 Wochen ziehen lassen.","Bei Bedarf Blüten aussieben."],"tipp":"Sehr sparsam dosieren – zu viel schmeckt seifig."}]}]},{"id":"vorsicht","titel":"Verwechslungen","bloecke":[{"typ":"text","text":"Viele Zierpflanzen und Wildpflanzen haben giftige Blüten. Grundregel: nur essen, was sicher bestimmt ist – im Zweifel nicht."},{"typ":"tabelle","kopf":["Giftig","Verwechselbar mit / Gefahr"],"zeilen":[["Gefleckter Schierling, Hundspetersilie","Koriander-, Dill- und andere Doldenblüten – tödlich giftig"],["Maiglöckchen","Blätter mit Bärlauch, Blüten als Deko – Herzgifte"],["Fingerhut, Eisenhut, Rittersporn","Gartenstauden – stark giftig"],["Goldregen, Oleander, Engelstrompete","Zierpflanzen – stark giftig"],["Herbstzeitlose","Krokusähnliche Blüten im Herbst – Colchicin"],["Zwerg-Holunder (Attich)","Holunderblüten; Attich ist eine Staude mit rotvioletten Staubbeuteln"],["Blüten aus dem Handel","Zierpflanzen sind meist mit Pflanzenschutzmitteln behandelt"]]},{"typ":"hinweis","text":"Allergiker (Korbblütler wie Ringelblume, Gänseblümchen, Löwenzahn) zuerst kleine Mengen probieren."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Deutschland summt: Faltblatt Essbare Blütenpflanzen","https://www.deutschland-summt.de/files/media_ds/pdfs/2023/pdf_faltblatt_essbare-bluetenpflanzen_c-alain-hamm.pdf"],["Öko-Test: Essbare Blüten – welche genießbar und welche giftig sind","https://www.oekotest.de/essen-trinken/Essbare-Blueten-Welche-sind-geniessbar-Welche-giftig_12039_1.html"],["aponet: Zarte Deko – essbare Blüten","https://www.aponet.de/artikel/zarte-deko-essbare-blueten-20605"]]},{"typ":"text","text":"Anregung: Bildtafel „Essbare Blüten“ des Zinuna Magazins (Facebook). Die Zeichnungen hier sind eigene Nachzeichnungen."}]}]},{"id":"tinkturen","titel":"Tinkturen – Herstellung, Biochemie, Anwendung","nr":"S-08","illu":"tinktur_ablauf","fotos":[],"text":"Alkoholische Pflanzenauszüge selbst herstellen: welche Stoffe bei welchem Alkoholgehalt in Lösung gehen, Ansetzen, Abseihen, Dosieren in Tropfen, Lagerung – mit einem Schwerpunkt Tinnitus.","stichworte":["Tinktur","Tinkturen","Mazeration","Perkolation","Auszug","Ethanol","Weingeist","Korn","Tropfen","Urtinktur","Glycerit","Oxymel","Tinnitus","Ohrgeräusche","Ginkgo","Johanniskrauttinktur","Ringelblumentinktur","Melisse","Baldrian","Weißdorn"],"pflanzen":["p08#heilkunde","p05#heilkunde","p07#heilkunde","p03#heilkunde"],"kurz":"Eine Tinktur ist ein Auszug aus Pflanzenteilen mit einem Gemisch aus Alkohol und Wasser. Der Alkoholgehalt entscheidet, welche Inhaltsstoffe herausgelöst werden – und macht den Auszug jahrelang haltbar.","steckbrief":[["Grundverhältnis","getrocknetes Kraut 1:5 (1 Teil Kraut, 5 Teile Flüssigkeit), frisches Kraut etwa 1:2"],["Alkohol","40 % (Korn, Wodka) für die meisten Kräuter; 60–70 % für Harze und ätherische Öle"],["Ziehzeit","2–6 Wochen, dunkel, täglich schütteln"],["Haltbarkeit","ab etwa 20 % Alkohol mehrere Jahre, dunkel und kühl"],["Übliche Menge","20–40 Tropfen 2–3 × täglich in etwas Wasser"],["Mehr","{{s:auszug|Kaltwasserauszug}}, {{s:trocknen|Kräuter trocknen}}"]],"reiter":[{"id":"ueberblick","titel":"Überblick","bloecke":[{"typ":"illu","id":"tinktur_ablauf","titel":"Vom Kraut zur Tinktur in fünf Schritten"},{"typ":"text","text":"Tinkturen sind die haltbarste Form, Heilpflanzen über das Jahr zu bringen. Alkohol löst viele Wirkstoffe besser als Wasser, tötet Keime ab und stoppt Enzyme, die Inhaltsstoffe sonst abbauen. Ein Glas Ringelblumen oder Johanniskraut im Sommer ergibt Tropfen für Jahre."},{"typ":"tabelle","kopf":["Begriff","Bedeutung"],"zeilen":[["**Droge**","das getrocknete, verwendete Pflanzenteil (pharmazeutischer Begriff, nichts mit Rauschmitteln)"],["**Menstruum**","das Auszugsmittel, z. B. Ethanol 70 %"],["**DEV**","Droge-Extrakt-Verhältnis, z. B. 1:5 = 1 g Kraut auf 5 ml Tinktur"],["**Mazeration**","Ansetzen und Ziehenlassen – die Hausmethode"],["**Perkolation**","Flüssigkeit tropft langsam durch das Kraut – Apothekenmethode, stärkerer Auszug"],["**Urtinktur**","Ausgangsstoff der Homöopathie nach dem Homöopathischen Arzneibuch (HAB), meist aus Frischpflanzen"],["**Glycerit**","alkoholfreier Auszug mit Glycerin und Wasser"],["**Oxymel**","Auszug mit Essig und Honig"]]},{"typ":"hinweis","text":"Tinkturen enthalten Alkohol. 30 Tropfen einer 40-%-Tinktur enthalten grob 0,3 g Alkohol – wenig, aber für trockene Alkoholiker, Kinder, in der Schwangerschaft und bei bestimmten Medikamenten ein Thema."}]},{"id":"biochemie","titel":"Biochemie des Auszugs","bloecke":[{"typ":"illu","id":"tinktur_polar","titel":"Welche Stoffgruppen bei welchem Alkoholgehalt gut in Lösung gehen (Richtwerte)"},{"typ":"abschnitt","titel":"Warum Alkohol und Wasser zusammen?","liste":["**Polarität:** Wasser ist sehr polar und löst Zucker, Schleim, Gerbstoffe und Salze. Ethanol ist weniger polar und löst fettähnliche Stoffe wie ätherische Öle, Harze und Farbstoffe. Ein Gemisch deckt einen breiten Bereich ab.","**Glykoside:** Viele Wirkstoffe sind an Zucker gebunden ({{b:flavonoide|Flavonoid-Glykoside}}, {{b:saponine|Saponine}}). Der Zuckerteil macht sie wasserliebend – sie lösen sich am besten bei 30–60 % Alkohol.","**Enzymstopp:** Ab etwa 20 % Alkohol werden pflanzeneigene Enzyme gehemmt, die sonst Glykoside spalten oder Stoffe oxidieren. Deshalb bleibt eine Tinktur stabil, ein Tee nicht.","**Konservierung:** Ab etwa 20 % wachsen kaum Bakterien und Pilze; 40 % gilt als sicher.","**Zellwand:** Alkohol entzieht den Zellen Wasser, die Membranen werden durchlässig, die Inhaltsstoffe diffundieren nach außen. Fein zerkleinern vergrößert die Oberfläche und beschleunigt das.","**Gleichgewicht:** Die Lösung geht so lange weiter, bis innen und außen gleich konzentriert sind. Darum hilft Schütteln, und darum gibt Auspressen am Ende noch viel Wirkstoff frei."]},{"typ":"tabelle","kopf":["Alkoholgehalt","Geeignet für","Beispiele"],"zeilen":[["**25–40 %** (Korn, Wodka)","Bitterstoffe, Gerbstoffe, Glykoside, Flavonoide","{{p:p03|Löwenzahn}}, {{p:p07|Schafgarbe}}, Melisse, Brennnessel, {{p:p16|Wermut}}"],["**50–60 %**","gemischte Wirkstoffe, Frischpflanzen","{{p:p08|Johanniskraut}} (frisch), Weißdorn, Baldrian"],["**70 %**","ätherische Öle, Harze, Carotinoide","{{p:p05|Ringelblume}}, Thymian, Salbei, Rosmarin"],["**80–90 %**","sehr harzige Drogen","Propolis, Myrrhe, Weihrauch"],["**unter 20 %**","nur kurz haltbar – lieber Glycerit oder Tee","Schleimdrogen: Eibisch, Malve, Spitzwegerich"]]},{"typ":"abschnitt","titel":"Frisch oder getrocknet?","liste":["**Frische Pflanzen** bestehen zu 70–85 % aus Wasser. Dieses Wasser verdünnt den Alkohol. Darum setzt man Frischkraut mit hochprozentigem Alkohol (Weingeist 70–96 %) etwa 1:2 an – am Ende stellt sich ein Gehalt um 50–70 % ein.","**Rechenbeispiel:** 100 g frisches Kraut (≈ 80 g Wasser) + 200 ml Weingeist 96 % ergeben grob 280 ml Flüssigkeit mit etwa 70 % Alkohol.","**Getrocknete Pflanzen** sind gleichmäßiger und lassen sich genau dosieren: 1:5 mit 40–70 %.","Manche Stoffe gibt es nur frisch: {{b:hypericin|Hypericin}} im Johanniskraut färbt eine Frischpflanzen-Tinktur tiefrot; Hyperforin ist licht- und luftempfindlich und zerfällt beim Trocknen teilweise."]},{"typ":"abschnitt","titel":"Was die Tinktur verändert","liste":["**Licht** zerstört Hyperforin, Chlorophyll und manche Flavonoide – Braunglas.","**Sauerstoff** oxidiert Gerbstoffe und Phenole; Flaschen voll füllen.","**Wärme** über etwa 30 °C lässt ätherische Öle entweichen; kühl lagern.","**Trübung** und Bodensatz sind normal (ausgefallene Gerbstoffe, Schleim); einmal filtern genügt."]}]},{"id":"herstellung","titel":"Herstellung","bloecke":[{"typ":"abschnitt","titel":"Grundrezept Mazeration (getrocknetes Kraut)","nummern":["Kraut grob zerkleinern (Mörser, Messer, Mixer kurz).","In ein sauberes Schraubglas füllen, z. B. 50 g Kraut.","Mit 250 ml Alkohol (40–70 %) übergießen – alles muss bedeckt sein, sonst schimmelt es oben.","Verschließen, beschriften (Pflanze, Alkohol, Verhältnis, Datum).","2–6 Wochen dunkel bei Zimmertemperatur stehen lassen, täglich kurz schütteln.","Durch ein Tuch abseihen und den Rückstand kräftig auspressen.","1–2 Tage stehen lassen, dann vom Bodensatz abgießen oder durch einen Kaffeefilter filtern.","In Braunglas-Tropfflaschen füllen und beschriften."]},{"typ":"abschnitt","titel":"Frischpflanzen-Tinktur","nummern":["Am Vormittag ernten, wenn der Tau getrocknet ist; nicht waschen, nur ausschütteln.","Fein schneiden, Glas locker bis oben füllen.","Mit Weingeist 70–96 % bis knapp über das Kraut auffüllen (etwa 1:2).","Nach einem Tag nachfüllen, falls das Kraut zusammengesunken ist und herausschaut.","Weiter wie oben."]},{"typ":"tabelle","kopf":["Material","Hinweis"],"zeilen":[["**Alkohol**","Korn, Wodka (38–40 %) aus dem Laden; Weingeist (Ethanol 96 %) aus der Apotheke, zum Verdünnen mit abgekochtem Wasser. **Kein** Brennspiritus und kein Isopropanol – giftig."],["**Gläser**","Schraubgläser, sauber und trocken; zum Lagern Braunglas-Tropfflaschen"],["**Siebtuch**","Mulltuch, Nussmilchbeutel oder Kaffeefilter"],["**Etiketten**","Pflanze, Pflanzenteil, frisch/getrocknet, Alkohol %, Verhältnis, Datum"]]},{"typ":"abschnitt","titel":"Alkohol verdünnen","liste":["Faustregel (Mischungskreuz): Für 70 % aus 96 % nimmt man 70 Teile Weingeist und füllt mit Wasser auf 96 Teile auf, also etwa 730 ml Weingeist + 270 ml Wasser für 1 Liter.","Beim Mischen schrumpft das Volumen etwas – mit Wasser auffüllen, nicht abmessen und addieren.","Für 40 % aus 96 %: etwa 420 ml Weingeist + 580 ml Wasser."]},{"typ":"abschnitt","titel":"Alkoholfreie Alternativen","liste":["**Glycerit:** 60 % pflanzliches Glycerin + 40 % Wasser, Ansatz wie oben; süßlich, für Kinder geeignet, hält etwa 1 Jahr. Löst Harze und Öle schlechter.","**Essigauszug / Oxymel:** Apfelessig (oft mit Honig), gut für Mineralstoffe und Bitterstoffe, hält einige Monate.","**Alkohol abdampfen:** Tropfen in eine Tasse heißes Wasser geben und einige Minuten stehen lassen – ein Teil des Alkohols verdunstet."]}]},{"id":"anwendung","titel":"Anwendung & Dosierung","bloecke":[{"typ":"tabelle","kopf":["Frage","Antwort"],"zeilen":[["**Wie viel?**","meist 20–40 Tropfen (etwa 1–2 ml), 2–3 × täglich, wenn nicht anders angegeben"],["**Womit?**","in ein halbes Glas Wasser oder Tee; bittere Tinkturen vor dem Essen pur auf die Zunge"],["**Tropfen pro ml**","je nach Tropfer und Alkoholgehalt etwa 20–50 Tropfen; im Zweifel einmal auszählen"],["**Wie lange?**","bei Alltagsbeschwerden einige Tage bis Wochen; dann Pause oder neu bewerten"],["**Äußerlich**","verdünnt für Umschläge, Mundspülungen, Einreibungen (Ringelblume, Arnika, Myrrhe)"]]},{"typ":"abschnitt","titel":"Typische Einsatzbereiche","liste":["**Verdauung:** Bittertinkturen ({{b:bitterstoffe|Bitterstoffe}}) – Löwenzahn, Schafgarbe, Wermut, Enzian – 10–20 Tropfen vor dem Essen.","**Nerven, Schlaf:** Melisse, Lavendel, Baldrian, Passionsblume, Hopfen.","**Stimmung:** {{p:p08|Johanniskraut}} – nur in Arzneimittelqualität verlässlich dosiert; viele Wechselwirkungen.","**Haut, Wunden:** {{p:p05|Ringelblume}}, Arnika (nur äußerlich), Schafgarbe – verdünnt als Umschlag.","**Mund und Rachen:** Myrrhe, Salbei, Ratanhia – zum Pinseln oder Gurgeln.","**Herz und Kreislauf:** Weißdorn – traditionell zur Unterstützung bei nachlassender Herzleistung im Alter, nur nach ärztlicher Abklärung."]},{"typ":"hinweis","text":"**Wechselwirkungen:** Johanniskraut beschleunigt den Abbau vieler Medikamente (u. a. Pille, Blutverdünner, Immunsuppressiva, manche Antidepressiva). Ginkgo und hoch dosierte Weidenrinde können die Blutungsneigung erhöhen. Bei regelmäßiger Medikamenteneinnahme vorher in der Apotheke nachfragen."}]},{"id":"tinnitus","titel":"Beispiel Tinnitus","bloecke":[{"typ":"text","text":"Tinnitus ist ein Ohrgeräusch (Pfeifen, Rauschen, Brummen), das keine äußere Schallquelle hat. Er ist ein Symptom, keine eigene Krankheit. Häufige Auslöser sind Lärmschäden, Altersschwerhörigkeit, Hörsturz, Verspannungen im Kiefer- und Nackenbereich und Stress. Wie stark er stört, hängt sehr davon ab, wie das Gehirn das Geräusch bewertet."},{"typ":"hinweis","text":"**Zuerst abklären lassen:** Plötzlicher Tinnitus, vor allem einseitig oder mit Hörverlust, Druck im Ohr oder Schwindel, gehört zeitnah zum HNO-Arzt (möglicher Hörsturz). Pulsierender Tinnitus im Herzschlag-Takt sollte ebenfalls ärztlich untersucht werden. Tinkturen ersetzen das nicht."},{"typ":"abschnitt","titel":"Was die Forschung sagt","liste":["**Leitlinie:** Für chronischen Tinnitus empfiehlt die deutsche S3-Leitlinie vor allem Beratung, tinnitusspezifische kognitive Verhaltenstherapie und – bei Hörminderung – Hörgeräte. Eine spezifische Arzneitherapie gibt es nicht.","**Ginkgo:** Am besten untersucht ist der standardisierte Ginkgo-Spezialextrakt EGb 761 (2 × 120 mg täglich, mindestens 12 Wochen). Laut Pharmazeutischer Zeitung ist das unter den Mitteln zur Linderung die beste Studienlage; ein Cochrane-Review von 2022 (4 Studien, 1.543 Teilnehmende) fand dagegen keinen überzeugenden Nachweis, wenn Tinnitus die Hauptbeschwerde ist.","**Sonst:** Für Melatonin, Zink oder Vitamin B3 ist die Datenlage schwach; sie werden gelegentlich zur Linderung genannt."]},{"typ":"abschnitt","titel":"Warum keine selbst gemachte Ginkgo-Tinktur","liste":["Ginkgoblätter enthalten neben den gewünschten Flavonoiden und Terpenlactonen (Ginkgolide, Bilobalid) auch **Ginkgolsäuren**. Diese sind allergieauslösend und zellschädigend.","Im Spezialextrakt EGb 761 werden die Ginkgolsäuren in mehreren Schritten fast vollständig entfernt (unter 5 ppm). Eine Haustinktur aus Blättern enthält sie dagegen in voller Menge – und die Studienergebnisse gelten nur für den Spezialextrakt.","**Fazit:** Ginkgo bei Tinnitus nur als Arzneimittel aus der Apotheke; wegen erhöhter Blutungsneigung nicht ohne Rücksprache zusammen mit Blutverdünnern und nicht vor Operationen."]},{"typ":"abschnitt","titel":"Wo Tinkturen sinnvoll helfen können","liste":["Tinnitus wird bei **Stress und Schlafmangel** lauter empfunden. Hier setzen beruhigende Pflanzen an – sie wirken nicht auf das Ohr, sondern auf die Anspannung.","**Melisse** und **Lavendel**: beruhigend, ausgleichend.","**Passionsblume**, **Baldrian**, **Hopfen**: zum Einschlafen.","**Weißdorn**: traditionell für Herz und Durchblutung; ersetzt keine Abklärung.","**Nacken und Kiefer:** Rosmarin- oder Arnikatinktur verdünnt zum Einreiben verspannter Muskeln (nicht auf verletzte Haut)."]},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"abendtinktur","titel":"Abend-Tinktur Melisse & Passionsblume","kat":"innerlich","menge":"ca. 250 ml","zeit":"10 Min. + 4 Wochen","kurz":"Zur Entspannung und zum Einschlafen, wenn das Ohrgeräusch abends lauter wirkt.","zutaten":["20 g getrocknete Melissenblätter","15 g getrocknetes Passionsblumenkraut","10 g getrocknete Lavendelblüten","250 ml Korn oder Wodka (40 %)"],"schritte":["Kräuter zerkleinern und in ein Glas füllen.","Mit dem Alkohol übergießen, verschließen, 4 Wochen dunkel ziehen lassen, täglich schütteln.","Abseihen, auspressen, filtern, in Braunglas abfüllen.","Anwendung: 30 Tropfen in etwas warmem Wasser etwa 30 Minuten vor dem Schlafengehen."],"tipp":"Lavendel sparsam – er dominiert schnell.","hinweis":"Kann müde machen; nicht vor dem Autofahren. Nicht für Kinder."},{"id":"nackenoel","titel":"Einreibung für Nacken & Kiefer","kat":"aeusserlich","menge":"ca. 100 ml","zeit":"10 Min. + 3 Wochen","kurz":"Lockert Muskelverspannungen, die Ohrgeräusche verstärken können.","zutaten":["15 g getrocknete Rosmarinblätter","100 ml Weingeist 70 %","zum Anwenden: etwas Pflanzenöl oder Wasser"],"schritte":["Rosmarin mit dem Alkohol ansetzen, 3 Wochen ziehen lassen, abseihen.","Zum Einreiben einige Tropfen in Öl oder auf ein feuchtes Tuch geben und Nacken, Schultern und Kiefergelenk sanft massieren."],"hinweis":"Nicht in die Augen, nicht auf verletzte Haut; Augen- und Schleimhautkontakt meiden."}]},{"typ":"abschnitt","titel":"Was sonst hilft","liste":["Stille meiden: leise Hintergrundgeräusche (Natur, Rauschen) lenken das Gehirn ab.","Gehörschutz bei Lärm; laute Kopfhörer meiden.","Regelmäßige Bewegung, Entspannungsverfahren, gute Schlafgewohnheiten.","Hörtest: Bei Hörminderung kann ein Hörgerät den Tinnitus deutlich in den Hintergrund rücken.","Selbsthilfe: Deutsche Tinnitus-Liga (DTL)."]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"johanniskraut","titel":"Johanniskraut-Tinktur (frisch)","kat":"innerlich","menge":"ca. 300 ml","zeit":"20 Min. + 4–6 Wochen","kurz":"Tiefrote Tinktur aus den Blüten um Johanni.","zutaten":["frisch geöffnete Blüten und Knospen (Glas locker voll)","Weingeist 70 % bis knapp darüber"],"schritte":["Blüten an einem sonnigen Vormittag pflücken, nicht waschen.","Glas füllen, mit Weingeist bedecken, 4–6 Wochen dunkel ziehen lassen.","Abseihen, auspressen, filtern, dunkel lagern."],"hinweis":"Viele Wechselwirkungen mit Medikamenten; macht die Haut lichtempfindlicher. Siehe {{p:p08|Johanniskraut}}."},{"id":"ringelblume","titel":"Ringelblumen-Tinktur","kat":"aeusserlich","menge":"ca. 250 ml","zeit":"10 Min. + 3 Wochen","kurz":"Für Umschläge bei kleinen Wunden und entzündeter Haut.","zutaten":["50 g getrocknete Ringelblumenblüten","250 ml Weingeist 70 %"],"schritte":["Ansetzen, 3 Wochen ziehen lassen, abseihen.","Für Umschläge 1 Teelöffel auf eine Tasse abgekochtes Wasser."],"tipp":"70 % löst auch die harzigen Bestandteile und Carotinoide."},{"id":"bitter","titel":"Bittertropfen","kat":"innerlich","menge":"ca. 250 ml","zeit":"10 Min. + 3 Wochen","kurz":"Vor schweren Mahlzeiten, regt Speichel, Magensaft und Galle an.","zutaten":["15 g Löwenzahnwurzel","10 g Schafgarbenkraut","5 g Wermutkraut","5 g Orangenschale","250 ml Korn 40 %"],"schritte":["Alles zerkleinern und ansetzen, 3 Wochen ziehen lassen.","Abseihen und abfüllen.","10–20 Tropfen 15 Minuten vor dem Essen auf die Zunge oder in wenig Wasser."],"hinweis":"Nicht bei Magengeschwür, Gallensteinen oder in der Schwangerschaft (Wermut)."},{"id":"melisse","titel":"Melissen-Tinktur","kat":"innerlich","menge":"ca. 250 ml","zeit":"10 Min. + 3 Wochen","kurz":"Beruhigend, ausgleichend, auch bei nervösem Magen.","zutaten":["50 g getrocknete Melissenblätter (oder frisch 1:2 mit Weingeist 70 %)","250 ml Korn 40 %"],"schritte":["Ansetzen, 3 Wochen ziehen lassen, abseihen.","20–30 Tropfen 2–3 × täglich in Wasser."]},{"id":"myrrhe","titel":"Myrrhen-Tinktur","kat":"aeusserlich","menge":"ca. 100 ml","zeit":"10 Min. + 2 Wochen","kurz":"Zum Pinseln bei Zahnfleischentzündung und kleinen Mundwunden.","zutaten":["20 g Myrrhe (Harz, zerstoßen)","100 ml Weingeist 90 %"],"schritte":["Harz zerstoßen, mit dem Weingeist ansetzen, 2 Wochen ziehen lassen, filtern.","Unverdünnt mit einem Wattestäbchen auftupfen oder 20 Tropfen in ein Glas Wasser zum Spülen."],"tipp":"Harze brauchen viel Alkohol – darunter löst sich Myrrhe kaum."},{"id":"glycerit","titel":"Kinder-Glycerit Melisse","kat":"innerlich","menge":"ca. 200 ml","zeit":"10 Min. + 3 Wochen","kurz":"Alkoholfreie Variante.","zutaten":["30 g getrocknete Melisse","120 ml pflanzliches Glycerin","80 ml abgekochtes Wasser"],"schritte":["Glycerin und Wasser mischen, über die Kräuter gießen.","3 Wochen ziehen lassen, abseihen, kühl lagern, innerhalb eines Jahres verbrauchen."],"tipp":"Für Kinder ab dem Schulalter; Menge vorher mit Kinderarzt oder Apotheke klären."}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"abschnitt","titel":"Grundregeln","liste":["Nur Pflanzen verwenden, die sicher bestimmt sind.","Nur Trinkalkohol oder Weingeist aus der Apotheke – nie Brennspiritus, Isopropanol oder vergällten Alkohol.","Stark wirksame Giftpflanzen (Eisenhut, Fingerhut, Tollkirsche, Herbstzeitlose) gehören nicht in Haustinkturen.","Arnika nur äußerlich und verdünnt.","Beinwell und andere Pflanzen mit {{b:pyrrolizidinalkaloide|Pyrrolizidinalkaloiden}} nur äußerlich.","Kinder, Schwangere, Stillende und Menschen mit Alkoholproblem: alkoholfreie Formen oder Rücksprache.","Etikettieren und kindersicher aufbewahren."]},{"typ":"hinweis","text":"Tinkturen sind kein Ersatz für ärztliche Behandlung. Bei anhaltenden oder plötzlich auftretenden Beschwerden – auch beim Tinnitus – ärztlich abklären lassen."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Pharmazeutische Zeitung: Den Ton im Ohr leiser machen","https://www.pharmazeutische-zeitung.de/den-ton-im-ohr-leiser-machen-128053/seite/2/"],["Cochrane Review (2022): Ginkgo biloba for tinnitus","https://www.cochrane.org/CD003852"],["AWMF S3-Leitlinie Chronischer Tinnitus (Reg.-Nr. 017-064)","https://register.awmf.org/de/leitlinien/detail/017-064"]]}]}]},{"id":"jauche","titel":"Pflanzenjauche","text":"Gärender Pflanzenauszug als Flüssigdünger. Kraut wird in Wasser angesetzt, gärt 1–3 Wochen und wird verdünnt (meist 1:10) auf den Boden gegossen. Gesteinsmehl bindet Geruch. Gefäße aus Kunststoff, Holz oder Ton, kein Metall.","pflanzen":["p01#selbstversorgung-jauche"]},{"id":"auszug","titel":"Kaltwasserauszug und Brühe","text":"Kurz angesetzte, nicht gärende Auszüge zum Spritzen. Kaltwasserauszug: 12–24 Stunden ziehen lassen. Brühe: Kraut einweichen und anschließend aufkochen. Beide frisch verwenden.","pflanzen":["p01#selbstversorgung-kaltwasserauszug"]},{"id":"trocknen","titel":"Kräuter trocknen","text":"Kräuter vormittags bei trockenem Wetter ernten, nicht waschen wenn sauber. In Bündeln kopfüber oder locker ausgebreitet an einem schattigen, luftigen Ort trocknen, bis die Blätter rascheln. Dunkel, trocken und luftdicht lagern und innerhalb eines Jahres verbrauchen. Im Dörrgerät höchstens 40 °C.","pflanzen":["p01#rezepte-salz"]},{"id":"einfrieren","titel":"Blanchieren und Einfrieren","text":"Grünes Blattgemüse kurz (30–60 Sekunden) in kochendes Wasser geben, in Eiswasser abschrecken, ausdrücken und portioniert einfrieren. Haltbar etwa 6–10 Monate. Eignet sich für Suppe, Spinat und Teig.","pflanzen":["p01#rezepte-spinat"]},{"id":"samen","titel":"Samen ernten","text":"Samenstände im Spätsommer schneiden, wenn sie bräunlich werden und schwer hängen. Kopfüber in einer Papiertüte trocknen, dann ausreiben und durch ein Sieb von Stielen trennen. Dunkel und trocken lagern.","pflanzen":["p01#rezepte-samen-crunch","p01#heilkunde-samen"]}],"biochemie":[{"id":"amine","titel":"Biogene Amine","text":"Stickstoffhaltige Botenstoffe, die auch im menschlichen Körper vorkommen. In den Brennhaaren: **Histamin** erweitert die feinen Blutgefäße (Rötung) und lässt Flüssigkeit ins Gewebe treten (Quaddeln, Juckreiz). **Acetylcholin** reizt Nervenenden. **Serotonin** verstärkt das Schmerzempfinden.","stichworte":["Histamin","Serotonin","Acetylcholin","Brennhaare","Quaddeln"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"ameisensaeure","titel":"Ameisensäure","text":"Einfachste organische Säure (HCOOH). Sie kommt in den Brennhaaren vor, aber nur in sehr kleiner Menge und gilt heute nicht mehr als Hauptursache des Brennens.","stichworte":["Säure","HCOOH"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"flavonoide","titel":"Flavonoide","text":"Große Gruppe gelber bis roter Pflanzenfarbstoffe aus der Familie der Polyphenole. Beispiele: Quercetin, Kämpferol, Rutin. Im Labor wirken sie antioxidativ und entzündungshemmend; wie viel davon im Körper ankommt, ist unklar.","stichworte":["Quercetin","Kämpferol","Rutin","Polyphenole","antioxidativ"],"pflanzen":["p01#inhaltsstoffe","p02#inhaltsstoffe"]},{"id":"kaffeoylaepfelsaeure","titel":"Kaffeoyläpfelsäure","text":"Phenolsäure aus Kaffeesäure und Äpfelsäure. Typisch für die Brennnessel und wird zur Qualitätsprüfung von Brennnesselblättern herangezogen, zusammen mit Chlorogensäure.","stichworte":["Phenolsäure","Chlorogensäure","Kaffeesäure"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"kieselsaeure","titel":"Kieselsäure","text":"Siliziumverbindungen, die Pflanzen in Zellwände einlagern. Die Spitzen der Brennhaare sind verkieselt und brechen deshalb wie Glas. In der Volksheilkunde gilt Kieselsäure als gut für Haare, Haut und Bindegewebe [T].","stichworte":["Silizium","Silikat"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"chlorophyll","titel":"Chlorophyll","text":"Grüner Blattfarbstoff, mit dem Pflanzen Licht für die Photosynthese einfangen. Im Zentrum des Moleküls sitzt ein Magnesium-Atom. Brennnesseln sind besonders reich daran.","stichworte":["Blattgrün","Photosynthese","Magnesium"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"carotinoide","titel":"Carotinoide","text":"Gelb-orange Farbstoffe wie Beta-Carotin (Vorstufe von Vitamin A) und Lutein. Fettlöslich: zusammen mit etwas Öl oder Butter gegessen, nimmt der Körper sie besser auf.","stichworte":["Beta-Carotin","Lutein","Provitamin A","Vitamin A"],"pflanzen":["p01#inhaltsstoffe","p02#inhaltsstoffe"]},{"id":"vitamin-k","titel":"Vitamin K","text":"Fettlösliches Vitamin (in Pflanzen als K1, Phyllochinon), nötig für die Blutgerinnung. Grünes Blattgemüse wie Brennnessel enthält viel davon. Wer Vitamin-K-Antagonisten wie Marcumar nimmt, sollte gleichmäßige Mengen essen und Änderungen mit dem Arzt besprechen.","stichworte":["Phyllochinon","Gerinnung","Marcumar","Blutverdünner"],"pflanzen":["p01#sicherheit"]},{"id":"phytosterole","titel":"Phytosterole","text":"Pflanzliche Sterole, dem Cholesterin im Aufbau ähnlich. Beta-Sitosterin kommt in der Brennnesselwurzel vor und wird als einer der Stoffe diskutiert, die bei Prostatabeschwerden helfen.","stichworte":["Beta-Sitosterin","Sitosterin","Sterole","Prostata"],"pflanzen":["p01#heilkunde-wurzeltee"]},{"id":"lektine","titel":"Lektine","text":"Eiweiße, die sich an Zuckerstrukturen binden. In der Brennnesselwurzel: UDA (Urtica-dioica-Agglutinin), das in Laborversuchen untersucht wird.","stichworte":["UDA","Agglutinin","Eiweiß"],"pflanzen":["p01#inhaltsstoffe"]},{"id":"nitrat","titel":"Nitrat","text":"Stickstoffverbindung aus dem Boden. Pflanzen an überdüngten Standorten speichern viel davon in den Blättern. Deshalb besser an ungedüngten Orten sammeln.","stichworte":["Stickstoff","Dünger"],"pflanzen":["p01#botanik"]},{"id":"bitterstoffe","titel":"Bitterstoffe","text":"Sammelbegriff für bitter schmeckende Pflanzenstoffe, oft Sesquiterpenlactone (z. B. Taraxacin im Löwenzahn). Sie reizen Bitterrezeptoren auf der Zunge und lösen über Reflexe Speichel, Magensaft und Galle aus. Deshalb wirken Bittertees am besten ungesüßt und vor dem Essen. Aus vielen Gemüsen wurden sie weggezüchtet.","stichworte":["Sesquiterpenlactone","Taraxacin","Lactucopicrin","Calendulin","Verdauung","Galle","Appetit"],"pflanzen":["p03#inhaltsstoffe","p05#inhaltsstoffe"]},{"id":"inulin","titel":"Inulin","text":"Ein Ballaststoff aus Fruchtzucker-Ketten, den Pflanzen wie Löwenzahn, Chicorée und Topinambur in den Wurzeln speichern. Der Mensch kann ihn nicht verdauen; er gelangt in den Dickdarm und füttert dort nützliche Bakterien (präbiotisch). In großen Mengen kann er Blähungen machen.","stichworte":["Ballaststoff","Präbiotikum","Fruktane","Darmflora","Mikrobiom"],"pflanzen":["p03#inhaltsstoffe"]},{"id":"anthocyane","titel":"Anthocyane","text":"Wasserlösliche rote bis blauviolette Farbstoffe aus der Gruppe der Flavonoide, z. B. in Holunderbeeren, Heidelbeeren und Rotkohl. Ihre Farbe hängt vom Säuregrad ab: sauer rot, basisch blau. Im Labor wirken sie stark antioxidativ.","stichworte":["Sambucyanin","Farbstoff","Polyphenole","antioxidativ"],"pflanzen":["p04#inhaltsstoffe"]},{"id":"sambunigrin","titel":"Sambunigrin (cyanogene Glykoside)","text":"Ein cyanogenes Glykosid in Samen, unreifen Beeren, Blättern und Rinde des Holunders. Beim Kauen und Verdauen kann daraus Blausäure (Cyanwasserstoff) entstehen, die Übelkeit, Erbrechen und Durchfall auslöst. Erhitzen über 80 °C zerstört bzw. verflüchtigt den Stoff weitgehend. Ähnliche Verbindungen stecken in bitteren Mandeln und Steinobstkernen (Amygdalin).","stichworte":["Blausäure","Cyanid","cyanogen","Glykosid","Amygdalin","giftig"],"pflanzen":["p04#sicherheit"]},{"id":"saponine","titel":"Saponine","text":"Pflanzenstoffe, die mit Wasser schäumen wie Seife (lateinisch sapo). In der Ringelblume als Triterpensaponine (Calenduloside). Sie wirken an der Haut entzündungshemmend und können Schleim lösen. Im Darm werden sie kaum aufgenommen.","stichworte":["Triterpene","Faradiol","Calendulosid","Seife","schaumbildend"],"pflanzen":["p05#inhaltsstoffe"]},{"id":"iridoide","titel":"Iridoide (Aucubin)","text":"Bitter schmeckende Pflanzenstoffe, die Pflanzen gegen Fraßfeinde schützen. Aucubin im Spitzwegerich wird beim Zerkleinern gespalten; das Spaltprodukt wirkt im Labor antibakteriell. Aucubin ist hitzeempfindlich und zerfällt beim langsamen Trocknen – dann werden die Blätter schwarz.","stichworte":["Aucubin","Catalpol","Iridoidglykoside","antibakteriell"],"pflanzen":["p06#inhaltsstoffe"]},{"id":"schleimstoffe","titel":"Schleimstoffe","text":"Quellfähige Vielfachzucker (Polysaccharide), die mit Wasser einen schützenden Film bilden. Sie legen sich auf gereizte Schleimhäute in Mund und Rachen und dämpfen so den Hustenreiz. Kaltauszüge erhalten sie besonders gut. Beispiele: Spitzwegerich, Eibisch, Leinsamen.","stichworte":["Mucilago","Polysaccharide","Reizhusten","Kaltauszug"],"pflanzen":["p06#inhaltsstoffe"]},{"id":"azulene","titel":"Azulene (Chamazulen)","text":"Blaue Verbindungen, die beim Erhitzen oder bei der Wasserdampfdestillation aus farblosen Vorstufen (Proazulenen) entstehen – daher das tiefblaue Öl von Schafgarbe und Kamille. Chamazulen wirkt entzündungshemmend. Nur bestimmte Schafgarben-Kleinarten bilden Proazulene.","stichworte":["Chamazulen","Proazulene","Achillicin","blau","entzündungshemmend","Kamille"],"pflanzen":["p07#inhaltsstoffe"]},{"id":"hypericin","titel":"Hypericin & Hyperforin","text":"Die Leitstoffe des Johanniskrauts. **Hypericin** ist ein roter Farbstoff, der beim Zerreiben der Blüten sichtbar wird; er macht Haut lichtempfindlich (phototoxisch). **Hyperforin** gilt als wesentlich für die stimmungsaufhellende Wirkung und regt gleichzeitig Leberenzyme an – daher die vielen Wechselwirkungen mit Medikamenten.","stichworte":["Hypericin","Hyperforin","phototoxisch","CYP3A4","Wechselwirkungen","Rotöl","Depression"],"pflanzen":["p08#inhaltsstoffe","p08#sicherheit"]},{"id":"gluten","titel":"Gluten (Kleber)","text":"Das Klebereiweiß von Weizen, Dinkel, Emmer, Einkorn, Roggen und Gerste. Es besteht aus Prolaminen (im Weizen Gliadin, im Roggen Secalin, in der Gerste Hordein, im Hafer Avenin) und Gluteninen. Gliadine machen den Teig dehnbar, Glutenine elastisch. Mit Wasser und Kneten bilden sie ein Netz, das Gärgase hält. Dinkel hat mehr Gliadin und weniger Glutenin als Weizen: sein Teig ist dehnbarer, aber weniger stabil. Bei Zöliakie löst vor allem die Gliadin-Fraktion die Entzündung aus.","stichworte":["Gliadin","Glutenin","Kleber","Prolamine","Secalin","Hordein","Avenin","Zöliakie","Seitan"],"pflanzen":[]},{"id":"staerke","titel":"Stärke","text":"Der Hauptbestandteil des Mehls: lange Ketten aus Traubenzucker (Amylose und Amylopektin). Beim Backen nimmt sie ab ca. 60 °C Wasser auf und verkleistert – die Krume wird fest. Beim Abkühlen und Lagern kristallisiert sie langsam wieder (Retrogradation): Brot wird altbacken. Kochstücke und Sauerteig verzögern das.","stichworte":["Amylose","Amylopektin","Verkleisterung","altbacken","Retrogradation","Amylase"],"pflanzen":[]},{"id":"beta-glucane","titel":"Beta-Glucane","text":"Lösliche Ballaststoffe vor allem in Hafer und Gerste. Sie bilden im Darm ein Gel, das Cholesterin und Gallensäuren bindet und den Blutzuckeranstieg dämpft. In der EU ist zugelassen: 3 g Beta-Glucane täglich aus Hafer oder Gerste können einen erhöhten Cholesterinspiegel senken.","stichworte":["Ballaststoff","Hafer","Gerste","Cholesterin","Blutzucker"],"pflanzen":[]},{"id":"phytinsaeure","titel":"Phytinsäure","text":"Der Phosphorspeicher im Getreidekorn, vor allem in den Randschichten. Sie bindet Eisen, Zink, Calcium und Magnesium und macht sie schlechter verfügbar. Keimen, Einweichen, Sauerteig und lange Teigführung aktivieren das Enzym Phytase, das Phytinsäure abbaut.","stichworte":["Phytat","Phytase","Mineralstoffe","Vollkorn","Sauerteig"],"pflanzen":[]},{"id":"fagopyrin","titel":"Fagopyrin","text":"Roter Farbstoff im Kraut und in der Fruchtschale des Buchweizens, chemisch verwandt mit dem Hypericin des Johanniskrauts. In größeren Mengen gegessen macht er die Haut lichtempfindlich (Fagopyrismus) – bekannt vor allem bei Weidetieren. Geschälte Buchweizenkörner enthalten nur sehr wenig; Vorsicht bei großen Mengen Buchweizenkraut, -sprossen oder -grün.","stichworte":["Fagopyrismus","Buchweizen","phototoxisch","Lichtempfindlichkeit"],"pflanzen":[]},{"id":"amylasen","titel":"Amylasen","text":"Enzyme, die Stärke in Zucker zerlegen. Sie sind im Speichel, im Darm und im Getreidekorn aktiv, besonders im keimenden Korn (Malz). Beta-Amylase arbeitet am besten bei ca. 62–65 °C und bildet vergärbaren Malzzucker, Alpha-Amylase bei ca. 70–72 °C. Beim Brotbacken liefern sie der Hefe Futter; im Roggen sind sie so aktiv, dass Sauerteig sie bremsen muss.","stichworte":["Enzyme","Malz","Maischen","Verzuckerung","Maltose","Roggen"],"pflanzen":[]},{"id":"cn-verhaeltnis","titel":"C:N-Verhältnis","text":"Das Verhältnis von Kohlenstoff (C) zu Stickstoff (N) in organischem Material. Bodenlebewesen brauchen etwa 25–30 Teile C auf 1 Teil N. Material mit viel C (Holz, Stroh) bindet beim Abbau vorübergehend Stickstoff aus dem Boden (Stickstoffsperre); Material mit wenig C (Gras, Mist, Brennnessel) setzt ihn frei. Grundlage für Kompost, Mulch, Jauche und das Hügelbeet.","stichworte":["Kohlenstoff","Stickstoff","Stickstoffsperre","Immobilisierung","Kompost","Rotte","Humus","Lignin"],"pflanzen":[]},{"id":"cumarine","titel":"Cumarine","text":"Duftende Pflanzenstoffe, bekannt vom Waldmeister- und Heugeruch. In Doldenblütlern wie Giersch kommen verschiedene Cumarin-Abkömmlinge vor. In großen Mengen kann reines Cumarin die Leber belasten; in Wildgemüse in üblichen Mengen spielt das keine Rolle.","stichworte":["Waldmeister","Duftstoff"],"pflanzen":["p02#inhaltsstoffe"]},{"id":"polyacetylene","titel":"Polyacetylene","text":"Fettlösliche Pflanzenstoffe mit Dreifachbindungen, typisch für Doldenblütler wie Möhre und Giersch (z. B. Falcarinol). Sie dienen der Pflanze als Abwehrstoff, können bei empfindlichen Menschen die Haut reizen und werden im Labor auf entzündungshemmende Wirkung untersucht.","stichworte":["Falcarinol","Doldenblütler"],"pflanzen":["p02#inhaltsstoffe"]},{"id":"lithium","titel":"Lithium","nr":"B-Li","text":"Leichtestes Metall, in Spuren in Gestein, Wasser und Nahrung. In hoher Dosis ein bewährtes Psychiatrie-Medikament. Ob es in kleinen Mengen ein lebenswichtiges Spurenelement ist, ist umstritten; Dr. Michael Nehls vertritt das in seinem Buch „Das Lithium-Komplott“.","stichworte":["Li","Spurenelement","Nehls","Lithium-Komplott","Lithiumorotat","Mikrodosis","Trinkwasser","Alzheimer","Demenz","Depression","Suizid"],"pflanzen":[],"kurz":"Leichtestes Metall der Welt und Spurenelement in Wasser und Nahrung. In hoher Dosis ist es ein bewährtes Medikament gegen bipolare Störungen. Ob kleine Mengen lebenswichtig sind und vor Demenz oder Depression schützen, ist eine der spannendsten offenen Fragen der Ernährungsmedizin.","steckbrief":[["Symbol","Li, Ordnungszahl 3, Alkalimetall"],["Vorkommen","Gestein, Boden, Grund- und Mineralwasser, Pflanzen"],["Essenziell?","in der EU nicht anerkannt, keine amtliche Zufuhrempfehlung"],["Vorgeschlagene Zufuhr","1 mg pro Tag für Erwachsene (Vorschlag Schrauzer 2002, nicht amtlich)"],["Als Medikament","Lithiumsalze, verschreibungspflichtig, mit Blutspiegelkontrolle"],["Als Nahrungsergänzung","in Deutschland und der EU nicht erlaubt; Lithiumorotat ist kein zugelassenes Novel Food"],["Typische Aufnahme","je nach Region sehr unterschiedlich, von Mikrogramm bis einige Milligramm pro Tag"]],"reiter":[{"id":"grundlagen","titel":"Grundlagen","bloecke":[{"typ":"text","text":"Lithium wirkt im Körper nicht als Baustein, sondern als Regler: Es greift in Signalwege von Nervenzellen ein. Am besten untersucht sind zwei Angriffspunkte."},{"typ":"abschnitt","titel":"Wie Lithium in der Zelle wirkt","liste":["**GSK-3β-Hemmung [W]:** Lithium bremst das Enzym Glykogensynthase-Kinase 3 beta. Es ist an der Bildung der Tau-Fasern und Eiweißablagerungen bei Alzheimer beteiligt. Das ist im Labor gut belegt, beim Menschen aber noch nicht als Schutz nachgewiesen.","**Inositol-Signalweg [W]:** Lithium hemmt die Inositol-Monophosphatase und dämpft damit überaktive Botenstoff-Signale. Das gilt als ein Grund für die stimmungsstabilisierende Wirkung.","**Nervenschutz und Neubildung [W]:** In Zell- und Tierversuchen fördert Lithium das Überleben von Nervenzellen und die Bildung neuer Nervenzellen im Hippocampus."]},{"typ":"abschnitt","titel":"Formen","liste":["**Lithiumcarbonat, Lithiumcitrat:** Medikamente in der Psychiatrie.","**Lithiumorotat:** Salz der Orotsäure. In einer Rattenstudie von 1978 war der Hirnspiegel etwa dreimal so hoch wie nach Carbonat. Vergleichsstudien am Menschen fehlen.","**Natürliches Lithium:** gelöst in Wasser und in Pflanzen, aufgenommen über Nahrung und Getränke."]},{"typ":"tabelle","kopf":["Bereich","Größenordnung pro Tag","Einordnung"],"zeilen":[["Aufnahme über Nahrung","regional von Mikrogramm bis einige mg; Kanarische Inseln im Schnitt ca. 3,7 mg","[W] Studien zur Aufnahme"],["Vorgeschlagene Zufuhr","1 mg","[A] Vorschlag Schrauzer 2002, nicht amtlich"],["Medikament (bipolare Störung)","600–1.200 mg Lithiumcarbonat","[W] ärztliche Therapie mit Blutkontrolle"]]},{"typ":"text","text":"Die Spanne zwischen Nahrung und Medikament ist riesig. Studien zu Trinkwasser und Ernährung bewegen sich im Bereich der Nahrung, nicht der Therapie."}]},{"id":"vorkommen","titel":"Vorkommen & Nahrung","bloecke":[{"typ":"text","text":"Wie viel Lithium ein Lebensmittel enthält, hängt vor allem vom Boden und Wasser ab, auf dem es gewachsen ist. Eine rumänische Studie fand die höchsten Werte in Blattgemüse."},{"typ":"tabelle","kopf":["Lebensmittelgruppe","Mittelwert Lithium","Bemerkung"],"zeilen":[["Blattgemüse","9,4 mg/kg","höchster Wert, bis 17,8 mg/kg"],["Mandeln, Erdnüsse","ca. 9–10 mg/kg","Literaturwerte"],["Sojabohnen","ca. 8–11 mg/kg","Literaturwerte"],["Zwiebelgemüse","1,6 mg/kg","stark schwankend"],["Kartoffeln, Tomaten","1,4 mg/kg","Nachtschattengewächse"],["Hülsenfrüchte","1,1 mg/kg",""],["Milchprodukte","0,35 mg/kg",""],["Fleisch, Eigelb","ca. 0,03 mg/kg","sehr wenig"],["Tee, Kaffee","sehr wenig",""]]},{"typ":"abschnitt","titel":"Wasser","liste":["**Leitungswasser in Dänemark:** 0,6 bis 30,7 µg pro Liter, im Mittel 11,6 µg.","**Mineralwasser:** je nach Quelle von wenigen µg bis über 1 mg pro Liter. Das Schweizer Mineralwasser aus Zurzach enthält rund 1,3 mg pro Liter.","Laut Literatur kann Mineralwasser rund ein Drittel der Lithiumaufnahme ausmachen."]},{"typ":"text","text":"Quelle Tabelle: [Studie zu Lebensmitteln in Rumänien (2024)](https://pmc.ncbi.nlm.nih.gov/articles/PMC10888284). Wer Lithium über die Ernährung aufnehmen möchte, findet es vor allem in Blattgemüse, Nüssen und Hülsenfrüchten – wildes Blattgrün wie {{p:p01|Brennnessel}} und {{p:p02|Giersch}} gehört zur reichsten Gruppe, eigene Messwerte fehlen aber."}]},{"id":"forschung","titel":"Forschung","bloecke":[{"typ":"text","text":"Gut belegt ist Lithium als Medikament bei bipolarer Störung, auch zur Suizidvorbeugung. Für kleine Mengen aus Wasser und Nahrung gibt es Zusammenhänge in Beobachtungsstudien, aber noch keinen Beweis, dass sie schützen."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["therapie","Therapie"],["wasser","Trinkwasser"],["demenz","Demenz"]],"eintraege":[{"id":"cipriani","titel":"Lithium-Therapie senkt Suizidrisiko","kat":"therapie","beleg":"W","teil":"BMJ 2013, Cipriani u. a.","kurz":"Bei affektiven Störungen senkt Lithium das Suizidrisiko deutlich, in der Auswertung um bis zu 87 Prozent.","zutaten":["Metaanalyse randomisierter Studien","Therapiedosis mit Blutkontrolle"],"schritte":["Gilt als eine der stärksten Belege in der Psychiatrie.","Gilt nur für die ärztliche Therapie, nicht für Mikrodosen."]},{"id":"oita","titel":"Japan: Suizide und Leitungswasser","kat":"wasser","beleg":"W","teil":"Präfektur Oita, 2009","kurz":"In 18 Gemeinden war die Suizidrate dort niedriger, wo mehr Lithium im Wasser war.","zutaten":["Beobachtungsstudie"],"schritte":["Kritik: Arbeitslosigkeit, Isolation und Zugang zu Ärzten wurden nicht berücksichtigt."]},{"id":"memon","titel":"Metaanalyse Trinkwasser und Suizid","kat":"wasser","beleg":"W","teil":"British Journal of Psychiatry 2020, Memon u. a.","kurz":"15 Studien aus sieben Ländern zeigen insgesamt weniger Suizide bei mehr Lithium im Wasser.","zutaten":["Zusammenfassung von Beobachtungsstudien"],"schritte":["Die Studien weichen stark voneinander ab.","Eine Untersuchung in England mit 5,7 Millionen Menschen fand keinen Zusammenhang."]},{"id":"kessing","titel":"Dänemark: Demenz und Leitungswasser","kat":"demenz","beleg":"W","teil":"JAMA Psychiatry 2017, Kessing u. a.","kurz":"Über 800.000 Menschen: Ab 15 µg Lithium pro Liter Wasser rund 17 Prozent weniger Demenz als bei 2–5 µg.","zutaten":["79.731 Demenzfälle mit je etwa 10 Vergleichspersonen","Wasserwerte 0,6–30,7 µg/l"],"schritte":["Bei 5–10 µg/l war das Risiko dagegen 22 Prozent höher – kein gleichmäßiger Verlauf.","Nur ein Zusammenhang, kein Beweis. Die Autoren raten zur Vorsicht und sehen keine Grundlage, Trinkwasser anzureichern."]},{"id":"nature2025","titel":"Harvard: Lithiummangel und Alzheimer bei Mäusen","kat":"demenz","beleg":"W","teil":"Nature 2025, Yankner-Labor","kurz":"Bei Mäusen verhinderte niedrig dosiertes Lithiumorotat Hirnschäden und stellte das Gedächtnis wieder her.","zutaten":["Tierversuch, Gewebeanalysen"],"schritte":["Die Forscher fanden Hinweise, dass Alzheimer-Ablagerungen Lithium binden und so einen Mangel im Gehirn erzeugen.","Yankner selbst betont, dass es erst Studien am Menschen braucht."]},{"id":"medtransparent","titel":"Direkte Studien zu Lithium gegen Demenz","kat":"demenz","beleg":"W","teil":"Zusammenfassung Medizin transparent","kurz":"Bisher zeigt nur eine mangelhafte Studie einen kleinen Effekt; mehrere sorgfältige Studien fanden keinen Schutz.","zutaten":["wenige Teilnehmende, meist nur Wochen Laufzeit"],"schritte":["Ein vorbeugender Effekt gegen Demenz ist damit nicht belegt.","Bei bipolar Erkrankten unter Lithium gibt es weniger Alzheimer – das kann aber an deren höherem Ausgangsrisiko liegen."]}]}]},{"id":"nehls","titel":"Dr. Nehls","bloecke":[{"typ":"text","text":"PD Dr. med. Michael Nehls ist Arzt und habilitierter Molekulargenetiker und Bestsellerautor („Alzheimer ist heilbar“). Sein Buch „Das Lithium-Komplott – Plädoyer für ein essenzielles Spurenelement“ ist die bekannteste deutschsprachige Stimme für Lithium als Spurenelement."},{"typ":"tabelle","kopf":["Buch","Angabe"],"zeilen":[["Titel","Das Lithium-Komplott – Plädoyer für ein essenzielles Spurenelement"],["Verlag","Mental Enterprises"],["Erschienen","30. April 2025, 464 Seiten, ISBN 978-3-9814048-9-0"],["Englisch","The Conspiracy Against Lithium"]]},{"typ":"abschnitt","titel":"Seine Kernthesen [A]","nummern":["**Lithium ist essenziell:** Das Gehirn brauche Lithium als Spurenelement; die vorhandenen Studien reichten schon jetzt, es als lebenswichtig einzustufen.","**Weit verbreiteter Mangel:** Ein chronischer Mangel senke die Lebensqualität und begünstige Depression, Alzheimer, Gewalt, Suizid und eine kürzere Lebenserwartung.","**Schutzstoff:** Lithium schütze vor chronischen Entzündungen, Stress für das Gehirn und Angststörungen und fördere die Neubildung von Nervenzellen.","**Lithiumorotat:** Es erreiche das Gehirn besser und wirke schon in einem Bruchteil der Therapiedosis.","**Komplott:** Behörden erkennten die Bedeutung nicht an; dass Lithium-Nahrungsergänzung in Europa verboten ist, nütze den Herstellern teurer Medikamente.","**Vorbeugung:** Die Medizin solle stärker darauf achten, was der Körper braucht, um gesund zu bleiben."]},{"typ":"abschnitt","titel":"Was dafür spricht [W]","liste":["Beobachtungsstudien zu Trinkwasser zeigen öfter weniger Suizide und Demenz bei mehr Lithium ({{b:lithium-forschung|Forschung}}).","Lithium greift nachweislich in Alzheimer-relevante Signalwege ein (GSK-3β).","Die Harvard-Studie 2025 stützt die Idee eines Lithiummangels im Gehirn, bisher bei Mäusen.","Lithium als Medikament ist bei bipolarer Störung sehr wirksam."]},{"typ":"abschnitt","titel":"Was Kritiker einwenden [W]","liste":["Lithium ist in der EU nicht als essenziell anerkannt; einen nachgewiesenen Mangelzustand beim Menschen gibt es bisher nicht.","Trinkwasserstudien zeigen nur Zusammenhänge; Bildung, Wohlstand und Gesundheitsversorgung können die Unterschiede erklären.","Die Orotat-These stützt sich auf eine Rattenstudie von 1978; Tierversuche lassen sich nicht direkt übertragen.","Langzeitstudien zu Mikrodosen beim Menschen fehlen.","Verbraucherschützer und Ärzte raten von Selbstversuchen mit Präparaten aus dem Internet ab."]},{"typ":"hinweis","text":"**Dosis:** Im Interview bei Ungeskriptet nennt Nehls 1 mg Lithium pro Tag für 70 kg Körpergewicht, als Lithiumorotat vom Arzt verordnet und in der Apotheke hergestellt, oder über Heilwasser mit ca. 1 mg pro Liter. Er beruft sich auf Schrauzer 2002. Eine amtliche Empfehlung gibt es nicht ({{a:nehls-videos-ungeskriptet|Video-Zusammenfassung}})."},{"typ":"text","text":"Alles über Nehls, seine weiteren Bücher und Ideen: {{a:nehls|Autorenporträt Dr. Michael Nehls}}."}]},{"id":"praxis","titel":"Praxis","bloecke":[{"typ":"text","text":"Was man ohne Rezept und ohne Rechtsprobleme tun kann, ist die Aufnahme über Wasser und Nahrung. Alles darüber hinaus gehört in ärztliche Hände."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"ernaehrung","titel":"Lithiumreich essen","kat":"alle","beleg":"W","teil":"Ernährung","kurz":"Blattgemüse, Nüsse und Hülsenfrüchte gehören zu den lithiumreichsten Lebensmitteln.","zutaten":["Blattgemüse und Wildkräuter","Mandeln, Erdnüsse","Soja und andere Hülsenfrüchte"],"schritte":["Täglich eine Portion Blattgrün einplanen, z. B. {{p:p02#rezepte-salat|Gierschsalat}} oder {{p:p01#rezepte-spinat|Brennnesselspinat}}.","Nüsse als Snack.","Der Gehalt schwankt stark mit dem Boden."]},{"id":"mineralwasser","titel":"Mineralwasser vergleichen","kat":"alle","beleg":"W","teil":"Getränke","kurz":"Der Lithiumgehalt steht oft auf dem Etikett oder in der Analyse des Herstellers.","zutaten":["Etikett oder Wasseranalyse"],"schritte":["Angabe in mg/l oder µg/l suchen.","Wasser mit nennenswertem Gehalt bevorzugen, wenn man möchte.","Bei Nierenerkrankung oder Lithiumtherapie vorher mit dem Arzt sprechen."]},{"id":"arzt","titel":"Mit dem Arzt sprechen","kat":"alle","beleg":"W","teil":"Medizin","kurz":"Lithiumsalze gibt es nur auf Rezept, mit Blutspiegelkontrolle.","zutaten":["Fragen zu Depression, Stimmung oder Gedächtnis"],"schritte":["Beschwerden ärztlich abklären lassen.","Lithium-Blutspiegel kann bei Bedarf gemessen werden."],"hinweis":"Präparate aus dem Ausland sind in der EU nicht zugelassen, Inhalt und Reinheit sind ungeprüft."}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Lithium hat eine schmale therapeutische Breite: Zwischen wirksamer und giftiger Menge liegt wenig Spielraum. Das gilt vor allem für Medikamentendosen."},{"typ":"abschnitt","titel":"Risiken der Therapie","liste":["**Niere:** Nach zehn Jahren Therapie entwickeln 10–20 Prozent eine chronische Nierenerkrankung.","**Schilddrüse:** Unterfunktion möglich, daher regelmäßige Kontrollen.","**Nebenwirkungen:** Zittern, Gewichtszunahme, Durst, Wassereinlagerungen.","**Vergiftung:** Übelkeit, Erbrechen, Schwindel, Verwirrtheit bis Koma."]},{"typ":"abschnitt","titel":"Wechselwirkungen","liste":["Schmerzmittel (NSAR wie Ibuprofen)","Entwässerungstabletten (Diuretika)","Bestimmte Blutdrucksenker (z. B. ACE-Hemmer)","Diese können den Lithiumspiegel gefährlich erhöhen, mit Nervenschäden und Herzrhythmusstörungen als Folge."]},{"typ":"hinweis","text":"**Kein Selbstversuch mit Präparaten:** Verbraucherschützer und Fachleute raten davon ab. Bei Nierenerkrankungen, Herzschwäche, Schwangerschaft oder bei Einnahme der genannten Medikamente ist auch bei kleinen Mengen ärztlicher Rat nötig."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Spektrum: Wundermittel Lithium? Umstrittenes Microdosing","https://www.spektrum.de/news/wundermittel-spurenelement-lithium-umstrittenes-microdosing/2301935"],["apotheken.de: Schützt Lithium vor Demenz?","https://apotheken.de/news/14251-schuetzt-lithium-vor-demenz"],["Plattform J: Lithium-Kontroverse (2026)","https://www.plattformj.ch/artikel/247000/"],["Pressetext: Interview mit Dr. Michael Nehls (2026)","https://www.pressetext.com/news/freitag-21-august-2026-ab-19-uhr-dr-michael-nehls-im-interview-ueber-lithium-und-praevention.html"],["Lesejury: Das Lithium-Komplott","https://www.lesejury.de/michael-nehls/buecher/das-lithium-komplott/9783981404890"],["Alzforum: Kessing 2017, Lithium im Leitungswasser und Demenz","https://alzforum.org/node/875701"],["Lithiumgehalt in Lebensmitteln, Rumänien (2024)","https://pmc.ncbi.nlm.nih.gov/articles/PMC10888284"],["Schrauzer 2002: Lithium – Vorkommen, Aufnahme, Essenzialität","https://pubmed.ncbi.nlm.nih.gov/11838882/"]]},{"typ":"text","text":"Noch offen: Originalzitate aus dem Buch, Lithiumgehalte deutscher Mineralwässer."}]}]},{"id":"juglon","titel":"Juglon","text":"Naphthochinon aus Walnuss und Schwarznuss. Liegt im Baum als ungiftige Vorstufe vor und wird an Luft zu Juglon oxidiert. Hemmt die Protonenpumpe und die Atmung von Wurzelzellen anderer Pflanzen (Allelopathie) und färbt Haut braun. In durchlüftetem Boden bauen Mikroben es ab.","stichworte":["Allelopathie","Naphthochinon","Walnuss","Schwarznuss"],"pflanzen":["p17#selbstversorgung"]},{"id":"thujon","titel":"Thujon","text":"Bestandteil ätherischer Öle (Wermut, Beifuß, Salbei, Thuja). Blockiert GABA-A-Rezeptoren im Gehirn und kann in hoher Dosis Krämpfe auslösen. Für Wermut gilt: unter 6,0 mg pro Tag (HMPC). Der Gehalt schwankt stark nach Chemotyp und Erntemonat.","stichworte":["Absinth","Nervengift","GABA","ätherisches Öl"],"pflanzen":["p16#sicherheit","p09#inhaltsstoffe"]},{"id":"pyrrolizidinalkaloide","titel":"Pyrrolizidinalkaloide (PA)","text":"Abwehrstoffe vieler Raublatt-, Korbblütler- und Hülsenfrüchtler. Werden in der Leber zu reaktiven Verbindungen umgebaut, die Leberzellen schädigen, das Erbgut verändern und Krebs auslösen können. Vorkommen u. a. in Beinwell, Borretsch, Huflattich, Jakobskreuzkraut. Für Arzneimittel gelten strenge Tagesgrenzen.","stichworte":["PA","Leber","Beinwell","Borretsch","Jakobskreuzkraut"],"pflanzen":["p20#sicherheit"]},{"id":"eugenol","titel":"Eugenol","text":"Hauptbestandteil des Nelkenöls (80–90 %), auch in Zimtblatt und Piment. Betäubt örtlich und wirkt antimikrobiell – daher in der Zahnmedizin. In großen Mengen leber- und nierenschädigend; Kontaktallergen.","stichworte":["Nelkenöl","Zahnschmerz","Phenylpropanoid"],"pflanzen":["p15#inhaltsstoffe"]},{"id":"curcumin","titel":"Curcumin","text":"Gelber Farbstoff der Kurkuma (Curcuminoid). Wird schlecht aufgenommen und schnell abgebaut; Piperin aus Pfeffer hemmt den Abbau und erhöht die Aufnahme in einer Humanstudie etwa 20-fach. Genau diese Kombination steht hinter Fällen von Leberentzündung durch Nahrungsergänzungsmittel. ADI: 3 mg/kg Körpergewicht.","stichworte":["Kurkuma","Piperin","Bioverfügbarkeit","ADI"],"pflanzen":["p19#sicherheit"]},{"id":"gingerole","titel":"Gingerole & Shogaole","text":"Scharfstoffe des Ingwers. Gingerole im frischen Rhizom; beim Trocknen und Erhitzen wird Wasser abgespalten und es entstehen die schärferen Shogaole, beim Kochen das milde Zingeron. Sie wirken auf Rezeptoren im Magen-Darm-Trakt und gegen Übelkeit.","stichworte":["Ingwer","Scharfstoffe","Zingeron","Übelkeit"],"pflanzen":["p18#inhaltsstoffe"]},{"id":"muscimol","titel":"Ibotensäure & Muscimol","text":"Giftstoffe des Fliegenpilzes. Ibotensäure wirkt erregend am Glutamat-System und geht beim Trocknen und Erhitzen in Muscimol über. Muscimol aktiviert GABA-A-Rezeptoren: Rausch, Benommenheit, Verwirrtheit bis Koma (Pantherina-Syndrom).","stichworte":["Fliegenpilz","Pantherina-Syndrom","GABA","Microdosing"],"pflanzen":["p13#inhaltsstoffe"]},{"id":"allantoin","titel":"Allantoin","text":"Abbauprodukt der Harnsäure, reichlich in der Beinwellwurzel. Fördert die Neubildung von Hautzellen und macht Hornhaut weicher; Bestandteil vieler Hautcremes (heute meist synthetisch).","stichworte":["Beinwell","Wundheilung","Hautpflege"],"pflanzen":["p20#inhaltsstoffe"]},{"id":"oxalsaeure","titel":"Oxalsäure","text":"Organische Säure in Portulak, Spinat, Mangold, Rhabarber und Sauerampfer. Bindet Calcium zu unlöslichem Calciumoxalat – Hauptbestandteil vieler Nierensteine – und verringert die Aufnahme von Calcium und Eisen. Blanchieren und Milchprodukte senken die Belastung.","stichworte":["Oxalat","Nierensteine","Calcium","Portulak","Spinat"],"pflanzen":["p11#sicherheit"]},{"id":"omega3","titel":"Omega-3-Fettsäuren","text":"Mehrfach ungesättigte Fettsäuren. Pflanzen liefern Alpha-Linolensäure (ALA), z. B. Portul
