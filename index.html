t höher"],["Höchstmenge","Curcumin 3 mg pro kg Körpergewicht und Tag aus allen Quellen (EFSA, BfR)"],["Piperin","höchstens 2 mg pro Tag aus Nahrungsergänzungsmitteln (BfR)"],["Anbau bei uns","wie Ingwer im Kübel"]],"reiter":[{"id":"botanik","titel":"Botanik & Anbau","bloecke":[{"typ":"standort","licht":3,"wasser":4,"naehrstoffe":4,"ph":"ca. 6–6,5","boden":"lockere, humose Kübelerde, warm","ellenberg":"–","hinweis":"Wie Ingwer; Ernte nach 7–10 Monaten, wenn die Blätter vergilben."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** groß, breit-lanzettlich, an langen Stielen, bis 1 m.","**Rhizom:** Mutterknolle mit fingerförmigen Seitenrhizomen; innen leuchtend orange.","**Blüten:** blassgelb in grün-rosa Hochblättern (bei uns selten)."]},{"typ":"text","text":"Anbau, Ernte und Überwinterung wie bei {{p:p18#botanik|Ingwer}}."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Gehalt / Bedeutung","Teil B"],"zeilen":[["Curcuminoide","Curcumin, Demethoxy-, Bisdemethoxycurcumin; 2–5 % im Pulver","{{b:curcumin|Curcumin}}"],["Ätherisches Öl","Turmerone","{{b:terpene|Terpene}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Leichte Verdauungsbeschwerden","Pulver, Tee","[W] HMPC traditionell"],["Arthrose-Schmerzen","Extrakte","[W] kleine bis moderate Effekte in heterogenen Studien"],["Entzündungshemmend, antioxidativ","Labor","[W] Labor; schlecht übertragbar wegen geringer Aufnahme"],["„Wundermittel“ gegen Krebs, Alzheimer","–","[A] nicht belegt"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"milch","titel":"Goldene Milch","kat":"innerlich","beleg":"T","teil":"Pulver","kurz":"Abendgetränk mit Fett und Pfeffer – in Küchenmengen.","zutaten":["250 ml Milch oder Pflanzendrink","½ TL Kurkuma","1 Prise schwarzer Pfeffer, etwas Zimt, Ingwer, Honig"],"schritte":["Alles erhitzen, nicht kochen, 5 Minuten ziehen lassen."],"hinweis":"Küchenmengen sind unbedenklich. Keine hochdosierten Kapseln ohne ärztliche Rücksprache."}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["kueche","Küche"],["vorrat","Vorrat"]],"eintraege":[{"id":"curry","titel":"Linsen-Dal","kat":"kueche","menge":"4 Pers.","zeit":"40 Min.","kurz":"Kurkuma, Fett und Pfeffer – gute Aufnahme, kleine Menge.","zutaten":["250 g rote Linsen","1 Zwiebel, 2 Knoblauchzehen, 1 Stück Ingwer","1 TL Kurkuma, 1 TL Kreuzkümmel, Pfeffer","400 ml Kokosmilch, 400 ml Wasser"],"schritte":["Zwiebel, Knoblauch, Ingwer in Öl anbraten, Gewürze kurz mitrösten.","Linsen, Kokosmilch und Wasser zugeben, 20 Minuten köcheln.","Mit Salz und Zitrone abschmecken."]},{"id":"paste","titel":"Frische Kurkuma-Paste","kat":"vorrat","menge":"1 Glas","zeit":"20 Min.","kurz":"Aus eigener Ernte.","zutaten":["100 g frische Kurkuma","2 EL Kokosöl","½ TL Pfeffer"],"schritte":["Kurkuma reiben (Handschuhe – färbt!).","Mit Öl und Pfeffer 5 Minuten sanft erwärmen.","Kühl lagern, in 2 Wochen verbrauchen."]}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"faerben","titel":"Färben","kat":"haus","beleg":"T","teil":"Rhizom","kurz":"Kurkuma färbt Stoff und Ostereier gelb – aber nicht lichtecht.","zutaten":["2 EL Pulver, 1 l Wasser, Essig"],"schritte":["Pulver 20 Minuten auskochen.","Eier oder Stoff darin ziehen lassen."]}]}]},{"id":"tradition","titel":"Tradition","bloecke":[{"typ":"text","text":"Im Ayurveda seit über 3.000 Jahren Gewürz, Färbe- und Heilmittel; in Indien bei Hochzeiten als Glückssymbol. Traditionell immer mit Fett und Pfeffer gegessen – das verbessert die Aufnahme, wie heute bestätigt. [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Thema","Grenze / Fakt","Quelle"],"zeilen":[["Curcumin aus allen Quellen","höchstens 3 mg/kg Körpergewicht und Tag (bei 70 kg ca. 210 mg)","[W] EFSA 2010, BfR 040/2021"],["Piperin in Nahrungsergänzung","höchstens 2 mg pro Tag; nur ca. 20 % der geprüften Produkte hielten das ein (CVUA Stuttgart)","[W] BfR 040/2021"],["Leberentzündungen","Italien 2019: 28 Meldungen akuter, meist cholestatischer Hepatitis durch Kurkuma-Produkte, meist mit Piperin","[W] Istituto Superiore di Sanità"],["Gegenanzeigen","Gallenwegsverschluss, Lebererkrankung, Gerinnungshemmer, Chemotherapie, Schwangerschaft (Präparate)","[W]"]]},{"typ":"hinweis","text":"Bei Gelbsucht, dunklem Urin oder Oberbauchschmerz nach Einnahme von Kurkuma-Kapseln: sofort absetzen und zum Arzt."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["BfR-Stellungnahme 040/2021: Kurkuma-Präparate und Piperin","https://doi.org/10.17590/20211214-121912"],["Shoba et al. 1998: Piperin und Curcumin (Planta Medica)","https://pubmed.ncbi.nlm.nih.gov/9619120/"]]}]}]},{"id":"p20","nr":"P-20","illu":"beinwell","fotos":[],"name":"Beinwell","botan":"Symphytum officinale L.","volksnamen":["Wallwurz","Schwarzwurz","Beinwurz","Comfrey"],"kurz":"„Bein“ heißt Knochen: Beinwell ist das Hausmittel für Prellungen, Zerrungen und schmerzende Gelenke – aber nur äußerlich, denn er enthält leberschädigende Pyrrolizidinalkaloide. Im Garten liefert er eine der besten Kalijauchen.","steckbrief":[["Familie","Raublattgewächse (Boraginaceae)"],["Lebensform","ausdauernde Staude, 30–120 cm"],["Blütezeit","Mai–September"],["Sammelzeit","Wurzel Frühjahr oder Herbst, Blätter vor der Blüte"],["Verwendete Teile","Wurzel, Blätter – nur äußerlich"],["Wirkstoffe","Allantoin, Schleim, Rosmarinsäure; Pyrrolizidinalkaloide"],["Grenzwert","höchstens 100 µg Pyrrolizidinalkaloide pro Tag, äußerlich, max. 4–6 Wochen im Jahr"],["Achtung","nie innerlich; Verwechslung mit Fingerhut"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"beinwell_d","titel":"Detail- und Verwechslungstafel"},{"typ":"standort","licht":4,"wasser":4,"naehrstoffe":5,"ph":"neutral","boden":"feucht bis nass, nährstoffreich: Gräben, Bachufer, Wiesen","ellenberg":"L7 F8 R– N8","hinweis":"Tiefwurzler: holt Kalium und Mineralstoffe aus dem Unterboden."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** groß, lanzettlich, rau behaart (kratzig).","**Stängel:** geflügelt – die Blätter laufen als Leisten am Stängel herab.","**Blüten:** nickende Glocken in eingerollten Wickeln, violett, rosa oder cremeweiß.","**Wurzel:** tief, fleischig, außen schwarz, innen weiß und schleimig."]},{"typ":"hinweis","text":"**Verwechslung:** Vor der Blüte ähneln die Blätter dem **Fingerhut** (tödlich giftig: Herzglykoside). Fingerhut ist weich-filzig, ohne geflügelten Stängel. Blätter nur von blühenden, sicher bestimmten Pflanzen sammeln."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Wirkung","Teil B"],"zeilen":[["{{b:allantoin|Allantoin}}","fördert Zellneubildung","{{b:allantoin|Allantoin}}"],["Schleimstoffe","kühlend, reizmildernd","{{b:schleimstoffe|Schleimstoffe}}"],["Rosmarinsäure","entzündungshemmend","–"],["Gerbstoffe","zusammenziehend","–"],["{{b:pyrrolizidinalkaloide|Pyrrolizidinalkaloide}}","Symphytin, Echimidin, Lycopsamin – leberschädigend, krebserregend; am meisten in der Wurzel","{{b:pyrrolizidinalkaloide|PA}}"]]}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Anwendung","Einordnung"],"zeilen":[["Prellungen, Zerrungen, Verstauchungen","Salbe, Umschlag","[W] PA-reduzierte Fertigpräparate klinisch geprüft"],["Muskel- und Gelenkschmerzen","Salbe","[W] Studien mit Fertigpräparaten"],["Knochenbrüche heilen schneller","Umschlag","[T] Name „Beinwell“, „Wallwurz“ (wallen = zusammenwachsen)"],["Innerlich","–","[W] verboten wegen Lebertoxizität"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"]],"eintraege":[{"id":"umschlag","titel":"Beinwell-Umschlag","kat":"aeusserlich","beleg":"T","teil":"Wurzel","kurz":"Bei Prellung und Verstauchung – auf intakter Haut.","zutaten":["1 frische Wurzel","Leinentuch"],"schritte":["Wurzel waschen, fein reiben.","Brei auf ein Tuch streichen, auflegen, 1–2 Stunden.","Kurzfristig, höchstens einige Tage."],"hinweis":"Nie auf offene Wunden. Nicht in Schwangerschaft und Stillzeit, nicht bei Kleinkindern."},{"id":"salbe","titel":"Beinwellsalbe","kat":"aeusserlich","beleg":"T","teil":"Wurzel","kurz":"Hausgemachte Salbe hat einen unbekannten PA-Gehalt – sparsam verwenden.","zutaten":["50 g frische Wurzel, fein geschnitten","200 ml Olivenöl","20 g Bienenwachs"],"schritte":["Wurzel im Öl bei max. 60 °C 2 Stunden ziehen lassen.","Abseihen, Wachs schmelzen, abfüllen.","Höchstens 4–6 Wochen im Jahr verwenden."],"tipp":"Sicherer sind PA-reduzierte Fertigpräparate aus der Apotheke."}]}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"**Keine Rezepte zum Essen.** Früher beliebte „Beinwell-Küchlein“ (in Teig ausgebackene Blätter) und Tees sind wegen der Pyrrolizidinalkaloide nicht mehr zu empfehlen. [W]"}]},{"id":"selbstversorgung","titel":"Garten","bloecke":[{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["anbau","Anbau"]],"eintraege":[{"id":"jauche","titel":"Beinwelljauche (Kalidünger)","kat":"garten","beleg":"T","teil":"Blätter","kurz":"Ideal für Tomaten, Kartoffeln, Kürbis, Beeren – fördert Blüte und Frucht.","zutaten":["1 kg frische Blätter","10 l Wasser, Regenwasser am besten","Gefäß aus Kunststoff oder Holz"],"schritte":["Blätter zerkleinern, mit Wasser ansetzen, abdecken (luftdurchlässig).","1–3 Wochen gären lassen, täglich umrühren.","1:10 verdünnt an den Wurzelfuß gießen."],"tipp":"Nicht über Blattgemüse kurz vor der Ernte gießen. Siehe {{s:jauche|Pflanzenjauche}}."},{"id":"mulch","titel":"Mulch und Kompost-Starter","kat":"garten","beleg":"T","teil":"Blätter","kurz":"Beinwellblätter verrotten schnell und sind kaliumreich.","zutaten":["Blätter, mehrmals im Jahr schneiden"],"schritte":["Angewelkt unter Tomaten legen.","Im Komposthaufen als Starter einlegen."]},{"id":"pflanzen","titel":"Beinwell-Ecke anlegen","kat":"anbau","beleg":"T","teil":"Wurzel","kurz":"Einmal gepflanzt, bleibt er für immer – jedes Wurzelstück treibt neu.","zutaten":["Wurzelstück, feuchte Ecke"],"schritte":["Ein Stück Wurzel 5 cm tief legen.","Nicht ins Gemüsebeet: kaum wieder loszuwerden.","Bienen und Hummeln lieben die Blüten."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Schon in der Antike wurde Beinwell auf Brüche gelegt; „Symphytum“ kommt vom griechischen symphyein = zusammenwachsen. [T]"},{"typ":"text","text":"Bei **Storl** gehört Beinwell zu den Kräutern, aus denen der Selbstversorger seinen Dünger selbst macht: In seinen Gartenbüchern nennt er Brennnessel, Beinwell und Giersch als Grundlage der Kräuterjauchen ({{a:storl-garten-jauchen|Mit Pflanzen düngen}}). [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Regel","Grenze","Quelle"],"zeilen":[["Nur äußerlich","höchstens 100 µg PA pro Tag (äußerlich), 1 µg innerlich","[W] Stufenplan 1992, BfArM; BfR"],["Dauer","höchstens 4–6 Wochen im Jahr","[W] EMA 2021"],["Nicht auf offene Wunden","PA werden über verletzte Haut aufgenommen","[W]"],["Schwangerschaft, Stillzeit, Kleinkinder","nicht anwenden","[W]"],["Verwechslung Fingerhut","tödlich","[W]"]]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["BfR: Pyrrolizidinalkaloide","https://www.bfr.bund.de/cm/343/pyrrolizidinalkaloide-gehalte-in-lebensmitteln-sollen-nach-wie-vor-so-weit-wie-moeglich-gesenkt-werden.pdf"],["BfArM 2016: Pyrrolizidinalkaloide in Arzneimitteln","https://www.bfarm.de/SharedDocs/Bekanntmachungen/DE/Arzneimittel/besTherap/bm-besTherap-20160301-pa-pdf.pdf?__blob=publicationFile&amp=&v=3"],["Deutsches Apothekenportal: bedenkliche Rezepturen","https://www.deutschesapothekenportal.de/download/public/arbeitshilfen/dap_arbeitshilfe_bedenkliche-rezepturen.pdf"],["apotheken.de: Beinwell","https://www.apotheken.de/alternativmedizin/heilpflanzen/9270-beinwell"]]}]}]},{"id":"p21","nr":"P-21","illu":"tabak","fotos":[],"name":"Tabak","botan":"Nicotiana tabacum L., Bauerntabak N. rustica L.","volksnamen":["Virginischer Tabak","Knaster","Bauerntabak","Machorka"],"kurz":"Ein Nachtschattengewächs aus Amerika, das in den Wurzeln ein starkes Nervengift bildet: Nikotin. In Mitteleuropa wächst Tabak problemlos im Garten. Wie man ihn anbaut, trocknet, fermentiert und verarbeitet, steht im Kapitel {{s:tabak|Tabak – vom Samen zur Zigarette}}.","steckbrief":[["Familie","Nachtschattengewächse (Solanaceae)"],["Herkunft","Südamerika; seit dem 16. Jahrhundert in Europa"],["Lebensform","einjährig, 1,5–2,5 m hoch"],["Blütezeit","Juli–September, rosa (N. rustica gelbgrün)"],["Wirkstoff","Nikotin, meist ca. 1–4 % der Blatt-Trockenmasse"],["Recht","Anbau für den Eigenbedarf erlaubt und steuerfrei (§ 30 TabStG)"],["Achtung","Nikotin ist giftig – Kinder, Haustiere, nasse Blätter bei der Ernte"],["Anbau","{{s:tabak|Kapitel S-05}}"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"tabak_d","titel":"Detailtafel"},{"typ":"standort","licht":5,"wasser":3,"naehrstoffe":5,"ph":"5,6–6,8","boden":"locker, humos, sandig-lehmig, warm, keine Staunässe","ellenberg":"–","hinweis":"Starkzehrer; braucht viel Kalium, verträgt kein Chlorid (verschlechtert die Glimmfähigkeit)."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** aufrecht, dick, kaum verzweigt, drüsig behaart.","**Blätter:** wechselständig, groß (bis 60 cm), elliptisch bis lanzettlich, sitzend, klebrig durch Drüsenhaare.","**Blüten:** Rispe aus rosa Trompetenblüten (N. rustica: gelbgrün, kurz).","**Frucht:** Kapsel mit winzigen Samen – etwa 10.000 pro Gramm.","**Wurzel:** kräftige Hauptwurzel mit dichtem Faserwurzelwerk; Ort der Nikotinbildung."]},{"typ":"tabelle","kopf":["Typ","Merkmale","Trocknung","Verwendung"],"zeilen":[["Virginia","helle, zuckerreiche Blätter, mild","Röhren-/Heißluft (flue-cured)","Zigaretten, Feinschnitt"],["Burley","großblättrig, zuckerarm, nimmt Aromen gut an","Luft (air-cured)","Zigaretten, Pfeife"],["Orient","kleinblättrig, sehr aromatisch","Sonne (sun-cured)","Mischungen"],["Geudertheimer / Badischer","alte deutsche Landsorten, robust","Luft","Zigarren, Pfeife, Schnupf"],["Bauerntabak (N. rustica)","klein, rundblättrig, bis ca. 9 % Nikotin","Luft","traditionell, Machorka; sehr stark"]]},{"typ":"hinweis","text":"**Ziertabak** (Nicotiana sylvestris, N. alata) ist für den Blumengarten gezüchtet – ebenfalls giftig, nicht zum Rauchen gedacht."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Bedeutung","Teil B"],"zeilen":[["Nikotin","Hauptalkaloid, Nervengift, macht abhängig","{{b:nikotin|Nikotin}}"],["Nornicotin, Anabasin, Anatabin","Nebenalkaloide; Nornicotin ist Vorstufe von Nitrosaminen","{{b:nikotin|Nikotin}}"],["Zucker, Stärke","entscheiden über Milde und Geschmack (Virginia viel, Burley wenig)","{{b:staerke|Stärke}}"],["Chlorogensäure, Rutin","Polyphenole; bräunen beim Trocknen","{{b:flavonoide|Flavonoide}}"],["Carotinoide","Abbauprodukte (Ionone, Damascenon) ergeben das Aroma","{{b:carotinoide|Carotinoide}}"],["Nitrat","bei Stickstoffüberschuss viel – fördert Nitrosamine","{{b:nitrat|Nitrat}}"],["Tabakspezifische Nitrosamine (TSNA)","entstehen beim Trocknen, stark krebserregend","{{b:tsna|Nitrosamine}}"]]}]},{"id":"wirkung","titel":"Wirkung & Gesundheit","bloecke":[{"typ":"tabelle","kopf":["Wirkung","Einordnung"],"zeilen":[["Nikotin bindet an Acetylcholin-Rezeptoren: anregend, beruhigend, appetithemmend","[W] macht schnell und stark abhängig"],["Rauchen: Lungenkrebs, COPD, Herzinfarkt, Schlaganfall, viele weitere Krebsarten","[W] häufigste vermeidbare Todesursache"],["Demenzrisiko","[W] Rauchen gehört zu den veränderbaren Risikofaktoren für Demenz (Lancet-Kommission)"],["Eigenanbau „gesünder“, weil ohne Zusatzstoffe","[W] falsch – die Verbrennung ist das Hauptproblem"],["Tabak als Heilmittel (Klistier, Schnupf gegen Kopfweh)","[T] historisch; heute obsolet"]]},{"typ":"hinweis","text":"Rauchen ist in Deutschland laut Deutschem Krebsforschungszentrum für rund 127.000 Todesfälle pro Jahr verantwortlich. Selbst angebauter Tabak ist **nicht** gesünder: Die Hauptschäden entstehen beim Verbrennen (Teer, Kohlenmonoxid, krebserregende Stoffe), nicht durch Zusatzstoffe. Hilfe beim Aufhören: Rauchfrei-Telefon 0800 8 31 31 31 (kostenfrei)."},{"typ":"hinweis","text":"**Nehls-Bezug:** {{a:nehls|Dr. Nehls}} setzt in der Alzheimer-Vorbeugung auf den Lebensstil. Rauchen ist einer der gut belegten, vermeidbaren Risikofaktoren für Demenz – Nichtrauchen gehört deshalb zu jeder Gehirn-Vorsorge ({{a:nehls-kernideen|Kernideen}})."}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"In Amerika war Tabak seit Jahrtausenden eine heilige Pflanze: Bauerntabak (N. rustica) wurde in Zeremonien geraucht, geopfert und als Gebet zum Himmel geschickt – nicht als Alltagsgenuss. Mit Kolumbus kam Tabak nach Europa, zunächst als Heil- und Zierpflanze; Jean Nicot, französischer Gesandter in Lissabon, gab ihm 1560 den Namen. [T]"},{"typ":"text","text":"**Storl** hat bei Medizinmännern der Cheyenne geforscht ({{a:storl-person|Person}}) – einer Kultur, in der Tabak eine Gebetspflanze für die heilige Pfeife ist. Sein Grundgedanke, dass Rausch- und Zauberpflanzen in alten Kulturen an Ritual und Maß gebunden waren ({{a:storl-denken|Storls Denken}}, {{a:storl-buecher-hexenmedizin|Hexenmedizin}}), zeigt den Gegensatz zur heutigen Industriezigarette. [T]"}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"tabelle","kopf":["Gefahr","Wer","Was tun"],"zeilen":[["Grüne Tabakkrankheit: Nikotin aus nassen Blättern geht durch die Haut – Übelkeit, Erbrechen, Schwindel, Kopfschmerz, Herzrasen, etwa 3–17 Stunden nach der Arbeit","Erntende","nicht bei Tau oder Regen ernten, Handschuhe und lange wasserfeste Kleidung, nasse Kleidung sofort wechseln [W] CDC"],["Nikotinvergiftung durch Verschlucken","Kinder, Hunde, Katzen","Blätter, Kippen, Sud unerreichbar lagern; Verschluckte Tabakblätter, Kippen oder Tabaksud bei Kindern: sofort Giftnotruf (z. B. Berlin 030 19240), bei Bewusstseinsstörung **112**."],["Tabaksud als Pflanzenschutz","alle","nicht verwenden: Nikotin ist in der EU als Pflanzenschutzmittel nicht zugelassen und sehr giftig für Mensch, Bienen und Gewässer"],["Schimmel beim Trocknen/Fermentieren","Raucher","verschimmelten Tabak wegwerfen (Schimmelgifte)"],["Schwangerschaft, Stillzeit","–","kein Tabak, kein Nikotin"]]},{"typ":"hinweis","text":"Verschluckte Tabakblätter, Kippen oder Tabaksud bei Kindern: sofort Giftnotruf (z. B. Berlin 030 19240), bei Bewusstseinsstörung **112**."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["CDC MMWR: Green Tobacco Sickness in Tobacco Harvesters (Kentucky 1992)","https://www.cdc.gov/mmwR/preview/mmwrhtml/00020119.htm"],["Shitan et al. 2015: Nicotine translocation in Nicotiana tabacum (PMC4622871)","https://pmc.ncbi.nlm.nih.gov/articles/PMC4622871"],["Wissenschaftliche Dienste des Bundestags: Tabakanbau für den Eigenbedarf (WD 5 – 143/20)","https://www.bundestag.de/resource/blob/823612/1e9b1ece68b2aa625dc553b038e5083a/WD-5-143-20-pdf.pdf"],["planet-wissen: Tabak – ein Kraut für alle Fälle","https://www.planet-wissen.de/gesellschaft/rauschmittel/nikotin/pwietabakeinkrautfuerallefaelle100.html"]]}]}]},{"id":"p22","nr":"P-22","illu":"hanf","fotos":[],"name":"Hanf","botan":"Cannabis sativa L.","volksnamen":["Nutzhanf","Fimmel (männlich)","Mastel (weiblich)","Cannabis"],"kurz":"Eine der ältesten Kulturpflanzen der Menschheit: Fasern für Seile, Segel und Papier, nahrhafte Samen und Öl – und Blüten mit Cannabinoiden. Hanf ist zweihäusig: Es gibt männliche und weibliche Pflanzen, die sich in Wuchs, Blüte und Nutzung deutlich unterscheiden.","steckbrief":[["Familie","Hanfgewächse (Cannabaceae), verwandt mit Hopfen"],["Lebensform","einjährig, 1–4 m"],["Geschlecht","meist zweihäusig: männliche und weibliche Pflanzen (XY-System); einige Faserhanfsorten einhäusig"],["Blüte","Kurztagspflanze; im Freiland ca. August–September"],["Nutzung","Fasern (Stängel), Samen und Öl, Blüten"],["Samen","ca. 25–35 % Fett, 20–25 % Eiweiß; Omega-6 zu Omega-3 ca. 3:1"],["Recht","KCanG: bis 3 Pflanzen Eigenanbau; siehe {{s:hanf-ueberblick|Überblick & Recht}}"],["Anbau","{{s:hanf|Kapitel S-06}}"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"standort","licht":5,"wasser":3,"naehrstoffe":5,"ph":"6–7","boden":"tiefgründig, locker, humos, nährstoffreich, keine Staunässe","ellenberg":"–","hinweis":"Starkzehrer; tiefe Pfahlwurzel lockert den Unterboden."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** gefingert, 5–9 (selten bis 13) lanzettliche, grob gesägte Blättchen; unten gegenständig, oben wechselständig.","**Stängel:** aufrecht, kantig, hohl werdend, mit langen Bastfasern in der Rinde.","**Blüten:** getrennt auf männlichen und weiblichen Pflanzen – Einzelheiten im Reiter {{p:p22#geschlecht|Männlich & weiblich}}.","**Frucht:** Nüsschen („Hanfsamen“), 3–5 mm, grau-braun marmoriert.","**Wurzel:** Pfahlwurzel, im Feld bis über 1 m tief."]},{"typ":"tabelle","kopf":["Gruppe","Merkmale","Verwendung"],"zeilen":[["Faserhanf (Nutzhanf)","hoch, wenig verzweigt, dicht gesät; THC unter 0,3 %; viele Sorten einhäusig","Fasern, Schäben, Samen"],["Ölsaathanf","kürzer, samenreich","Samen, Öl, Eiweiß"],["„Sativa“-Typen","hoch, schmale Blätter, lange Blüte","Blüten"],["„Indica“-Typen","gedrungen, breite Blätter, kurze Blüte","Blüten"],["Autoflower (mit C. ruderalis)","klein, blüht nach Alter statt Tageslänge","Blüten, kurze Saison"]]},{"typ":"text","text":"Die Einteilung in Sativa und Indica ist botanisch umstritten; heute gilt meist eine einzige Art Cannabis sativa mit vielen Kultursorten."}]},{"id":"geschlecht","titel":"Männlich & weiblich","bloecke":[{"typ":"illu","id":"hanf_mw","titel":"Männliche und weibliche Pflanze im Vergleich"},{"typ":"tabelle","kopf":["Merkmal","männlich ♂","weiblich ♀"],"zeilen":[["Wuchs","höher, schlanker, lockerer","gedrungener, buschiger, kräftiger"],["Erste Anzeichen","1–3 Wochen früher","später"],["Vorblüte am Knoten","kleines Kügelchen auf einem Stielchen","tropfenförmiger Kelch mit 2 weißen Narbenfäden"],["Blütenstand","lockere, hängende Rispen mit Pollensäcken","dichte Büschel aus Tragblättern mit Narben"],["Drüsenhaare / Harz","wenig","viel, besonders an den Tragblättern"],["Lebensdauer","stirbt nach dem Pollenflug","lebt bis zur Samenreife, 4–8 Wochen länger"],["Faser","feiner, weicher – früher bevorzugt geerntet („Fimmel“)","gröber, kräftiger („Mastel“, Samenhanf)"],["Nutzen","Pollen für Samen; feine Faser","Samen, Blüten, Faser"]]},{"typ":"illu","id":"hanf_hormone","titel":"Hormonwaage"},{"typ":"text","text":"Geschlecht ist genetisch angelegt (XX weiblich, XY männlich), wird aber erst zur Blüte durch Hormone ausgeprägt: Gibberelline drängen Richtung männlich, Ethylen, Cytokinine und Auxin Richtung weiblich. Stress, Hitze und Licht in der Nacht können weibliche Pflanzen zu Zwittern machen. Alle Einzelheiten: {{s:hanf-geschlecht|Geschlecht erkennen und Biochemie}}."},{"typ":"hinweis","text":"Ausführlich mit Vorblüten, Zwittern und Bestäubung: {{s:hanf-geschlecht|Kapitel S-06, Reiter Geschlecht erkennen}}."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"tabelle","kopf":["Stoff","Wo","Teil B"],"zeilen":[["Cannabinoide: THCA/THC, CBDA/CBD, CBG, CBN","Drüsenhaare der weiblichen Blüten, wenig in Blättern","{{b:cannabinoide|Cannabinoide}}"],["Terpene: Myrcen, Limonen, β-Caryophyllen, Pinen","Drüsenhaare; bestimmen den Duft","{{b:terpene|Terpene}}"],["Fett mit Linolsäure, α-Linolensäure, γ-Linolensäure","Samen","{{b:omega3|Omega-3}}"],["Eiweiß (Edestin, Albumin) mit allen essenziellen Aminosäuren","Samen",""],["Flavonoide (Cannflavine)","Blätter, Blüten","{{b:flavonoide|Flavonoide}}"],["Cellulose, Lignin, Pektin","Stängel: Bast und Schäben","–"]]},{"typ":"tabelle","kopf":["Hanfsamen, geschält, pro 100 g (Richtwert)","Menge"],"zeilen":[["Fett","ca. 49 g"],["Eiweiß","ca. 32 g"],["Magnesium","ca. 700 mg"],["Eisen","ca. 8 mg"],["Zink","ca. 10 mg"],["Omega-6 : Omega-3","ca. 3 : 1"]]},{"typ":"text","text":"Nährwerte nach USDA (aus der Recherche, vor dem Druck prüfen). Hanfsamen enthalten selbst praktisch kein THC; Spuren können von anhaftendem Blütenmaterial stammen."}]},{"id":"wirkung","titel":"Wirkung & Gesundheit","bloecke":[{"typ":"tabelle","kopf":["Thema","Einordnung"],"zeilen":[["Hanfsamen als Lebensmittel: Eiweiß, Fettsäuren, Magnesium","[W] nährstoffreich, glutenfrei"],["Medizinisches Cannabis: Schmerzen, Spastik bei MS, Übelkeit bei Chemotherapie","[W] verschreibungspflichtig nach Medizinal-Cannabisgesetz; Wirkung je nach Indikation mäßig belegt"],["CBD: beruhigend, entkrampfend","[W] als Arzneimittel bei bestimmten Epilepsien zugelassen; viele Werbeversprechen unbelegt"],["THC und Gedächtnis","[W] THC wirkt über CB1-Rezeptoren, die im Hippocampus besonders dicht sind; regelmäßiger Konsum in der Jugend beeinträchtigt Gedächtnis und Lernen"],["Abhängigkeit, Psychose","[W] etwa jeder zehnte Konsument wird abhängig, bei frühem Beginn mehr; hoher THC-Gehalt erhöht das Psychoserisiko"]]},{"typ":"hinweis","text":"**Nehls-Bezug:** Der Hippocampus – das Gedächtniszentrum, um das sich {{a:nehls|Dr. Nehls}}’ Alzheimer-Vorbeugung dreht ({{a:nehls-kernideen|Kernideen}}) – ist besonders reich an CB1-Rezeptoren. Dauerhafter THC-Konsum, vor allem jung, gilt deshalb als Belastung für genau diese Hirnregion."}]},{"id":"rezepte","titel":"Rezepte (Samen)","bloecke":[{"typ":"karten","art":"rezept","filter":[["alle","Alle"]],"eintraege":[{"id":"muesli","titel":"Hanf-Frühstück","kat":"kueche","menge":"1 Portion","zeit":"5 Min.","kurz":"Geschälte Hanfsamen sind weich und nussig.","zutaten":["2 EL geschälte Hanfsamen","Haferflocken, Joghurt oder Pflanzendrink, Obst"],"schritte":["Alles mischen, Hanfsamen zuletzt darüberstreuen."]},{"id":"milch","titel":"Hanfmilch","kat":"kueche","menge":"1 l","zeit":"10 Min.","kurz":"Pflanzendrink ohne Einweichen.","zutaten":["100 g geschälte Hanfsamen","1 l Wasser","1 Prise Salz, 1–2 Datteln"],"schritte":["Alles 1–2 Minuten im Mixer pürieren.","Durch ein feines Tuch abseihen, kühl lagern, in 3 Tagen verbrauchen."]},{"id":"pesto","titel":"Hanf-Bärlauch- oder Kräuterpesto","kat":"kueche","menge":"1 Glas","zeit":"10 Min.","kurz":"Hanfsamen statt Pinienkerne.","zutaten":["1 Bund Kräuter (Basilikum, Bärlauch oder {{p:p02|Giersch}})","40 g geschälte Hanfsamen","30 g Parmesan, 100 ml Hanf- oder Olivenöl, Salz"],"schritte":["Alles pürieren, mit Öl bedecken, kühl lagern."]},{"id":"dressing","titel":"Hanföl-Dressing","kat":"kueche","menge":"4 Portionen","zeit":"5 Min.","kurz":"Hanföl nur kalt verwenden.","zutaten":["3 EL Hanföl","1 EL Apfelessig, 1 TL Senf, Salz, Pfeffer"],"schritte":["Verrühren, über Salat geben."],"tipp":"Hanföl ist reich an mehrfach ungesättigten Fettsäuren – nicht erhitzen, kühl und dunkel lagern, rasch verbrauchen."},{"id":"roesten","titel":"Geröstete Hanfsamen","kat":"kueche","menge":"1 Schale","zeit":"10 Min.","kurz":"Ungeschälte Samen als knuspriger Snack.","zutaten":["100 g ganze Hanfsamen (Lebensmittelqualität)","Salz"],"schritte":["In der Pfanne ohne Fett 3–5 Minuten rösten, bis sie knacken.","Salzen, abkühlen lassen."]}]}]},{"id":"tradition","titel":"Tradition & Storl","bloecke":[{"typ":"text","text":"Hanf wird seit mindestens 10.000 Jahren genutzt; in Europa war er bis ins 19. Jahrhundert die wichtigste Faserpflanze für Seile, Segel, Kleidung und Papier. Fast jedes Dorf hatte seine Hanfröste. Hildegard von Bingen lobte Hanfsamen als bekömmliche Speise. In Indien gilt Hanf als heilige Pflanze Shivas (Bhang). [T]"},{"typ":"text","text":"**Storl** hat bei den Shiva-Sadhus in Indien und Nepal geforscht – Wanderasketen, für die Hanf eine heilige Pflanze des Gottes Shiva ist ({{a:storl-buecher-shiva|Shiva – Der wilde, gütige Gott}}). Wie beim Tabak gilt in seinem Denken: Rauschpflanzen waren in alten Kulturen an Ritual, Maß und Gemeinschaft gebunden ({{a:storl-denken|Storls Denken}}). Als Selbstversorger sieht er Pflanzen zugleich als Rohstoff – und kaum eine Pflanze liefert so viel wie Hanf: Faser, Nahrung, Öl. [T]"},{"typ":"hinweis","text":"**Storl im Video (2018):** Die Sadhus, „lebende Tote“ ohne Kaste und Namen, rauchen ein Chillum mit Hanf; gerade weil sie keiner Kaste angehören, kamen sie mit westlichen Reisenden ins Gespräch – ein Ursprung der Flower-Power-Bewegung ({{a:storl-videos-kenfm2018|Storl im Gespräch 2018}}). [T]"}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Konsumcannabisgesetz (KCanG) – Gesetzestext","https://www.gesetze-im-internet.de/kcang/"],["Wissenschaftliche Dienste des Bundestags: Nutzhanf und THC-Grenzwerte (WD 5 – 165/24)","https://www.bundestag.de/resource/blob/1042780/be749330137a0f32f6ee41b00cc75299/WD-5-165-24-pdf.pdf"],["CSC Deutschland: Cannabiskontrollgesetz 2026","https://cscsdeutschland.de/cannabiskontrollgesetz-2026"],["WESSLING: Hanf – neues Superfood","https://de.wessling-group.com/fileadmin/user_upload/global/services/food/WESSLING_Lebensmittelbrief_Hanf_neues_Superfood.pdf"],["topagrar: Unterschied zwischen Nutzhanf und Cannabis","https://www.topagrar.com/perspektiven/news/kennen-sie-den-unterschied-zwischen-nutzhanf-und-cannabis-20009854.html"]]}]}]}],"autoren":[{"id":"nehls","nr":"A-01","name":"Dr. Michael Nehls","botan":"Arzt, Molekulargenetiker, Sachbuchautor","volksnamen":[],"kurz":"Michael Nehls verbindet Molekularbiologie, Evolution und Lebensstil zu einer Gesamtsicht auf Gehirngesundheit. Sein Leitgedanke: Zivilisationskrankheiten wie Alzheimer entstehen durch eine Lebensweise, die nicht zu unserer Natur passt, und lassen sich deshalb vermeiden.","steckbrief":[["Geboren","20. Oktober 1962, Deutschland"],["Studium","Medizin in Freiburg und Heidelberg (1983–1989)"],["Promotion","1989 Heidelberg, Herzhormone in der Stammesgeschichte"],["Habilitation","1996 MH Hannover, Molekulargenetik der Thymusentwicklung; Lehrbefugnis 1997"],["Forschung","über 50 Fachveröffentlichungen, zwei mit den Nobelpreisträgern Paul Greengard und Martin Evans"],["Auszeichnung","2015 Hanse-Preis für Molekulare Psychiatrie (Universität Rostock)"],["Sport","Ultra-Radfahrer: Race Across America 2008, Platz 7 von 27 Solo-Fahrern"],["Kernthemen","Hippocampus, Alzheimer-Prävention, mentale Energie, Lithium, geistige Freiheit"]],"reiter":[{"id":"person","titel":"Person","bloecke":[{"typ":"text","text":"Nehls arbeitete nach Studium und Habilitation in der Forschung und in leitenden Positionen der Industrie. Seit Anfang der 2010er Jahre schreibt er Sachbücher für ein breites Publikum, zunächst über gesundes Altern, dann vor allem über Alzheimer und das Gehirn."},{"typ":"abschnitt","titel":"Werdegang","nummern":["**1983–1989:** Medizinstudium in Freiburg und Heidelberg, Promotion.","**1996/1997:** Habilitation in Hannover, Lehrbefugnis für Molekulargenetik.","**Danach:** Forschung und Management in der Industrie.","**2003:** Rückkehr zum Leistungssport nach rund 20 Jahren Pause.","**2008:** Race Across America, 4.800 km in 10 Tagen und 23 Stunden – mit über 90 Stunden Schlaf, mehr als die Konkurrenz. Für ihn ein Beleg, wie wichtig Erholung für das Gehirn ist.","**2014–2018:** Alzheimer-Bücher, Hanse-Preis 2015, 2016 Veröffentlichung seiner „Unified Theory of Alzheimer's Disease“ (UTAD).","**2021–2023:** Bücher zu Corona, mentaler Energie und geistiger Freiheit.","**2025:** „Das Lithium-Komplott“."]},{"typ":"text","text":"Zum Lithium-Kapitel: {{b:lithium-nehls|Lithium · Dr. Nehls}}."}]},{"id":"buecher","titel":"Bücher","bloecke":[{"typ":"text","text":"Seine Sachbücher bauen aufeinander auf: vom gesunden Altern über Alzheimer und mentale Energie bis zu Lithium. Zusammenfassungen sind aus Verlagsangaben und Rezensionen erstellt und werden ergänzt, wenn du Passagen aus deinen Büchern beisteuerst."},{"typ":"karten","art":"buch","filter":[["alle","Alle"],["gehirn","Gehirn & Alzheimer"],["ernaehrung","Ernährung"],["gesellschaft","Corona & Gesellschaft"],["sport","Sport"]],"eintraege":[{"id":"lithium-komplott","titel":"Das Lithium-Komplott","kat":"gehirn","jahr":"2025","verlag":"Mental Enterprises","kurz":"Plädoyer für Lithium als essenzielles Spurenelement.","zutaten":["Untertitel: Plädoyer für ein essenzielles Spurenelement","464 Seiten, ISBN 978-3-9814048-9-0","Englisch: The Conspiracy Against Lithium"],"schritte":["Lithium ist für das Gehirn lebenswichtig; ein weit verbreiteter Mangel fördert Depression, Alzheimer, Gewalt und Suizid.","Lithium schützt vor chronischer Entzündung, Stress fürs Gehirn und Angst und fördert die Neubildung von Nervenzellen.","Behörden verweigern die Anerkennung; das Verbot von Lithium-Nahrungsergänzung nützt teuren Medikamenten.","Ausführlich im Kapitel {{b:lithium-nehls|Lithium}}."]},{"id":"erschoepfte-gehirn","titel":"Das erschöpfte Gehirn","kat":"gehirn","jahr":"2022","verlag":"Heyne","kurz":"Woher unsere mentale Energie kommt und warum sie schwindet.","zutaten":["Untertitel: Der Ursprung unserer mentalen Energie – und warum sie schwindet"],"schritte":["Mentale Erschöpfung ist eine verbreitete Zivilisationskrankheit: Konzentration, Willenskraft und Kreativität lassen nach.","Die Energie des Frontalhirns entsteht im Zusammenspiel mit dem Hippocampus, der Erinnerungen speichert und abrufbar macht.","Der Hippocampus bildet lebenslang neue Nervenzellen (Neurogenese) – wenn wir ihn lassen.","Evolution: Omega-3-reiche Meeresnahrung half beim Wachstum unseres Gehirns.","Empfehlungen: Omega-3 (z. B. Algenöl), Entgiftung, Nähe und Berührung, viel Bewegung und vor allem Lebenssinn als stärkster Antrieb."]},{"id":"formel","titel":"Die Formel gegen Alzheimer","kat":"gehirn","jahr":"2018","verlag":"Heyne","kurz":"Praxisleitfaden für ein gehirngesundes Leben zur Vorbeugung und Heilung.","zutaten":["Fasst seine Alzheimer-Bücher als Lebensstil-Programm zusammen"],"schritte":["Alzheimer als Folge vieler Mangelzustände der modernen Lebensweise.","Das Programm setzt an allen Faktoren gleichzeitig an (siehe Reiter Praxis)."]},{"id":"kopfkueche","titel":"Kopfküche – Das Anti-Alzheimer-Kochbuch","kat":"ernaehrung","jahr":"2017","verlag":"Systemed","kurz":"Rezepte für ein gehirngesundes Essen.","zutaten":["Kochbuch zur Alzheimer-Prävention"],"schritte":["Frische, naturnahe Lebensmittel statt stark verarbeiteter Kost.","Omega-3-reiche Zutaten und wenig Zucker."]},{"id":"mediterran","titel":"Demenz vorbeugen: Mediterran essen","kat":"ernaehrung","jahr":"2017","verlag":"Fona","kurz":"Mittelmeerküche als Schutz für das Gehirn.","zutaten":["Rezept- und Ratgeberbuch"],"schritte":["Gemüse, Hülsenfrüchte, Fisch, Olivenöl und Nüsse als Basis."]},{"id":"algenoel","titel":"Algenöl","kat":"ernaehrung","jahr":"2018","verlag":"Heyne","kurz":"Die Ernährungsrevolution aus dem Meer.","zutaten":["Untertitel: Die Ernährungsrevolution aus dem Meer"],"schritte":["Die Omega-3-Fettsäure DHA ist ein Grundbaustein des Gehirns.","Algenöl liefert DHA direkt aus der Quelle, aus der auch Fische es haben, ohne Überfischung."]},{"id":"alzheimer-heilbar","titel":"Alzheimer ist heilbar","kat":"gehirn","jahr":"2015","verlag":"Heyne","kurz":"Rechtzeitig zurück in ein gesundes Leben.","zutaten":["Untertitel: Rechtzeitig zurück in ein gesundes Leben","Nachfolger der Alzheimer-Lüge"],"schritte":["Wird die Krankheit früh erkannt und die Lebensweise umfassend geändert, kann sie sich zurückbilden.","Der Hippocampus kann sich durch Neurogenese erholen."]},{"id":"alzheimer-luege","titel":"Die Alzheimer-Lüge","kat":"gehirn","jahr":"2014","verlag":"Heyne","kurz":"Die Wahrheit über eine vermeidbare Krankheit.","zutaten":["Untertitel: Die Wahrheit über eine vermeidbare Krankheit","Grundlage seiner Alzheimer-Theorie"],"schritte":["Alzheimer ist keine zwangsläufige Alterskrankheit; nur etwa 2 Prozent der Fälle sind rein erblich.","Der Hippocampus verwandelt Erlebnisse in Erinnerungen und braucht dafür ständig neue Nervenzellen.","Beta-Amyloid ist eigentlich ein Schutzeiweiß; zu viel davon wirkt aber giftig und startet einen Teufelskreis.","Ursachen: Bewegungsmangel, Schlafmangel, falsche Ernährung, soziale Isolation, geistige Unterforderung und Dauerstress (Cortisol).","Medikamente gegen Amyloid hält er für den falschen Weg, weil sie eine Schutzfunktion stören.","Neugier, neue Aufgaben, Gemeinschaft und Bewegung fördern die Neubildung von Nervenzellen."]},{"id":"methusalem","titel":"Die Methusalem-Strategie","kat":"gehirn","jahr":"2011","verlag":"Mental Enterprises","kurz":"Vermeiden, was uns daran hindert, gesund älter und weiser zu werden.","zutaten":["Sein erstes großes Gesundheitsbuch"],"schritte":["Gesundes Altern aus Sicht der Evolution: Der Körper ist auf ein aktives, naturnahes Leben ausgelegt.","Wer die modernen Störfaktoren meidet, altert gesund und wird weiser statt vergesslich."]},{"id":"corona-syndrom","titel":"Das Corona Syndrom","kat":"gesellschaft","jahr":"2021","verlag":"Heyne","kurz":"Wie das Virus unsere Schwächen offenlegt.","zutaten":["Untertitel: Wie das Virus unsere Schwächen offenlegt"],"schritte":["Schwere Verläufe treffen vor allem Menschen mit Mangelzuständen und Vorerkrankungen.","Ein gesunder Lebensstil stärkt die Abwehr nachhaltig, etwa durch Vitamin D, Omega-3, Bewegung und Schlaf."]},{"id":"herdengesundheit","titel":"Herdengesundheit","kat":"gesellschaft","jahr":"2022","verlag":"Mental Enterprises","kurz":"Der Weg aus der Corona-Krise und die natürliche Alternative zum globalen Impfprogramm.","zutaten":["Untertitel: Der Weg aus der Corona-Krise und die natürliche Alternative zum globalen Impfprogramm"],"schritte":["Statt Herdenimmunität durch Impfung setzt er auf Herdengesundheit: eine gesunde Bevölkerung durch bessere Lebensweise und Nährstoffversorgung."]},{"id":"indoktrinierte-gehirn","titel":"Das indoktrinierte Gehirn","kat":"gesellschaft","jahr":"2023","verlag":"Mental Enterprises / Skyhorse (englisch)","kurz":"Wie wir den globalen Angriff auf unsere mentale Freiheit erfolgreich abwehren.","zutaten":["Englisch: The Indoctrinated Brain"],"schritte":["Der Hippocampus ist Sitz unseres autobiografischen Gedächtnisses und damit unserer Identität und Urteilskraft.","Angst, Isolation, Dauerstress und Erschöpfung während der Pandemie-Maßnahmen schwächten ihn – Menschen würden dadurch leichter lenkbar.","Er sieht darin ein koordiniertes Vorgehen von Eliten und vermutet Schäden durch das Spike-Protein und die mRNA-Impfstoffe.","Schutz: Hippocampus und Gedächtnis stärken, kritisch denken, vielfältige Quellen nutzen, lokale Gemeinschaften aufbauen, unabhängig und gesund leben."]},{"id":"race","titel":"Herausforderung Race Across America","kat":"sport","jahr":"2008","verlag":"Delius Klasing","kurz":"4.800 km Zeitfahren von Küste zu Küste.","zutaten":["Erfahrungsbericht; überarbeitet 2012"],"schritte":["Bericht über sein Rennen quer durch die USA."]},{"id":"siegen","titel":"Du musst nicht siegen, um zu gewinnen","kat":"sport","jahr":"2010","verlag":"Eigenverlag","kurz":"Sport, Grenzerfahrung und Lebenseinstellung.","zutaten":["auch als DVD"],"schritte":["Persönliche Lehren aus dem Extremsport."]},{"id":"kilimanjaro","titel":"Gipfel der Freiheit","kat":"sport","jahr":"2011","verlag":"–","kurz":"Herausforderung Kilimanjaro.","zutaten":["Erfahrungsbericht"],"schritte":["Bergbesteigung als persönliche Herausforderung."]}]}]},{"id":"kernideen","titel":"Kernideen","bloecke":[{"typ":"text","text":"Fast alle seine Bücher kreisen um eine Idee: Der Hippocampus ist das Herz unserer geistigen Gesundheit, und unsere moderne Lebensweise lässt ihn verkümmern."},{"typ":"abschnitt","titel":"1. Der Hippocampus als Schlüssel","liste":["Er speichert Erlebnisse und macht sie abrufbar – er ist das Archiv unseres Lebens und unserer Identität.","Er bildet lebenslang neue Nervenzellen (Neurogenese). Bekanntes Beispiel: Londoner Taxifahrer haben einen größeren hinteren Hippocampus.","Ohne regelmäßige Anregung werden die neuen Zellen wieder abgebaut."]},{"typ":"abschnitt","titel":"2. Alzheimer als Mangelkrankheit der Lebensweise","liste":["Alzheimer ist keine Alterserscheinung, sondern das Ende einer jahrzehntelangen Fehlentwicklung.","Mehrere Mangelzustände wirken zusammen: Bewegung, Schlaf, Nährstoffe, soziale Bindung, Sinn.","Beta-Amyloid ist ein Schutzeiweiß, das bei Überlastung giftig wird. Medikamente gegen Amyloid greifen daher am falschen Punkt an.","Wird früh und umfassend gegengesteuert, kann sich das Gehirn erholen. Seine Theorie veröffentlichte er 2016 als „Unified Theory of Alzheimer's Disease“."]},{"typ":"abschnitt","titel":"3. Evolution als Maßstab","liste":["Unser Gehirn ist für ein Leben als Jäger und Sammler gebaut: viel Bewegung, Tageslicht, Gemeinschaft, Meeres- und Naturnahrung.","Großeltern hatten in der Evolution eine wichtige Rolle als Wissensträger – ein gesundes Gedächtnis im Alter ist daher vorgesehen.","Was davon abweicht, wird zum Risiko."]},{"typ":"abschnitt","titel":"4. Mentale Energie","liste":["Willenskraft, Konzentration und Kreativität hängen am Zusammenspiel von Hippocampus und Frontalhirn.","Dauerstress, Schlafmangel und Reizüberflutung erschöpfen dieses System."]},{"typ":"abschnitt","titel":"5. Lithium als vergessenes Spurenelement","liste":["Seit 2025 sein Schwerpunkt: Ein chronischer Lithiummangel schwäche Gehirn und Psyche.","Details und Studienlage: {{b:lithium|Lithium}}."]},{"typ":"abschnitt","titel":"6. Geistige Freiheit","liste":["Ein geschwächter Hippocampus macht Menschen lenkbar, weil Urteilskraft und Erinnerung leiden.","Gegenmittel: Gesundheit, Gemeinschaft, kritisches Denken."]}]},{"id":"praxis","titel":"Praxis","bloecke":[{"typ":"text","text":"Seine Empfehlungen für ein gesundes Gehirn. Das Kürzel zeigt, wie gut der jeweilige Faktor allgemein in der Forschung gestützt ist."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["koerper","Körper"],["geist","Geist & Seele"],["ernaehrung","Ernährung"]],"eintraege":[{"id":"bewegung","titel":"Täglich bewegen","kat":"koerper","beleg":"W","teil":"Bewegung","kurz":"Für ihn die eigentliche Grundlage: Bewegung regt die Neubildung von Nervenzellen an.","zutaten":["Ausdauerbewegung, möglichst draußen"],"schritte":["Täglich aktiv sein: gehen, Rad fahren, Gartenarbeit.","Lieber regelmäßig als selten und hart."]},{"id":"schlaf","titel":"Ausreichend schlafen","kat":"koerper","beleg":"W","teil":"Schlaf","kurz":"Im Schlaf werden Erinnerungen übertragen und Beta-Amyloid abgebaut.","zutaten":["feste Schlafzeiten","dunkles, ruhiges Schlafzimmer"],"schritte":["Chronischen Schlafmangel vermeiden.","Abends Bildschirm und Stress reduzieren."]},{"id":"omega3","titel":"Omega-3 (DHA) versorgen","kat":"ernaehrung","beleg":"W","teil":"Fettsäuren","kurz":"DHA ist Baustein der Nervenzellen; er empfiehlt Algenöl als Quelle.","zutaten":["Algenöl, fetter Seefisch, Leinöl (nur ALA)"],"schritte":["Regelmäßig DHA-Quellen einplanen.","Omega-3-Status kann beim Arzt gemessen werden."]},{"id":"vitamind","titel":"Vitamin D und Tageslicht","kat":"ernaehrung","beleg":"W","teil":"Vitamine","kurz":"Ein Mangel schwächt Abwehr und Gehirn. Nehls strebt einen Spiegel von ca. 125 nmol/l an, deutlich höher als offizielle Empfehlungen.","zutaten":["Tageslicht, im Winter Ergänzung","Spiegelmessung beim Arzt"],"schritte":["Täglich nach draußen.","Spiegel messen lassen und nach Rücksprache ergänzen.","Seine Faustregel: 50 IE täglich heben den Spiegel um ca. 1 nmol/l ({{a:nehls-videos-ungeskriptet|Video}})."]},{"id":"natuerlich-essen","titel":"Naturnah essen","kat":"ernaehrung","beleg":"W","teil":"Ernährung","kurz":"Wenig Zucker und Fertigprodukte, viel Gemüse, Hülsenfrüchte, Nüsse, Olivenöl, Fisch.","zutaten":["Mittelmeerkost, Wildkräuter"],"schritte":["Frisch kochen, z. B. mit {{p:p01|Brennnessel}} und {{p:p02|Giersch}}.","Siehe Kochbücher im Reiter Bücher."]},{"id":"lithium-praxis","titel":"Lithium über die Nahrung","kat":"ernaehrung","beleg":"A","teil":"Spurenelement","kurz":"Sein jüngstes Thema. Legal ist in Deutschland nur die Aufnahme über Wasser und Lebensmittel.","zutaten":["lithiumhaltiges Mineralwasser, Blattgemüse, Nüsse"],"schritte":["Details im Kapitel {{b:lithium-praxis|Lithium · Praxis}}."]},{"id":"lebenssinn","titel":"Lebenssinn finden","kat":"geist","beleg":"T","teil":"Psyche","kurz":"Für Nehls der stärkste Antrieb für ein gesundes Gehirn: ein Ziel, das größer ist als man selbst.","zutaten":["eine Aufgabe, die einem wichtig ist"],"schritte":["Sich fragen: Wofür stehe ich morgens auf?","Wissen und Erfahrung weitergeben, z. B. an Kinder und Enkel."]},{"id":"gemeinschaft","titel":"Gemeinschaft pflegen","kat":"geist","beleg":"W","teil":"Soziales","kurz":"Isolation erhöht Stresshormone und schadet dem Hippocampus.","zutaten":["Familie, Freunde, Vereine, Nachbarschaft"],"schritte":["Regelmäßige Treffen fest einplanen.","Nähe und Berührung zulassen."]},{"id":"neugier","titel":"Neues lernen","kat":"geist","beleg":"W","teil":"Geist","kurz":"Neue Erfahrungen halten die frisch gebildeten Nervenzellen am Leben.","zutaten":["Neugier, neue Aufgaben"],"schritte":["Instrument, Sprache, Handwerk, Reisen.","Auch Schach mit anderen nennt er als Beispiel."]},{"id":"stress","titel":"Dauerstress abbauen","kat":"geist","beleg":"W","teil":"Psyche","kurz":"Chronisch hohes Cortisol schädigt den Hippocampus.","zutaten":["Pausen, Natur, Bewegung"],"schritte":["Überlastung und dauernde Erreichbarkeit begrenzen.","Bewusst Erholungszeiten schaffen."]}]}]},{"id":"videos","titel":"Videos","bloecke":[{"typ":"text","text":"Zusammenfassungen von Interviews und Videos mit Nehls. Alles hier gibt seine Aussagen wieder; Zahlen und Studien sind so notiert, wie er sie nennt. Die Kürzel zeigen, wie gut eine Aussage außerhalb des Videos gesichert ist."},{"typ":"baum","titel":"Themenbaum","wurzel":"Nehls: Videos und Gespräche","knoten":[{"t":"Mentales Immunsystem","k":[{"t":"Neben dem körperlichen
