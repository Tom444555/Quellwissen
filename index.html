aststoffreich essen (Vitamin K2 aus …"},{"t":"Omega-3 (EPA/DHA) ergänzen, bei veganer Ernährung auch B12."},{"t":"Lithium ca. 1 mg täglich als Lithiumorotat: vom Arzt …"},{"t":"Alternativ lithiumhaltiges Heilwasser trinken (ca. 1 mg …"}]}]},{"typ":"karten","art":"buch","filter":[["alle","Alle"]],"eintraege":[{"id":"ungeskriptet","titel":"Ungeskriptet – Lithium, mentales Immunsystem, Vitamin D","kat":"alle","jahr":"2026","verlag":"Podcast Ungeskriptet","kurz":"Warum Lithiummangel laut Nehls das mentale Immunsystem schwächt und Menschen manipulierbar macht; dazu Vitamin D und scharfe Kritik an Corona-Politik, Pharmaindustrie und WHO.","zutaten":["Anlass: Besuch beim US-Gesundheitsminister Kennedy, Ziel: Lithium als essenziell anerkennen lassen","Themen: Hippocampus, Lithium, Vitamin D, Gesetz des Minimums, Corona, WHO","Ausführlich unten auf dieser Seite"],"schritte":["**Mentales Immunsystem:** Der Hippocampus bildet lebenslang neue Nervenzellen; sie machen neugierig, stressfest und schützen vor Manipulation.","**Lithium ist essenziell:** Mangel fördere Alzheimer, Depression, Suizid und Gewalt. Bedarf: ca. 1 mg pro Tag.","**Vitamin D:** Zielspiegel ca. 125 nmol/l; die offizielle Empfehlung von 800 IE sei viel zu niedrig.","**Corona:** Alternativen wie Vitamin D und Ivermectin seien unterdrückt worden; das Spike-Protein schädige den Hippocampus.","**Gesetz des Minimums:** Ein fehlender essenzieller Stoff lässt sich durch nichts ersetzen – das werde im Medizinstudium nicht gelehrt."]}]},{"typ":"abschnitt","titel":"Mentales Immunsystem","liste":["Neben dem körperlichen gibt es laut Nehls ein mentales Immunsystem: Es wehrt schädliche Narrative ab, also Manipulation.","Der Hippocampus speichert Erlebnisse mit Ort und Zeit und bildet als einziger Hirnbereich lebenslang neue Nervenzellen (adulte hippokampale Neurogenese) [W].","Die neuen Zellen entstehen vor allem nachts. Werden sie tagsüber nicht durch Neues gebraucht, sterben sie ab – sie stehen für unsere Neugier.","Sie bremsen die Stressachse und verknüpfen Neues mit Erfahrung: Erst Schreck beim Rascheln im Gebüsch, dann erkennt man das Eichhörnchen, und der Stress fällt ab.","**Fördert:** Bewegung (Wachstumshormon, EPO), Nähe und Sexualität (Oxytocin, Prolaktin), neue Erlebnisse, Lithium.","**Hemmt:** Entzündung (Infekt, starker Muskelkater, Kopfverletzungen), Dauerstress und laut Nehls das Spike-Protein.","Kurzfristig ist der Rückzug bei Krankheit sinnvoll (Sickness Behavior). Bleibt er, folgen Angst, Depression und am Ende Alzheimer.","**Engels- oder Teufelskreis:** Wer rausgeht, bildet mehr Zellen und wird neugieriger; wer sich zurückzieht, wird ängstlicher.","Leichtgläubigkeit hat laut Nehls nichts mit dem IQ zu tun, sondern mit zu wenigen neuen Zellen."]},{"typ":"abschnitt","titel":"Die Evolution der Großmutter","liste":["Schimpansen sterben kurz nach der letzten fruchtbaren Phase mit etwa 40–50 Jahren; Menschen leben rund 50 Jahre länger.","Grund laut Nehls: Großeltern geben überlebenswichtige Erfahrung an die Enkel weiter.","Er nennt als Beleg: Bis Anfang des 20. Jahrhunderts wurden pro Lebensjahrzehnt einer Großmutter zwei Enkel mehr erwachsen.","Alzheimer zerstört genau diese Funktion; gehäuft trete die Krankheit erst seit den 1950er-Jahren auf."]},{"typ":"abschnitt","titel":"Lithium","liste":["Lithium ist eines der ersten Elemente des Universums und steckt in jedem Gestein (griechisch lithos = Stein).","Schon die ersten Zellen steuerten ihr Recycling (Autophagie) über das Enzym IMPase, das auf Lithium reagiert. Diesen Mechanismus fand er von Bakterien über Pflanzen bis zum Menschen.","**Autophagie:** Zellen zerlegen alte Eiweiße und Mitochondrien und bauen daraus Neues – auch eingedrungene Viren. Nervenzellen müssen bis zu 100 Jahre halten und sind darauf besonders angewiesen. Ohne Lithium keine Autophagie, so Nehls.","Tiere mit Lithiummangel zeigen Fruchtbarkeitsstörungen, Früh- und Totgeburten. Er spricht von einem „mentalen Immundefizienzsyndrom“.","Weitere Wirkungen laut Nehls: entzündungshemmend, gegen Brain Fog, fördert Neubildung von Nervenzellen, besserer Tiefschlaf und Tag-Nacht-Rhythmus.","**Woher die 1 mg kommen:** An der südafrikanischen Küste, der Wiege des Homo sapiens, nahmen Menschen über Muscheln 1–2 mg täglich auf; heute in Deutschland etwa 100-mal weniger. Schrauzer kam 2002 auf 1 mg für 70 kg.","7Up hieß ursprünglich „Lithiated Soda“ und enthielt pro Glas etwa 1 mg; Heilquellen wie die Hirschquelle haben ca. 0,7–1,3 mg pro Liter.","**Das Verbot von 1949:** Im selben Jahr, in dem John Cade Lithium gegen Manie entdeckte, bekamen herzkranke Patienten in US-Kliniken Lithiumchlorid grammweise als Salzersatz; 4 von 12 starben. Die FDA verbot Lithium als Nahrungsergänzung, Europa übernahm das. In den USA ist Lithiumorotat seit 1994 wieder frei verkäuflich.","Die Nature-Studie vom August 2025 sieht er als Bestätigung (siehe {{b:lithium-forschung-nature2025|Forschung}})."]},{"typ":"tabelle","kopf":["Lithium pro Tag","Bedeutung laut Video"],"zeilen":[["1 mg","essenzieller Bedarf (laut Nehls)"],["bis 85 mg","laut Europäischer Chemikalienagentur ohne Nebenwirkungen verträglich (wie von Nehls zitiert)"],["120–150 mg","Therapie bei bipolarer Störung, mit deutlichen Nebenwirkungen"]]},{"typ":"text","text":"Die Milligramm-Angaben beziehen sich auf reines Lithium, nicht auf das Salz. Lithiumcarbonat-Tabletten enthalten etwa ein Fünftel ihres Gewichts als Lithium."},{"typ":"abschnitt","titel":"Vitamin D","liste":["Vitamin D wird in der Leber erst zum Prohormon (25-OH-D3), daraus dann zum aktiven Hormon. Die Leber schafft nur einige Tausend Einheiten pro Tag – eine Stoßdosis von 100.000 IE wirkt deshalb erst nach 1–2 Wochen.","Bei schwerer Infektion verbrauche der Körper bis zu 10.000 IE täglich.","**Zielspiegel ca. 125 nmol/l** (= 50 ng/ml): Werte von Naturvölkern wie den Massai; laut den von ihm zitierten Studien höchste Lebenserwartung und niedrigstes Alzheimer-Risiko.","**Faustregel:** 50 IE täglich heben den Spiegel um etwa 1 nmol/l. Für 125 nmol/l also rund 6.000 IE, individuell 4.000–8.000. Mit 800 IE komme man aus leerem Speicher nur auf etwa 16 nmol/l.","Gefäßverkalkung drohe vor allem bei viel Calcium dazu; Vitamin K2 bilde ein gesundes Darm-Mikrobiom bei ballaststoffreicher Kost.","Winter sei der größte Risikofaktor für Atemwegsinfekte; nach RKI-Daten sei das Covid-Sterberisiko im Winter 72-mal höher gewesen.","Studien, die er nennt: Brenner (DKFZ) 2020, die Córdoba-Studie mit Prohormon (Intensiv-Risiko um über 95 % gesenkt), eine Brasilien-Studie, die er für falsch angelegt hält, und die VITAL-Studie 2022, deren Fazit er kritisiert.","Stillende mit 6.500 IE täglich versorgen laut ihm das Baby über die Muttermilch mit."]},{"typ":"abschnitt","titel":"Gesetz des Minimums und Maximums","liste":["Nach Carl Sprengel (1828): Fehlt einer Pflanze einer von 12 Mineralstoffen, wächst sie nicht – egal wie viel von den anderen da ist. Das gilt auch im Garten, z. B. beim {{s:huegelbeet-chemie|Hügelbeet}}.","Der Mensch braucht etwa 47–48 essenzielle Stoffe, dazu Bewegung, Schlaf, Sinn und Nähe.","Gesetz des Maximums: Jeder Stoff wird zu hoch dosiert giftig (Paracelsus).","Folgerung: Gesundheit liegt zwischen Minimum und Maximum. Ein Medikament gleicht keinen natürlichen Mangel aus – deshalb werde es nie ein Medikament gegen Alzheimer geben.","Seine Prüffragen für Empfehlungen: Was ist aus der Evolution sinnvoll? Welche Werte haben Naturvölker? Was zeigen Bevölkerungsstudien? Ist es biologisch erklärbar?"]},{"typ":"abschnitt","titel":"Corona, Spike-Protein und WHO","liste":["**Spike-Protein:** Die abgespaltene S1-Untereinheit gelange ins Gehirn, löse Entzündung aus und stoppe die Neubildung von Nervenzellen. Folgen laut Nehls: Long Covid, Post-Vac, Depression, schnellere Alzheimer-Verläufe; er nennt eine Studie aus Korea.","**Autophagie und Ivermectin:** Lithium und Ivermectin wirkten am selben Ziel (IMPase); beide seien mit schlecht angelegten Studien diskreditiert worden.","**Enquete-Kommission:** kein echter Untersuchungsausschuss; Kritik an PCR-Tests mit 45 Zyklen; Spahn-Zitat „Es ging nie um Fremdschutz“.","**Virusursprung:** laut Nehls ein Labor; er verweist auf die Furin-Spaltstelle und einen Projektantrag der EcoHealth Alliance von 2018.","**WHO:** etwa 80 % der Gelder von privaten Spendern mit Zweckbindung; Pandemie-Definition seit 2009 ohne Schweregrad; Investorenbroschüre von 2022.","Er warnt vor einer nächsten Pandemie, die Kinder trifft."]},{"typ":"abschnitt","titel":"Seine To-dos aus dem Video","nummern":["Vitamin-D-Spiegel beim Arzt messen lassen (Ziel ca. 125 nmol/l bzw. 50 ng/ml).","Vitamin D täglich nach gemessenem Spiegel ergänzen, im Mittel ca. 6.000 IE.","Mediterran und ballaststoffreich essen (Vitamin K2 aus dem Darm).","Omega-3 (EPA/DHA) ergänzen, bei veganer Ernährung auch B12.","Lithium ca. 1 mg täglich als Lithiumorotat: vom Arzt verordnen und in der Apotheke herstellen lassen. Ärzte und Apotheken listet Nehls auf seiner Webseite.","Alternativ lithiumhaltiges Heilwasser trinken (ca. 1 mg pro Liter).","Den Hippocampus fördern: täglich bewegen, Neues erleben, Nähe pflegen.","Weiterlesen: „Das Lithium-Komplott“ und „Herdengesundheit“."]},{"typ":"hinweis","text":"**Vor der Umsetzung:** Hohe Vitamin-D-Dosen dauerhaft nur mit Spiegelkontrolle beim Arzt – zu viel Vitamin D kann den Calciumspiegel gefährlich erhöhen. Lithium nur nach ärztlicher Rücksprache, besonders bei Nieren-, Herz- oder Schilddrüsenerkrankungen und bei Einnahme von Entwässerungs-, Blutdruck- oder Schmerzmitteln ({{b:lithium-sicherheit|Lithium · Sicherheit}})."},{"typ":"text","text":"Quelle: deine Zusammenfassung [Dr. Michael Nehls – Ungeskriptet](https://claude.ai/code/artifact/6fc1619a-3142-4d9c-9155-2043c7f90a13). Weitere Videos kommen als neue Karten dazu."}]},{"id":"einordnung","titel":"Einordnung","bloecke":[{"typ":"text","text":"Nehls hat viele Leser überzeugt und ist zugleich umstritten. Damit dieses Nachschlagewerk vollständig ist, steht hier auch, was Fachleute einwenden."},{"typ":"tabelle","kopf":["Thema","Seine Position","Einwand aus der Fachwelt"],"zeilen":[["Lebensstil und Alzheimer","Alzheimer ist vermeidbar und heilbar","[W] Lebensstil beeinflusst Beginn und Verlauf nachweislich. Der Biochemiker Christian Haass hält die Aussage, Alzheimer sei grundsätzlich vermeidbar oder heilbar, aber für irreführend."],["Stellung in der Forschung","eigene Gesamttheorie (UTAD, 2016)","Die Bioethikerin Silke Schicktanz beschreibt ihn als Populärwissenschaftler, den die Fachwelt weitgehend nicht aufgreift."],["Lithium","essenzielles Spurenelement, weit verbreiteter Mangel","Beobachtungsstudien sind vielversprechend; Beweise aus kontrollierten Studien am Menschen fehlen ({{b:lithium-forschung|Forschung}})."],["Corona, Impfung, Indoktrination","Maßnahmen und Impfstoffe schädigten das Gehirn; gesteuert von Eliten","Kritiker halten die Belege für schwach (u. a. ungeprüfte Meldedaten) und die Deutung für verschwörungstheoretisch; das Buch ist stark umstritten."],["Vitamin D","Zielspiegel 125 nmol/l, ca. 6.000 IE täglich","Ein Mangel ist häufig und sollte behoben werden. Fachgesellschaften wie die DGE nennen ohne eigene Bildung 800 IE täglich und halten einen höheren Zielspiegel nicht für belegt. Hohe Dosen dauerhaft nur mit Kontrolle."],["Ivermectin","bei Covid wirksam, unterdrückt","Große kontrollierte Studien fanden keinen Nutzen bei Covid-19."],["Virusursprung","Labor","Bis heute ungeklärt; ein Laborunfall und ein natürlicher Ursprung werden beide ernsthaft diskutiert."]]},{"typ":"hinweis","text":"**Gemeinsamer Nenner:** Bewegung, Schlaf, soziale Kontakte, geistige Anregung und gesunde Ernährung gelten auch in der etablierten Forschung als die wichtigsten beeinflussbaren Faktoren für ein gesundes Gehirn. Hier decken sich Nehls und die Fachwelt weitgehend."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Wikipedia (englisch): Michael Nehls","https://en.wikipedia.org/wiki/Michael_Nehls"],["Blinkist: Michael Nehls, Autorenseite","https://www.blinkist.com/de/content/authors/michael-nehls-de"],["Blinkist: Die Alzheimer-Lüge","https://www.blinkist.com/de/books/die-alzheimer-luge-de"],["Blinkist: Das erschöpfte Gehirn","https://www.blinkist.com/de/books/das-erschopfte-gehirn-de"],["Shortform: The Indoctrinated Brain","https://www.shortform.com/pdf/the-indoctrinated-brain-pdf-michael-nehls"],["Lesejury: Das Lithium-Komplott","https://www.lesejury.de/michael-nehls/buecher/das-lithium-komplott/9783981404890"],["Pressetext: Interview zu Lithium und Prävention (2026)","https://www.pressetext.com/news/freitag-21-august-2026-ab-19-uhr-dr-michael-nehls-im-interview-ueber-lithium-und-praevention.html"]]},{"typ":"text","text":"Noch offen: Inhaltsverzeichnisse und Originalzitate. Wenn du seine Bücher hast, ergänze ich Kapitel für Kapitel."}]}]},{"id":"storl","nr":"A-02","name":"Dr. Wolf-Dieter Storl","botan":"Kulturanthropologe, Ethnobotaniker, Selbstversorger","volksnamen":[],"kurz":"Wolf-Dieter Storl verbindet Pflanzenkunde mit Völkerkunde, Mythen und Gartenpraxis. Für ihn sind Pflanzen keine bloßen Rohstoffe, sondern Wesen, mit denen der Mensch seit Urzeiten in Beziehung lebt – als Nahrung, Medizin und Lehrer.","steckbrief":[["Geboren","1. Oktober 1942 in Crimmitschau, Sachsen"],["Jugend","1951 mit elf Jahren Auswanderung nach Ohio (USA), viel Zeit im Wald"],["Studium","Botanik an der Ohio State University, dann Anthropologie"],["Promotion","1974 in Ethnologie, Universität Bern"],["Lehre","Kent State, Wien, Oregon, Genf, Bern, Varanasi (Indien), Wyoming"],["Wohnort","abgelegener Hof im Westallgäu, ehemaliger Rittersitz von 1188"],["Familie","verheiratet, ein Sohn, eine Tochter"],["Heute","Bücher, Vorträge, Online-Kurse der Storl-Akademie"]],"reiter":[{"id":"person","titel":"Person","bloecke":[{"typ":"text","text":"Storl wuchs in der Wildnis von Ohio auf und fand früh zu den Pflanzen: „Ich war schon als Kind mit dem Wald verbunden.“ Als Ethnologe erforschte er, wie verschiedene Kulturen mit Pflanzen leben, und brachte dieses Wissen in den Garten zurück."},{"typ":"abschnitt","titel":"Feldforschung","liste":["eine spiritualistische Siedlung in Ohio","eine Camphill-Gemeinschaft (anthroposophische Lebensgemeinschaft)","biologisch-dynamische Höfe im Emmental","Medizinmänner der Cheyenne","Shiva-Sadhus (Wanderasketen) in Indien und Nepal"]},{"typ":"text","text":"Er schrieb über 25 Bücher auf Deutsch, viele in bis zu 15 Sprachen übersetzt. Auf Englisch erschienen u. a. „The Heart and Its Healing Plants“, „A Curious History of Vegetables“, „Witchcraft Medicine“ und seine Erinnerungen „Far Out in America“."}]},{"id":"buecher","titel":"Bücher","bloecke":[{"typ":"text","text":"Alle Bücher von Wolf-Dieter Storl einzeln zusammengefasst, nach Themen filterbar. Grundlage sind Verlags- und Händlerbeschreibungen; wo nur Titel und Untertitel bekannt sind, steht das bei den Angaben. Die Zusammenfassungen geben **Storls Sicht** wieder – wo sie wissenschaftlich anders gesehen wird, steht eine Einordnung."},{"typ":"karten","art":"buch","filter":[["alle","Alle"],["garten","Garten & Selbstversorgung"],["pflanzen","Pflanzen & Kräuter"],["gesund","Heilkunde"],["mythos","Mythos & Kultur"],["leben","Leben & Gespräche"]],"eintraege":[{"id":"rechter-umgang","titel":"Vom rechten Umgang mit heilenden Pflanzen","kat":"pflanzen","jahr":"1986","verlag":"Hermann Bauer","kurz":"Sein erstes Kräuterbuch: Heilpflanzen achtsam sammeln und verwenden.","zutaten":["Frühwerk, heute vergriffen; kaum Verlagsangaben verfügbar"],"schritte":["Grundhaltung, die alle späteren Bücher prägt: Pflanzen sind Lebewesen, denen man mit Respekt begegnet.","Viele Gedanken tauchen erweitert in der „Kräuterkunde“ (1996) wieder auf."]},{"id":"mikrokosmos","titel":"Der Garten als Mikrokosmos / Der Kosmos im Garten","kat":"garten","jahr":"1988, Neuausgabe 2022","verlag":"Hermann Bauer; heute AT Verlag","kurz":"Ganzheitliche Garten- und Naturkunde: der Garten als Abbild einer höheren Ordnung – von Planeten bis Bodenbakterien.","zutaten":["Neuausgabe „Der Kosmos im Garten“, AT Verlag, 352 Seiten","Untertitel der Erstausgabe: Biologische Naturgeheimnisse als Weg zur besseren Ernte"],"schritte":["Wer die Zusammenhänge im Garten versteht, gärtnert erfüllter und erntet mehr.","Schöpft aus Rosenkreuzern, Neuplatonikern, indigenen Völkern, China, Paracelsus und Agrippa von Nettesheim.","Praktisch: biodynamische Gartenpraxis durchs Jahr – Kompost, Pflanzennachbarschaften, Fruchtfolge, Saatgut.","Insekten und Kleintiere als Mitbewohner des Gartens."],"tipp":"Im Kompendium: {{s:mischkultur|Mischkultur}}, {{s:boden-kompost|Kompost}}."},{"id":"bach","titel":"Die Seelenpflanzen des Edward Bach (mit Mechthild Scheffer)","kat":"pflanzen","jahr":"1995, Neuausgabe 2012","verlag":"Hugendubel; Aurum","kurz":"Die Pflanzen hinter den Bach-Blüten – botanisch, kulturgeschichtlich und in ihrem „Wesen“ beschrieben.","zutaten":["Untertitel der Neuausgabe: Neue Einsichten in die Bach-Blütentherapie","Co-Autorin: Mechthild Scheffer, bekannte Bach-Blüten-Autorin"],"schritte":["Storl ergänzt die Bach-Blüten-Lehre um den Blick des Ethnobotanikers auf die lebende Pflanze.","Jede Pflanze wird in Standort, Gestalt und Überlieferung porträtiert."],"hinweis":"Bach-Blüten gelten als [A] alternativ; eine Wirkung über Placebo hinaus ist nicht belegt."},{"id":"kraeuterkunde","titel":"Kräuterkunde","kat":"pflanzen","jahr":"1996, Neuausgabe 2020","verlag":"Aurum","kurz":"Sein Standardwerk: Einführung in die verborgenen Kräfte der Heilkräuter – Wissenschaft und Mystik nebeneinander.","zutaten":["Neuausgabe 2020, Aurum (Kamphausen), 224 Seiten"],"schritte":["Verbindet wissenschaftliche Erkenntnisse mit mystischen Sichtweisen und zeigt, wo sie sich berühren.","Pflanzen als Lebewesen mit eigener „Botschaft“.","Für Einsteiger informationsdicht – eher ein Grundlagenwerk zum Nachschlagen."]},{"id":"pflanzengottheiten","titel":"Von Heilkräutern und Pflanzengottheiten","kat":"mythos","jahr":"1997","verlag":"Aurum","kurz":"Heilpflanzen und die Götter, mit denen die Völker sie verbanden.","zutaten":["Kurzfassung nach Titel und Werkverzeichnis; ausführlicher Klappentext nicht verfügbar"],"schritte":["Pflanzenkunde und Religion gehörten in alten Kulturen zusammen.","Vorstufe zu späteren Büchern wie „Pflanzendevas“ und „Ur-Medizin“."]},{"id":"devas","titel":"Pflanzendevas","kat":"mythos","jahr":"1997/2002","verlag":"AT Verlag","kurz":"Die „Pflanzenengel“: geistig-seelische Wesen der Pflanzen in Heilkunde, Mythologie und Religion.","zutaten":["Untertitel: Die Göttin und ihre Pflanzenengel – Heilkunde, Kulturgeschichte, Mythologie und Religion der Völker","ca. 220 Seiten"],"schritte":["Hinter jeder Pflanzenart steht nach Storl ein seelisch-geistiges Wesen (Deva).","Geprägt von Anthroposophie und alten Naturreligionen."],"hinweis":"Spirituelle Deutung [A], keine überprüfbaren Aussagen."},{"id":"hexenmedizin","titel":"Hexenmedizin (mit Christian Rätsch und Claudia Müller-Ebeling)","kat":"mythos","jahr":"1998, Neuausgabe 2011","verlag":"AT Verlag","kurz":"Die verdrängte Heilkunst der „weisen Frauen“: stark wirksame Pflanzen zwischen Heilen und Töten.","zutaten":["AT Verlag, 272 Seiten (Ausgabe 2011)","Untertitel: Die Wiederentdeckung einer verbotenen Heilkunst – schamanische Traditionen in Europa"],"schritte":["Hexenmedizin als angewandte Pharmakologie mit Wurzeln im Schamanismus und bei den antiken Wurzelgräbern.","Heilung war mit Ritual, Mond und Göttinnen wie Hekate, Artemis oder Freya verbunden – Kirche und später Schulmedizin verdrängten das Wissen.","Pflanzen u. a.: Johanniskraut, Beifuß, Holunder, Schafgarbe, Wermut, Eibe, Bilsenkraut, Alraune, Eisenhut.","Bis zur Geschichte des Drogenverbots."],"tipp":"Im Kompendium: {{p:p09|Beifuß}}, {{p:p16|Wermut}}, {{p:p08|Johanniskraut}}.","hinweis":"Viele der beschriebenen Pflanzen sind stark giftig – das Buch ist Kulturgeschichte, keine Anleitung."},{"id":"bilsenkraut","titel":"Götterpflanze Bilsenkraut","kat":"mythos","jahr":"2000","verlag":"Nachtschatten Verlag","kurz":"Monografie über eine der berühmtesten Zauber- und Giftpflanzen Europas.","zutaten":["Reihe über Nachtschattengewächse im Nachtschatten Verlag","Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Bilsenkraut als alte Ritual- und Heilpflanze der Germanen und Kelten.","Kulturgeschichte von Brauch, Zauber und Medizin."],"hinweis":"Bilsenkraut ist hochgiftig (Tropanalkaloide)."},{"id":"haustuer","titel":"Heilkräuter und Zauberpflanzen zwischen Haustür und Gartentor","kat":"pflanzen","jahr":"2000","verlag":"AT Verlag","kurz":"Die wichtigsten Heilpflanzen wachsen nicht in fernen Ländern, sondern direkt vor der Haustür.","zutaten":["AT Verlag; Leseprobe beim Narayana Verlag"],"schritte":["Pflanzenporträts mit Volksheilkunde, Brauchtum und Mythologie.","Beifuß und die Artemisia-Arten als bittere, zähe Überlebende der Eiszeit-Steppe.","Sonnwendbräuche: Beifußgürtel und Johannisfeuer.","Pflanzen haben eine Seele, die man wahrnehmen kann."],"tipp":"Im Kompendium: {{p:p09#tradition|Beifuß – Tradition & Storl}}."},{"id":"kelten","titel":"Pflanzen der Kelten","kat":"mythos","jahr":"2000, Neuausgabe 2025","verlag":"AT Verlag","kurz":"Was vom Wissen der Druiden im Volk überlebte: Heilkunde, Pflanzenzauber und Baumkalender.","zutaten":["Untertitel: Heilkunde, Pflanzenzauber, Baumkalender","AT Verlag, 336 Seiten (2025)"],"schritte":["Das Wissen der Druiden lebte im einfachen Volk in Bräuchen, Erzählungen und Kräuterkunde weiter.","Eine Volksheilkunde, die weniger auf Wirkstoffe als auf die „magische Kraft“ der Pflanzen setzt.","Kräuter und Bäume im Jahreslauf; keltischer Jahreskreis und Baumkalender mit acht Festen.","Mit Rezepten für überlieferte Heilmittel."],"tipp":"Im Kompendium: {{p:p14|Waldkiefer}}, {{p:p04|Holunder}}."},{"id":"gemuese","titel":"Bekannte und vergessene Gemüse (mit Paul Silas Pfyl)","kat":"garten","jahr":"2002","verlag":"AT Verlag","kurz":"48 bekannte und seltene Gemüse mit Kulturgeschichte, Heilwirkung, Gartenpraxis und alten Rezepten.","zutaten":["Englisch 2016: „A Curious History of Vegetables“","Farbige Bleistiftzeichnungen zu jeder Art"],"schritte":["Zu jedem Gemüse: Symbolik, Geschichte, Heilwirkung und „Charakter“.","Gartentipps nach biodynamischer Lehre: Licht, Wärme, Kompost, Fruchtfolge, Beikräuter.","Volkserzählungen, Anekdoten und historische Rezepte."],"tipp":"Im Kompendium: {{p:p11|Portulak}}, {{s:mischkultur-standort|Gemüse: Licht, Wasser, Nährstoffe}}."},{"id":"shiva","titel":"Shiva – Der wilde, gütige Gott","kat":"mythos","jahr":"um 2003","verlag":"KOHA","kurz":"Der hinduistische Gott Shiva – aus Storls Feldforschung bei Sadhus in Indien und Nepal.","zutaten":["Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Mythologie, Verehrung und Lebensweise der Shiva-Asketen.","Verbindet Ethnologie mit eigenen Erfahrungen."]},{"id":"bom-shiva","titel":"Bom Shiva – Der ekstatische Gott des Ganjas","kat":"mythos","jahr":"2003","verlag":"Nachtschatten Verlag","kurz":"Die Rolle des Hanfs im Shiva-Kult Indiens – kulturgeschichtlich beschrieben.","zutaten":["Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Hanf als Ritualpflanze der Shiva-Verehrung.","Ethnologische Perspektive auf Rausch und Religion."]},{"id":"midgard","titel":"Streifzüge am Rande Midgards","kat":"leben","jahr":"2006","verlag":"KOHA","kurz":"Geschichten aus seinem Leben zwischen Wissenschaft, Schamanismus und Natur.","zutaten":["Untertitel: Geschichten aus meinem Leben"],"schritte":["Autobiografische Erzählungen.","Midgard = die Menschenwelt der germanischen Mythologie."]},{"id":"borreliose","titel":"Borreliose natürlich heilen","kat":"gesund","jahr":"2007","verlag":"AT Verlag","kurz":"Storls eigene Borreliose und sein Weg mit der Karde und Überhitzung.","zutaten":["AT Verlag, 263 Seiten"],"schritte":["Borreliose als Zeckeninfektion mit sehr vielen möglichen Symptomen.","Storl hält Antibiotika für wirkungslos und setzt auf chinesische Medizin, indianisches Heilwissen, Homöopathie und Kräuter.","Zentral: Kardenwurzel-Tinktur und Überhitzungstherapie, nach eigenen Angaben an sich selbst erprobt."],"hinweis":"**Einordnung:** Die Leitlinien empfehlen bei Borreliose eine frühe Antibiotikabehandlung, sie ist gut wirksam. Für die Karde gibt es keine klinischen Belege [A]. Bei Wanderröte oder nach Zeckenstich mit Symptomen immer zum Arzt."},{"id":"seele","titel":"Die Seele der Pflanzen","kat":"pflanzen","jahr":"2009","verlag":"Kosmos / Nymphenburger","kurz":"55 Pflanzen aus Wald, Wegrand und Wiese – ihr Wesen und ihre Heilkräfte.","zutaten":["Untertitel: Botschaften und Heilkräfte aus dem Reich der Kräuter","Fotos: Frank Brunke"],"schritte":["Jede Pflanze hat eine eigene „Botschaft“ und Persönlichkeit.","Verbindet Bestimmung, Heilkunde und Pflanzenwesen."],"tipp":"Viele davon stehen im Kompendium, z. B. {{p:p01|Brennnessel}}, {{p:p06|Spitzwegerich}}, {{p:p12|Königskerze}}."},{"id":"mit-pflanzen","titel":"Mit Pflanzen verbunden","kat":"pflanzen","jahr":"2009","verlag":"Heyne / Nymphenburger","kurz":"Persönliche Begegnungen: was einzelne Pflanzen Storl bedeuten.","zutaten":["Untertitel: Meine Erlebnisse mit Heilkräutern und Zauberpflanzen"],"schritte":["Pflanzen als eigenständige Persönlichkeiten.","Beispiele u. a. Kanadische Goldrute, Karde, Tollkirsche."]},{"id":"erkenne","titel":"Erkenne dich selbst in der Natur","kat":"leben","jahr":"2011","verlag":"AT Verlag","kurz":"Gespräche über Natur, Mensch und Selbsterkenntnis.","zutaten":["Untertitel: Gespräche unter dem Regenbogen, aufgezeichnet von Rébecca Kunz"],"schritte":["Die Natur als Spiegel des Menschen.","Interviewform, persönlich und philosophisch."]},{"id":"wandernde","titel":"Wandernde Pflanzen","kat":"pflanzen","jahr":"2012","verlag":"AT Verlag","kurz":"Neophyten – eingewanderte Pflanzen wie Goldrute, Springkraut, Riesenbärenklau – neu bewertet.","zutaten":["Untertitel: Neophyten, die stillen Eroberer. Ethnobotanik, Heilkunde und Anwendungen","ca. 250 Seiten"],"schritte":["Woher die Pflanzen kommen, warum sie hier sind und welche Aufgabe sie übernehmen.","Storl hinterfragt das pauschale Urteil „Problempflanze“ und sieht sie als Bereicherung, Teil der Wiederbesiedlung nach der Eiszeit.","In ihren Ursprungsländern oft Nahrungs-, Heil- oder heilige Pflanzen."],"hinweis":"Naturschutzbehörden sehen invasive Neophyten wie Riesenbärenklau (Verbrennungen) und Ambrosia (Allergie) deutlich kritischer."},{"id":"baer","titel":"Der Bär – Krafttier der Schamanen und Heiler","kat":"mythos","jahr":"2013","verlag":"AT Verlag","kurz":"Der Bär in Kulturgeschichte, Mythos und Heilkunde – von der Neandertalerhöhle bis zum Teddybär.","zutaten":["ca. 274 Seiten"],"schritte":["Der Bär galt als „Waldmensch“ mit menschlicher oder göttlicher Seele, der heilen konnte.","Bärenkulte sibirischer Völker, die Bärengöttin Artemis, der Medizinbär indianischer Schamanen, Bärenmärchen.","Storl lebte selbst lange in Bärengebieten der Rocky Mountains."]},{"id":"selbstversorger","titel":"Der Selbstversorger","kat":"garten","jahr":"2013","verlag":"Gräfe und Unzer","kurz":"Wie Storl sich seit Jahrzehnten aus Garten und Natur versorgt.","zutaten":["Später als „Der Selbstversorger: Mein Gartenwissen“"],"schritte":["Gemüseanbau, Wildkräuter sammeln, guten Kompost herstellen.","Natürliche Mittel gegen Schädlinge, Pflanzenpflege, Gartenkalender.","Leitlinien: nachhaltig, naturnah, ganzheitlich – für Einsteiger und Fortgeschrittene."],"tipp":"Im Kompendium: {{s:boden|Boden}}, {{s:mischkultur|Mischkultur}}, {{s:jauche|Pflanzenjauche}}."},{"id":"alte-goettin","titel":"Die alte Göttin und ihre Pflanzen","kat":"mythos","jahr":"2014","verlag":"Kailash","kurz":"Märchen und ihre Pflanzen als Spuren einer alten, vorchristlichen Spiritualität.","zutaten":["Untertitel: Wie wir durch Märchen zu unserer Urspiritualität finden"],"schritte":["Storl liest bekannte Märchen als Erinnerung an die Verehrung der Großen Göttin.","Die Pflanzen der Märchen tragen diese alte Bedeutung weiter."],"tipp":"Im Kompendium: {{p:p04|Holunder}}."},{"id":"naturrituale","titel":"Naturrituale","kat":"mythos","jahr":"–","verlag":"AT Verlag","kurz":"Schamanische Rituale als Weg zu den eigenen Wurzeln.","zutaten":["Untertitel: Mit schamanischen Ritualen zu den eigenen Wurzeln finden","Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Rituale im Jahreslauf und in der Natur.","Rückbindung an alte europäische Traditionen."]},{"id":"ur-medizin","titel":"Ur-Medizin","kat":"gesund","jahr":"2015","verlag":"AT Verlag","kurz":"Die wahren Ursprünge unserer Volksheilkunde – bewahrt vor allem von Frauen.","zutaten":["Untertitel: Die wahren Ursprünge unserer Volksheilkunde","AT Verlag, 304 Seiten"],"schritte":["Jedes Volk hat eine an Ort, Klima und Pflanzen angepasste Volksheilkunde.","Bewahrt und weitergegeben vor allem von Frauen, die Kranke, Kinder und Alte pflegten.","Dazu gehören schamanisches Heilen, Kontakt zum Pflanzengeist, Krankheitsgeister und Überhitzung (Schwitzhütte).","Frühe Bauern nutzten Ackerbegleitkräuter wie Kamille oder Wegmalve als Heilmittel."],"tipp":"Im Kompendium: {{a:storl-denken|Storls Denken}}."},{"id":"fuenf-baeume","titel":"Unsere fünf heiligen Bäume","kat":"pflanzen","jahr":"–","verlag":"Kosmos","kurz":"Naturmeditationen mit fünf heimischen Bäumen, die je für ein Lebensthema stehen.","zutaten":["Kurzfassung nach Verlagsbeschreibung"],"schritte":["Birke: lichtvoller Anfang. Buche: geistige Verbindung. Eiche: ordnende Kräfte. Linde: heilende Liebe. Eibe: offene Lebensfragen.","Keine besondere Technik nötig: den Baum berühren, riechen, ein Blatt kosten und auf die eigene Resonanz achten."],"hinweis":"Eibe nicht kosten – fast alle Teile sind giftig. Siehe {{s:knospen-sammeln|Sicher sammeln}}."},{"id":"teil-des-waldes","titel":"Ich bin ein Teil des Waldes","kat":"leben","jahr":"–","verlag":"Kosmos / Nymphenburger","kurz":"Seine Lebensgeschichte: vom Biologiestudium zu Schamanen, Sadhus und Bergbauern.","zutaten":["Untertitel: „Der Schamane aus dem Allgäu“ erzählt seine Lebensgeschichte; 2021 auch als Hörbuch"],"schritte":["Nach vielversprechendem Studium wendet er sich ganz der Natur zu.","Begegnungen mit Schamanen, Sadhus und Bergbauern; Sagen, Mythen, Heilpflanzen.","Heute auf einem Hof im Allgäu, engagiert für den Schutz der Pflanzen."]},{"id":"gartenjahr","titel":"Der Selbstversorger. Mein Gartenjahr","kat":"garten","jahr":"2016","verlag":"Gräfe und Unzer","kurz":"Der Gartenkalender eines Selbstversorgers – nach Naturzeichen statt nach Datum.","zutaten":["Gräfe und Unzer, 128 Seiten, mit DVD und App (110 Min. Video)"],"schritte":["Vom Vorfrühling bis zur Winterernte: die wichtigsten Arbeiten Schritt für Schritt.","Zeitpunkt für Aussaat, Pflanzung, Mulchen und Ernte nach Naturphänomenen wie der Apfelblüte – unabhängig von Region und Wetter."]},{"id":"kulturschock","titel":"Mein amerikanischer Kulturschock","kat":"leben","jahr":"2017","verlag":"Kailash","kurz":"Erinnerungen an seine Jugend in Ohio.","zutaten":["Untertitel: Meine Jugend unter Hillbillies, Blumenkindern und Rednecks"],"schritte":["Mit elf Jahren von Sachsen nach Ohio ausgewandert.","Prägende Zeit im Wald und unter sehr verschiedenen Menschen."]},{"id":"unkraeuter","titel":"Die „Unkräuter“ in meinem Garten","kat":"garten","jahr":"2018","verlag":"Gräfe und Unzer","kurz":"21 heimische Wildpflanzen, die als Unkraut gelten, aber Heil- und Nutzpflanzen sind.","zutaten":["Untertitel: 21 Pflanzenpersönlichkeiten erkennen & nutzen"],"schritte":["„Unkräuter“ sind Heil- und Nahrungspflanzen, Nektarquellen und Zierde naturnaher Gärten.","Porträts in verschiedenen Wachstumsstadien mit Bestimmungshilfe.","Gleichgewicht statt Kampf – eine Löwenzahn-Invasion im Gemüsebeet muss man aber nicht dulden."],"tipp":"Im Kompendium: {{p:p01|Brennnessel}}, {{p:p02|Giersch}}, {{p:p03|Löwenzahn}}, {{p:p11|Portulak}}."},{"id":"wolfsmedizin","titel":"Wolfsmedizin","kat":"gesund","jahr":"2018","verlag":"AT Verlag","kurz":"Reise zu den Pflanzenheilkundigen in der Mongolei und Sibirien.","zutaten":["Untertitel: Eine Reise zu den Pflanzenheilkundigen in der Mongolei und Sibirien"],"schritte":["Begegnungen mit Heilern und Schamanen Zentralasiens.","Der Wolf in Mythos und Heilkunde der Steppenvölker."]},{"id":"wir-geschoepfe","titel":"Wir sind Geschöpfe des Waldes","kat":"pflanzen","jahr":"2019","verlag":"Gräfe und Unzer","kurz":"Warum der Mensch untrennbar mit den Bäumen verbunden ist.","zutaten":["Untertitel: Warum wir untrennbar mit den Bäumen verbunden sind"],"schritte":["Der Mensch stammt aus dem Wald und braucht ihn – körperlich und seelisch.","Bäume in Kulturgeschichte, Mythos und Heilkunde."],"tipp":"Fortsetzung als Ratgeber: „Meine Kräuter des Waldes“."},{"id":"herz","titel":"Das Herz und seine heilenden Pflanzen","kat":"gesund","jahr":"2020","verlag":"AT Verlag","kurz":"Herzleiden ganzheitlich betrachtet – mit Pflanzen der Volks- und der Schulmedizin.","zutaten":["AT Verlag, 231 Seiten"],"schritte":["Fragt nach Stress, Ernährung, seelischen Mustern und Mikroorganismen als Ursachen.","Vor der Industrialisierung waren Herzleiden in heutiger Form selten; man nutzte Pflanzen mit geistig-seelischer Wirkung.","Auch Pflanzen der Kardiologie: Fingerhut, Maiglöckchen, Strophanthus.","Ethnomedizinische und volkskundliche Perspektive."],"hinweis":"Fingerhut und Maiglöckchen sind hochgiftig – Herzmittel nur ärztlich."},{"id":"kraeuter-wald","titel":"Meine Kräuter des Waldes","kat":"pflanzen","jahr":"um 2020","verlag":"Gräfe und Unzer","kurz":"30 heimische Waldkräuter auf Spaziergängen durchs Jahr.","zutaten":["Gräfe und Unzer, 240 Seiten","Gegliedert nach Frühling, Sommer, Herbst"],"schritte":["Merkmale, Eigenschaften und Verwendung als Heil- und Esspflanzen.","Dazu Wesen und Kulturgeschichte der Pflanzen.","Erster Waldkräuter-Ratgeber des Autors, anknüpfend an „Wir sind Geschöpfe des Waldes“."],"tipp":"Im Kompendium: {{s:knospen|Knospen & junge Triebe}}."},{"id":"neophyten","titel":"Wesen und Geheimnisse der Neophyten","kat":"pflanzen","jahr":"2022","verlag":"AT Verlag","kurz":"Fortsetzung von „Wandernde Pflanzen“: eingewanderte Arten als Heil-, Nahrungs- und Nutzpflanzen.","zutaten":["Untertitel: Heilpflanzen, Nahrungspflanzen, Nutzpflanzen","Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Neophyten nicht nur als Problem, sondern als Ressource sehen.","Nutzung in Küche, Heilkunde und Handwerk."],"tipp":"Im Kompendium: {{p:p17|Schwarznuss}} (ein Neophyt)."},{"id":"rezepte","titel":"Die Rezepte unseres Lebens","kat":"garten","jahr":"2023","verlag":"Gräfe und Unzer","kurz":"Das Kochbuch der Familie Storl.","zutaten":["Untertitel: Das Kochbuch der Familie Storl","Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Alltagsküche aus Garten und Natur eines Selbstversorgerhaushalts."]},{"id":"mont-aubert","titel":"Der Weise vom Mont Aubert","kat":"leben","jahr":"2023","verlag":"AT Verlag","kurz":"Erinnerungen an Arthur Hermes und ein Leben im Einklang mit der Natur.","zutaten":["Untertitel: Erinnerungen an Arthur Hermes. Ein Leben im Einklang mit der Natur","Kurzfassung nach Titel und Werkverzeichnis"],"schritte":["Porträt eines prägenden Weggefährten aus Storls Zeit in der Schweiz.","Naturnahes Leben und Gärtnern als Lebenshaltung."]},{"id":"sonnenwenden","titel":"Die Magie der Sonnenwenden","kat":"mythos","jahr":"6. Aufl. 2024","verlag":"Gräfe und Unzer","kurz":"Bräuche und Pflanzen zu Mittsommer und Wintersonnenwende.","zutaten":["Untertitel: Unsere Pflanzen und ihre Rituale; 224 Seiten"],"schritte":["Bräuche und Rituale folgen dem Jahreskreis und den Pflanzen.","Ursprüngliche Bedeutung der Rituale aus der Kraft der Pflanzen erklärt.","Themen: Johanni und Sommersonnenwende, Jul und Weihnachtszeit."],"tipp":"Im Kompendium: {{p:p08|Johanniskraut}}, {{p:p09#tradition|Beifuß-Sonnwendgürtel}}."},{"id":"wurzeln","titel":"Unsere Wurzeln entdecken","kat":"leben","jahr":"2024","verlag":"Kailash","kurz":"Interviewband: woher die Menschheit kommt und wohin sie geht.","zutaten":["Kailash, 184 Seiten"],"schritte":["Entstehung des Menschseins und des Bewusstseins.","Spiritualität von der Jungsteinzeit bis heute – von der Höhlenmalerei zur Kathedrale.","Verbunden mit Erfahrungen bei indigenen Völkern Nordamerikas; Ausblick auf die Zukunft."]}]},{"typ":"quellen","eintraege":[["Wikipedia: Wolf-Dieter Storl (Werkverzeichnis)","https://de.wikipedia.org/wiki/Wolf-Dieter_Storl"],["Ex Libris: Der Kosmos im Garten","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/der-kosmos-im-garten/id/9783039021543/"],["Ex Libris: Pflanzen der Kelten","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/pflanzen-der-kelten/id/9783039022922/"],["Ex Libris: Ur-Medizin","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/ur-medizin/id/9783038008729/"],["Ex Libris: Die Magie der Sonnenwenden","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/die-magie-der-sonnenwenden/id/9783833894992/"],["Ex Libris: Meine Kräuter des Waldes","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/meine-kraeuter-des-waldes/id/9783833877841/"],["Ex Libris: Unsere Wurzeln entdecken","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/unsere-wurzeln-entdecken/id/9783424633009/"],["Ex Libris: Der Selbstversorger – Mein Gartenjahr","https://www.exlibris.ch/de/buecher-buch/deutschsprachige-buecher/wolf-dieter-storl/der-selbstversorger-mein-gartenjahr/id/9783833851650/"],["Lesejury: Kräuterkunde","https://www.lesejury.de/wolf-dieter-storl/buecher/kraeuterkunde/9783958834361"],["Shop Apotheke: Borreliose natürlich heilen","https://www.shop-apotheke.com/buecher/upmUMZWW7/borreliose-natuerlich-heilen.htm"],["Shop Apotheke: Das Herz und seine heilenden Pflanzen","https://www.shop-apotheke.com/buecher/upmXURX2Y/das-herz-und-seine-heilenden-pflanzen.htm"],["Narayana: Leseprobe Hexenmedizin","https://narayana-verlag.imgbolt.de/media/a7/ec/3d/1787087717/excerpt_16414_de-DE.pdf"],["BookBeat: Der Bär","https://bookbeat.com/uk/book/der-bar-570161"],["North Atlantic Books: A Curious History of Vegetables","https://northatlanticbooks.com/?p=48320"],["Goodreads: Wandernde Pflanzen","https://www.goodreads.com/book/show/17206141-wandernde-pflanzen"],["Kosmos: Storl-Titel","https://www.kosmos.de/en/collections/wolf-dieter-storl.oembed"],["ebook.de: Der Selbstversorger – Mein Gartenwissen","https://www.ebook.de/de/product/28081884/wolf_dieter_storl_der_selbstversorger_mein_gartenwissen.html"],["VOL.AT: Die „Unkräuter“ in meinem Garten","https://www.vol.at/selbstversorger-die-unkraeuter-in-meinem-garten/5778209"]]}]},{"id":"denken","titel":"Denken","bloecke":[{"typ":"text","text":"Storl schaut auf Pflanzen mit drei Brillen zugleich: der des Botanikers, der des Völkerkundlers und der des Gärtners."},{"typ":"abschnitt","titel":"1. Pflanzen sind Wesen","liste":["Pflanzen haben kulturelle, sprachliche, heilkundliche und mythologische Bedeutung, die aus ihrer Beziehung zum Menschen entsteht.","Er spricht von der Seele der Pflanzen und von Pflanzendevas – geprägt von Anthroposophie und alten Naturreligionen.","Sammeln heißt für ihn: mit Respekt und Dank, nicht nur nehmen."]},{"typ":"abschnitt","titel":"2. Ur-Medizin","liste":["Unsere Volksmedizin reicht bis in die Steinzeit und zu schamanischen Kulturen zurück.","Kelten, Germanen, Indianer und indische Heiler kannten dieselben Grundprinzipien.","Viel von diesem Wissen ging durch Christianisierung und Hexenverfolgung verloren."]},{"typ":"abschnitt","titel":"3. „Unkräuter“ sind Begleiter","liste":["Die wichtigsten Heilpflanzen wachsen dort, wo Menschen leben – an Haustür, Weg und Gartenzaun.","Brennnessel, Löwenzahn und Co. sind Nahrung, Medizin und Nützlingsweide.","Siehe {{p:p01|Brennnessel}} und {{p:p02|Giersch}}."]},{"typ":"abschnitt","titel":"4. Selbstversorgung","liste":["Lokaler Anbau mit alten, samenfesten Sorten statt eng gezüchtetem Hybrid- und Gentechnik-Saatgut.","Der Garten ist ein Mikrokosmos und ein Lernort.","Jeder kann klein anfangen."]},{"typ":"abschnitt","titel":"5. Natur als Weg zu sich selbst","liste":["„Die Arbeit mit der Natur bringt einen näher zum eigenen Selbst, man kann sich selber finden.“","Gärtnern und Wandern als Meditation.","Der Mensch ist ein Geschöpf des Waldes."]}]},{"id":"garten","titel":"Garten-Praxis","bloecke":[{"typ":"text","text":"Praktische Grundsätze aus seinen Selbstversorger-Büchern, übertragen auf den eigenen Garten."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["anbau","Anbau"],["wild","Wildpflanzen"],["haltung","Haltung"]],"eintraege":[{"id":"sorten","titel":"Alte Sorten anbauen","kat":"anbau","beleg":"T","teil":"Saatgut","kurz":"Samenfeste, regionale Sorten passen sich an Standort und Wandel an.","zutaten":["samenfestes Saatgut, z. B. aus Saatgut-Tauschbörsen"],"schritte":["Sorten wählen, die in der Region bewährt sind.","Eigenes Saatgut von den kräftigsten Pflanzen gewinnen ({{s:samen|Samen ernten}}).","Jedes Jahr ein Stück mehr selbst vermehren."]},{"id":"klein","titel":"Klein anfangen","kat":"haltung","beleg":"T","teil":"Einstieg","kurz":"Man braucht keinen Acker – ein Beet oder Kübel genügt für den Anfang.","zutaten":["ein sonniges Beet oder einige Kübel"],"schritte":["Mit leichten Kulturen beginnen: Salat, Radieschen, Bohnen, Kräuter.","Jedes Jahr dazulernen und erweitern."]},{"id":"beikraut","titel":"Beikräuter nutzen statt bekämpfen","kat":"wild","beleg":"T","teil":"Wildpflanzen","kurz":"Brennnessel, Giersch, Löwenzahn und Co. als Ernte betrachten.","zutaten":["Beikräuter im eigenen Garten"],"schritte":["Bestimmen lernen.","Regelmäßig ernten und verwerten ({{p:p02#selbstversorgung-ernten|Giersch aufessen}}).","Ecken für Nützlinge stehen lassen, Gleichgewicht halten."]},{"id":"mikrokosmos","titel":"Den Garten als Ganzes sehen","kat":"haltung","beleg":"A","teil":"Biodynamik","kurz":"Boden, Pflanzen, Tiere, Jahreslauf und Mensch bilden einen Organismus.","zutaten":["Kompost, Mulch, Vielfalt"],"schritte":["Boden mit Kompost und Mulch pflegen.","Mischkultur statt Monokultur.","Nach dem Jahreslauf arbeiten (siehe „Mein Gartenjahr“)."]},{"id":"jauchen","titel":"Mit Pflanzen düngen","kat":"anbau","beleg":"T","teil":"Dünger","kurz":"Kräuterjauchen gehören zum traditionellen Selbstversorger-Garten.","zutaten":["Brennnessel, Beinwell, Giersch"],"schritte":["Jauche ansetzen: {{s:jauche|Pflanzenjauche}}.","Beispiel: {{p:p01#selbstversorgung-jauche|Brennnesseljauche}}."]},{"id":"mischkultur","titel":"Mischkultur statt Monokultur","kat":"anbau","beleg":"T","teil":"Beet","kurz":"Vielfalt im Beet: Pflanzen schützen und versorgen sich gegenseitig.","zutaten":["Beetplan, verschiedene Pflanzenfamilien"],"schritte":["Gute Nachbarn kombinieren: {{s:mischkultur-nachbarn|Nachbar-Check}}.","Boden mit Spinat, Mulch und Gründüngung bedeckt halten.","Fruchtfolge einhalten: {{s:mischkultur-plan|Beet planen}}."]},{"id":"wildkraeuter","titel":"Wildkräuter vor der Haustür","kat":"wild","beleg":"T","teil":"Sammeln","kurz":"Die neuen Pflanzenkapitel mit Storl-Bezug.","zutaten":["{{p:p09|Beifuß}}, {{p:p10|Breitwegerich}}, {{p:p11|Portulak}}, {{p:p12|Königskerze}}, {{p:p20|Beinwell}}"],"schritte":["Jeweils Reiter „Tradition & Storl“ öffnen.","Mit Respekt sammeln: {{s:knospen-sammeln|Sicher sammeln}}."]}]}]},{"id":"videos","titel":"Videos","bloecke":[{"typ":"text","text":"Aufbereitung eines langen Video-Gesprächs, vollständig aus dem Transkript. Eigene Ergänzungen sind mit **[Ergänzung]** markiert, schlecht verständliche Stellen mit **[unklar]**."},{"typ":"karten","art":"buch","filter":[["alle","Alle"]],"eintraege":[{"id":"kenfm2018","titel":"Storl im Gespräch bei KenFM (1. Mai 2018)","kat":"alle","jahr":"2018","verlag":"KenFM, YouTube; ca. 2:44 Std.","kurz":"Langes Gespräch in Storls Arbeitszimmer im Westallgäu – Lebensweg, Amerika, Wissenschaft, Grüne Revolution, Indianer, Indien, Weltbild – und ein Rundgang durch seinen Selbstversorgergarten.","zutaten":["Aufhänger: sein Buch {{a:storl-buecher-kulturschock|Mein amerikanischer Kulturschock}} – laut Moderator sein etwa 30. Buch","Ort: Storls Hof auf ca. 930 m im Westallgäu; Teil 2 im Garten","Vorgespräch: knapp 3 Stunden; Moderator laut Transkript „Herr Schul“ [unklar]; Sendungsname „Dimacher“ [unklar, vermutlich „Die Macher“]"],"schritte":["Natur ist kein Feind und kein Partner – „Wir sind Natur.“","Pflanzen haben neben der botanischen eine kulturelle und sprachliche Identität; über sie findet der Mensch zu seinen Wurzeln zurück.","Die Grüne Revolution sollte nach seiner Erfahrung Abhängigkeit schaffen; Vielfalt (Kulturen, Höfe, Pflanzen) ist Stärke.","Gärtnern ist einfach: Fruchtfolge, Pflanzabstände, Kompost – „Die Pflanzen wachsen von alleine, man muss ihnen nur die Möglichkeit geben.“"]}]},{"typ":"abschnitt","titel":"1. Überblick","liste":["**Thema:** Wolf-Dieter Storl erzählt sein Leben zwischen Sachsen, Amerika, Europa und Indien und erklärt, wie daraus sein Blick auf Natur, Pflanzen und Gesellschaft entstand.","**Zusammenfassung:** Ausgehend von seinem Buch über den amerikanischen Kulturschock spricht Storl über Kriegskindheit, Auswanderung nach Ohio, sein enttäuschendes Botanikstudium und den Weg in die Ethnologie. Er kritisiert die Grüne Revolution, die Agrarindustrie und kulturelle Gleichmacherei, schildert Erfahrungen mit Indianern, LSD, Indien und dem Tod. Am Ende steht sein Weltbild: Der Mensch ist Teil der Natur; Pflanzen, Märchen und alte Bilder verbinden ihn mit seinen Wurzeln. Im Garten zeigt er, wie Selbstversorgung praktisch aussieht.","**Für wen relevant:** Selbstversorger und Gärtner, an Ethnobotanik, Kulturgeschichte und Storls Werk Interessierte, alle, die seine Haltung hinter den Büchern verstehen wollen."]},{"typ":"illu","id":"storl_mindmap","titel":"Mindmap des Gesprächs"},{"typ":"baum","titel":"2. Themenbaum","wurzel":"Storl im Gespräch (KenFM, 2018)","knoten":[{"t":"Herkunft & Kindheit","k":[{"t":"Geburt 1942 in Crimmitschau, Tuchmacherfamilie"},{"t":"Bombennächte, Vater erst mit 5 kennengelernt"},{"t":"Flucht 1947 nach Oldenburg, Dachkammer"},{"t":"Hunger, Wildpflanzen sammeln"},{"t":"Schreiben wie Weben, als Meditation"}]},{"t":"Amerika & Kulturschock","k":[{"t":"Auswanderung 1954 nach Ohio"},{"t":"Amische"},{"t":"Überfluss und Wegwerfen"},{"t":"Rassentrennung, Schule"},{"t":"Wildnis gegen Zivilisation"},{"t":"Sexualmoral, 60er-Jahre, Drogen"},{"t":"Überwachung, Bürgerwehr, Flucht"}]},{"t":"Wissenschaft & Bewusstsein","k":[{"t":"Botanikstudium: Pflanzen ohne Willen"},{"t":"Schmetterlinge aufspießen"},{"t":"Geologie abgebrochen, Ethnologie gefunden"},{"t":"Feldforschung Genf, Promotion"},{"t":"LSD als ethnobotanisches Experiment"},{"t":"Descartes, Wissenschaft als Weltbild"}]},{"t":"Politik & Globalisierung","k":[{"t":"Grüne Revolution als Kader"},{"t":"„Get big or get out“"},{"t":"globale Abhängigkeit, Saatgut, Sanktionen"},{"t":"Fernsehen als Herrschaftsinstrument"},{"t":"Vielfalt Europas gegen Einheitskultur"},{"t":"Ethnologie im Dienst des Imperiums"}]},{"t":"Indianer, Schamanen, Indien","k":[{"t":"Vielfalt der Völker"},{"t":"Cheyenne und Wölfe"},{"t":"Rauschpflanzen werden überschätzt"},{"t":"Alkohol statt Visionssuche"},{"t":"heilige Orte"},{"t":"Benares: Ganges, Tod, Sadhus"}]},{"t":"Weltbild","k":[{"t":"Wir sind Natur"},{"t":"Kooperenz statt Kampf"},{"t":"Karma und Fügung"},{"t":"Zwerge und Naturwesen"},{"t":"Pflanzen mit kultureller Identität"},{"t":"Märchen als wahre Botschaften"}]},{"t":"Garten & Selbstversorgung","k":[{"t":"Permakultur richtig verstanden"},{"t":"Zen-Gärtnern"},{"t":"Beete, Kompost, Nährstoffe"},{"t":"Pflanzenrundgang"},{"t":"Tausch mit Nachbarn"},{"t":"wie schnell die Natur zurückkehrt"}]}]},{"typ":"illu","id":"storl_weg","titel":"Storls Lebensweg"},{"typ":"abschnitt","titel":"3.1 Herkunft & Kindheit","liste":["**Kernaussage: Krieg, Hunger und die Nähe zur Natur in der Kindheit haben ihn geprägt.**","Geboren 1942 in Crimmitschau (Sachsen), einer alten Tuchstadt; die Familie der Mutter waren Tuchmacher mit eigener Fabrik, im Mittelalter Weber. Er sagt, deshalb könne er stundenlang schreiben: „Ich webe Gedankenfäden.“","Schreiben ist für ihn Meditation und Abenteuer: Nachts gehe die Seele auf Reise, am Tag schreibe er es aus. Danach müsse er „wieder in den Körper zurückkommen“.","Schlechter Schüler in Deutschland, weil er Vögeln zusah; Anekdote vom gefälschten Zeugnis. In Amerika wurde er plötzlich ein guter Schüler.","Erinnerung an Bombenangriffe auf das benachbarte Zwickau: die Angst der Erwachsenen als „psychologische Terrorisierung“ – Eltern konnten keine Sicherheit geben.","Nach Amerikanern kamen die Sowjets (Tausch Westsachsen/Thüringen gegen Teile Berlins); Anekdote vom Militärpolizisten Sascha.","Der Vater (Hauptmann, Aufklärungsabteilung, Kriegsgefangenschaft in Ägypten) kehrte Ende 1947 zurück; Storl lernte ihn mit fünf kennen. Aus Angst vor Verschleppung nach Sibirien floh die Familie schwarz über die Zonengrenze, im Güterwagen auf Stroh.","Oldenburg: kaum zerstört, voller Vertriebener; die Familie lebte in einer Dachkammer mit einer Luke. Kein „spießiges“, sondern ein Überlebens-Deutschland.","Hungerzeit: Wiese ums Haus umgegraben, Hühner, Kaninchen; Wildpflanzen, Beeren und Brennnesseln gesammelt und getrocknet ({{p:p01|Brennnessel}}). Hier begann seine Beziehung zur Natur."]},{"typ":"abschnitt","titel":"3.2 Amerika & Kulturschock","liste":["**Kernaussage: Amerika trennt Wildnis und Zivilisation – eine Weltsicht, die ihm fremd blieb.**","Ein Onkel war vor Bismarcks Sozialistengesetzen als 16-Jähriger nach Amerika geflohen; Verwandte in Ohio schickten nach dem Krieg Pakete und luden ein: „bigger and better“.","Auswanderung im Frühjahr 1954 nach zwei Tagen Untersuchung in Hamburg (Anekdote von der Rechenaufgabe in Unterhose); 10 Tage Schiff ab Bremerhaven nach New York, dann Zug nach Ohio.","Ohio: so groß wie die frühere DDR, südlich des Eriesees; Dorf mit 700 Einwohnern, ringsum **Amische**.","Die Amischen: ohne Maschinen, mit Pferden, große Familien (12 Kinder keine Seltenheit), Gemeinschaftsbau von Scheunen, Ältestenrat, Gottesdienst alle zwei Wochen in Scheunen mit dem Liederbuch „Ausbund“, eigene Schulen; Kinder sollen laut Transkript nicht „länger als 4er Jahre“ zur Schule gehen [unklar], sonst taugten sie nicht mehr fürs Handwerk – sie lernten trotzdem schneller als Staatsschüler. Laut Storl schuldenfrei, gesund, ohne psychische Probleme. Die Behörden räumten ihre Schulen, Lehrer wurden verhaftet, einige wanderten nach Kanada aus.","Überfluss: riesige Kühlschränke, Essen wurde regelmäßig weggeworfen und in Öltonnen verbrannt.","Schule: Er saß 1954 hinten bei den schwarzen Schülern – das erste Jahr gemeinsamer Schulen. Beim Buchstabieren von „alien“ drehten sich alle zu ihm um.","**Wildnis gegen Zivilisation:** Als er beim Baseball über den Zaun in den Wald kletterte, hieß es „You crazy crowd“ [unklar, vermutlich „crazy Kraut“] – dort seien Klapperschlangen und Poison Ivy. Die Wildnis gilt als Feindesland, in das man bewaffnet geht. Das romantische Naturgefühl der Goethezeit (Goethe, Schiller, Humboldt) gab es dort nicht.","Sexualmoral: Sex vor der Ehe tabu, keine Pille, Angst vor Geschlechtskrankheiten; nach Storl eine „schizophrene Situation“. Er nennt die Zahl, 87 % der Amerikaner seien auf Rücksitzen gezeugt worden [Zahl ohne Quelle, siehe Einordnung].","Die 60er: Bürgerrechte, Vietnam, Flower Power; später harte Drogen. Er erwähnt Vorwürfe, die CIA habe Stadtviertel mit Drogen „geflutet“ [Meinung, siehe Einordnung].","Als Erstsemester lebte er in einem Wohnheim, in dem ein freundlicher Betreuer heimlich über alle Studenten Buch führte.","Er unterrichtete so erfolgreich, dass seine Vorlesungen in die Aula mussten; man hielt ihn als „Sociologist“ für einen Sozialisten. Er wurde verprügelt, eine Bürgerwehr formierte sich; mit seiner damaligen Frau Fee floh er nachts, ein Vietnamveteran gab mit Waffen Deckung."]},{"typ":"illu","id":"storl_weltbild","titel":"Zwei Arten, Natur zu sehen"},{"typ":"abschnitt","titel":"3.3 Wissenschaft & Bewusstsein","liste":["**Kernaussage: Die materialistische Wissenschaft hat ihn von der Natur entfremdet – erst im Garten fand er sie wieder.**","Er arbeitete als Stahlarbeiter, um das Studium zu bezahlen, und wollte Botanik studieren, um die Namen der Pflanzen zu lernen.","Ein Professor nannte die Aussage, Wurzeln „wollen“ Wasser aufnehmen, Animismus und „primitives Denken“: alles nur Kapillarwirkung wie bei Löschpapier.","Schmetterlinge sollten mit Chloroform betäubt und aufgespießt werden; als sie aufwachten und flattern wollten, erkannte er: „Indem man den Schmetterling tötet, tötet man etwas in sich.“ Wer so beginnt, könne am Ende auch Menschen als Ungeziefer sehen.","Bezüge: Milgram-Experiment (Gehorsam gegenüber Autorität), Rachel Carsons „Silent Spring“ (1962, DDT) [Ergänzung: Autorin], heute insektenfreie Autoscheiben.","Er brach Botanik ab, versuchte Geologie (Dinosaurier, Zeiträume), brach wegen Ölgeologie ab, reiste nach Mexiko und fand über das Lehrbuch eines Freundes die **Ethnologie** – sie half ihm, seine eigenen Kulturschocks zu verstehen.","Er galt als „The Campus Mystic“, nahm diese Rolle aber nie an; Selbstbewusstsein habe ihm die Unternehmerfamilie gegeben.","Je mehr er „im Kopf“ war, desto entfremdeter fühlte er sich – „wie in Plastik eingehüllt“.","**Genf:** Feldforschung in einer anthroposophischen Gemeinschaft (ca. 150 Mitglieder, biologischer Gartenbau, Werkstätten für geistig Behinderte, gemeinsamer Besitz). Er tarnte sich als Gärtner – und wurde einer. Ein alter Gärtnermeister las abends Goethes Faust vor. Barfuß gehen, lange Haare „wie Antennen“, der Bussard, der jeden Tag den Garten umkreiste.","Nach zweieinhalb Jahren holte ihn der Professor mit einem Fulbright-Stipendium zurück; Bitte: auf Fakultätspartys nicht von Astralleibern reden. Dissertation auf Englisch: „Shamanism among Americans of European Origin“ (Feldforschung bei Geisterbeschwörern im Wald); Ergebnis magna cum laude.","**LSD:** kam über Assistenten der Harvard-Experimente (Timothy Leary) zu ihm, vermutlich hoch dosiert in Milchzucker; für ihn ein „wertvolles Erlebnis“ und ethnobotanisches Experiment, um die Tiefen des Bewusstseins auszuloten. LSD wurde nach seiner Darstellung zuerst in CIA-Experimenten an Ahnungslosen verwendet; Albert Hofmann (Basel) sei über die Bestellung von 2 kg nicht begeistert gewesen.","**Wissenschaft als Weltbild:** Mit Niels Bohr: Physik liefert Modelle. Ethnologisch gesehen ist unsere Wissenschaft „unser Märchen“, ein Weltbild unter vielen – eine säkularisierte Form des Monotheismus.","**Descartes:** Vorher war das Herz die Mitte; seit „Ich denke, also bin ich“ sitzt das Göttliche im Kopf (Zirbeldrüse), Tiere und Universum gelten als Maschinen. Für Storl hat der ganze Körper Bewusstsein; das Kopfbewusstsein sei „eine Art Primatenhirn“.","Er sieht sich als „absolut kein Esoteriker“; Zwerge sind für ihn kulturell unterschiedlich vorgestellte Naturkräfte (Gartenzwerg = Bergmannskleidung der Kelten aus der Hallstattzeit), die man nicht glaubt, sondern erlebt."]},{"typ":"abschnitt","titel":"3.4 Politik & Globalisierung","liste":["**Kernaussage: Agrarindustrie und Einheitskultur zerstören Vielfalt und schaffen Abhängigkeit.**","Familienfarmen im Mittelwesten (ein reicher Farmer hatte höchstens 20 Kühe) wurden durch politische Weichenstellungen verdrängt; Landwirtschaftsminister Earl Butz: „Get big or get out.“","Laut Storl gab es damals 7 Millionen Farmen, heute eine halbe Million, davon die Hälfte Hobby-Farmen; der Rest hoch verschuldete Agrarfabriken mit GPS-Maschinen, Kunstdünger, Glyphosat, ohne Beikraut und Insekten. Er befürchtet eine ökologische Katastrophe und Hungersnöte.","Indien: Konzerne wie Monsanto und Bayer; Selbstmordwelle unter Bauern, „Terminator-Saatgut“, das sich nicht nachbauen lässt [siehe Einordnung].","Als Student in den frühen 60ern wurde er in eine Art Kader für die **Grüne Revolution** einsortiert – neben Peace Corps und Green Berets als drittes Mittel gegen die „rote Revolution“ (Mao, Vietcong, Kuba).","Das Saatgut funktionierte nur mit Bewässerung (Pumpen von Ford) und Chemie (Standard Oil), dazu Kredit und Infrastruktur. Ziel nach seiner Darstellung: globale Abhängigkeit – ein Land macht Soja, eines Weizen, dazu eine Einheitssprache; wer nicht mitspielt, bekommt keinen Dünger.","Irak: Nach dem Krieg seien traditionelle Weizensorten eingesammelt worden; Bauern müssten jedes Jahr Saatgut kaufen.","Indien galt als „Problemfall“ mit 500.000 autarken Dörfern; ein Professor sagte, Fernsehen müsse hin, damit die Menschen statt Erlösung (Moksha) Konsumgüter wollen. Für Storl: Fernsehen ist ein Herrschaftsinstrument, Kulturimperialismus.","Amerika ist für ihn „homogenisierte Milch“, Europa ein „Flickenteppich“: alle 100 km andere Mundart, Architektur, Küche. Früher hatte jeder Ort seine eigene Hamburger-Braterei, heute McDonald’s.","Ethnologie diente den Kolonialmächten und den USA dazu, die „Peripherie“ zu verstehen und zu beherrschen („Teile und herrsche“).","Er ist „100 % für eine bürgerliche Demokratie“, glaubt aber nicht mehr ganz an Wahlen wegen eines „Deep State“ [Meinung]."]},{"typ":"illu","id":"storl_gruen","titel":"Die Grüne Revolution als Paket"},{"typ":"abschnitt","titel":"3.5 Indianer, Schamanen, Indien","liste":["**Kernaussage: Naturvölker leben die Verbindung zur Natur – sie glauben nicht, sie erleben.**","Schon der Begriff „Indianer“ unterstellt eine Einheitskultur; in Amerika gibt es mehr Sprachfamilien als in der ganzen Alten Welt. Beispiele: Irokesen (Gärtnervolk mit Mais, Kürbis, Bohnen, Langhäuser), Ojibwa (Wildreis, Wigwams mit Birkenrinde), Pueblos (Lehmbauten), Nordwestküste (Blockhäuser). Tipis gab es nur bei manchen Stämmen.","Die Ureinwohner sind auf etwa 1 % der Bevölkerung geschrumpft, viele leben in Armut; es gibt Progressive und Traditionalisten. Storl: „Lass die Leute doch machen.“","**Cheyenne:** sehen sich als Wölfe in Menschengestalt; der Urschamane lernte von den himmlischen Wölfen – ein Motiv bis zum Baikal, woher die Indianer vor ca. 15.000 Jahren kamen.","**Rauschpflanzen** werden überschätzt: Askese, Meditation und ein Leben ohne Technik führen leichter in Hellsichtigkeit und schamanische Reisen.","Alkohol wirkte als „Ersatz-Visionssuche“. In der Sowjetunion habe man den sakralen Gebrauch des **Fliegenpilzes** zur Wintersonnenwende auslöschen wollen – die Menschen sollten Wodka trinken ({{p:p13#tradition|Fliegenpilz}}).","Die Pilgerväter wurden von Indianern vor dem Verhungern gerettet; weil diese an Jesus kein Interesse hatten, galten sie als „Kinder Satans“.","**Heilige Orte** gibt es wirklich, oft an geologischen Verwerfungen; man erkennt sie manchmal an gedrehten Bäumen. Christen bauten Kapellen (oft dem heiligen Michael) auf heidnische Kultplätze, in der Mongolei Buddhisten auf Schamanenorte.","**Indien:** Gastwissenschaftler an der Benares Hindu University; seine (heutige) Frau bekam schwere Gelbsucht, ein Rhesusaffe stahl seine Papiere. Ganges als Göttin in Flussgestalt; tote Kinder werden ihm übergeben. Am Verbrennungsplatz: „Burning is learning.“ Der Tod ist kein Drama.","**Sadhus** – „lebende Tote“ ohne Kaste und Namen – rauchen ein Chillum mit **Hanf** und kamen gerade deshalb mit westlichen Reisenden ins Gespräch ({{p:p22#tradition|Hanf}}); daraus wuchs mit die Flower-Power-Bewegung."]},{"typ":"abschnitt","titel":"3.6 Weltbild","liste":["**Kernaussage: „Wir sind Natur“ – wer die Natur bekämpft, bekämpft sich selbst.**","Natur ist für ihn weder Feind noch bloß Partner. Man solle liebevoll mit ihr umgehen; im Sanskrit: „Tat tvam asi – das bist du.“","Natur ist **„Kooperenz“**: Kooperation und Konkurrenz zugleich. Der „Kampf aller gegen alle“ sei ein falsches Naturverständnis aus Manchester-Kapitalismus und Sozialdarwinismus (Herbert Spencer).","Darwin selbst sah Zusammenhänge; Originale lesen statt vereinfachter Ideologie.","**Karma und Fügung:** Wir sind Geist, der sich immer wieder verkörpert; was wir tun, kommt zurück. Wie man morgens weiß, was man am Vortag versprochen hat, weiß man tief im Inneren seine Lebensaufgabe – auch Skeptiker kennen das „Bauchgefühl“.","Nach einer schweren Krankheit in Indien beschloss er, sich von der inneren Stimme führen zu lassen: Europa statt akademischer Karriere in Amerika.","Bei einem Verlagsjubiläum im Schwarzwald zeigte ein Unbekannter auf ihn: „Ich weiß, wo du leben sollst.“ So kam er ohne zu suchen auf den Hof im Allgäu.","Er sieht sich als **Ethnobotaniker**: Jedes Volk hat eine eigene Sicht auf Pflanzen. Pflanzen haben eine botanische, kulturelle und sprachliche Identität.","Beispiel **Gänseblümchen:** Germanen, Kelten und Slawen stellten sich die Seele als Gans vor; das Gänsemädchen ist die Göttin, die Seelen hütet; der Himmel war eine grüne Wiese („Godes grüne Wang“ [unklar]), wie im Märchen von Frau Holle.","„Pflanzen sind verwurzelte Wesen“ – über sie gibt er Menschen Wurzeln zurück, auch zum eigenen Selbst. Was stimmt, erkennt man an der Resonanz.","**Märchen** bedeutete ursprünglich wahre Botschaft; deshalb dichtete Luther „Ich bring euch gute neue Mär“.","Wir stammen von Baumbewohnern ab: Farbsehen (grün, gelb, rot wie bei Früchten – und an der Ampel), Greifhand und räumliches Sehen; wir fühlen uns wohl, wo Bäume sind."]},{"typ":"illu","id":"storl_kette","titel":"Alles hängt zusammen"},{"typ":"abschnitt","titel":"3.7 Garten & Selbstversorgung","liste":["**Kernaussage: Gärtnern ist kein Geheimwissen – Fruchtfolge, Abstände und Kompost genügen.**","**Permakultur** ist für ihn eigentlich naturnahes Gärtnern: eine essbare Landschaft, die dauerhaft trägt und fruchtbarer wird. Sie muss an Klima, Boden und Flora angepasst sein; im Allgäu muss man umgraben. Bei einer Permakultur-Gruppe in der Schweiz wurde aus der „essbaren Landschaft“ eine Brennnesselwildnis.","Er lebte nach der Ankunft zunächst von Wildpflanzen, Handmühle und täglich selbst gebackenem Brot; heute ernährt der Garten zwei Menschen weitgehend.","**Zen-Gärtnern** (vom Gärtnermeister gelernt): genaue Fruchtfolgen und Pflanzabstände, so dass der Garten sich fast selbst trägt. Keine anthroposophischen Präparate mehr, keine Kultivatoren (zerhäckseln Regenwürmer).","Umgraben von Hand als Meditation: den Boden riechen, Würmer und Drahtwürmer sehen.","**Pflanzpartner** nach Pflanzensoziologie: Doldenblütler (Möhre, Pastinake) mit Zwiebel und Lauch ergänzen sich hervorragend ({{s:mischkultur-nachbarn|Nachbar-Check}}).","**Beete 1,20 m breit**, nie betreten – man erreicht die Mitte mit der Hacke, der Boden bleibt locker und die Wurzeln können atmen.","**Kompost** ist die Grundlage: sein ältester Haufen ist 3 Jahre alt, mit Stroh und alten Teppichen abgedeckt („er braucht einen Mantel“, sonst wäscht er aus). Ein Teelöffel enthält so viele Lebewesen, wie es Menschen auf der Erde gibt. Im Frühjahr aufs Beet; Starkzehrer wie Kohl und Mangold bekommen beim Pflanzen eine Handvoll extra ({{s:boden-kompost|Kompost}}).","Nährstoffe: Stickstoff, Phosphor, Kali, dazu Kalk. Stickstoff kommt vor allem aus Mist (Kühe, Pferde, Stallhasen) und von Leguminosen (Erbsen, Bohnen, Saubohnen) in der Fruchtfolge. „Der Gärtner ist der Kapellmeister, aber die Pflanzen machen die Musik.“","Er hat den Eindruck, dass Pflanzen auf Zuneigung reagieren.","Überschuss tauscht er: Weidepächter (Käse, Quark), Imker (Honig), Jäger (Fleisch)."]},{"typ":"hinweis","text":"💡 **Tipp:** Beete nur so breit anlegen, dass man die Mitte erreicht (ca. 1,20 m), und nie betreten.  💡 **Tipp:** Kompost mit Stroh oder alten Teppichen abdecken, damit Regen ihn nicht auswäscht.  💡 **Tipp:** Möhrengrün nicht wegwerfen – jung ist es ein Gemüse, z. B. in Suppen.  💡 **Tipp:** Wurzelpetersilie und Möhren im Beet überwintern lassen, wenn Wühlmäuse es zulassen – dort halten sie sich am besten."},{"typ":"hinweis","text":"⚠️ **Achtung:** Empfindliches nicht vor den Eisheiligen säen oder pflanzen.  ⚠️ **Achtung:** Topinambur wird man kaum wieder los – jedes Knollenstück treibt neu.  ⚠️ **Achtung:** Brennnessel nicht roh als Salat – Storl hat sich dabei „die Gusche verbrannt“; besser als Spinat oder Smoothie.  ⚠️ **Achtung:** Kartoffeln und Wurzelgemüse brauchen einen kühlen, feuchten Keller – mit moderner Heizung ist er zu trocken.  ⚠️ **Typischer Fehler:** zu viel tun, Mondkalender-Mystik statt Grundwissen."},{"typ":"tabelle","kopf":["Pflanze im Rundgang","Was Storl sagt","Im Kompendium"],"zeilen":[["Helmkraut (Scutellaria galericulata)","„Mad Dog Skullcap“; tief entspannend; Pulver bei Schlaflosigkeit und Stress – eine seiner Lieblingsheilpflanzen","–"],["Brennnessel","Gemüse, als Spinat oder Smoothie; „vitamin- und mineralreicher geht es nicht“","{{p:p01|Brennnessel}}"],["Kamille, Breitwegerich, Vogelknöterich","Trittgesellschaft: Tritt drückt Konkurrenz weg, Samen kleben an Sohlen","{{p:p10|Breitwegerich}}"],["Mais","auf 930 m ein Kunststück; stark gedüngt, weil seine Frau Amerikanerin ist","{{g:mais|Mais}}"],["Indianernessel (Monarde)","„Monadenminze“ [Ergänzung: Monarda]; bei Indianern schweißtreibend in der Schwitzhütte","–"],["Amarant","aus Mexiko; Blätter im Frühjahr als Spinat, schwarze Samen dreschen und puffen","–"],["Möhre","einheimisch; Grün essbar","{{s:mischkultur|Mischkultur}}"],["Topinambur","aus der Prärie; roh wie Wasserkastanie, gekocht wie Kartoffel; „das nahrhafteste Gemüse“ [siehe Einordnung]","–"],["Tomaten, Aubergine","brauchen auf 930 m Schutz; Aubergine nur ein Versuch","–"],["Mangold, Kohl, Lauch, Federkohl","Federkohl schmeckt erst nach Frost; Kohl und Lauch ertragen Frost","–"],["Meerrettich, Rote Bete, Erdbeeren, Kartoffeln","Meerrettich wächst fast wie Unkraut","–"],["Meisterwurz","Gebirgspflanze; nimmt er nur „sterbenskrank“ – gegen Grippe, Magengrimmen","–"]]},{"typ":"illu","id":"storl_garten","titel":"Storls Garten im Überblick"},{"typ":"abschnitt","titel":"Wie schnell die Natur zurückkäme","liste":["Nach wenigen Wochen: Pionierkräuter, „die wir als Unkräuter definieren“.","Nach 1–2 Jahren: Sämlinge von Salweide und Ahorn.","Nach 10 Jahren: kein Garten mehr erkennbar."]},{"typ":"abschnitt","titel":"5. Kernaussagen","nummern":["Wir sind Natur; die Natur als Feind zu sehen heißt, sich selbst als Feind zu sehen.","Die Natur ist „Kooperenz“, kein Kampf aller gegen alle.","Pflanzen haben eine botanische, kulturelle und sprachliche Identität.","Die materialistische Botanik versteht Pflanzen nicht als lebendige Wesen.","Wer Lebewesen achtlos tötet, tötet ein Gefühl in sich.","Wissenschaft ist ein Weltbild unter vielen und liefert Modelle, keine letzte Wahrheit.","Bewusstsein sitzt nicht nur im Kopf.","Die Grüne Revolution brachte Saatgut im Paket mit Bewässerung, Chemie und Kredit und damit Abhängigkeit.","Die Agrarindustrie hat in den USA die Familienfarmen verdrängt und laugt die Böden aus.","Kulturelle Vielfalt ist Stärke – wie eine Blumenwiese gegenüber einer Kunstwiese.","Fernsehen ist ein Herrschaftsinstrument und Mittel des Kulturimperialismus.","„Den Indianer“ gibt es nicht – es gibt viele Völker.","Naturvölker glauben nicht an Geister, sie erleben sie.","Rauschpflanzen werden in ihrer Rolle für Schamanen überschätzt.","Es gibt heilige Orte; Kirchen stehen oft auf alten Kultplätzen.","Der Tod ist kein Drama.","Was wir tun, kommt zurück (Karma); man kann sich von der inneren Stimme führen lassen.","Märchen sind wahre Botschaften in Bildern, die die Seele versteht.","Gärtnern ist leicht: Fruchtfolge, Abstände, Kompost – die Pflanzen wachsen von allein.","Kompost ist das Herz eines erfolgreichen Gartens.","Permakultur muss an Klima und Boden angepasst werden.","Ohne Pflege holt sich die Natur einen Garten in etwa 10 Jahren zurück."]},{"typ":"hinweis","text":"**Wenn du nur das mitnimmst …** 1. Der Mensch ist Teil der Natur – Umgang mit ihr ist Umgang mit sich selbst. 2. Vielfalt (in Kulturen, Höfen, Beeten) macht stark, Gleichmacherei macht abhängig. 3. Ein Selbstversorgergarten braucht kein Geheimwissen: Kompost, Fruchtfolge, richtige Abstände, schmale Beete."},{"typ":"tabelle","kopf":["Begriff","Erklärung"],"zeilen": die Farm übergeben"],["ca. 24","sein Alter als Assistent bei den Campus-Unruhen"],["7 Mio. → 0,5 Mio.","Farmen in den USA damals und heute (laut Storl)"],["20 Kühe","Viehbestand eines reichen Mittelwest-Farmers damals"],["500.000","autarke Dörfer in Indien"],["2 kg","bestellte LSD-Menge (laut Storl)"],["87 %","angeblich auf Rücksitzen gezeugte Amerikaner (laut Storl)"],["ca. 1 %","Anteil der Ureinwohner an der Bevölkerung Amerikas"],["ca. 15.000 Jahre","Einwanderung der Vorfahren der Indianer"],["ca. 150","Mitglieder der Gemeinschaft in Genf"],["2,5 Jahre","Zeit im Garten in Genf"],["5 Jahre","Zeit in Wien"],["28 Jahre","Zeit auf dem Hof im Allgäu bis zum Gespräch [unklar, ab 1988]"],["100 Jahre","Alter seiner Mutter, die am Tag vor dem Gespräch starb"],["1,20 m","Beetbreite"],["3 Jahre","Alter seines ältesten Komposthaufens"],["10 Jahre","bis der Garten wieder Natur wäre"],["Personen","Earl Butz, Albert Hofmann, Timothy Leary, Cary Grant, Niels Bohr, Einstein, Descartes, Darwin, Adam Smith, Herbert Spencer, Goethe, Schiller, Humboldt, Martin Luther, J. D. Vance [Ergänzung: „Hillbilly-Elegie“]"],["Werke und Medien","„Mein amerikanischer Kulturschock“, „Der Selbstversorger“, „Silent Spring“, Milgram-Experiment, Ausbund, Goethes Faust"],["Firmen","Monsanto, Bayer, Ford, Standard Oil, Woolworth, McDonald’s, Burger King"]]},{"typ":"abschnitt","titel":"7. Umsetzung","nummern":["Eigene Beete auf ca. 1,20 m Breite anlegen und Wege fest einplanen.","Einen Kompostplatz einrichten, Haufen abdecken und 2–3 Jahre reifen lassen.","Fruchtfolge planen: Starkzehrer mit Kompost, danach Mittel- und Schwachzehrer, Leguminosen einbauen ({{s:mischkultur-plan|Beet planen}}).","Gute Partner kombinieren, z. B. Möhre mit Zwiebel oder Lauch.","Erst nach den Eisheiligen empfindliche Kulturen pflanzen.","Wildpflanzen wie Brennnessel als Gemüse nutzen.","Überschüsse mit Nachbarn tauschen.","Zum Einstieg Storls Buch „Der Selbstversorger“ lesen ({{a:storl-buecher-selbstversorger|Buch}}).","Öfter barfuß und ohne Ablenkung in Garten und Wald sein – beobachten statt nur analysieren."]},{"typ":"tabelle","kopf":["Aussage im Gespräch","Einordnung [Ergänzung]"],"zeilen":[["Permakultur kommt von einem Japaner","Als Begriff von Bill Mollison und David Holmgren (Australien, 1970er); Masanobu Fukuoka (Japan) prägte das verwandte „natürliche Landwirtschaft“."],["7 Mio. Farmen damals, heute 0,5 Mio.","Laut US-Landwirtschaftsministerium gibt es heute rund 2 Millionen Betriebe (Höchststand ca. 6,8 Mio. um 1935); die Konzentration ist real, die Zahl 0,5 Mio. aber zu niedrig."],["„Kampf aller gegen alle“ von Herbert Spencer","Die Formel stammt von Thomas Hobbes; von Spencer stammt „Survival of the fittest“."],["Terminator-Saatgut in Indien und im Irak","Die Technik wurde patentiert, aber nie kommerziell eingesetzt. Im Irak verbot 2004 die „Order 81“ den Nachbau geschützter Sorten – nicht traditioneller."],["87 % auf Rücksitzen gezeugt","Keine Quelle genannt; als Anekdote behandeln."],["Topinambur „das nahrhafteste Gemüse“","Topinambur ist reich an Inulin und Mineralstoffen, aber nicht nährstoffreicher als alle anderen Gemüse ({{b:inulin|Inulin}})."],["CIA, Deep State, Obama als „Züchtung des Establishments“","Persönliche politische Meinungen, im Gespräch nicht belegt."],["Plattform","KenFM war eine umstrittene Plattform, der Verbreitung von Verschwörungserzählungen vorgeworfen wurde. Das Gespräch selbst dreht sich überwiegend um Storls Leben und Garten."]]},{"typ":"hinweis","text":"Quelle: Transkript des YouTube-Videos „Wolf-Dieter Storl bei KenFM“, ursprünglich vom 1. Mai 2018, vom Nutzer bereitgestellt. Zitate sind sinngemäß und sprachlich geglättet."}]},{"id":"einordnung","titel":"Einordnung","bloecke":[{"typ":"text","text":"Storl ist einer der bekanntesten Pflanzenautoren im deutschsprachigen Raum. Sein kulturgeschichtliches Wissen ist breit; seine spirituellen und heilkundlichen Aussagen sind teils umstritten."},{"typ":"tabelle","kopf":["Thema","Seine Position","Einwand"],"zeilen":[["Borreliose","Kardentinktur als wichtigstes Mittel; Antibiotika kaum wirksam","Der Phytotherapeut Martin Koradi findet keine Belege für Karde bei Borreliose; Antibiotika sind gut belegt. Bei Borreliose immer ärztlich behandeln lassen."],["Pflanzenseele, Devas","Pflanzen haben geistige Wesenheiten","[A] Weltanschauung aus Anthroposophie und Naturreligion, wissenschaftlich nicht prüfbar."],["Klima","Interview auf KenFM","Seine Aussagen dort wurden kritisiert."]]},{"typ":"hinweis","text":"**Für dieses Werk:** Storls Pflanzen- und Kulturwissen wird bei den Pflanzenkapiteln als [T] oder [A] gekennzeichnet. Heilanwendungen bei ernsten Krankheiten bleiben Sache des Arztes."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["storl.de: Über Wolf-Dieter Storl","https://www.storl.de/?p=399633"],["Wikipedia (englisch): Wolf-Dieter Storl","https://en.wikipedia.org/wiki/Wolf-Dieter_Storl"],["Vienna.at: „In der Natur kann man sich selber finden“","https://www.vienna.at/in-der-natur-kann-man-sich-selber-finden/3547529"],["Vol.at: Die „Unkräuter“ in meinem Garten","https://www.vol.at/selbstversorger-die-unkraeuter-in-meinem-garten/5778209"],["Koradi: Rezension Borreliose natürlich heilen","https://phytotherapie-seminare.ch/wp-content/uploads/2024/10/Borreliose-Storl-Karde-1-2.pdf"]]},{"typ":"text","text":"Noch offen: Verlage und Inhalte mehrerer Bücher, Storls Pflanzenporträts zu Brennnessel und Giersch. Wenn du Bücher von ihm hast, ergänze ich gezielt."}]}]}],"getreide":[{"id":"brot","titel":"Getreide & Brot","nr":"G-01","illu":"aehren","fotos":[],"text":"Weizen, Dinkel, Roggen, Gerste, Hafer und Urgetreide: Aufbau des Korns, Kleber, Mehltypen, Mahlen, Hefe, Sauerteig, warum Dinkel anders backt, Rezepte, Anbau und Gesundheit.","stichworte":["Weizen","Dinkel","Roggen","Gerste","Hafer","Emmer","Einkorn","Grünkern","Gluten","Kleber","Mehltyp","Mahlen","Getreidemühle","Hefe","Sauerteig","Brot backen","Vorteig","Kochstück","Zöliakie"],"pflanzen":[],"kurz":"Getreide ist seit 10.000 Jahren die Grundlage der Selbstversorgung. Wer versteht, was im Korn steckt und was im Teig passiert, backt mit jedem Mehl gutes Brot – auch mit Dinkel, der anders behandelt werden will als Weizen.","steckbrief":[["Getreidearten","Weizen, Dinkel, Emmer, Einkorn, Roggen, Gerste, Hafer; dazu Pseudogetreide wie Buchweizen"],["Backfähig durch Kleber","Weizen > Dinkel > Emmer > Einkorn; Roggen nur mit Sauerteig"],["Mehltyp","mg Mineralstoffe (Asche) pro 100 g Mehl-Trockenmasse"],["Hefe","1 Würfel Frischhefe (42 g) ≈ 2 Päckchen Trockenhefe (je 7 g)"],["Wohlfühltemperatur Hefe","ca. 24–32 °C; ab ca. 50 °C stirbt sie"],["Dinkel-Regel","kürzer und sanfter kneten, mehr Zeit, Wasser über ein Kochstück binden"],["Glutenfrei?","nein: Weizen, Dinkel, Emmer, Einkorn, Roggen, Gerste; Hafer nur als zertifiziert glutenfreier"],["Lagerung","Korn trocken jahrelang, helles Mehl ca. 1 Jahr, Vollkornmehl nur wenige Wochen"]],"reiter":[{"id":"ueberblick","titel":"Getreidearten","bloecke":[{"typ":"text","text":"Alle Getreide sind Gräser. Sie unterscheiden sich vor allem im Kleber, der bestimmt, wie gut ein Teig aufgeht, und darin, ob das Korn fest in Spelzen sitzt."},{"typ":"tabelle","kopf":["Getreide","Botanik","Kleber / Backverhalten","Geschmack","Typische Verwendung"],"zeilen":[["Weizen","Triticum aestivum, Nacktgetreide","viel, sehr elastisch – geht hoch auf","mild","Brot, Brötchen, Kuchen, Nudeln, Pizza"],["Dinkel","Triticum spelta, Spelzgetreide, eng mit Weizen verwandt","viel, aber weicher und weniger stabil – reißt leichter, läuft breit","nussig","Brot, Brötchen, Kuchen; unreif gedarrt als Grünkern"],["Emmer","Triticum dicoccum, Urgetreide, Spelzgetreide","mittel, weich","kräftig, leicht würzig","Fladen, Mischbrote, Nudeln"],["Einkorn","Triticum monococcum, ältestes Getreide, Spelzgetreide","wenig, sehr weich – kaum Volumen","nussig, gelbes Mehl (viel Lutein)","Kekse, Pfannkuchen, Mischbrote"],["Roggen","Secale cereale","Kleber bildet kein Gerüst; braucht Sauerteig","herzhaft, säuerlich","Sauerteig-, Misch- und Vollkornbrote"],["Gerste","Hordeum vulgare","wenig backfähig","mild-süßlich","Graupen, Malz, Bier, Gerstenkaffee, Fladen"],["Hafer","Avena sativa","kein backfähiger Kleber","mild, cremig","Flocken, Brei, Kekse, als Beimischung"]]},{"typ":"abschnitt","titel":"Spelzgetreide","liste":["Dinkel, Emmer und Einkorn sitzen fest in ihren Spelzen. Nach dem Dreschen muss das Korn in einer Schälmühle entspelzt werden (Gerbgang).","Die Spelzen schützen das Korn vor Schädlingen und Umwelteinflüssen; darum gelten Spelzgetreide als robust und für den Bio-Anbau gut geeignet.","Für die Haushaltsmühle nur entspelztes Korn kaufen."]},{"typ":"illu","id":"korn","titel":"Aufbau des Getreidekorns"},{"typ":"abschnitt","titel":"Aufbau des Korns","liste":["**Mehlkörper (ca. 80–85 %):** Stärke und Kleber-Eiweiß – daraus besteht helles Mehl.","**Keimling (ca. 3 %):** Fett, Vitamin E, B-Vitamine; macht Vollkornmehl schnell ranzig.","**Randschichten und Schale (ca. 12–15 %):** Ballaststoffe, Mineralstoffe; die Aleuronschicht ist besonders eiweiß- und mineralstoffreich.","Vollkornmehl enthält alle drei Teile, helles Mehl fast nur den Mehlkörper."]},{"typ":"abschnitt","titel":"Gerste und Hafer im Haus","liste":["**Graupen:** geschliffene, polierte Gerstenkörner für Suppen und Eintöpfe; Rollgerste sind große Graupen.","**Malz:** Gerste keimen lassen und darren – die Keimung bildet Enzyme, die Stärke in Malzzucker umwandeln. Grundlage für Bier und Malzextrakt.","**Gerstenkaffee (Muckefuck):** geröstete Gerste als koffeinfreier Kaffee-Ersatz.","**Hafer:** wird gequetscht zu Flocken; ganz wichtig für Brei und Müsli.","Gerste und Hafer enthalten viele Beta-Glucane ({{b:beta-glucane|Beta-Glucane}})."]}]},{"id":"chemie","titel":"Kleber & Chemie","bloecke":[{"typ":"text","text":"Was beim Backen passiert, ist Biochemie: Eiweiß bildet ein Netz, Hefe produziert Gas, Stärke verkleistert. Das erklärt, warum Dinkel anders reagiert als Weizen."},{"typ":"abschnitt","titel":"1. Der Kleber (Gluten)","liste":["Mehl enthält zwei Eiweißgruppen: **Gliadine** machen den Teig dehnbar und klebrig, **Glutenine** machen ihn elastisch und stabil.","Mit Wasser und Kneten verbinden sie sich zum Kleber – einem Netz, das wie ein Ballon die Gärgase festhält.","**Weizen:** ausgewogenes, stabiles Netz – hohes Volumen.","**Dinkel:** insgesamt viel Kleber, aber mehr Gliadin und weniger Glutenin. Der Teig ist sehr dehnbar, aber wenig stabil: Er reißt bei zu langem Kneten, läuft breit und hält das Gas schlechter. Mehr dazu: {{b:gluten|Gluten}}."]},{"typ":"illu","id":"kleber","titel":"Kleber-Netz: Weizen und Dinkel"},{"typ":"abschnitt","titel":"2. Die Gärung","liste":["Hefe frisst Zucker aus dem Mehl und bildet Kohlendioxid (lässt den Teig aufgehen) und Alkohol (verfliegt beim Backen, gibt Aroma).","Enzyme im Mehl (Amylasen) spalten Stärke laufend in Zucker – Futter für die Hefe.","Lange, kühle Gare bringt mehr Aroma und bessere Verträglichkeit als viel Hefe und kurze Zeit."]},{"typ":"abschnitt","titel":"3. Warum Roggen Sauerteig braucht","liste":["Roggen hat viel aktive Amylase und viele Schleimstoffe (Pentosane). Sein Kleber bildet kein Gerüst.","Ohne Säure bauen die Enzyme beim Backen die Stärke ab – die Krume wird klebrig und nass.","Die Milchsäure im Sauerteig bremst die Enzyme und lässt die Schleimstoffe quellen. So entsteht eine schnittfeste Krume."]},{"typ":"abschnitt","titel":"4. Im Ofen","liste":["Ab ca. 50–60 °C stirbt die Hefe, das Gas dehnt sich noch einmal aus (Ofentrieb).","Ab ca. 60–70 °C verkleistert die Stärke und bindet Wasser – die Krume wird fest ({{b:staerke|Stärke}}).","Ab ca. 70 °C gerinnt der Kleber und fixiert die Form.","Ab ca. 150 °C bräunt die Kruste durch die Maillard-Reaktion (Zucker + Eiweiß) und Karamellisierung – das Aroma entsteht.","Kerntemperatur eines fertigen Brots: ca. 96–98 °C."]},{"typ":"tabelle","kopf":["Material","Temperatur","Was passiert"],"zeilen":[["Teig nach dem Kneten","24–27 °C","
