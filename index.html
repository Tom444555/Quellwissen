<style>
/* Layout: Feldbuch – feste Suchleiste oben, Teil-Buttons, Pflanzenseite mit Steckbrief + Reitern, Inhalte aus JSON */
:root{
  --bg:#f3f5ef; --surface:#fbfcf8; --ink:#1d241a; --muted:#5b6655; --line:#d5dccd;
  --accent:#3e6b2a; --accent-ink:#ffffff; --accent-soft:#e2ecd8; --sting:#b5721b;
  --w:#2f5f8a; --w-soft:#dde8f2; --t:#3e6b2a; --t-soft:#e2ecd8; --a:#7a4b8c; --a-soft:#eee3f2;
  --l0:#cfe0bd; --l1:#e2d2b4; --l2:#e8dcc0; --l3:#d6e4c6; --l4:#d9c3a3;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --label:"Alegreya Sans SC","Alegreya Sans","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141912; --surface:#1b2218; --ink:#e4ead9; --muted:#9aa68f; --line:#303a2a;
  --accent:#8dbb6c; --accent-ink:#11170e; --accent-soft:#25331d; --sting:#e0a14a;
  --w:#8db8de; --w-soft:#1d2a36; --t:#8dbb6c; --t-soft:#25331d; --a:#c39ad3; --a-soft:#2d2233;
  --l0:#2c3d22; --l1:#3d3224; --l2:#3a3326; --l3:#2a3622; --l4:#45351f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141912; --surface:#1b2218; --ink:#e4ead9; --muted:#9aa68f; --line:#303a2a;
  --accent:#8dbb6c; --accent-ink:#11170e; --accent-soft:#25331d; --sting:#e0a14a;
  --w:#8db8de; --w-soft:#1d2a36; --t:#8dbb6c; --t-soft:#25331d; --a:#c39ad3; --a-soft:#2d2233;
  --l0:#2c3d22; --l1:#3d3224; --l2:#3a3326; --l3:#2a3622; --l4:#45351f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1.05rem/1.55 var(--body)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.kopf{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.kopf-in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.marke{font:800 1.35rem/1 var(--display);color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.marke span{color:var(--accent)}
.suche{position:relative;flex:1 1 260px;min-width:0}
.suche input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 1rem var(--body)}
.suche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.treffer{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgb(0 0 0 / .14);max-height:60vh;overflow:auto;padding:6px}
.treffer button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:8px 10px;border:0;background:none;border-radius:7px}
.treffer button[aria-selected="true"],.treffer button:hover{background:var(--accent-soft)}
.treffer .art{font:700 .7rem var(--label);letter-spacing:.06em;color:var(--muted);min-width:5.5em;text-transform:uppercase}
.treffer .wo{color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.treffer .leer{padding:10px;color:var(--muted)}
.teile{display:flex;gap:6px;flex-wrap:wrap}
.teile button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font:700 .82rem var(--label);letter-spacing:.04em}
.teile button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{max-width:960px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.12rem;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font:700 .78rem var(--label);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.botan{font:italic 400 1.2rem var(--display);color:var(--muted)}
.stack{display:grid;gap:12px}

.legende{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.9rem;color:var(--muted)}
.b{display:inline-block;font:700 .72rem/1 var(--label);letter-spacing:.05em;padding:4px 7px 3px;border-radius:5px;vertical-align:.12em;white-space:nowrap}
.b-W{background:var(--w-soft);color:var(--w)} .b-T{background:var(--t-soft);color:var(--t)} .b-A{background:var(--a-soft);color:var(--a)}

.steck{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.steck div{padding:12px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.steck dt{font:700 .72rem var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.steck dd{margin:2px 0 0}

.reiter{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:thin}
.reiter button{border:0;background:none;padding:10px 14px;font:700 .95rem var(--body);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.reiter button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:grid;gap:22px}
.abschnitt{display:grid;gap:10px}
.abschnitt ul,.abschnitt ol{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:72ch}
.tab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .75rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.hinweis{border-left:3px solid var(--sting);padding:8px 14px;background:var(--surface);border-radius:0 8px 8px 0;max-width:72ch}

.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:500;font-size:.92rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.karte{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.karte>button{display:grid;gap:4px;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.karte .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--muted);align-items:center}
.karte .auf{font:700 .78rem var(--label);letter-spacing:.05em;color:var(--accent)}
.karte .koerper{padding:0 16px 16px;display:grid;gap:10px;border-top:1px dashed var(--line);padding-top:12px;margin:0 0 0}
.karte .koerper ul,.karte .koerper ol{margin:0;padding-left:1.25em;display:grid;gap:4px}
.karte.ziel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.unter{font:700 .72rem var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.teilkarten{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.teilkarte{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:8px;align-content:start}
.teilkarte .buchst{font:800 2.2rem/1 var(--display);color:var(--accent)}
.liste-links{display:flex;flex-wrap:wrap;gap:6px}
.liste-links a,.chip{font-size:.9rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);text-decoration:none;border:0}
.eintrag{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:8px;scroll-margin-top:140px}
.eintrag.ziel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fuss{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}
.schnitt{margin:0;display:grid;gap:3px;justify-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.schnitt figcaption{justify-self:start;margin-bottom:6px}
.lage{width:var(--w);min-width:0;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:8px 12px;border-radius:6px;color:var(--ink)}
.lage-name{font-weight:700;min-width:0}
.lage-dicke{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lage-info{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.lage-0{background:var(--l0);border-radius:40% 40% 6px 6px / 60% 60% 6px 6px;padding-top:12px}
.lage-1{background:var(--l1)} .lage-2{background:var(--l2)} .lage-3{background:var(--l3)} .lage-4{background:var(--l4)}
.lage-5{background:transparent;border:2px dashed var(--muted);padding-block:5px}
.grund{width:100%;text-align:center;font:700 .72rem var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--muted);padding-top:4px}
@media (max-width:520px){.lage{width:100%}}
.kopfgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){.kopfgrid{grid-template-columns:minmax(0,1fr)}}
.illu{margin:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:8px;min-width:0}
.illu svg{width:100%;height:auto;display:block}
.illu-breit svg{max-height:440px}
.illu ol{margin:0;padding-left:1.5em;font-size:.9rem;display:grid;gap:3px}
.illu figcaption{font-size:.75rem;color:var(--muted)}
.illu .mk circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.illu .mk text{fill:var(--accent-ink);font:700 10px var(--body);text-anchor:middle}
.illu .lbl{fill:var(--ink);font:600 13px var(--body);text-anchor:middle}
.illu .lbl2{fill:var(--muted);font:500 11px var(--body);text-anchor:middle}
.illu .boden,.mini .boden{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.mini svg{height:120px;width:auto;max-width:100%;display:block;margin:0 auto}
.ministreifen{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ministreifen a{display:grid;gap:4px;justify-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 4px;font-weight:500;font-size:.9rem}
.ministreifen a:hover{border-color:var(--accent)}
.ministreifen svg{height:96px;width:auto}
.fotos{display:grid;gap:10px}
.fotos-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.knopf{border:1px solid var(--accent);color:var(--accent);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer}
.knopf:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.galerie:empty{display:none}
.foto{margin:0;display:grid;gap:4px;min-width:0}
.foto-btn{padding:0;border:0;background:none;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.foto-btn img{width:100%;height:100%;object-fit:cover;display:block}
.foto figcaption{font-size:.82rem;color:var(--muted);display:grid}
.foto figcaption span{font-size:.72rem;font-weight:700;letter-spacing:.03em}
.foto-weg{justify-self:start;border:0;background:none;color:var(--sting);font-size:.8rem;padding:0;text-decoration:underline}
.klein{font-size:.85rem;color:var(--muted)}
#lightbox{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .85);display:grid;place-items:center;padding:16px;gap:8px}
#lightbox img{max-width:100%;max-height:80vh;border-radius:8px}
#lightbox p{color:#fff;margin:0}
#lightbox button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;font-size:2rem;background:none;border:0;color:#fff}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px}
@media (prefers-reduced-motion:no-preference){.karte,.eintrag{transition:box-shadow .2s,border-color .2s}}
@media print{.kopf,.reiter,.filter,.auf,.knopf,.foto-weg{display:none!important}.panel[hidden]{display:grid!important}.koerper[hidden]{display:grid!important}body{background:#fff;color:#000}}

:root{--c-p:#3e6b2a;--c-s:#8a5a2b;--c-g:#a07a12;--c-b:#2f5f8a;--c-a:#7a4b8c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-p:#8dbb6c;--c-s:#d39a62;--c-g:#d8b24a;--c-b:#8db8de;--c-a:#c39ad3}}
:root[data-theme="dark"]{--c-p:#8dbb6c;--c-s:#d39a62;--c-g:#d8b24a;--c-b:#8db8de;--c-a:#c39ad3}
.ue{min-width:0;max-width:100%}.ue-panel{min-width:0}
.ue-tabs{max-width:100%;display:flex;gap:6px;overflow-x:auto;padding:0 2px;border-bottom:2px solid var(--line);scrollbar-width:thin}
.ue-tab{display:flex;align-items:center;gap:8px;padding:10px 14px 9px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--bg);color:var(--muted);white-space:nowrap;margin-bottom:-2px;font-weight:700}
.ue-tab .bu{width:28px;height:28px;border-radius:50%;background:var(--tc);color:var(--surface);display:grid;place-items:center;font:800 1rem/1 var(--display);flex:none}
.ue-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:inset 0 4px 0 var(--tc);border-bottom:2px solid var(--surface)}
.ue-panel{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--surface);padding:16px;box-shadow:inset 0 3px 0 -1px var(--tc)}
.ue-kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.ue-kopf h2{margin:0;color:var(--tc)}.ue-kopf p{margin:2px 0 0;color:var(--muted)}
.ue-alle{font-weight:700;text-decoration:none;color:var(--tc)}
.ue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.ue-kachel{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:10px;background:var(--bg);transition:transform .15s,border-color .15s}
.ue-kachel:hover{border-color:var(--tc);transform:translateY(-2px)}
.ue-kachel .bild{height:88px;display:grid;place-items:center;overflow:hidden}
.ue-kachel .bild svg{max-height:88px;max-width:100%;width:auto;height:auto}
.ue-init{width:64px;height:64px;border-radius:50%;background:var(--tc);color:var(--surface);display:grid;place-items:center;font:800 1.5rem var(--display)}
.ue-kachel h3{margin:0;font:700 1.05rem/1.2 var(--display)}
.ue-kachel .eyebrow{font-size:.72rem}
.ue-sub{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.ue-sub span{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ue-rest{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px}
@media (max-width:560px){.ue-tab .nm{font-size:.9rem}.ue-tab{padding:8px 10px}.ue-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ue-kachel .bild{height:70px}.ue-kachel .bild svg{max-height:70px}}
.standort{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin:12px 0}
.st-kopf{font:700 .8rem var(--label);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st-zeile{display:flex;gap:10px;align-items:center}
.st-zeile>svg{width:30px;height:30px;flex:none}
.st-licht{--sc:#d99a12}.st-wasser{--sc:#3a8ac8}.st-naehrstoffe{--sc:#5f9a3a}
.st-zeile>svg{color:var(--sc)}
.st-k{font-weight:700;font-size:.9rem}
.st-bar{display:flex;gap:3px;margin:3px 0}.st-bar i{width:18px;height:7px;border-radius:4px;background:var(--line)}.st-bar i.an{background:var(--sc)}
.st-v{font-size:.85rem;color:var(--muted)}
.st-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.st-chips span{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft)}
.st-note{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.nachbar{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;margin:12px 0;display:grid;gap:12px}
.nb-wahl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.nb-plus{font:800 1.4rem var(--display);color:var(--muted);padding-bottom:6px}
.nb-ergebnis{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px;background:var(--bg);border-left:5px solid var(--muted)}

.nb-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 1.2rem var(--body);color:#fff;background:var(--muted);flex:none}
.nb-gut{border-left-color:#3e8a3a}.nb-gut .nb-icon{background:#3e8a3a}
.nb-schlecht{border-left-color:#c0392b}.nb-schlecht .nb-icon{background:#c0392b}
.nb-listen{display:grid;gap:6px}.nb-listen>div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.nb-chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:.88rem}
.nb-chip.gut{border-color:#3e8a3a}.nb-chip.schlecht{border-color:#c0392b}

.bm{position:relative;margin:8px 0 4px;padding:18px 12px 20px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(120% 60% at 50% 0%,var(--accent-soft),transparent 70%),var(--surface)}
.bm ul{list-style:none;margin:0;padding:0}
.bm-wurzel{display:flex;align-items:center;gap:12px;width:max-content;margin:0 auto;padding:10px 22px 10px 12px;border-radius:999px;background:var(--ink);color:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bm-wurzel strong{display:block;font:800 1.35rem/1.1 var(--display)}.bm-wurzel small{display:block;font-size:.8rem;opacity:.75}
.bm-logo{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 1.4rem var(--display)}
.bm-aeste{display:grid;grid-template-columns:1.5fr 1.15fr 1fr 1fr .9fr;gap:12px;position:relative;margin-top:34px}
.bm-aeste::before{content:"";position:absolute;left:50%;top:-34px;height:34px;border-left:2px solid var(--muted)}
.bm-wurzel{position:relative;z-index:1}
.bm-ast{position:relative;padding-top:18px}
.bm-ast::before{content:"";position:absolute;top:0;left:-6px;right:-6px;border-top:2px solid var(--muted)}
.bm-ast:first-child::before{left:50%}.bm-ast:last-child::before{right:50%}
.bm-ast::after{content:"";position:absolute;top:0;left:50%;height:18px;border-left:2px solid var(--muted)}
.bm-knoten{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px;border-radius:12px;background:var(--tc);color:var(--surface);text-decoration:none;font:700 1.02rem/1.15 var(--body);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:transform .15s}
.bm-knoten:hover{transform:translateY(-2px)}
.bm-knoten .bu{width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--tc);display:grid;place-items:center;font:800 .95rem var(--display);flex:none}
.bm-gruppen{position:relative;margin:10px 0 0 12px;padding-left:12px;border-left:2px solid color-mix(in srgb,var(--tc) 55%,transparent)}
.bm-gruppen>li{position:relative;margin-top:8px}
.bm-gruppen>li::before{content:"";position:absolute;left:-12px;top:16px;width:10px;border-top:2px solid color-mix(in srgb,var(--tc) 55%,transparent)}
.bm details>summary{list-style:none;cursor:pointer}.bm details>summary::-webkit-details-marker{display:none}
.bm-gruppe{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 35%,transparent);font:700 .9rem var(--body);color:var(--ink)}
.bm-gruppe span{font-size:.75rem;color:var(--muted);font-weight:700}
.bm-gruppe::after{content:"▾";font-size:.8rem;color:var(--muted);margin-left:auto}
.bm details:not([open])>.bm-gruppe::after{content:"▸"}
.bm-gruppe span{margin-left:auto}
.bm-zweige{margin:4px 0 0 8px;padding-left:10px;border-left:1px dashed var(--line)}
.bm-zweige a{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.2}
.bm-zweige a:hover{background:var(--accent-soft)}
.bm-mini{width:26px;height:26px;display:grid;place-items:center;flex:none;overflow:hidden}.bm-mini svg{max-width:26px;max-height:26px;width:auto;height:auto}
.bm-punkt{width:8px;height:8px;border-radius:50%;background:var(--tc);margin:0 9px;flex:none}
@media (max-width:900px){.bm-aeste{grid-template-columns:repeat(3,1fr)}.bm-ast::before,.bm-ast::after,.bm-aeste::before{display:none}.bm-ast{padding-top:0}}
@media (max-width:620px){.bm{padding:14px 10px}.bm-aeste{grid-template-columns:1fr;gap:10px;margin-top:14px;margin-left:12px;padding-left:14px;border-left:2px solid var(--muted)}
 .bm-ast::before{display:block;left:-14px;right:auto;top:20px;width:12px}.bm-ast:first-child::before{left:-14px}.bm-knoten{justify-content:flex-start}
 .bm-wurzel{margin:0}}
[hidden]{display:none!important}

<script type="application/json" id="daten">{"pflanzen":[{"id":"p01","nr":"P-01","illu":"brennnessel","fotos":[],"name":"Brennnessel","botan":"Urtica dioica L.","volksnamen":["Nessel","Hanfnessel","Haarnessel"],"kurz":"Eine der vielseitigsten Wildpflanzen Mitteleuropas: Gemüse, Heilpflanze, Dünger und Faserlieferant in einem.","steckbrief":[["Familie","Brennnesselgewächse (Urticaceae)"],["Verwandt","Kleine Brennnessel (Urtica urens L.), einjährig"],["Lebensform","ausdauernde Staude mit Wurzelstock"],["Größe","bis ca. 1,4 m"],["Blütezeit","etwa Juni bis September"],["Sammelzeit","Blätter März–Juni, Samen Spätsommer, Wurzel Frühjahr oder Herbst"],["Verwendete Teile","Blätter, Kraut, Wurzel, Samen"],["Rechtlich","Lebensmittel; in Arzneidosis traditionelles pflanzliches Arzneimittel"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"brennnessel_d","titel":"Detailtafel"},{"typ":"standort","licht":3,"wasser":4,"naehrstoffe":5,"ph":"neutral","boden":"humos, stickstoffreich; Gräben, Waldränder, Gärten","ellenberg":"L– F6 R7 N9","hinweis":"Stickstoffzeiger: Wo Brennnesseln wachsen, ist der Boden reich."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Stängel:** aufrecht, vierkantig, meist unverzweigt, mit Brennhaaren.","**Blätter:** gegenständig, länglich-herzförmig, grob gesägt, dunkelgrün.","**Blüten:** unscheinbar grünlich, in hängenden Rispen. Männliche und weibliche Blüten auf getrennten Pflanzen (dioica = zweihäusig).","**Wurzelstock:** gelblich, stark verzweigt, mit waagrechten Ausläufern dicht unter der Oberfläche.","**Brennhaar:** eine einzelne Zelle mit verkieseltem Köpfchen. Die Spitze bricht schräg ab wie eine Kanüle und spritzt den Inhalt in die Haut ({{b:amine|Biogene Amine}})."]},{"typ":"hinweis","text":"**Verwechslung:** Taubnesseln (Lamium) sehen ähnlich aus, brennen aber nicht und tragen auffällige Lippenblüten. Sie sind ebenfalls essbar, die Verwechslung ist harmlos."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März–April:** Austrieb aus dem überwinternden Wurzelstock.","**Mai–Juni:** schnelles Wachstum, beste Erntezeit für junge Blätter.","**Ab Ende Juni:** Blüte. Männliche Blüten schleudern den Pollen explosionsartig aus, der Wind trägt ihn zu den weiblichen Pflanzen.","**Spätsommer–Herbst:** kleine Nüsschen (Samen) reifen.","**Winter:** oberirdische Teile sterben ab, der Wurzelstock überdauert."]},{"typ":"text","text":"Auf der Brennnessel leben die Raupen von Tagpfauenauge, Kleinem Fuchs und Admiral. Eine Brennnesselecke im Garten ist deshalb auch Artenschutz."},{"typ":"abschnitt","titel":"Standort und Verbreitung","liste":["**Boden:** feucht, locker, sehr stickstoffreich – sie ist eine Zeigerpflanze für Stickstoff.","**Typische Orte:** Weg- und Waldränder, Auwälder, Gräben, Komposthaufen, verlassene Höfe, Ufer.","**Licht:** Halbschatten bis Sonne.","**In Deutschland:** Große und Kleine Brennnessel häufig, Röhricht- und Pillen-Brennnessel selten."]},{"typ":"hinweis","text":"**Sammeln:** nicht an stark befahrenen Straßen, gedüngten oder gespritzten Feldrändern und Hundewiesen ({{b:nitrat|Nitrat}})."},{"typ":"abschnitt","titel":"Eigenschaften","liste":["Nährstoffreich: für ein Wildgemüse viel Eiweiß, Mineralstoffe und Vitamine.","Wassertreibend: fördert die Harnausscheidung.","Brennend: Schutz gegen Fraß; Trocknen, Kochen oder Walzen hebt die Wirkung auf.","Faserpflanze: Stängelfasern wurden früher zu Nesselstoff verwebt.","Bodenzeiger für stickstoffreiche, lockere Böden."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Blätter und Kraut enthalten vor allem Mineralstoffe, Flavonoide und Chlorophyll. Die Wurzel hat ein eigenes Profil mit Sterolen, Lignanen und Lektinen. Jeder Stoff ist in Teil B erklärt."},{"typ":"tabelle","kopf":["Pflanzenteil","Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Brennhaare","Biogene Amine, Säuren","Histamin, Serotonin, Acetylcholin, Ameisensäure","{{b:amine|Amine}} · {{b:ameisensaeure|Ameisensäure}}"],["Blätter, Kraut","Flavonoide","Quercetin, Kämpferol, Rutin","{{b:flavonoide|Flavonoide}}"],["Blätter, Kraut","Phenolsäuren","Kaffeoyläpfelsäure, Chlorogensäure","{{b:kaffeoylaepfelsaeure|Kaffeoyläpfelsäure}}"],["Blätter, Kraut","Farbstoffe","Chlorophyll, Beta-Carotin, Lutein","{{b:chlorophyll|Chlorophyll}} · {{b:carotinoide|Carotinoide}}"],["Blätter, Kraut","Mineralstoffe","Kalium, Calcium, Kieselsäure, Eisen","{{b:kieselsaeure|Kieselsäure}}"],["Blätter","Vitamine","Vitamin C, Provitamin A, Vitamin K","{{b:vitamin-k|Vitamin K}}"],["Wurzel","Sterole, Lignane, Lektine","Beta-Sitosterin, UDA (Lektin)","{{b:phytosterole|Phytosterole}} · {{b:lektine|Lektine}}"]]},{"typ":"text","text":"Entgegen der verbreiteten Meinung ist die Ameisensäure nicht der Hauptauslöser des Brennens. Histamin und Acetylcholin spielen die größere Rolle."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Am besten belegt sind die harntreibende Wirkung von Kraut und Blättern und die Linderung von Beschwerden beim Wasserlassen durch die Wurzel bei gutartiger Prostatavergrößerung."},{"typ":"tabelle","kopf":["Wirkung","Teil","Einordnung"],"zeilen":[["Harntreibend, Durchspülung der Harnwege","Kraut, Blätter","[W] als traditionelles Arzneimittel in der EU-Monographie anerkannt"],["Linderung leichter Gelenkschmerzen","Kraut, Blätter","[W] [T] als traditionelles Arzneimittel anerkannt"],["Erleichterung beim Wasserlassen bei gutartiger Prostatavergrößerung","Wurzel","[W] Kommission E, ESCOP; HMPC traditionelle Anwendung"],["Entzündungshemmend","Blätter","[W] nur im Labor gezeigt"],["Antioxidativ","Blätter","[W] im Labor; Bedeutung im Körper unklar"],["Blutbildend, Stärkung bei Erschöpfung","Blätter, Samen","[T] [A] Erfahrungsheilkunde"],["Haar- und Kopfhautpflege","Blätter, Wurzel","[T] äußerlich"],["Wärmereiz bei Rheuma (Urtikation)","frisches Kraut","[T] Volksmedizin"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Anwendungsbeispiele aus Arzneibuch, Volksheilkunde und alternativen Quellen. Das Kürzel zeigt, wie gut eine Anwendung gesichert ist. Bei anhaltenden Beschwerden gehört die Abklärung zum Arzt."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"],["alternativ","Alternativ"]],"eintraege":[{"id":"tee-harnwege","titel":"Blättertee zur Durchspülung","kat":"innerlich","beleg":"W","teil":"Blätter","kurz":"Bei leichten Beschwerden der Harnwege, unterstützend.","zutaten":["1–2 gehäufte TL getrocknete Blätter (ca. 2–4 g)","150 ml kochendes Wasser"],"schritte":["Blätter mit kochendem Wasser übergießen.","10 Minuten zugedeckt ziehen lassen, abseihen.","3–4 Tassen über den Tag verteilt trinken, dazu viel Wasser (mind. 2 Liter am Tag)."],"hinweis":"Bei Fieber, Blut im Urin, Krämpfen oder Beschwerden länger als eine Woche zum Arzt."},{"id":"tee-gelenke","titel":"Teekur bei leichten Gelenkschmerzen","kat":"innerlich","beleg":"T","teil":"Blätter, Kraut","kurz":"Als traditionelles Arzneimittel registriert, über einige Wochen.","zutaten":["Tee wie bei der Durchspülung"],"schritte":["3 Tassen täglich über 3–4 Wochen trinken.","Danach Pause einlegen und Wirkung beurteilen."],"hinweis":"Bei geröteten, geschwollenen oder überwärmten Gelenken sofort zum Arzt."},{"id":"presssaft","titel":"Frischpflanzen-Presssaft","kat":"innerlich","beleg":"T","teil":"frisches Kraut","kurz":"Saft aus jungem Kraut, als Kur im Frühjahr.","zutaten":["junge Triebspitzen","Entsafter oder Mixer und Tuch"],"schritte":["Triebe waschen und frisch entsaften (oder mit wenig Wasser mixen und durch ein Tuch pressen).","1–3 EL täglich, verdünnt mit Wasser oder Saft.","Nur frisch verwenden, im Kühlschrank höchstens 1 Tag."],"hinweis":"Fertigsäfte aus der Apotheke sind dosiert und haltbar; nur für Erwachsene."},{"id":"wurzeltee","titel":"Wurzeltee bei Prostatabeschwerden","kat":"innerlich","beleg":"W","teil":"Wurzel","kurz":"Lindert Beschwerden beim Wasserlassen bei gutartiger Vergrößerung im Anfangsstadium.","zutaten":["1,5 g grob gepulverte Wurzel","150 ml kaltes Wasser"],"schritte":["Wurzel kalt ansetzen und erhitzen.","1 Minute sieden, 10 Minuten ziehen lassen, abseihen.","Über längere Zeit regelmäßig trinken (Fertigpräparate sind genauer dosiert)."],"hinweis":"Lindert nur Beschwerden, verkleinert die Prostata nicht. Vorher ärztlich abklären, regelmäßige Kontrolle bleibt nötig."},{"id":"fruehjahrskur","titel":"Frühjahrskur","kat":"innerlich","beleg":"T","teil":"junge Blätter","kurz":"Vier Wochen frisches Grün und Tee als Start in die Saison.","zutaten":["täglich eine Handvoll junge Blätter","2–3 Tassen Tee"],"schritte":["Blätter in Suppe, Spinat, Smoothie oder Pesto essen.","Zusätzlich Tee trinken, dazu viel Wasser.","Nach 4 Wochen beenden."],"hinweis":"Der Begriff Entschlackung ist wissenschaftlich nicht belegt; belegt ist die harntreibende Wirkung."},{"id":"haarwasser","titel":"Brennnessel-Haarwasser","kat":"aeusserlich","beleg":"T","teil":"Kraut oder Wurzel","kurz":"Pflege für Kopfhaut und Haare nach altem Hausrezept.","zutaten":["100 g frisches Kraut oder 50 g getrocknete Wurzel","500 ml Wasser","250 ml Apfelessig"],"schritte":["Pflanzenteile mit Wasser aufkochen, 15 Minuten köcheln.","Abkühlen lassen, abseihen, Essig zugeben.","In eine saubere Flasche füllen, kühl lagern (ca. 2 Wochen).","Nach dem Waschen in die Kopfhaut einmassieren, nicht ausspülen."],"hinweis":"Wirkung auf Haarwuchs ist nicht wissenschaftlich belegt."},{"id":"hautoel","titel":"Brennnessel-Hautöl","kat":"aeusserlich","beleg":"T","teil":"Presssaft","kurz":"Massageöl, wie in der Stellungnahme der Rheumaliga erwähnt.","zutaten":["1 Teil frischer Brennnesselsaft","2 Teile Olivenöl"],"schritte":["Saft und Öl kräftig mischen.","Vor Gebrauch schütteln, auf schmerzende Muskeln oder Gelenke einreiben.","Kühl lagern und rasch aufbrauchen."],"hinweis":"Vorher an einer kleinen Hautstelle testen."},{"id":"urtikation","titel":"Urtikation (Nesselpeitschen)","kat":"aeusserlich","beleg":"T","teil":"frisches Kraut","kurz":"Alter Reiztherapie-Brauch bei Rheuma: Haut gezielt mit Nesseln berühren.","zutaten":["frische Brennnesseltriebe","Handschuhe"],"schritte":["Schmerzende Stelle kurz mit den Trieben bestreichen.","Die Haut rötet sich und wird warm (Gegenreiz).","Nicht täglich und nur auf gesunder Haut anwenden."],"hinweis":"Nicht bei empfindlicher Haut, Allergien oder Kindern. Wissenschaftlich kaum untersucht."},{"id":"samen","titel":"Nesselsamen zur Stärkung","kat":"alternativ","beleg":"A","teil":"Samen","kurz":"Volksheilkundliches Kräftigungsmittel bei Erschöpfung.","zutaten":["1–2 TL getrocknete Samen täglich"],"schritte":["Samen über Müsli, Salat oder Joghurt streuen.","Leicht geröstet schmecken sie nussig ({{p:p01#rezepte-samen-crunch|Samen-Crunch}})."],"hinweis":"Studien zur Wirkung fehlen."},{"id":"hildegard","titel":"Nesselmus nach Hildegard von Bingen","kat":"alternativ","beleg":"A","teil":"junge Blätter","kurz":"Hildegard schätzte die Brennnessel; in der Hildegard-Heilkunde gilt junges Nesselmus als stärkend.","zutaten":["junge Brennnesselblätter","etwas Fett oder Brühe","Salz"],"schritte":["Blätter weich kochen und fein hacken oder pürieren.","Mit wenig Fett oder Brühe zu einem Mus verrühren und warm essen."],"hinweis":"Originalstellen aus Hildegards Schriften werden noch ergänzt."}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** **Storl** porträtiert die Brennnessel in {{a:storl-buecher-unkraeuter|Die „Unkräuter“ in meinem Garten}} als eine der wertvollsten Pflanzen des Gartens: Nahrung, Medizin, Dünger und Raupenfutter. [T]"},{"typ":"hinweis","text":"**Storl im Video (2018):** Brennnessel lieber als Spinat oder Smoothie, nicht roh als Salat; „vitamin- und mineralreicher kann man es gar nicht haben“ ({{a:storl-videos-kenfm2018|Storl im Gespräch 2018}}). [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Verwendet werden die oberen 4–6 Blätter junger Triebe, am besten von März bis Juni. Blanchieren oder Walzen mit dem Nudelholz entschärft die Brennhaare. Wer im Juni zurückschneidet, erntet im Spätsommer wieder junge Blätter."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["gemuese","Gemüse & Suppen"],["wuerzen","Würzen & Vorrat"],["backen","Backen"],["getraenke","Getränke"]],"eintraege":[{"id":"spinat","titel":"Brennnesselspinat","kat":"gemuese","menge":"2 Portionen","zeit":"20 Min.","zutaten":["200 g junge Brennnesselblätter","1 Zwiebel","1 EL Butter","Salz, Pfeffer, Muskat","2 EL Sahne (nach Wunsch)"],"schritte":["Blätter mit Handschuhen pflücken und waschen.","1 Minute in Salzwasser blanchieren, kalt abschrecken, ausdrücken, hacken.","Zwiebel in Butter glasig dünsten, Brennnesseln dazu, 3 Minuten mitdünsten.","Würzen, nach Wunsch Sahne unterrühren."],"tipp":"Klassisch mit Spiegelei und Salzkartoffeln."},{"id":"suppe","titel":"Brennnesselsuppe","kat":"gemuese","menge":"4 Portionen","zeit":"35 Min.","zutaten":["150 g junge Brennnesselblätter","400 g mehlige Kartoffeln","1 Zwiebel","1 Knoblauchzehe","1 l Gemüsebrühe","1 EL Butter","100 ml Sahne","Salz, Pfeffer, Muskat"],"schritte":["Zwiebel und Knoblauch in Butter andünsten.","Kartoffeln würfeln, mit Brühe 15 Minuten kochen.","Gewaschene Brennnesseln zugeben, 3 Minuten mitkochen.","Fein pürieren, Sahne einrühren, abschmecken."],"tipp":"Mit gerösteten Nesselsamen oder Croûtons bestreuen."},{"id":"spaetzle","titel":"Brennnessel-Spätzle","kat":"gemuese","menge":"3 Portionen","zeit":"30 Min.","zutaten":["80 g blanchierte Brennnesseln","300 g Mehl","3 Eier","ca. 100 ml Wasser","1 TL Salz","Butter, Bergkäse"],"schritte":["Brennnesseln mit Eiern und Wasser fein pürieren.","Mit Mehl und Salz zu einem zähen Teig schlagen, bis er Blasen wirft.","Portionsweise in siedendes Salzwasser schaben oder pressen.","Wenn sie oben schwimmen, abschöpfen und in Butter schwenken, mit Käse bestreuen."]},{"id":"risotto","titel":"Brennnessel-Risotto","kat":"gemuese","menge":"2 Portionen","zeit":"35 Min.","zutaten":["150 g Risottoreis","100 g junge Brennnesseln, blanchiert und gehackt","1 Schalotte","100 ml Weißwein (oder Brühe)","ca. 600 ml heiße Brühe","30 g Parmesan","1 EL Butter"],"schritte":["Schalotte in Butter andünsten, Reis glasig mitdünsten.","Mit Wein ablöschen, dann nach und nach Brühe angießen und rühren.","Nach ca. 18 Minuten Brennnesseln unterheben.","Parmesan und ein Stück Butter einrühren, kurz ruhen lassen."]},{"id":"smoothie","titel":"Grüner Nessel-Smoothie","kat":"getraenke","menge":"2 Gläser","zeit":"5 Min.","zutaten":["1 Handvoll sehr junge Brennnesselspitzen","1 Banane","1 Apfel","Saft einer halben Zitrone","250 ml Wasser"],"schritte":["Brennnesseln waschen und mit dem Nudelholz walzen.","Alles im Mixer 1 Minute fein pürieren.","Sofort trinken."],"tipp":"Roh bleibt am meisten Vitamin C erhalten. Das kräftige Mixen zerstört die Brennhaare."},{"id":"limonade","titel":"Nessel-Zitronen-Limo","kat":"getraenke","menge":"1 Liter","zeit":"10 Min. + 4 Std.","zutaten":["2 Handvoll frische Brennnesseltriebe","1 Bio-Zitrone in Scheiben","2 EL Honig","1 l kaltes Wasser"],"schritte":["Brennnesseln und Zitrone in einen Krug geben.","Mit kaltem Wasser aufgießen, Honig einrühren.","4 Stunden im Kühlschrank ziehen lassen, abseihen."]},{"id":"tee-frisch","titel":"Frischer Brennnesseltee","kat":"getraenke","menge":"1 Tasse","zeit":"10 Min.","zutaten":["5–6 frische Triebspitzen","250 ml kochendes Wasser"],"schritte":["Triebspitzen kurz abspülen.","Mit kochendem Wasser übergießen, 8–10 Minuten ziehen lassen."],"tipp":"Mit Minze oder Zitronenmelisse mischen."},{"id":"pesto","titel":"Brennnesselpesto","kat":"wuerzen","menge":"1 Glas (ca. 200 ml)","zeit":"15 Min.","zutaten":["100 g junge Brennnesselblätter","40 g Walnüsse oder Sonnenblumenkerne","40 g Parmesan","1 Knoblauchzehe","ca. 120 ml Olivenöl","Salz, Zitronensaft"],"schritte":["Blätter 30 Sekunden blanchieren, kalt abschrecken, gut ausdrücken.","Nüsse ohne Fett anrösten.","Alles im Mixer grob pürieren, Öl nach und nach zugeben.","Abschmecken, ins Glas füllen, mit Öl bedecken."],"tipp":"Kühl gelagert und mit Öl bedeckt hält es etwa eine Woche. Portionsweise einfrieren geht auch."},{"id":"salz","titel":"Brennnesselsalz","kat":"wuerzen","menge":"1 kleines Glas","zeit":"10 Min. + Trocknen","zutaten":["2 Handvoll getrocknete Brennnesselblätter","100 g grobes Meersalz"],"schritte":["Blätter vollständig trocknen ({{s:trocknen|Kräuter trocknen}}).","Mit dem Salz im Mörser oder Mixer grob mahlen.","In ein dunkles Glas füllen."],"tipp":"Hält monatelang. Passt zu Kartoffeln, Eiern und Quark."},{"id":"samen-crunch","titel":"Samen-Crunch","kat":"wuerzen","menge":"1 kleines Glas","zeit":"10 Min.","zutaten":["4 EL getrocknete Brennnesselsamen","4 EL Sonnenblumenkerne","2 EL Sesam","1 Prise Salz"],"schritte":["Sonnenblumenkerne und Sesam ohne Fett goldbraun rösten.","Nesselsamen die letzte Minute mitrösten.","Salzen, abkühlen lassen, in ein Glas füllen."],"tipp":"Über Salat, Suppe oder Müsli. Samen ernten: {{s:samen|Samen ernten}}."},{"id":"butter","titel":"Brennnesselbutter","kat":"wuerzen","menge":"125 g","zeit":"10 Min.","zutaten":["125 g weiche Butter","30 g blanchierte Brennnesseln","1 kleine Knoblauchzehe","Salz, etwas Zitronenabrieb"],"schritte":["Brennnesseln gut ausdrücken und sehr fein hacken.","Mit Butter, Knoblauch und Gewürzen verrühren.","In Folie zur Rolle formen, kühlen oder einfrieren."]},{"id":"chips","titel":"Brennnesselchips","kat":"wuerzen","menge":"1 Schale","zeit":"15 Min.","zutaten":["30 große, ganze Brennnesselblätter","1 EL Olivenöl","Salz, Paprika"],"schritte":["Blätter waschen und gut trocken tupfen.","Mit Öl und Gewürzen vorsichtig mischen.","Auf Backpapier bei 150 °C 8–12 Minuten backen, bis sie knusprig sind."],"tipp":"Die Brennwirkung verschwindet beim Backen vollständig."},{"id":"quiche","titel":"Brennnessel-Quiche","kat":"backen","menge":"1 Form (26 cm)","zeit":"70 Min.","zutaten":["1 Rolle Mürbe- oder Quicheteig","200 g blanchierte Brennnesseln, gehackt","1 Zwiebel","3 Eier","200 g Schmand","100 g geriebener Käse","Salz, Pfeffer, Muskat"],"schritte":["Form mit Teig auslegen, Boden mehrfach einstechen.","Zwiebel andünsten, mit Brennnesseln mischen, auf dem Boden verteilen.","Eier, Schmand, Käse und Gewürze verquirlen, darübergießen.","Bei 180 °C Ober-/Unterhitze ca. 40 Minuten backen."]},{"id":"pfannkuchen","titel":"Grüne Pfannkuchen","kat":"backen","menge":"6 Stück","zeit":"25 Min.","zutaten":["50 g blanchierte Brennnesseln","200 g Mehl","3 Eier","300 ml Milch","1 Prise Salz","Butter zum Braten"],"schritte":["Brennnesseln mit Milch und Eiern fein pürieren.","Mehl und Salz einrühren, 10 Minuten quellen lassen.","In Butter dünne Pfannkuchen ausbacken."],"tipp":"Herzhaft gefüllt mit Ziegenkäse oder süß mit Apfelmus."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Eine wilde Ecke im Garten liefert Nahrung, Tee und Dünger fürs ganze Jahr. Die Verfahren sind in Teil S allgemein beschrieben."},{"typ":"abschnitt","titel":"Anbau und Ernte","liste":["**Ansiedeln:** Ausläufer im Frühjahr oder Herbst an einen feuchten, nährstoffreichen Platz setzen; mit Wurzelsperre oder Rasenkante begrenzen.","**Ernten:** mit Handschuhen, nur die Triebspitzen; Rückschnitt im Juni sorgt für eine zweite Ernte im Spätsommer.","**Haltbar machen:** {{s:trocknen|Trocknen}} oder blanchiert einfrieren.","**Samen:** {{s:samen|Samen ernten}}."]},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["duenger","Dünger"],["schutz","Pflanzenschutz"],["garten","Garten"]],"eintraege":[{"id":"jauche","titel":"Brennnesseljauche","kat":"duenger","beleg":"T","teil":"Kraut","kurz":"Stickstoffreicher Flüssigdünger für Starkzehrer.","zutaten":["ca. 1 kg frisches Kraut (ohne Samen)","10 l Regenwasser","1 Handvoll Gesteinsmehl gegen Geruch"],"schritte":["Kraut zerkleinern, in einem Kunststoff- oder Holzgefäß mit Wasser übergießen.","Offen oder mit Gitter abgedeckt an einen sonnigen Platz stellen, täglich umrühren.","Nach 1–2 Wochen, wenn nichts mehr schäumt, ist sie fertig.","1:10 verdünnt auf den Boden gießen, nicht über die Blätter."],"hinweis":"Kein Metallgefäß. Geeignet für Tomaten, Kohl, Kürbis; nicht für Erbsen, Bohnen und Zwiebeln. Mehr: {{s:jauche|Pflanzenjauche}}."},{"id":"kaltwasserauszug","titel":"Kaltwasserauszug gegen Blattläuse","kat":"schutz","beleg":"T","teil":"Kraut","kurz":"Kurz angesetzter Auszug zum Spritzen.","zutaten":["ca. 1 kg frisches Kraut","10 l kaltes Wasser"],"schritte":["Kraut im Wasser 12–24 Stunden ziehen lassen, nicht gären lassen.","Abseihen und unverdünnt auf befallene Pflanzen spritzen.","Mehrmals im Abstand von einigen Tagen wiederholen."],"hinweis":"Wirkung je nach Befall unterschiedlich; frisch verwenden. Mehr: {{s:auszug|Auszug und Brühe}}."},{"id":"mulch","titel":"Mulch und Kompoststarter","kat":"garten","beleg":"T","teil":"Kraut","kurz":"Grünschnitt düngt den Boden und beschleunigt den Kompost.","zutaten":["abgeschnittenes Kraut ohne Samen"],"schritte":["Als dünne Mulchschicht unter Beerensträucher oder Tomaten legen.","Oder lagenweise in den Kompost geben."],"hinweis":"Keine Pflanzen mit reifen Samen und keine Wurzelstücke verwenden, sonst breiten sie sich aus."},{"id":"raupenecke","titel":"Schmetterlingsecke","kat":"garten","beleg":"W","teil":"ganze Pflanze","kurz":"Futterpflanze für Raupen von Tagpfauenauge, Kleinem Fuchs und Admiral.","zutaten":["eine sonnige, ungestörte Ecke"],"schritte":["Einen Bestand stehen lassen und nicht vollständig abmähen.","Teilflächen zeitversetzt schneiden, damit immer junge Triebe da sind."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Brennnessel gilt als gut verträglich. Als Arzneimittel darf sie aber nicht bei Wasseransammlungen durch Herz- oder Nierenschwäche angewendet werden."},{"typ":"abschnitt","titel":"Gegenanzeigen (laut Beipackzetteln)","liste":["Überempfindlichkeit gegen Brennnessel","Wasseransammlungen (Ödeme) durch eingeschränkte Herz- oder Nierentätigkeit","Wenn der Arzt eine verringerte Trinkmenge empfohlen hat"]},{"typ":"abschnitt","titel":"Vorsicht","liste":["Kinder unter 12 Jahren, Schwangere und Stillende: nicht als Arzneimittel anwenden. Als Gemüse in üblichen Mengen gilt sie als unbedenklich.","Diabetes, Leber- oder Nierenerkrankungen: vorher mit dem Arzt sprechen.","Blutverdünner vom Typ Vitamin-K-Antagonist (z. B. Marcumar): keine großen, schwankenden Mengen essen ({{b:vitamin-k|Vitamin K}}).","Arzt aufsuchen bei Fieber, Blut im Urin, Krämpfen oder Beschwerden länger als eine Woche.","Wurzelpräparate lindern Prostatabeschwerden, ersetzen aber keine ärztliche Kontrolle."]},{"typ":"hinweis","text":"**Wechselwirkungen:** In den Beipackzetteln sind keine bekannt. An gedüngten Standorten kann sich {{b:nitrat|Nitrat}} anreichern."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["EMA: Urticae herba, EU-Monographie (Revision 1)","https://www.ema.europa.eu/en/medicines/herbal/urticae-herba"],["EMA: Monographie Urticae radix","https://www.ema.europa.eu/en/documents/herbal-monograph/final-community-herbal-monograph-urtica-dioica-l-urtica-urens-l-their-hybrids-their-mixtures-radix_en.pdf"],["Altmeyers Enzyklopädie: Brennnessel","https://www.altmeyers.org/de/naturheilkunde/brennnessel-22060"],["Altmeyers Enzyklopädie: Urticae radix","https://www.altmeyers.org/de/naturheilkunde/urticae-radix-155403"],["Apotheken Umschau: Brennnessel als Heilpflanze","https://www.apotheken-umschau.de/heilpflanzen/brennessel"],["DGRh: Brennnessel bei rheumatischen Erkrankungen","https://dgrh.de/dam/jcr:cc6c3e74-b2ce-4ef0-8535-fc948051617d/Brennnessel.pdf"],["Gebrauchsinformation Brennnessel Tee N","https://cdn.shop-apotheke.com/PDF/D02/580/332/D02580332-bp.pdf"],["Onmeda: Brennnessel","https://www.onmeda.de/therapie/medikamente/rheuma-hek-id210966/"],["Schule-BW: Brennhaare mikroskopieren","https://www.schule-bw.de/faecher-und-schularten/mathematisch-naturwissenschaftliche-faecher/biologie/unterrichtsmaterialien/7-10/zelle/mikro/pdf/Mikroskopieren_Brennnesselhaare_Lehrerblatt.pdf"],["Gartenjournal: Brennnessel in der Küche","https://www.gartenjournal.net/brennessel-giftig"]]},{"typ":"text","text":"Noch offen: Fotos (eigene oder lizenzfrei), Hildegard-Originalstellen, Nährwerttabelle."}]}]},{"id":"p02","nr":"P-02","illu":"giersch","fotos":[],"name":"Giersch","botan":"Aegopodium podagraria L.","volksnamen":["Geißfuß","Zipperleinskraut","Podagrakraut","Gichtkraut"],"kurz":"Gefürchtetes Gartenunkraut und eines der besten Wildgemüse: mild-würzig nach Petersilie und Möhre, reich an Kalium und Vitamin C. Wichtig: Er hat giftige Doppelgänger.","steckbrief":[["Familie","Doldenblütler (Apiaceae)"],["Lebensform","ausdauernde Staude mit unterirdischen Ausläufern"],["Größe","bis ca. 90 cm"],["Blütezeit","Mai bis September, weiße Doppeldolden"],["Sammelzeit","März bis September; am zartesten März bis Mai"],["Verwendete Teile","Blätter, Blattstiele, Blüten, Samen"],["Nicht essen","Wurzel (laut Altmeyers giftig)"],["Name","Aegopodium = Ziegenfuß (Blattform), podagraria = von Podagra, Gicht"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"giersch_d","titel":"Detailtafel"},{"typ":"standort","licht":2,"wasser":3,"naehrstoffe":4,"ph":"neutral bis basisch","boden":"humos, frisch; Gehölzränder, Hecken","ellenberg":"L5 F6 R7 N8","hinweis":"Breitet sich mit Ausläufern aus; im Halbschatten am üppigsten."},{"typ":"hinweis","text":"**Verwechslungsgefahr:** Giersch gehört zu den Doldenblütlern. Zu ihnen zählen auch hochgiftige Arten wie Gefleckter Schierling, Hundspetersilie und Wasserschierling. Nur sammeln, was alle drei Merkmale unten zeigt."},{"typ":"abschnitt","titel":"Erkennen nach der 3-3-3-Regel","nummern":["**Drei Teile:** Das Blatt ist dreigeteilt, und jeder Teil ist noch einmal dreigeteilt.","**Dreikantig:** Der Blattstiel ist dreikantig mit einer Rinne auf der Oberseite.","**Duft:** Zerriebene Blätter riechen nach Möhre und Petersilie."]},{"typ":"tabelle","kopf":["Merkmal","Giersch","Gefleckter Schierling","Hundspetersilie"],"zeilen":[["Blatt","3 × 3 Teilblättchen, breit, gesägt","fein, mehrfach gefiedert, farnartig","fein gefiedert, Unterseite glänzend"],["Stiel","dreikantig, grün, behaart bis kahl","rund, bläulich bereift, rotbraun gefleckt","rund, oft rötlich überlaufen"],["Geruch","Möhre, Petersilie","unangenehm nach Mäuseharn","unangenehm, knoblauchartig"],["Wuchs","dichte Teppiche, Ausläufer","einzeln, bis 2 m hoch","einzeln, Äcker und Gärten"]]},{"typ":"text","text":"Die Merkmale der giftigen Arten beschreiben die typische Form. Im Zweifel nicht essen und eine Pflanzenführung oder ein Bestimmungsbuch hinzuziehen."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März:** erste hellgrüne, glänzende Blätter, am mildesten im Geschmack.","**April–Mai:** Hauptsaison für Salat, Pesto, Spinat.","**Mai–September:** Blüte in weißen Doppeldolden; ältere Blätter werden herber.","**Spätsommer:** Samen reifen.","**Ganzjährig:** Ausbreitung über weiße, unterirdische Ausläufer. Schon kleine Wurzelstücke treiben neu aus."]},{"typ":"abschnitt","titel":"Standort","liste":["Frische, nährstoffreiche, lockere Böden","Halbschatten: Hecken, Waldränder, Gebüsche, Gärten, Parks","Bildet dichte Teppiche und verdrängt andere Pflanzen"]},{"typ":"text","text":"Die weißen Dolden sind eine Bienenweide. Der NABU nennt Dukatenfalter und Kleinen Eisvogel als Falter, die Giersch nutzen."}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Giersch ist besonders reich an Kalium und enthält dazu Vitamin C, Provitamin A, Mineralstoffe und Eiweiß. Für frische Blätter werden etwa 576 mg Kalium und 99 mg Calcium pro 100 g angegeben."},{"typ":"tabelle","kopf":["Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Mineralstoffe","Kalium, Calcium, Magnesium, Eisen, Mangan, Kupfer","–"],["Vitamine","Vitamin C, Provitamin A (Beta-Carotin)","{{b:carotinoide|Carotinoide}}"],["Flavonoide","Quercetin-Verbindungen u. a.","{{b:flavonoide|Flavonoide}}"],["Cumarine","verschiedene Cumarin-Abkömmlinge","{{b:cumarine|Cumarine}}"],["Polyacetylene","Falcarinol-artige Verbindungen","{{b:polyacetylene|Polyacetylene}}"],["Ätherisches Öl","Mono- und Sesquiterpene (Möhrenduft)","–"],["Eiweiß","pflanzliches Protein","–"]]},{"typ":"text","text":"Quellen: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/giersch-161006), [NABU](https://www.nabu.de/tiere-und-pflanzen/pflanzen/pflanzenportraets/wildpflanzen/22952.html), [Heidelberg24](https://www.heidelberg24.de/verbraucher/giersch-wildgemuese-kueche-essen-inhaltsstoffe-verwechslung-94399734.html)."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Giersch ist keine Arzneibuchdroge. Seine Heilwirkungen stammen aus der Erfahrungsheilkunde; gesichert ist vor allem sein Wert als nährstoffreiches Gemüse."},{"typ":"tabelle","kopf":["Wirkung","Teil","Einordnung"],"zeilen":[["Bei Gicht und Rheuma (daher der Name)","Blätter","[T] Volksheilkunde, nicht belegt"],["Harntreibend, bei Blasen- und Nierenbeschwerden","Blätter","[T] Volksheilkunde"],["Basisch, soll Harnsäure neutralisieren","Blätter","[A] Erklärung aus der Naturheilkunde, nicht geprüft"],["Antioxidativ","Blätter","[W] nur Labor- und Tierstudien"],["Bei Insektenstichen, kleinen Wunden, Verbrennungen","frische Blätter","[T] äußerlich"],["Nährstoffreiches Wildgemüse","Blätter","[W] Nährstoffanalysen"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Alle Anwendungen stammen aus der Volksheilkunde. Bei Gicht gehört die Behandlung in ärztliche Hand; Giersch kann höchstens begleiten."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"tee","titel":"Gierschtee","kat":"innerlich","beleg":"T","teil":"Blätter","kurz":"Traditionell bei Gicht, Rheuma und Blasenbeschwerden.","zutaten":["1 EL frische oder 1 TL getrocknete Blätter","250 ml kochendes Wasser"],"schritte":["Blätter übergießen und 10 Minuten ziehen lassen.","2–3 Tassen täglich, dazu viel trinken."],"hinweis":"Bei akuter Gicht oder Fieber zum Arzt."},{"id":"auflage","titel":"Blattauflage bei Gelenkschmerzen","kat":"aeusserlich","beleg":"T","teil":"frische Blätter","kurz":"Alter Umschlag auf schmerzende Gelenke.","zutaten":["1 Handvoll frische Blätter","ein Tuch"],"schritte":["Blätter mit dem Nudelholz quetschen oder im Mörser zerstoßen.","Auf das Gelenk legen, mit einem Tuch fixieren.","20–30 Minuten wirken lassen."],"hinweis":"Nicht auf offene Haut; bei Hautreizung entfernen."},{"id":"stich","titel":"Erste Hilfe bei Insektenstichen","kat":"aeusserlich","beleg":"T","teil":"frisches Blatt","kurz":"Ein Blatt zerreiben und auflegen, wie man es vom Spitzwegerich kennt.","zutaten":["1–2 frische Blätter"],"schritte":["Blatt zwischen den Fingern zerreiben, bis Saft austritt.","Auf den Stich drücken."]},{"id":"fussbad","titel":"Gierschfußbad","kat":"aeusserlich","beleg":"T","teil":"Kraut","kurz":"Warmes Fußbad, traditionell bei Gicht in den Zehen (Podagra).","zutaten":["2 Handvoll frisches Kraut","2 l Wasser"],"schritte":["Kraut 10 Minuten in Wasser köcheln, abseihen.","Auf angenehme Badetemperatur abkühlen lassen.","Füße 15 Minuten baden."],"hinweis":"Nicht bei akut entzündetem, heißem Gelenk."},{"id":"kur","titel":"Wildkräuter-Frühjahrskur","kat":"innerlich","beleg":"T","teil":"junge Blätter","kurz":"Giersch und {{p:p01#heilkunde-fruehjahrskur|Brennnessel}} vier Wochen lang täglich frisch essen.","zutaten":["täglich eine Handvoll junger Giersch","nach Wunsch Brennnessel"],"schritte":["Roh in Salat, Quark oder Smoothie, oder gegart als Spinat.","Über 4 Wochen täglich."]}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** **Storl** empfiehlt, Giersch nicht zu bekämpfen, sondern zu essen ({{a:storl-garten-beikraut|Beikräuter nutzen statt bekämpfen}}). [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Giersch schmeckt mild nach Petersilie und Möhre. Am besten sind die jungen, glänzenden, noch gefalteten Blätter. Regelmäßiges Abschneiden hält sie zart."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["roh","Roh & Salat"],["gemuese","Gemüse & Suppen"],["wuerzen","Würzen & Vorrat"],["getraenke","Getränke"]],"eintraege":[{"id":"salat","titel":"Gierschsalat mit Ei","kat":"roh","menge":"2 Portionen","zeit":"15 Min.","zutaten":["2 Handvoll junge Gierschblätter","1 Handvoll Feldsalat oder Löwenzahn","2 hartgekochte Eier","2 EL Öl, 1 EL Apfelessig","1 TL Senf, Salz, Pfeffer, Honig"],"schritte":["Blätter waschen, große Blätter zupfen.","Dressing aus Öl, Essig, Senf und Gewürzen rühren.","Mit Salat mischen, Eier in Scheiben darauflegen."]},{"id":"quark","titel":"Giersch-Kräuterquark","kat":"roh","menge":"4 Portionen","zeit":"10 Min.","zutaten":["1 Handvoll junge Gierschblätter","250 g Quark","3 EL Milch oder Joghurt","1 kleine Knoblauchzehe","Salz, Pfeffer, Zitronensaft"],"schritte":["Giersch sehr fein hacken.","Mit Quark, Milch und Knoblauch glattrühren.","Abschmecken."],"tipp":"Zu Pellkartoffeln, ein Klassiker im Saarland wie anderswo."},{"id":"smoothie","titel":"Giersch-Apfel-Smoothie","kat":"getraenke","menge":"2 Gläser","zeit":"5 Min.","zutaten":["1 Handvoll junge Gierschblätter","1 Apfel","1 Banane","Saft einer halben Zitrone","250 ml Wasser"],"schritte":["Alles im Mixer 1 Minute fein pürieren.","Sofort trinken."]},{"id":"wasser","titel":"Giersch-Gurken-Wasser","kat":"getraenke","menge":"1 Liter","zeit":"5 Min. + 2 Std.","zutaten":["5–6 Gierschstängel mit Blättern","eine halbe Gurke in Scheiben","1 l kaltes Wasser"],"schritte":["Alles in einen Krug geben.","2 Stunden kühl ziehen lassen."]},{"id":"spinat","titel":"Gierschspinat","kat":"gemuese","menge":"2 Portionen","zeit":"15 Min.","zutaten":["300 g Giersch (Blätter und zarte Stiele)","1 Zwiebel","1 EL Butter","Salz, Pfeffer, Muskat"],"schritte":["Giersch waschen und grob hacken.","Zwiebel in Butter dünsten, Giersch zugeben.","3–4 Minuten zusammenfallen lassen, würzen."],"tipp":"Fällt stark zusammen, also reichlich sammeln."},{"id":"suppe","titel":"Gierschsuppe","kat":"gemuese","menge":"4 Portionen","zeit":"30 Min.","zutaten":["200 g Giersch","300 g Kartoffeln","1 Zwiebel","1 l Gemüsebrühe","100 ml Sahne","Salz, Pfeffer, Muskat"],"schritte":["Zwiebel andünsten, Kartoffeln würfeln, mit Brühe 15 Minuten kochen.","Giersch zugeben, 3 Minuten mitkochen.","Pürieren, Sahne einrühren, abschmecken."]},{"id":"frittata","titel":"Giersch-Frittata","kat":"gemuese","menge":"2 Portionen","zeit":"20 Min.","zutaten":["2 Handvoll Giersch, gehackt","5 Eier","50 g geriebener Käse","1 Zwiebel","Öl, Salz, Pfeffer"],"schritte":["Zwiebel in einer ofenfesten Pfanne anbraten, Giersch kurz mitbraten.","Eier mit Käse und Gewürzen verquirlen, darübergießen.","Bei kleiner Hitze stocken lassen, dann 5 Minuten unter den Backofengrill."]},{"id":"pesto","titel":"Gierschpesto","kat":"wuerzen","menge":"1 Glas (ca. 200 ml)","zeit":"10 Min.","zutaten":["100 g junge Gierschblätter","40 g Sonnenblumenkerne oder Walnüsse","40 g Parmesan","1 Knoblauchzehe","ca. 120 ml Olivenöl","Salz, Zitronensaft"],"schritte":["Kerne ohne Fett anrösten.","Giersch roh mit allen Zutaten im Mixer pürieren, Öl nach und nach zugeben.","Ins Glas füllen und mit Öl bedecken."],"tipp":"Anders als Brennnessel muss Giersch nicht blanchiert werden. Hält gekühlt etwa eine Woche."},{"id":"wuerzpaste","titel":"Giersch-Würzpaste auf Vorrat","kat":"wuerzen","menge":"2 kleine Gläser","zeit":"15 Min.","zutaten":["200 g Giersch","20 g Salz","ca. 80 ml Öl"],"schritte":["Giersch fein hacken oder mixen.","Mit Salz und Öl verrühren, fest in saubere Gläser drücken.","Mit Öl abdecken, kühl lagern."],"tipp":"Durch das Salz einige Wochen haltbar. Löffelweise in Suppen und Soßen, dann nicht nachsalzen."},{"id":"samen","titel":"Gierschsamen als Gewürz","kat":"wuerzen","menge":"1 kleines Glas","zeit":"Ernte + Trocknen","zutaten":["reife Samendolden im Spätsommer"],"schritte":["Dolden schneiden, wenn die Samen bräunlich sind.","In einer Papiertüte trocknen, ausreiben, sieben ({{s:samen|Samen ernten}}).","Wie Kümmel zu Brot, Kohl und Kartoffeln verwenden."],"tipp":"Nur sammeln, wenn die Pflanze sicher bestimmt ist."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Giersch wird man im Garten kaum wieder los. Der NABU empfiehlt, ihn durch häufiges Ernten statt durch Gift in Schach zu halten. So wird aus dem Unkraut ein Gemüsebeet, das sich selbst pflegt."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["duenger","Dünger"]],"eintraege":[{"id":"ernten","titel":"Aufessen statt bekämpfen","kat":"garten","beleg":"T","teil":"ganze Pflanze","kurz":"Regelmäßiges Schneiden schwächt die Pflanze und liefert laufend zarte Blätter.","zutaten":["Schere oder Sichel"],"schritte":["Bestand alle 2–3 Wochen bodennah abschneiden.","Blüte verhindern, damit er sich nicht aussät.","Ernte in die Küche."]},{"id":"abdecken","titel":"Fläche abdecken","kat":"garten","beleg":"T","teil":"Wurzelausläufer","kurz":"Ohne Licht stirbt der Bestand mit der Zeit ab.","zutaten":["Pappe oder lichtdichte Folie","Mulch zum Beschweren"],"schritte":["Fläche bodennah mähen.","Lückenlos mit Pappe oder Folie abdecken, Ränder überlappen.","Mindestens eine Saison liegen lassen."],"hinweis":"Wurzelstücke nicht auf den Kompost: Sie treiben wieder aus."},{"id":"jauche","titel":"Gierschjauche","kat":"duenger","beleg":"T","teil":"Kraut","kurz":"Wie {{p:p01#selbstversorgung-jauche|Brennnesseljauche}} als mild düngende Pflanzenjauche.","zutaten":["ca. 1 kg Kraut ohne Wurzeln","10 l Regenwasser"],"schritte":["Kraut zerkleinern und ansetzen, täglich umrühren.","Nach 1–2 Wochen 1:10 verdünnt gießen ({{s:jauche|Pflanzenjauche}})."]},{"id":"insekten","titel":"Blühinsel für Insekten","kat":"garten","beleg":"W","teil":"Blüten","kurz":"Eine kleine Ecke blühen lassen: Bienen und Falter besuchen die Dolden.","zutaten":["eine begrenzte Ecke, z. B. mit Wurzelsperre"],"schritte":["Ecke ausblühen lassen.","Vor der Samenreife abschneiden, damit er sich nicht verbreitet."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Das größte Risiko beim Giersch ist die Verwechslung mit giftigen Doldenblütlern. Ein sicher bestimmter Giersch gilt als gut verträglich."},{"typ":"abschnitt","titel":"Worauf achten","liste":["**Bestimmung:** nur Pflanzen mit 3-3-3-Blatt, dreikantigem Stiel und Möhrenduft sammeln ({{p:p02#botanik|Botanik}}).","**Wurzel:** nicht essen.","**Allergie:** Wer auf Beifuß- oder Birkenpollen reagiert, kann auch auf Giersch allergisch reagieren, bis hin zu Juckreiz im Mund.","**Hautkontakt:** Doldenblütler können bei empfindlicher Haut reizen; bei Rötung Handschuhe tragen.","**Gicht:** Giersch ersetzt keine ärztliche Behandlung."]},{"typ":"hinweis","text":"**Wechselwirkungen:** keine bekannt. Giersch ist kein geprüftes Arzneimittel, daher gibt es keine amtlichen Angaben."}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Altmeyers Enzyklopädie: Giersch","https://www.altmeyers.org/de/naturheilkunde/giersch-161006"],["NABU: Giersch","https://www.nabu.de/tiere-und-pflanzen/pflanzen/pflanzenportraets/wildpflanzen/22952.html"],["LfL Bayern: Wildkräuter – Giersch","https://lfl.bayern.de/mam/cms07/iab/dateien/wildkraeuter_giersch_jutta_kotzi.pdf"],["Heidelberg24: Giersch als Wildgemüse","https://www.heidelberg24.de/verbraucher/giersch-wildgemuese-kueche-essen-inhaltsstoffe-verwechslung-94399734.html"],["Spektrum Lexikon: Aegopodium podagraria","https://www.spektrum.de/lexikon/arzneipflanzen-drogen/aegopodium-podagraria/219"]]},{"typ":"text","text":"Noch offen: Fotos zum Vergleich mit Schierling und Hundspetersilie, genaue Nährwerttabelle."}]}]},{"id":"p03","nr":"P-03","illu":"loewenzahn","fotos":[],"name":"Löwenzahn","botan":"Taraxacum officinale (F. H. Wigg.)","volksnamen":["Pusteblume","Kuhblume","Butterblume","Bettsaicher (Saarland, Pfalz)"],"kurz":"Von der Wurzel bis zur Blüte essbar und eine der ältesten Bitterpflanzen der Volksmedizin. Die Bitterstoffe regen Appetit, Verdauung und Galle an, die Blätter treiben Wasser aus. Im Saarland kennt man ihn als Bettsaicher-Salat.","steckbrief":[["Familie","Korbblütler (Asteraceae)"],["Lebensform","ausdauernde Staude mit langer Pfahlwurzel"],["Größe","10–40 cm"],["Blütezeit","Hauptblüte April–Mai, Nachblüte bis Herbst"],["Sammelzeit","Blätter März–Mai (vor der Blüte am mildesten), Blüten April–Mai, Wurzel Herbst oder zeitiges Frühjahr"],["Verwendete Teile","Wurzel, Blätter, Blüten, Knospen"],["Arzneidroge","Löwenzahnwurzel mit Kraut (Taraxaci radix cum herba), Qualität im Europäischen Arzneibuch"],["Name","Taraxacum vermutlich aus dem Arabischen/Persischen für Bitterkraut; Löwenzahn nach den gezähnten Blättern"]],"reiter":[{"id":"botanik","titel":"Botanik","bloecke":[{"typ":"illu","id":"loewenzahn_d","titel":"Detailtafel"},{"typ":"standort","licht":4,"wasser":3,"naehrstoffe":4,"ph":"indifferent","boden":"Wiesen, Wegränder, Rasen","ellenberg":"L7 F5 R– N8","hinweis":"Lange Pfahlwurzel lockert den Unterboden."},{"typ":"abschnitt","titel":"Aussehen","liste":["**Blätter:** in einer bodennahen Rosette, tief gezähnt wie Löwenzähne, kahl, mit hellem Mittelnerv.","**Blütenstand:** ein einzelner goldgelber Korb aus 100–200 Zungenblüten auf einem hohlen, blattlosen Stängel.","**Milchsaft:** alle Teile führen weißen, bitteren Milchsaft, der braune Flecken macht.","**Frucht:** die Pusteblume – Achänen mit Schirmchen, die der Wind kilometerweit trägt.","**Wurzel:** fleischige Pfahlwurzel, außen braun, innen weiß, bis über 1 m tief."]},{"typ":"hinweis","text":"**Verwechslung:** Ähnlich sehen Herbst-Löwenzahn, Ferkelkraut und Pippau aus; sie sind ungiftig. Ein sicheres Merkmal des echten Löwenzahns: hohler, unverzweigter Stängel mit nur einer Blüte und Blätter ganz ohne Haare."},{"typ":"abschnitt","titel":"Lebenszyklus","nummern":["**März:** Rosette treibt aus der Pfahlwurzel; zarteste Blätter.","**April–Mai:** Massenblüte, eine der ersten großen Bienenweiden.","**Mai–Juni:** Pusteblumen; die Blätter werden bitterer und zäher.","**Sommer–Herbst:** Nachblüte; die Wurzel speichert Inulin und ist im Herbst am süßesten.","**Winter:** Rosette zieht ein, Wurzel überdauert."]},{"typ":"text","text":"Die meisten Löwenzahn-Samen entstehen ohne Bestäubung (Apomixis) – jede Pflanze erzeugt genetische Kopien ihrer selbst. Darum gibt es Hunderte leicht verschiedener Kleinarten."},{"typ":"abschnitt","titel":"Standort","liste":["Fette Wiesen, Weiden, Wegränder, Rasen, Gärten – fast überall.","Zeigerpflanze für stickstoffreiche, gut gedüngte Böden.","Sammeln: nicht an Straßen, Hundewiesen und frisch gedüngten Wiesen ({{b:nitrat|Nitrat}})."]}]},{"id":"inhaltsstoffe","titel":"Inhaltsstoffe","bloecke":[{"typ":"text","text":"Typisch sind Bitterstoffe in allen Teilen, Inulin in der Wurzel und viel Kalium in den Blättern."},{"typ":"tabelle","kopf":["Pflanzenteil","Stoffgruppe","Beispiele","Teil B"],"zeilen":[["Wurzel, Kraut, Milchsaft","Bitterstoffe (Sesquiterpenlactone)","Taraxacin bzw. Lactucopicrin, Eudesmanolide, Germacranolide","{{b:bitterstoffe|Bitterstoffe}}"],["Wurzel","Speicherkohlenhydrat","Inulin, im Herbst bis zu rund 40 % der Trockenmasse","{{b:inulin|Inulin}}"],["Wurzel, Milchsaft","Triterpene, Sterole","Taraxasterol, Beta-Sitosterin","{{b:phytosterole|Phytosterole}}"],["Blätter, Blüten","Flavonoide, Phenolsäuren","Luteolin, Chicorsäure, Chlorogensäure","{{b:flavonoide|Flavonoide}}"],["Blätter","Mineralstoffe, Vitamine","viel Kalium, Calcium, Vitamin C, Provitamin A","{{b:carotinoide|Carotinoide}}"],["Blüten","Farbstoffe","Carotinoide (Lutein u. a.)","{{b:carotinoide|Carotinoide}}"]]},{"typ":"text","text":"Quelle: [Altmeyers Enzyklopädie](https://www.altmeyers.org/de/naturheilkunde/taraxaci-radix-cum-herba-23462). Der Inulingehalt schwankt stark mit der Jahreszeit; die Zahl ist ein häufig genannter Höchstwert."}]},{"id":"wirkung","titel":"Wirkung","bloecke":[{"typ":"text","text":"Löwenzahn ist als traditionelles Arzneimittel bei leichten Verdauungsbeschwerden, Appetitlosigkeit und zur Durchspülung der Harnwege anerkannt."},{"typ":"tabelle","kopf":["Wirkung","Teil","Einordnung"],"zeilen":[["Regt Appetit und Magensaft an","Wurzel mit Kraut","[W] HMPC traditionell, Kommission E"],["Fördert den Gallefluss","Wurzel","[W] Kommission E, ESCOP"],["Bei Völlegefühl und Blähungen","Wurzel mit Kraut","[W] Kommission E"],["Harntreibend, Durchspülung der Harnwege","Blätter","[W] HMPC traditionell, ESCOP"],["Präbiotisch, füttert Darmbakterien","Wurzel (Inulin)","[W] für Inulin allgemein belegt"],["Leicht abführend","Wurzel","[T] Erfahrungsheilkunde"],["Frühjahrskur, „Blutreinigung“, bei Gicht und Rheuma","ganze Pflanze","[T] Volksheilkunde"],["Milchsaft gegen Warzen","frischer Milchsaft","[T] Hausmittel, nicht belegt"]]}]},{"id":"heilkunde","titel":"Heilkunde","bloecke":[{"typ":"text","text":"Bitterstoffe wirken schon auf der Zunge: Sie lösen über Reflexe die Verdauungssäfte aus. Darum Bittertees vor dem Essen und ungesüßt trinken."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["innerlich","Innerlich"],["aeusserlich","Äußerlich"]],"eintraege":[{"id":"tee-verdauung","titel":"Wurzeltee für die Verdauung","kat":"innerlich","beleg":"W","teil":"Wurzel mit Kraut","kurz":"Bei Völlegefühl, Blähungen und Appetitlosigkeit.","zutaten":["3–4 g geschnittene Wurzel mit Kraut (ca. 1 gehäufter TL)","150 ml Wasser"],"schritte":["Mit kaltem Wasser ansetzen, aufkochen, 1 Minute köcheln.","10 Minuten ziehen lassen, abseihen.","Eine halbe Stunde vor dem Essen trinken, bis 3 Tassen am Tag."],"hinweis":"Nicht bei Gallengangsverschluss; bei Gallensteinen nur nach Rücksprache mit dem Arzt."},{"id":"tee-harnwege","titel":"Blättertee zur Durchspülung","kat":"innerlich","beleg":"W","teil":"Blätter","kurz":"Unterstützend bei leichten Harnwegsbeschwerden.","zutaten":["1 EL getrocknete Blätter","150 ml kochendes Wasser"],"schritte":["Übergießen, 10 Minuten ziehen lassen.","3 Tassen über den Tag verteilt, dazu mindestens 2 Liter trinken.","Nicht abends – er treibt Wasser."]},{"id":"presssaft","titel":"Frischpflanzen-Presssaft","kat":"innerlich","beleg":"T","teil":"ganze Pflanze","kurz":"Klassische Frühjahrskur über 4 Wochen.","zutaten":["frische Blätter mit Wurzel","Entsafter oder Mixer und Tuch"],"schritte":["Pflanzen gründlich waschen und entsaften.","3-mal täglich etwa 20 ml (ca. 1 EL) in Wasser.","Frisch verbrauchen."]},{"id":"tinktur","titel":"Löwenzahntinktur","kat":"innerlich","beleg":"T","teil":"Wurzel","kurz":"Haltbares Bittermittel für unterwegs.","zutaten":["50 g frische, gehackte Wurzel","250 ml Korn oder Wodka (38–40 %)","dunkles Schraubglas"],"schritte":["Wurzel ins Glas, mit Alkohol bedecken.","3–4 Wochen dunkel ziehen lassen, täglich schütteln.","Abseihen, in Tropfflasche füllen.","3-mal täglich 10–15 Tropfen in Wasser vor dem Essen."],"hinweis":"Enthält Alkohol – nicht für Kinder und bei Alkoholproblemen."},{"id":"kur","titel":"Löwenzahn-Frühjahrskur","kat":"innerlich","beleg":"T","teil":"Blätter, Stängel","kurz":"Täglich frisches Grün über 3–4 Wochen im April.","zutaten":["täglich eine Handvoll junge Blätter","nach Volksbrauch 5–10 rohe Blütenstängel"],"schritte":["Blätter in Salat oder Smoothie.","Die Stängel roh kauen – sie schmecken bitter-süß.","Mit {{p:p01#heilkunde-fruehjahrskur|Brennnessel}} und {{p:p02#heilkunde-kur|Giersch}} kombinieren."]},{"id":"warzen","titel":"Milchsaft gegen Warzen","kat":"aeusserlich","beleg":"T","teil":"Stängel","kurz":"Altes Hausmittel: täglich frischen Milchsaft auftupfen.","zutaten":["frisch abgebrochene Stängel"],"schritte":["Stängel abbrechen, den weißen Saft auf die Warze tupfen.","2–3-mal täglich über einige Wochen wiederholen."],"hinweis":"Nicht belegt. Der Saft färbt braun und kann bei Empfindlichen die Haut reizen."},{"id":"hautoel","titel":"Blütenöl für trockene Haut","kat":"aeusserlich","beleg":"T","teil":"Blüten","kurz":"Ölauszug als Massage- und Pflegeöl.","zutaten":["Blüten (über Nacht angewelkt)","Olivenöl oder Sonnenblumenöl","Schraubglas"],"schritte":["Blüten locker ins Glas füllen, mit Öl vollständig bedecken.","4 Wochen warm und hell stehen lassen, täglich schwenken.","Abseihen, dunkel lagern, binnen 6 Monaten verbrauchen."],"hinweis":"Blüten vorher anwelken lassen, sonst kann das Wasser das Öl verderben."}]},{"typ":"hinweis","storl":true,"text":"**Storl-Bezug:** In {{a:storl-buecher-unkraeuter|Die „Unkräuter“ in meinem Garten}} rät **Storl** zum Gleichgewicht: Löwenzahn ist Heil- und Nahrungspflanze – eine Invasion im Gemüsebeet muss man aber nicht dulden. [T]"}]},{"id":"rezepte","titel":"Rezepte","bloecke":[{"typ":"text","text":"Junge Blätter vor der Blüte sind am mildesten. Wer es noch milder mag, legt sie 30 Minuten in lauwarmes Wasser oder bleicht die Pflanzen (siehe Selbstversorgung)."},{"typ":"karten","art":"rezept","filter":[["alle","Alle"],["salat","Salate"],["warm","Warme Gerichte"],["vorrat","Vorrat & Süßes"],["getraenke","Getränke"]],"eintraege":[{"id":"bettsaicher","titel":"Bettsaicher-Salat mit Speck","kat":"salat","menge":"4 Portionen","zeit":"30 Min.","zutaten":["300 g junge Löwenzahnblätter","500 g festkochende Kartoffeln","150 g durchwachsener Speck","1 Zwiebel","3 EL Essig, 2 EL Öl","Salz, Pfeffer, etwas Zucker","2 hartgekochte Eier (nach Wunsch)"],"schritte":["Kartoffeln kochen, pellen, in Scheiben schneiden.","Blätter waschen, in mundgerechte Stücke zupfen.","Speck würfeln und knusprig braten, Zwiebel mitbraten.","Pfanne vom Herd nehmen, Essig, Öl und Gewürze einrühren.","Die warme Marinade über Salat und Kartoffeln gießen, sofort servieren."],"tipp":"So isst man ihn im Saarland und in der Pfalz. Die warme Specksoße mildert die Bitterkeit."},{"id":"wildkraeutersalat","titel":"Wildkräutersalat mit Blüten","kat":"salat","menge":"2 Portionen","zeit":"15 Min.","zutaten":["2 Handvoll junge Löwenzahnblätter","1 Handvoll {{p:p02|Giersch}} und Gänseblümchen","1 Apfel","2 EL Walnüsse","Dressing: 3 EL Öl, 1 EL Apfelessig, 1 TL Honig, 1 TL Senf"],"schritte":["Blätter zupfen, Apfel in feine Scheiben schneiden.","Dressing verrühren, alles mischen.","Mit Nüssen und Löwenzahn-Blütenblättern bestreuen."]},{"id":"pesto","titel":"Löwenzahnpesto","kat":"vorrat","menge":"1 Glas (200 ml)","zeit":"10 Min.","zutaten":["80 g junge Blätter","40 g Sonnenblumenkerne, geröstet","40 g Parmesan","1 Knoblauchzehe","120 ml Olivenöl","Salz, Zitronensaft, 1 TL Honig"],"schritte":["Alles im Mixer grob pürieren, Öl nach und nach zugeben.","Mit Honig und Zitrone die Bitterkeit ausgleichen.","Ins Glas füllen, mit Öl bedecken, kühl lagern."]},{"id":"risotto","titel":"Löwenzahn-Risotto","kat":"warm","menge":"2 Portionen","zeit":"35 Min.","zutaten":["150 g Risottoreis","1 Handvoll junge Blätter, in Streifen","1 Schalotte","100 ml Weißwein oder Brühe","600 ml heiße Brühe","40 g Parmesan, Butter"],"schritte":["Schalotte und Reis in Butter andünsten, ablöschen.","Brühe nach und nach angießen und rühren.","Nach 18 Minuten die Blätter unterheben.","Mit Parmesan und Butter vollenden."]},{"id":"blueten-teig","titel":"Ausgebackene Löwenzahnblüten","kat":"warm","menge":"2 Portionen","zeit":"20 Min.","zutaten":["20 voll geöffnete Blüten mit kurzem Stiel","100 g Mehl","1 Ei","150 ml Milch oder Bier","Prise Salz","Öl zum Ausbacken"],"schritte":["Blüten ausschütteln, nicht waschen.","Mehl, Ei, Milch und Salz zu glattem Teig rühren.","Blüten am Stiel durch den Teig ziehen.","In heißem Öl goldgelb backen, auf Küchenpapier abtropfen."],"tipp":"Süß mit Zucker und Zimt oder herzhaft mit Kräuterquark."},{"id":"kapern","titel":"Löwenzahnkapern","kat":"vorrat","menge":"1 kleines Glas","zeit":"15 Min. + 2 Wochen","zutaten":["2 Handvoll fest geschlossene Knospen","100 ml Weißweinessig, 50 ml Wasser","1 TL Salz, 1 TL Zucker","Lorbeerblatt, Pfefferkörner"],"schritte":["Knospen über Nacht in Salzwasser legen, abspülen.","Sud aus Essig, Wasser, Salz und Zucker aufkochen.","Knospen ins Glas, heiß übergießen, verschließen.","2 Wochen durchziehen lassen."],"tipp":"Wie Kapern zu Fisch, Salaten und Soßen."},{"id":"honig","titel":"Löwenzahnhonig (Blütensirup)","kat":"vorrat","menge":"ca. 3 Gläser","zeit":"1 Tag + 2 Std.","zutaten":["300 g Löwenzahnblüten (ca. 4 Handvoll)","1 l Wasser","1 Bio-Zitrone","1 kg Zucker"],"schritte":["Blüten ausschütteln, grüne Kelchblätter möglichst entfernen.","Mit Wasser und Zitronenscheiben aufkochen, über Nacht ziehen lassen.","Abseihen, gut ausdrücken.","Mit Zucker offen 1,5–2 Stunden einkochen, bis er honigartig fließt (Gelierprobe auf kaltem Teller).","Heiß in saubere Gläser füllen."],"tipp":"Vegane Honigalternative. Ohne Kelchblätter wird er milder und heller."},{"id":"gelee","titel":"Löwenzahn-Blütengelee","kat":"vorrat","menge":"4 Gläser","zeit":"30 Min. + 1 Nacht","zutaten":["3 Handvoll Blütenblätter","750 ml Apfelsaft","500 g Gelierzucker 2:1","Saft einer Zitrone"],"schritte":["Blüten im Apfelsaft über Nacht ziehen lassen, abseihen.","Mit Gelierzucker und Zitrone 4 Minuten sprudelnd kochen.","Heiß abfüllen."]},{"id":"kaffee","titel":"Löwenzahnwurzel-Kaffee","kat":"getraenke","menge":"ca. 100 g Pulver","zeit":"2 Std.","zutaten":["500 g frische Wurzeln (Herbst)"],"schritte":["Wurzeln schrubben, in kleine Stücke schneiden.","Im Ofen bei 100 °C trocknen, dann bei 180 °C rösten, bis sie dunkelbraun duften.","Abkühlen lassen und mahlen.","1 TL pro Tasse aufbrühen wie Kaffee, 5 Minuten ziehen lassen."],"tipp":"Koffeinfrei, nussig-bitter. Im Herbst enthält die Wurzel am meisten Inulin, das beim Rösten karamellisiert."},{"id":"smoothie","titel":"Grüner Bitter-Smoothie","kat":"getraenke","menge":"2 Gläser","zeit":"5 Min.","zutaten":["1 Handvoll junge Löwenzahnblätter","1 Banane, 1 Birne","Saft einer Orange","200 ml Wasser"],"schritte":["Alles fein mixen und sofort trinken."],"tipp":"Die süße Frucht gleicht die Bitterkeit aus."}]}]},{"id":"selbstversorgung","titel":"Selbstversorgung","bloecke":[{"typ":"text","text":"Löwenzahn wächst von allein. Mit etwas Pflege wird er zu einem der ersten Frühjahrsgemüse."},{"typ":"karten","art":"anwendung","filter":[["alle","Alle"],["garten","Garten"],["ernte","Ernte & Vorrat"]],"eintraege":[{"id":"bleichen","titel":"Löwenzahn bleichen","kat":"garten","beleg":"T","teil":"Blätter","kurz":"Ohne Licht bleiben die Blätter zart, hellgelb und mild – wie Chicorée.","zutaten":["umgedrehter Eimer oder Tontopf","oder dicke Laub-/Strohschicht"],"schritte":["Im Spätwinter einen Eimer über kräftige Rosetten stülpen.","Nach 2–3 Wochen die hellen Blätter ernten.","Pflanze danach wieder ans Licht lassen."]},{"id":"anbau","titel":"Anbau im Beet","kat":"garten","beleg":"T","teil":"Saat","kurz":"Für großblättrige Sorten (z. B. Kulturlöwenzahn).","zutaten":["Saatgut, Reihenabstand 30 cm"],"schritte":["Im April–Mai direkt säen, dünn mit Erde bedecken.","Auf 15–20 cm vereinzeln.","Blüten abschneiden, wenn er sich nicht aussäen soll."]},{"id":"wurzelernte","titel":"Wurzeln ernten und trocknen","kat":"ernte","beleg":"T","teil":"Wurzel","kurz":"Im Herbst sind die Wurzeln dick, süß und inulinreich.","zutaten":["Grabegabel oder Löwenzahnstecher"],"schritte":["Wurzel tief ausstechen.","Waschen, längs halbieren, in Stücke schneiden.","Bei höchstens 40 °C trocknen ({{s:trocknen|Kräuter trocknen}})."]},{"id":"bienen","titel":"Bienenweide im Frühjahr","kat":"garten","beleg":"W","teil":"Blüten","kurz":"Eine der wichtigsten frühen Nektar- und Pollenquellen.","zutaten":["ein Stück Wiese, das erst nach der Blüte gemäht wird"],"schritte":["Rasenecke bis Ende Mai stehen lassen.","Vor der Samenreife mähen, falls er sich nicht ausbreiten soll."]},{"id":"tiere","titel":"Futter für Kleintiere","kat":"ernte","beleg":"T","teil":"Blätter","kurz":"Kaninchen, Meerschweinchen und Hühner fressen ihn gern.","zutaten":["frische Blätter"],"schritte":["Langsam an frisches Grün gewöhnen.","Abwechslungsreich mit anderen Kräutern füttern."]}]}]},{"id":"sicherheit","titel":"Sicherheit","bloecke":[{"typ":"text","text":"Löwenzahn gilt als gut verträglich. Wegen der galletreibenden Wirkung gibt es bei Gallenleiden Einschränkungen."},{"typ":"abschnitt","titel":"Gegenanzeigen","liste":["Verschluss der Gallenwege, Gallenblasenentzündung (Empyem), Darmverschluss.","Gallensteine: nur nach ärztlicher Rücksprache.","Allergie gegen Korbblütler (z. B. Kamille, Arnika, Ringelblume)."]},{"typ":"abschnitt","titel":"Nebenwirkungen und Hinweise","liste":["Bitterstoffe können bei empfindlichem Magen Sodbrennen auslösen.","Der Milchsaft kann selten Kontaktallergien auslösen.","Zur Durchspülung mindestens 2 Liter am Tag trinken; nicht bei Ödemen durch Herz- oder Nierenschwäche.","Nicht abends einnehmen, da harntreibend.","Wechselwirkungen: keine bekannt."]}]},{"id":"quellen","titel":"Quellen","bloecke":[{"typ":"quellen","eintraege":[["Altmeyers Enzyklopädie: Taraxaci radix cum herba","https://www.altmeyers.org/de/naturheilkunde/taraxaci-radix-cum-herba-23462"],["EMA: Monographie-Entwurf Taraxaci folium","https://www.ema.europa.eu/documents/herbal-monograph/draft-community-herbal-monograph-taraxacum-officinale-weber-ex-wigg-folium_en.pdf"]]},{"typ":"text","text":"Rezepte sind überlieferte Hausrezepte. Noch offen: Fotos, Vergleich mit Doppelgängern."}]}]},{"id":"p04","nr":"P-04","illu":"holunder","fotos":[],"name":"Schwarzer Holunder","botan":"Sambucus nigra L.","volksnamen":["Holler","Holder","Flieder (nordd.)","Fliederbeere"],"kurz":"Der Hausbaum der Selbstversorger: Blüten für Sirup und Erkältungstee, Beeren für Saft und Gelee. Wichtig: Beeren und grüne Teile nie roh essen, erst erhitzen.","steckbrief":[["Familie","Moschuskrautgewächse (Adoxaceae), früher Geißblattgewächse"],["Lebensform","Strauch oder kleiner Baum, bis ca. 6 m"],["Blütezeit","Mai–Juni, cremeweiße, flache Schirmrispen"],["Fruchtreife","August–September, schwarzviolette Beeren"],["Verwendete Teile","Blüten, reife Beeren (nur erhitzt)"],["Arzneidroge","Holunderblüten (Sambuci flos), HMPC: traditionell bei beginnender Erkältung"],["Giftig","rohe Beeren, unreife Beeren, Blätter, Rinde, Samen (Sambunigrin)"],["He
