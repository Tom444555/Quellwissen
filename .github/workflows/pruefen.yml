name: Quellwissen prüfen
on: [push, pull_request]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Links, Zeichnungen, JavaScript prüfen
        run: python3 werkzeug/pruefen.py | tee out.txt && grep -q '^OK$' out.txt
      - name: Realismus-Modul Syntax
        run: node --input-type=module --check < werkzeug/qw3d-plus.js
